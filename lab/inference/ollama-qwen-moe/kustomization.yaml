apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab-ollama-qwen-moe
resources:
  - namespace.yaml
  - service.yaml
  - statefulset.yaml
  - ingress.yaml
  - secret.local.yaml
# Override the public hostname before applying:
#   kustomize edit set configmap ollama-host --from-literal=host=ollama.example.com
# (or edit configMapGenerator below). DNS must point at the ingress LB IP
# before cert-manager will solve the ACME HTTP-01 challenge.
replacements:
  - source:
      kind: ConfigMap
      name: ollama-host
      fieldPath: data.host
    targets:
      - select:
          kind: Ingress
          name: ollama
        fieldPaths:
          - spec.tls.0.hosts.0
          - spec.rules.0.host
configMapGenerator:
  - name: ollama-host
    literals:
      - host=ollama.lab.example.com
generatorOptions:
  disableNameSuffixHash: true
