<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Unbounded{{end}} - Unbounded</title>
  <!--
    Bootstrap 5 and htmx are vendored under static/vendor and embedded into the
    binary, so the dashboard works in air-gapped clusters with no external CDN.
  -->
  <link rel="stylesheet" href="/static/assets/bootstrap.min.css">
  <link rel="stylesheet" href="/static/dashboard.css">
  <script src="/static/assets/htmx.min.js" defer></script>
  <script src="/static/assets/htmx-ext-sse.min.js" defer></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark ub-navbar mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Unbounded</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/">Overview</a>
        <a class="nav-link" href="/modules">Modules</a>
      </div>
    </div>
  </nav>
  <div class="container-fluid">
    {{- if .Nav}}
    <div class="row">
      <div class="col-md-2">
        <div class="list-group mb-4">
          {{- range .Nav}}
          <a class="list-group-item list-group-item-action{{if .Active}} active{{end}}" href="{{.Href}}">{{.Title}}</a>
          {{- end}}
        </div>
      </div>
      <div class="col-md-10">
        {{template "content" .}}
      </div>
    </div>
    {{- else}}
    {{template "content" .}}
    {{- end}}
  </div>
</body>
</html>
