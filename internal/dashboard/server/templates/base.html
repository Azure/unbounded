<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Unbounded{{end}} - Unbounded</title>
  <!--
    Prototype: Bootstrap 5 and htmx are loaded from a CDN. This keeps the repo
    light while the dashboard mechanics are validated. Vendoring these assets
    into the embedded /static tree (for air-gapped clusters) is a follow-up.
  -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.3/dist/htmx.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.2/sse.min.js" defer></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark ub-navbar mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Unbounded</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/">Overview</a>
        <a class="nav-link" href="/modules">Modules</a>
      </div>
    </div>
  </nav>
  <div class="container-fluid">
    {{- if .Nav}}
    <div class="row">
      <div class="col-md-2">
        <div class="list-group mb-4">
          {{- range .Nav}}
          <a class="list-group-item list-group-item-action{{if .Active}} active{{end}}" href="{{.Href}}">{{.Title}}</a>
          {{- end}}
        </div>
      </div>
      <div class="col-md-10">
        {{template "content" .}}
      </div>
    </div>
    {{- else}}
    {{template "content" .}}
    {{- end}}
  </div>
</body>
</html>
