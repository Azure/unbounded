// Gantry coordination RPCs (libp2p, length-prefixed protobuf).
//
// Carried over libp2p stream protocol ID `/gantry/coord/1.1.0` as described in
// detailed-design.md §4.4. One stream per request/response pair; the stream
// is closed after the response is written. Forward-compat policy: additive
// changes bump the minor (`/gantry/coord/1.1.0`), breaking changes bump the
// major (`/gantry/coord/2.0.0`).
//
// gRPC is intentionally avoided - `go-msgio` length-delimited framing is
// sufficient and avoids HTTP-over-libp2p complexity.

syntax = "proto3";

package gantry.coord.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Azure/unbounded/internal/gantry/proto/coord/v1;coordv1";

// FailureClass classifies the cause of a terminal origin pull failure.
// See detailed-design.md §5.8 for semantics and cluster-wide trust rules.
enum FailureClass {
  FAILURE_CLASS_UNSPECIFIED  = 0;
  FAILURE_CLASS_AUTH         = 1; // 401 / 403 from origin
  FAILURE_CLASS_NOT_FOUND    = 2; // 404 from origin
  FAILURE_CLASS_RATE_LIMITED = 3; // 429 from origin
  FAILURE_CLASS_TRANSIENT    = 4; // connection / timeout / DNS / 5xx
}

// Envelope is the single message kind sent over `/gantry/coord/1.1.0`.
// Receivers dispatch on the `msg` oneof.
message Envelope {
  oneof msg {
    ChairOfferRequest   chair_offer_request   = 5;
    ChairOfferResponse  chair_offer_response  = 6;
  }
  reserved 1, 2, 3, 4;
  reserved "pull_intent_request", "pull_intent_response", "please_pull_request", "please_pull_response";
}

// PleasePullRequest is carried only by the HTTPS chair endpoint, not Envelope.
message PleasePullRequest {
  // Kind discriminates the OCI Distribution Spec URL family the puller
  // should target at the upstream registry:
  //   /v2/<repo>/blobs/<digest>      (KIND_BLOB; image-config blobs are
  //                                   KIND_CONFIG, all other blobs are
  //                                   KIND_BLOB)
  //   /v2/<repo>/manifests/<digest>  (KIND_MANIFEST)
  //   /v2/<repo>/blobs/<digest>      (KIND_CONFIG; per the OCI Distribution
  //                                   Spec the image-config blob lives in
  //                                   the same /blobs/ URL family but is
  //                                   typed separately so per-kind metrics
  //                                   ("manifest | config | layer") agree
  //                                   end-to-end across the please_pull
  //                                   wire boundary)
  // Missing or unknown Kind is rejected before any origin work is admitted.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_BLOB        = 1;
    KIND_MANIFEST    = 2;
    KIND_CONFIG      = 3;
  }

  // Batched (§5.2a). All digests in a single batch MUST share
  // `upstream_registry`, `repository`, AND `kind`. Mixed-kind batches
  // require separate calls.
  repeated string digests   = 1;

  string upstream_registry  = 2; // e.g. "registry.example.com"
  string repository         = 3; // e.g. "library/nginx"
  Kind   kind               = 4;

  // Basic or Bearer authorization delegated by the requesting node. The
  // recipient uses it only if it must contact origin for this request; local
  // cache hits ignore it. It MUST NOT be persisted, logged, or cached.
  string authorization      = 5;

  // Required. The server validates the assignment before accepting origin work.
  ChairAssignment chair_assignment = 6;
}

message ChairAssignment {
  uint64 chair_id         = 1;
  int64 generation       = 2;
  int64 assignment_epoch = 3;
}

message ChairOfferRequest {
  ChairAssignment assignment = 1;
}

message ChairOfferResponse {
  bool accepted              = 1;
  string peer_id             = 2;
  repeated string p2p_addrs  = 3;
  string transfer_addr       = 4;
}

// PleasePullResponse reports the per-digest outcome of a `please_pull` request.
message PleasePullResponse {
  message Result {
    enum Outcome {
      OUTCOME_UNSPECIFIED     = 0;
      OUTCOME_ALREADY_PULLING = 1;
      OUTCOME_STARTED         = 2;
      OUTCOME_RECENTLY_FAILED = 3;
      OUTCOME_STALE_CHAIR     = 4;
    }

    string digest                            = 1;
    Outcome outcome                          = 2;
    google.protobuf.Timestamp started_at     = 3;
    google.protobuf.Timestamp cooldown_until = 4;
    FailureClass failure_class               = 5;
  }

  repeated Result results = 1;
}
