# Each selected participant supplies the same dataset at its local origin socket.
apiVersion: racer.unbounded-cloud.io/v1alpha1
kind: ClusterCache
metadata:
  name: racer-volume
spec:
  siteSelector:
    matchLabels:
      kubernetes.io/metadata.name: racer-a
  cacheGeneration: 1
  maxCandidateAttempts: 3
