# Test workload only. Install the operator, create Site racer-a, and
# label qualified Nodes unbounded-cloud.io/site=racer-a before applying.
# After applying, configure the actual API-assigned UID (repeat after recreation):
# kubectl -n unbounded-system create configmap racer-loadgen-cache --from-literal=uid="$(kubectl get clustercache racer-loadgen-volume -o jsonpath='{.metadata.uid}')" --dry-run=client -o yaml | kubectl apply -f -
# kubectl -n unbounded-system rollout restart daemonset/racer-loadgen
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: racer-loadgen
  namespace: unbounded-system
spec:
  selector:
    matchLabels:
      app: racer-loadgen
      racer.unbounded-cloud.io/universe: racer-a
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: racer-loadgen
        racer.unbounded-cloud.io/universe: racer-a
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
        unbounded-cloud.io/site: racer-a
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: racer.unbounded-cloud.io/exclude
                    operator: NotIn
                    values: ["true"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: racer-loadgen:local
          imagePullPolicy: IfNotPresent
          args:
            - -cache-uid=$(RACER_CACHE_UID)
            - -listen=:8080
            - -footprint=512GB
            - -object-size=1GB
            - -exponent=1
            - -concurrency=4
            - -page-concurrency=8
            - -timeout=5m
            - -ttl=1h
            - -duration=0
          env:
            - name: RACER_CACHE_UID
              valueFrom:
                configMapKeyRef:
                  name: racer-loadgen-cache
                  key: uid
            - name: GOMAXPROCS
              value: "2"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: sockets
              mountPath: /run/racer
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "2"
              memory: 256Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: "2"
              memory: 512Mi
              ephemeral-storage: 128Mi
          # Origin health cannot depend on successful dataplane downloads.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: sockets
          hostPath:
            path: /run/racer
            type: Directory
---
apiVersion: racer.unbounded-cloud.io/v1alpha1
kind: ClusterCache
metadata:
  name: racer-loadgen-volume
spec:
  siteSelector:
    matchLabels:
      kubernetes.io/metadata.name: racer-a
  cacheGeneration: 1
  maxCandidateAttempts: 3
