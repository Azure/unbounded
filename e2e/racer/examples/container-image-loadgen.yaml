# Test-only combined per-host registry and simulated image pulls.
# See cmd/racer-loadgen/README.md for GANTRY_HOST_IP endpoint substitution.
# Enable Gantry's Racer backend and configure the image-fixture.test upstream
# on every Gantry node before applying. Import racer-loadgen:local on all nodes.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: image-loadgen
  namespace: unbounded-system
spec:
  selector:
    matchLabels:
      app: image-loadgen
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: image-loadgen
      annotations:
        # Use the README's dedicated management-port scrape job, once per pod.
        prometheus.io/scrape: "false"
        prometheus.io/path: /metrics
        prometheus.io/port: "18082"
    spec:
      # Gantry's mirror is on the node's loopback interface.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
        unbounded-cloud.io/site: racer-a
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: racer.unbounded-cloud.io/exclude
                    operator: NotIn
                    values: ["true"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: racer-loadgen:local
          imagePullPolicy: IfNotPresent
          args:
            - -mode=container-image
            - -role=both
            - -listen=:18082
            - -registry-listen=:18081
            - -footprint=80GB
            - -object-size=1GB
            - -layers-per-image=80
            - -registry-namespace=image-fixture.test
            - -gantry-endpoint=http://127.0.0.1:5000
            - -exponent=1
            - -concurrency=8
            - -layer-concurrency=8
            - -timeout=30m
            - -gantry-ready-timeout=10m
          ports:
            - name: management
              containerPort: 18082
              hostPort: 18082
            - name: registry
              containerPort: 18081
              hostPort: 18081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: management
            periodSeconds: 10
