# kind cluster topology for the gantry e2e suite.
#
# One control-plane + two workers - enough to exercise inter-pod
# coord paths (HRW top-K=3 means the requester picks a peer that's
# not itself, which requires ≥2 peers in the membership view).
#
# No extraMounts are declared. Each kind node runs its own
# containerd inside the node container, listening on
# /run/containerd/containerd.sock; the DaemonSet bind-mounts that
# in-container runtime directory (not the host's containerd) so the gantry
# cdsub source can subscribe to image events on the same containerd
# that pulled the image. If the socket's effective ownership / SELinux
# label inside the node container does not match the gantry pod's
# runAsUser the agent fails readiness because containerd is its sole
# storage backend.
#
# The kind node image does not enable certs.d registry configuration by
# default. Tests install hosts.toml files dynamically, so point the CRI plugin
# at that directory before containerd starts. kindest/node:v1.34.0 currently
# ships containerd v2 with config format 2 and the legacy CRI plugin key below.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gantry-e2e
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
  - role: worker
  - role: worker
