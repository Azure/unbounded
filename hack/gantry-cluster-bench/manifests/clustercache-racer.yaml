#
# Racer mode with Racer-managed persistence: Racer keeps gantry pages in
# memory and on its own slab disks, so a pulled layer exists twice on disk
# (Racer slab plus containerd's content store). Comparison baseline for
# clustercache-adapter.yaml. Applied by deploy.sh racer.
apiVersion: racer.unbounded-cloud.io/v1alpha1
kind: ClusterCache
metadata:
  name: gantry
  labels:
    gantry-cluster-bench: "true"
spec:
  persistence: Racer
