# Representative live override layout, with no live configuration or credentials.
overrides:
- component: racer
  kind: Deployment
  patch:
    spec:
      template:
        spec:
          containers:
          - name: controller
            image: old-controller # Keep image comments.
- component: racer
  kind: DaemonSet
  name: racer-dataplane
  patch:
    spec:
      template:
        spec:
          containers:
          - name: dataplane
            image: 'old-dataplane'
            env: &id001
            - name: RACER_GUARD
              value: keep
            - name: NODE_NAME
              valueFrom: &id002
                fieldRef:
                  fieldPath: spec.nodeName
            volumeMounts: &id003
            - name: guard-socket
              mountPath: /guard
          volumes: &id004
          - name: guard-socket
            hostPath:
              path: /guard
          initContainers: &id005
          - name: guard-launch-copy
            image: guard:keep
- component: racer
  kind: DaemonSet
  name: racer-dataplane-podnet
  patch:
    spec:
      template:
        spec:
          containers:
          - name: dataplane
            image: "old-podnet"
            env: *id001
            volumeMounts: *id003
          - name: sidecar
            image: sidecar:keep
            env:
            - name: NODE_NAME
              valueFrom: *id002
          volumes: *id004
          initContainers: *id005
- component: gantry
  kind: DaemonSet
  patch:
    spec:
      template:
        spec:
          containers:
          - name: gantry
            image: old-gantry
            volumeMounts: *id003
          volumes: *id004
