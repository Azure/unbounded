#
# Kind cluster configuration for the smoke-metalman tests.
# The PXE smoke drives the guest over a playtime VXLAN-over-WireGuard overlay
# whose client end is 172.31.99.2.  The guest's kubelet, kindnet, and kube-proxy
# reach the kind API server at 172.31.99.2:6443 (playtime forwards it back to
# the API server's loopback port on the host).  Include that overlay IP as an
# extra certSAN so those clients can verify the API server TLS certificate.
# The layered HTTP smoke reaches the same API server over its local libvirt
# network at 192.168.200.2, so that address must also be covered.  127.0.0.1
# and localhost must be listed
# because kubeadm's certSANs list replaces (not appends to) the default SANs,
# and the host-side kubeconfig uses 127.0.0.1.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      certSANs:
      - "172.31.99.2"
      - "192.168.200.2"
      - "127.0.0.1"
      - "localhost"
