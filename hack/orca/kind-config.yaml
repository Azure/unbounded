# Kind cluster config for the Orca dev harness.
#
# 1 control-plane + 3 workers. The 3 workers match Orca's default
# replica count and the required pod-anti-affinity (hostname topology).
#
# extraPortMappings on the first worker expose:
#   30100 -> Azurite (azureblob origin in dev)
#   30200 -> LocalStack (awss3 origin + cachestore in dev)
# Both NodePorts are reached at http://localhost:<nodePort>/ from the
# host so host-side dev tools (hack/cmd/orcadev) can talk to them
# without a kubectl port-forward. NodePort services in Kind aren't
# routable from the host without explicit port mappings.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: orca-dev
nodes:
  - role: control-plane
  - role: worker
    extraPortMappings:
      - containerPort: 30100
        hostPort: 30100
        protocol: TCP
      - containerPort: 30200
        hostPort: 30200
        protocol: TCP
  - role: worker
  - role: worker
