# Kind cluster config for the Orca dev harness.
#
# 1 control-plane + 3 workers. The 3 workers match Orca's default
# replica count and the strict pod-anti-affinity that kind installs
# use (one Orca pod per node).
#
# No extraPortMappings: orcadev opens kubectl port-forwards to
# svc/azurite, svc/garage, and svc/orca as needed, which is the
# same code path used on non-kind clusters (AKS, EKS, k3d). Users
# who want ad-hoc curl from the host can run
# `kubectl port-forward svc/azurite 10000:10000` themselves.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: orca-dev
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
