<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#07111f"/><text x="60" y="72" fill="white" font-family="Arial" font-size="38" font-weight="700">Suite Contract</text>
  <text x="60" y="108" fill="#9fb5cc" font-family="Arial" font-size="19">The workflow engine sees one stable task; the runner may coordinate a complete procedure</text>
  <rect x="70" y="155" width="300" height="430" rx="20" fill="#10233a" stroke="#31577d"/><text x="220" y="195" fill="#51dfd0" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle">INPUTS</text>
  <g fill="#dcecff" font-family="Arial" font-size="18"><text x="100" y="245">• Run identity</text><text x="100" y="285">• Profile and suite version</text><text x="100" y="325">• Runner digest</text><text x="100" y="365">• Participants and topology</text><text x="100" y="405">• Placement and deadline</text><text x="100" y="445">• Configuration references</text><text x="100" y="485">• Evidence destination</text><text x="100" y="525">• Audit correlation</text></g>
  <rect x="450" y="155" width="300" height="430" rx="20" fill="#182c44" stroke="#ffd166"/><text x="600" y="195" fill="#ffd166" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle">SUITE RUNNER</text>
  <g fill="#f1f5fa" font-family="Arial" font-size="18" text-anchor="middle"><text x="600" y="245">Discovery and preflight</text><text x="600" y="285">Collectors and monitors</text><text x="600" y="325">Parallel or sequential stages</text><text x="600" y="365">Shared state and events</text><text x="600" y="405">Cooldown observation</text><text x="600" y="445">Deferred evaluation</text><text x="600" y="485">Cancellation and cleanup</text></g>
  <rect x="830" y="155" width="300" height="430" rx="20" fill="#10233a" stroke="#31577d"/><text x="980" y="195" fill="#79d99b" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle">OUTPUTS</text>
  <g fill="#dcecff" font-family="Arial" font-size="18"><text x="860" y="245">• Execution state</text><text x="860" y="285">• Hardware verdict</text><text x="860" y="325">• Measurements</text><text x="860" y="365">• Observation coverage</text><text x="860" y="405">• Failure category</text><text x="860" y="445">• Evidence manifest</text><text x="860" y="485">• Cleanup result</text><text x="860" y="525">• Structured audit events</text></g>
  <path d="M370 370H445M750 370H825" stroke="#8bb8e8" stroke-width="4"/>
</svg>
