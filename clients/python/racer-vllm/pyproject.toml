[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "racer-vllm"
version = "0.2.0"
description = "vLLM model loader that reads weights from a Racer cache"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Microsoft Corporation" }]
keywords = ["racer", "unbounded", "kubernetes", "cache", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["racer-client>=0.2.0,<0.3"]

[project.urls]
Homepage = "https://github.com/Azure/unbounded"
Documentation = "https://github.com/Azure/unbounded/tree/main/docs/content/guides/racer-vllm.md"
Source = "https://github.com/Azure/unbounded/tree/main/clients/python/racer-vllm"
Issues = "https://github.com/Azure/unbounded/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."vllm.general_plugins"]
racer = "racer_vllm:register"

[project.scripts]
racer-vllm-fetch = "racer_vllm.model:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
