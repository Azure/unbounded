version: 2

before:
  hooks:
    # Render manifests once before any builds. These targets are not safe
    # to run in parallel (they rm -rf shared output directories), and
    # goreleaser fans builds out across goos/goarch concurrently.
    - make machina-manifests VERSION={{ .Tag }}
    - make token-refresher-manifests VERSION={{ .Tag }}
    - make net-manifests VERSION={{ .Tag }}
    - make unbounded-storage-supervisor-manifests VERSION={{ .Tag }}
    - make unbounded-operator-manifests VERSION={{ .Tag }}

builds:
  - id: kubectl-unbounded
    main: ./cmd/kubectl-unbounded
    binary: kubectl-unbounded
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/Azure/unbounded/internal/version.Version={{ .Version }}
      - -X github.com/Azure/unbounded/internal/version.GitCommit={{ .ShortCommit }}
      - -X github.com/Azure/unbounded/internal/version.BuildTime={{ .Date }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: unbounded-agent
    main: ./cmd/agent
    binary: unbounded-agent
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/Azure/unbounded/internal/version.Version={{ .Version }}
      - -X github.com/Azure/unbounded/internal/version.GitCommit={{ .ShortCommit }}
      - -X github.com/Azure/unbounded/internal/version.BuildTime={{ .Date }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: agent-artifacts-builder
    main: ./hack/cmd/agent-artifacts-builder
    binary: agent-artifacts-builder
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  # The inventory agent runs on the node it inventories, so it ships as a
  # released binary as well as a container image. The other three inventory
  # commands are cluster workloads and ship only as images.
  - id: inventory-agent
    main: ./cmd/inventory/inventory-agent
    binary: inventory-agent
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/Azure/unbounded/internal/version.Version={{ .Version }}
      - -X github.com/Azure/unbounded/internal/version.GitCommit={{ .ShortCommit }}
      - -X github.com/Azure/unbounded/internal/version.BuildTime={{ .Date }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: kubectl-unbounded
    ids:
      - kubectl-unbounded
    formats:
      - tar.gz
    name_template: "kubectl-unbounded-{{ .Os }}-{{ .Arch }}"

  - id: unbounded-agent
    ids:
      - unbounded-agent
    formats:
      - tar.gz
    name_template: "unbounded-agent-{{ .Os }}-{{ .Arch }}"

  - id: agent-artifacts-builder
    ids:
      - agent-artifacts-builder
    formats:
      - tar.gz
    name_template: "agent-artifacts-builder-{{ .Os }}-{{ .Arch }}"

  - id: inventory-agent
    ids:
      - inventory-agent
    formats:
      - tar.gz
    name_template: "inventory-agent-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Sign the checksums file with cosign using keyless (Sigstore OIDC) signing.
# This ties the signature to the GitHub Actions OIDC identity - no long-lived keys required.
# Uses --bundle to produce a Sigstore bundle (.bundle.json) containing the signature,
# certificate, and transparency log entry in one file.
signs:
  - cmd: cosign
    args:
      - sign-blob
      - "--bundle=${artifact}.bundle.json"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
    signature: "${artifact}.bundle.json"

# Generate an SPDX SBOM for each binary archive using syft.
sboms:
  - artifacts: archive
    args: ["$artifact", "--output", "spdx-json=$document"]

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  # owner/name are intentionally omitted so GoReleaser targets the repository the
  # workflow runs in (detected from the git remote). The Actions GITHUB_TOKEN is
  # scoped to that repository, so a release can only ever be created where the
  # workflow runs; hardcoding Azure/unbounded only broke fork releases without
  # adding any guard.
  # Always create as draft. The release workflow attaches additional
  # artifacts (manifests tarball, krew manifest, image signatures) before
  # a human flips the release to published.
  draft: true
  prerelease: auto
