syntax = "proto3";
package racer.control.v1;

option go_package = "github.com/Azure/unbounded/api/racer;racerconfig";

// Every update replaces this entire message. Empty lists remove all entries.
message Snapshot {
  bytes universe = 1; // 32 bytes, pinned by bootstrap configuration
  bytes node = 2; // 32 bytes, pinned by bootstrap configuration
  uint64 revision = 3;
  repeated Peer peers = 4; // only this node's direct connections
  repeated Volume volumes = 5;
  string fabric = 6;
  // Config generation shared across nodes in a universe; zero means unspecified.
  // Observability only: revision still orders updates, Topology.epoch orders routing.
  uint64 epoch = 7;
}

message Peer {
  string id = 1;
  string fabric = 2;
  string http_address = 3; // IPv4:port or [IPv6]:port
}

message Volume {
  string id = 1;
  string listen = 2; // numeric IP:port
  string origin_address = 3; // IPv4:port or [IPv6]:port; also HTTP Host
  string origin_identity = 4; // stable logical dataset identity, independent of address
  uint64 cache_generation = 5;
  // Direct transport peers only. Nonempty lists require topology.
  repeated string peers = 6;
  Topology topology = 7;
  // Primary plus successors, including suppressed slots; default 3, range 1..8.
  optional uint32 max_candidate_attempts = 8;
  // Required: complete direct membership, including incoming-only peers.
  // Empty explicitly authorizes none.
  VolumePeerEndpoints peer_endpoints = 9;
}

message VolumePeerEndpoints {
  repeated VolumePeerEndpoint peers = 1;
}
message VolumePeerEndpoint {
  string peer = 1; // exact identity in Snapshot.peers
  string http_address = 2; // empty explicitly inherits the global endpoint
}

// Shared slot geometry/epoch; only local slots and their outgoing neighbors.
// All nodes in a volume agree on epoch and slot_count. Revision is node-local.
message Topology {
  uint64 epoch = 1;
  uint32 slot_count = 2;
  repeated uint32 local_slots = 3;
  repeated SlotPeer neighbors = 4;
  // Destination-rooted shortest paths (2); absent defaults to 2.
  optional uint32 routing_algorithm = 5;
}
message SlotPeer {
  uint32 slot = 1;
  string peer = 2;
}

// Embedded in HTTP control commands. Local files use its ProtoJSON form.
// Signed snapshots authenticate the exact serialized plaintext bytes.
message Configuration {
  oneof contents {
    Snapshot snapshot = 1;
    SignedSnapshot signed = 2;
  }
}
message SignedSnapshot {
  bytes snapshot = 1;
  bytes signature = 2;
}

// Served by /v2/{universe}/{node}.
message ControlCommand {
  bytes universe = 1;
  bytes node = 2;
  bytes incarnation = 3;
  bytes snapshot_digest = 4;
  uint64 revision = 5;
  // 1 prepare, 2 enable receive, 3 activate ingress, 4 retire, 5 abort.
  uint32 phase = 6;
  Configuration configuration = 7;
  uint32 profile = 8; // profile 1: scoped peers, 262144 slots, 64 MiB input
  // Conditional forward correction, checked atomically against never-receive.
  bytes forward_digest = 9;
  uint64 forward_revision = 10;
  string pod_uid = 11; // TokenReview identity, pinned per subscription
}
message SignedControlCommand {
  bytes command = 1;
  bytes signature = 2; // racer/control/v1 over exact command bytes
}
