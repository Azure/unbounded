syntax = "proto3";
package racer.control.v1;

option go_package = "github.com/Azure/unbounded/api/racer;racerconfig";

message Snapshot {
  bytes universe = 1;
  bytes node = 2;
  uint64 revision = 3;
  repeated Peer peers = 4;
  repeated Volume volumes = 5;
  string fabric = 6;
  uint64 epoch = 7;
  bool idle = 8;
  // Placement-independent process catalogs, shared by volume references.
  repeated MemberCatalog member_catalogs = 9;
}

message MemberCatalog {
  repeated Member members = 1;
}
message Member {
  bytes node = 1;
  string pod_uid = 2;
  string fabric = 3;
}

message Peer {
  string id = 1;
  string fabric = 2;
  string http_address = 3;
  string pod_uid = 4;
}

message Volume {
  string id = 1;
  uint64 cache_generation = 5;
  repeated string peers = 6;
  Topology topology = 7;
  optional uint32 max_candidate_attempts = 8;
  VolumePeerEndpoints peer_endpoints = 9;
  string cache_socket = 10;
  string origin_socket = 12;
  // Required index into Snapshot.member_catalogs, including for empty membership.
  optional uint32 member_catalog = 13;
}

message VolumePeerEndpoints {
  repeated VolumePeerEndpoint peers = 1;
}
message VolumePeerEndpoint {
  string peer = 1;
  string http_address = 2;
}

message Topology {
  uint64 epoch = 1;
  uint32 slot_count = 2;
  repeated uint32 local_slots = 3;
  repeated SlotPeer neighbors = 4;
  optional uint32 routing_algorithm = 5;
}
message SlotPeer {
  uint32 slot = 1;
  string peer = 2;
}

message Configuration {
  oneof contents {
    Snapshot snapshot = 1;
  }
}

// Full independently applicable desired state on /v1/config. Cursor acknowledges
// receipt, not successful local preparation or application.
message DesiredState {
  bytes universe = 1;
  bytes node = 2;
  bytes incarnation = 3;
  bytes snapshot_digest = 4;
  uint64 revision = 5;
  Configuration configuration = 6;
  uint32 profile = 7;
  string pod_uid = 8;
  StoragePolicy storage_policy = 9;
  string cursor = 10;
}

message StoragePolicy {
  bytes identity = 1;
  uint64 version = 2;
  uint64 desired_bytes = 3;
}
