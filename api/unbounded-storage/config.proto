syntax = "proto3";

package unbounded.storage.config;

option go_package = "github.com/Azure/unbounded/api/unbounded-storage;storageconfig";

message Config {
  // Operator-assigned opaque version tracked so operators can confirm which config has been applied. 0 means unversioned.
  uint64 version = 1;

  // Startup options are only read once during initialization.
  StartupCfg startup = 2;

  repeated FrontendSpec frontends = 3;
  repeated BackendSpec backends = 4;
  repeated CacheSpec caches = 5;
  repeated DiskSpec disks = 6;

  // Number of deterministic finger-table entries to derive per peer. Defaults to 100 when unset.
  optional uint32 fingers_per_node = 7;

  // Name of this process in the `peers` roster. Required when peers or a
  // routing plan are configured. The internal ring and fabric ids are derived
  // from this peer name and are startup-fixed.
  string self = 8;

  // Precomputed routing table for this process. When set, `peers` can be
  // sparse, containing only this process's routing neighbors.
  optional RoutingPlan routing_plan = 9;

  // Process-wide peer definitions for the globally shared transport mesh.
  repeated PeerSpec peers = 10;

  // Optional topology weighting for automatic finger selection. When unset,
  // automatic routing uses the historical hard-locality preference. When set,
  // finger selection uses weighted rendezvous while successor/predecessor
  // selection remains purely ring-nearest for routing correctness.
  optional TopologyWeighting topology_weighting = 11;

  // Opt-in automatic allocation of completely unused whole block devices.
  // Mutually exclusive with disks. An empty deny list considers every safe
  // device; when none are eligible, fallback is used.
  optional DiskDiscovery disk_discovery = 12;
}

// A precomputed routing table for a single node, produced by a
// global-view planner. All names reference `PeerSpec.name` values in the
// `peers` list (each must be present so a fabric connection exists). Ring
// positions are derived from names, and tags do not affect runtime routing, so
// only names are carried here.
message RoutingPlan {
  // Peer names selected for this routing plan.
  repeated string fingers = 1;

  // Peer name of the nearest-forward neighbor on the ring.
  optional string successor = 2;

  // Peer name of the nearest-backward neighbor on the ring.
  optional string predecessor = 3;
}

// Weights applied to automatic topology-aware finger selection. A configured
// weighting switches finger selection from hard locality to weighted
// rendezvous. Only the most-specific matching prefix weight applies.
message TopologyWeighting {
  // Per-prefix weights keyed by tag index. Tag index 0 is the first/coarsest
  // tag, such as a region or datacenter; tag index 1 is the next tag, such as
  // an availability zone. Weight 0 is neutral, positive values favor peers
  // sharing that prefix, and negative values penalize them.
  repeated TopologyPrefixWeight prefix_weights = 1;
}

message TopologyPrefixWeight {
  // Tag slot this weight applies to when local and candidate peers share all
  // tags through this index.
  uint32 tag_index = 1;

  // Floating-point bias for candidates sharing this prefix. Selection computes
  // score = normalized_rendezvous_hash - weight and chooses the lowest score.
  // Zero is neutral.
  double weight = 2;
}

message PeerSpec {
  // Stable peer name. The process-wide fabric peer id, ring position, and route
  // references are derived from this name.
  string name = 1;

  // Peer tags used by placement-aware planning.
  repeated string tags = 2;

  oneof config {
    TcpPeerConfig tcp = 3;
    RdmaPeerConfig rdma = 4;
  }
}

message TcpPeerConfig {
  // TCP socket address used as this peer's fabric wire address.
  string addr = 1;
}

message RdmaPeerConfig {
  reserved 1, 2;
  reserved "addr", "addrs";

  // Node-reachable HTTP socket used to discover this peer's live libfabric
  // listeners. The daemon resolves the advertised candidates independently
  // for each local fabric domain.
  string discovery_addr = 3;
}

message CacheSpec {
  string name = 1;
  // Backend source used for miss fills. Cache name is the only logical keyspace prefix.
  string source = 2;
}

message StartupCfg {
  MemoryCfg memory = 1;
  FabricCfg fabric = 2;
  TopologyCfg topology = 3;
  MetricsCfg metrics = 4;
  FabricDiscoveryCfg fabric_discovery = 5;
}

message MetricsCfg {
  // Prometheus metrics listen address, such as "0.0.0.0:9100". Empty disables the exporter.
  string addr = 1;
}

message FabricDiscoveryCfg {
  // Dedicated HTTP listen address for publishing live libfabric listeners.
  // Empty disables discovery serving.
  string addr = 1;
}

message MemoryCfg {
  // Allocates per-shard backing from the heap instead of 2 MiB hugepages.
  bool no_hugepages = 1;

  // Total backing pool across serving shards, in bytes. Defaults to 128 MiB when unset.
  optional uint64 memory_total_bytes = 2;
}

message FabricCfg {
  oneof binds {
    TcpFabricBinds tcp = 1;
    RdmaFabricBinds rdma = 2;
    AutoRdmaFabricBinds auto_rdma = 3;
  }

  // Maximum in-flight fabric operations per shard. Defaults to 1024 when unset.
  optional uint32 max_inflight = 4;

  // libfabric progress threads per shard. Defaults to 2 when unset.
  optional uint32 progress_threads = 5;

  // Fabric RPC worker threads per shard. Defaults to 4 when unset.
  optional uint32 rpc_worker_threads = 6;

  // Progress-thread busy-poll budget in microseconds. Defaults to 10 when unset.
  optional uint32 progress_poll_us = 7;
}

message TcpFabricBinds {
  string addr = 1;
}

message RdmaFabricBinds {
  repeated RdmaFabricBind binds = 1;
}

message AutoRdmaFabricBinds {
  // Maximum number of HCAs to bind per NUMA node. Defaults to 1 when unset.
  // Raise this to use additional HCAs on a NUMA node. HCAs whose NUMA node is
  // unknown are never capped.
  optional uint64 hcas_per_numa_node = 1;
}

message RdmaFabricBind {
  // Provider-native RDMA fabric address encoded as "hex:<fi_getname-bytes>".
  string addr = 1;
}

message TopologyCfg {
  // Place shards on SMT sibling CPUs as well as physical cores. Defaults to false,
  // so one serving shard is placed per physical core unless explicitly enabled.
  bool use_smt_siblings = 1;

  // Schedule shards onto isolcpus-isolated CPUs too. Defaults to false, so CPUs
  // isolated by the kernel are reserved for other workloads unless explicitly included.
  bool ignore_isolated = 2;

  // Allow placing a shard on each NUMA node's CPU 0. Defaults to false, reserving
  // those CPUs for kernel and housekeeping work unless explicitly included.
  bool include_node_cpu0 = 3;

  // Use HCA ports that are not in the active state.
  bool allow_inactive_port = 4;

  // Disable RDMA and force the libfabric tcp provider. Defaults to false. This is
  // an operator escape hatch for hosts where discovered RDMA devices are present
  // but should not be used by this daemon.
  bool disable_rdma = 5;

  // Cap on the number of serving-shard CPUs to pin. When unset, claims every
  // usable core left after storage and NIC-worker reservations.
  optional uint64 serving_cores = 6;

  // NIC-worker CPUs to pin per active HCA. Defaults to 4 when unset.
  optional uint64 nic_workers = 7;
}

message DiskSpec {
  // Optional io_uring queue depth override for this disk.
  optional uint32 queue_depth = 1;

  // Optional cache page size override in bytes; defaults to the storage engine page size.
  optional uint64 page_size_bytes = 2;

  // Skips the recovery scan when no metadata page is valid; intended only for fresh or benchmark disks.
  bool skip_recovery_scan = 3;

  // Destructively resets the cache index on open, ignoring any existing on-disk metadata.
  // Intended only for benchmark cache devices that are safe to reformat between runs.
  bool force_format = 4;

  // Admit every write into the cache index instead of requiring the default
  // second touch. Intended for benchmark warmups that must prefill NVMe devices
  // with a cold synthetic keyspace.
  bool bypass_admission = 5;

  // Serve reads from the committed in-memory index mirror instead of reading
  // the terminal btree leaf from disk. Intended only for benchmark devices
  // where recovery/corruption validation has been deliberately traded for
  // measuring the data-page path.
  bool bypass_index_read = 6;

  // Skip data checksum validation on reads. Intended only for benchmark
  // devices where cache contents were just populated by the same daemon and
  // the target is measuring the NVMe data path rather than CPU checksum cost.
  bool bypass_checksum = 7;

  // Disables the in-memory bufferpool page cache for pages routed to this disk.
  bool disable_page_cache = 10;

  oneof config {
    BlockDiskConfig block = 8;
    FileDiskConfig file = 9;
  }
}

message BlockDiskConfig {
  // Optional NUMA node hint used when placing storage work for this block device.
  optional uint32 numa = 1;

  // Block device path; paths must be unique across all disks.
  string path = 2;
}

message FileDiskConfig {
  // Required file-backed disk capacity in bytes; the file is provisioned to this size before opening.
  optional uint64 size = 1;

  // Backing-file path; paths must be unique across all disks.
  string path = 2;
}

message DiskDiscovery {
  // Exact /dev paths to exclude. Symlinks are resolved and matched by block
  // device identity, so aliases of the same device are equivalent.
  repeated string deny_paths = 1;

  // File-backed disk used while no eligible block device exists. Defaults to
  // /var/lib/unbounded-storage/cache.disk with a 2 GiB capacity.
  FileDiskConfig fallback = 2;
}

message BackendSpec {
  string name = 1;

  oneof config {
    HttpBackendConfig http = 2;
    S3BackendConfig s3 = 3;
    AzureBackendConfig azure = 4;
    FakeBackendConfig fake = 5;
  }
}

message HttpBackendConfig {
  // Origin URL resolved to an IPv4 address for HTTP/1.1 fetches. `http://` uses plaintext;
  // `https://` uses TLS with kTLS receive offload.
  string url = 1;

  // Stripe granularity in bytes for origin references. Defaults to 4 MiB when unset.
  // Must be a power of two.
  optional uint64 stripe_size_bytes = 2;

  // Maximum concurrent origin HTTP fetches. Defaults to 64 when unset.
  optional uint32 http_concurrency = 3;

  // Optional CA certificate bundle/path used for TLS verification on `https://` origins.
  optional string ca_cert_path = 4;

  // Skips TLS certificate verification on `https://` origins. Mutually exclusive with ca_cert_path.
  bool insecure_skip_verify = 5;

  // Optional PEM client certificate presented for TLS client authentication on `https://` origins.
  // Must be set together with client_key_path.
  optional string client_cert_path = 6;

  // Optional PEM private key for client_cert_path. Must be set together with client_cert_path.
  optional string client_key_path = 7;
}

message S3BackendConfig {
  // S3-compatible origin URL resolved to an IPv4 address for HTTP/1.1 fetches. `http://` uses
  // plaintext; `https://` uses TLS with kTLS receive offload.
  string url = 1;

  // Stripe granularity in bytes for origin references. Defaults to 4 MiB when unset.
  // Must be a power of two.
  optional uint64 stripe_size_bytes = 2;

  // Maximum concurrent origin HTTP fetches. Defaults to 64 when unset.
  optional uint32 http_concurrency = 3;

  // Optional CA certificate bundle/path used for TLS verification on `https://` origins.
  optional string ca_cert_path = 4;

  // Skips TLS certificate verification on `https://` origins. Mutually exclusive with ca_cert_path.
  bool insecure_skip_verify = 5;

  // Optional PEM client certificate presented for TLS client authentication on `https://` origins.
  // Must be set together with client_key_path.
  optional string client_cert_path = 6;

  // Optional PEM private key for client_cert_path. Must be set together with client_cert_path.
  optional string client_key_path = 7;
}

message AzureBackendConfig {
  // Azure Blob-compatible origin URL resolved to an IPv4 address for HTTP/1.1 fetches. `http://`
  // uses plaintext; `https://` uses TLS with kTLS receive offload.
  string url = 1;

  // Stripe granularity in bytes for origin references. Defaults to 4 MiB when unset.
  // Must be a power of two.
  optional uint64 stripe_size_bytes = 2;

  // Maximum concurrent origin HTTP fetches. Defaults to 64 when unset.
  optional uint32 http_concurrency = 3;

  // Optional CA certificate bundle/path used for TLS verification on `https://` origins.
  optional string ca_cert_path = 4;

  // Skips TLS certificate verification on `https://` origins. Mutually exclusive with ca_cert_path.
  bool insecure_skip_verify = 5;

  // Optional PEM client certificate presented for TLS client authentication on `https://` origins.
  // Must be set together with client_key_path.
  optional string client_cert_path = 6;

  // Optional PEM private key for client_cert_path. Must be set together with client_cert_path.
  optional string client_key_path = 7;
}

message FakeBackendConfig {
  // Stripe granularity in bytes for synthetic origin references. Defaults to 4 MiB when unset.
  // Must be a power of two.
  optional uint64 stripe_size_bytes = 1;

  // Size of each deterministic synthetic object in bytes. Defaults to 1 MiB when unset.
  optional uint64 object_size_bytes = 2;
}

message FrontendSpec {
  string name = 1;
  string source = 2;

  oneof config {
    HttpFrontendConfig http = 3;
    S3FrontendConfig s3 = 4;
    LoadgenFrontendConfig loadgen = 5;
  }
}

message HttpFrontendConfig {
  // Socket address for HTTP listeners; each serving shard binds it with SO_REUSEPORT.
  string addr = 1;

  // Maximum requests served on one client connection. Defaults to 1024 when unset.
  optional uint32 max_requests_per_connection = 2;
}

message S3FrontendConfig {
  // Socket address for S3-compatible listeners; each serving shard binds it with SO_REUSEPORT.
  string addr = 1;
}

message LoadgenFrontendConfig {
  // Synthetic read workers per serving shard. Defaults to 1 when unset.
  optional uint32 workers = 1;

  // Deterministic synthetic keyspace and request stream seed.
  optional uint64 seed = 2;

  // Number of distinct synthetic object ids to sample. Defaults to 1,000,000 when unset.
  optional uint64 keyspace_objects = 3;

  // Bytes to read from the start of each object. When unset or zero, reads the full resolved object length.
  optional uint64 read_bytes = 4;

  // Verify returned metadata and body bytes against the deterministic synthetic dataset.
  bool verify = 5;

  // Optional expected synthetic object size. When set with verify=true, rejects mismatched metadata.
  optional uint64 object_size_bytes = 6;

  // Zipf exponent for synthetic object rank sampling. Defaults to 1.1 when unset.
  optional double zipf_exponent = 7;

  // When true, workers keep sampling until the first requested stripe routes to
  // a peer instead of local ownership. This is intended for fabric saturation
  // benchmarks; the request still uses the normal cache/p2p/storage/origin path.
  bool remote_only = 8;

  // When true, loadgen stamps requests so peer handlers synthesize zero-filled
  // response pages directly from their RPC scratch buffers. This bypasses disk
  // and origin work while keeping normal peer routing, fabric RPC framing, and
  // RDMA writes in the benchmark path.
  bool fabric_only = 9;

  // When true, workers keep sampling until the first requested stripe is owned
  // by the local node. This is intended for benchmark warmup phases that prefill
  // each node's own NVMe-backed cache before a remote-only measurement phase.
  bool local_only = 10;

  // When true, the initiating bufferpool skips local disk lookup and writeback.
  // Peer handlers still use their local NVMe-backed cache, so this keeps the
  // measured path focused on remote NVMe + RDMA instead of requester-side reuse.
  bool skip_local_disk = 11;
}
