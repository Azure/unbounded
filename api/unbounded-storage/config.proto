syntax = "proto3";

package unbounded.storage.config;

option go_package = "github.com/Azure/unbounded/api/unbounded-storage;storageconfig";

message Config {
  // Operator-assigned opaque version tracked so operators can confirm which config has been applied. 0 means unversioned.
  uint64 version = 1;

  // Backend definitions keyed by globally unique id.
  repeated BackendSpec backends = 2;

  // Frontend definitions keyed by globally unique id.
  repeated FrontendSpec frontends = 3;

  // Settings read once at process start; changes require a restart to affect memory, fabric, topology, or metrics.
  StartupCfg startup = 4;

  // Cache definitions keyed by globally unique id.
  repeated CacheSpec caches = 5;

  // Neighborhood definitions keyed by globally unique id.
  repeated NeighborhoodSpec neighborhoods = 6;
}

// Startup-fixed settings, grouped by the subsystem that consumes them.
message StartupCfg {
  // Memory pool and backing allocation used by all serving shards.
  MemoryCfg memory = 1;

  // Fabric listen address and worker limits used for peer RPC connections.
  FabricCfg fabric = 2;

  // CPU, NUMA, and RDMA placement policy used when shards are pinned.
  TopologyCfg topology = 3;

  // Prometheus exporter settings captured at process start.
  MetricsCfg metrics = 4;
}

message MetricsCfg {
  // Prometheus metrics listen address, such as "0.0.0.0:9100"; empty disables the exporter.
  string addr = 1;
}

message MemoryCfg {
  // Allocates per-shard backing from the heap instead of 2 MiB hugepages.
  bool no_hugepages = 1;

  // Total backing pool across serving shards, in bytes; 0 defaults to 128 MiB.
  uint64 memory_total_bytes = 2;
}

message FabricCfg {
  // Per-shard fabric listen address; empty defaults to "0.0.0.0:0" and picks a free port.
  string addr = 1;

  // libfabric progress threads per shard; 0 defaults to 2.
  uint32 progress_threads = 2;

  // Progress-thread busy-poll budget in microseconds; 0 defaults to 10.
  uint32 progress_poll_us = 3;

  // Fabric RPC worker threads per shard; 0 defaults to 4.
  uint32 rpc_worker_threads = 4;

  // Maximum in-flight fabric operations per shard; 0 defaults to 1024.
  uint32 max_inflight = 5;
}

message TopologyCfg {
  // Field numbers 1-3 (rdma_progress_per_hca, rdma_handlers_per_hca,
  // tcp_fallback_threads) were removed when the legacy per-role planner
  // was retired in favor of the three-class core planner. Reserved so
  // the numbers and names are never reused.
  reserved 1, 2, 3;
  reserved "rdma_progress_per_hca", "rdma_handlers_per_hca", "tcp_fallback_threads";
  // Place shards on SMT sibling CPUs as well as physical cores.
  bool use_smt_siblings = 4;
  // Schedule shards onto isolcpus-isolated CPUs too. The proto3 false
  // default preserves the historical "respect isolated CPUs" behavior.
  bool ignore_isolated = 5;
  // Allow placing a shard on each NUMA node's CPU 0. The proto3 false
  // default preserves the historical "exclude node CPU 0" behavior.
  bool include_node_cpu0 = 6;
  // Use HCA ports that are not in the active state. The proto3 false
  // default preserves the historical "require active port" behavior.
  bool allow_inactive_port = 7;
  // Disable RDMA and force the libfabric tcp provider.
  bool disable_rdma = 8;
  // Cap on the number of serving-shard CPUs to pin. 0 -> auto (claim
  // every usable core left after storage and NIC-worker reservations).
  uint64 serving_cores = 9;
  // NIC-worker CPUs to pin per active HCA. 0 -> 4.
  uint64 nic_workers = 10;
  // Maximum number of HCAs to use per NUMA node. 0 -> 1. Raise this to
  // use additional HCAs on a NUMA node. HCAs whose NUMA node is unknown
  // are never capped.
  uint64 hcas_per_numa_node = 11;
}

message NeighborhoodSpec {
  reserved 2;
  reserved "kind";

  // Unique neighborhood id used in bindings and to scope peer fabric identities.
  string id = 1;

  // Backend id that this neighborhood fetches origin data from.
  string binds_to = 3;

  // Number of deterministic finger-table entries to derive per node; 0 defaults to 100.
  uint32 fingers_per_node = 4;

  // Local node id on the P2P ring; required when peers are configured and must not match a peer id.
  optional uint64 local_node_id = 5;

  // Local labels used by placement-aware planning.
  repeated string local_labels = 6;

  // Precomputed routing table that replaces automatic finger-table derivation when set.
  optional RoutingPlan routing_plan = 7;

  // Peer definitions available to this neighborhood.
  repeated PeerSpec peers = 8;
}

// A precomputed routing table for a single node, produced by a
// global-view planner. All ids reference `PeerSpec.id` values in the
// `peers` list (each must be present so a fabric connection exists).
// Ring positions are derived from ids, and labels do not affect runtime
// routing, so only ids are carried here.
message RoutingPlan {
  // Peer ids selected for this routing plan.
  repeated uint64 fingers = 1;

  // Peer id of the nearest-forward neighbor on the ring.
  optional uint64 successor = 2;

  // Peer id of the nearest-backward neighbor on the ring.
  optional uint64 predecessor = 3;
}

message PeerSpec {
  // Unique node id within the neighborhood, used for ring position and route references.
  uint64 id = 1;

  // Peer labels used by placement-aware planning.
  repeated string labels = 2;

  oneof config {
    // TCP fabric connection details for this peer.
    TcpPeerConfig tcp = 3;

    // RDMA fabric connection details for this peer.
    RdmaPeerConfig rdma = 4;
  }
}

message TcpPeerConfig {
  // TCP socket address used as this peer's fabric wire address.
  string addr = 1;
}

message RdmaPeerConfig {
  // Provider-native RDMA fabric address encoded as "hex:<fi_getname-bytes>".
  string addr = 1;

  // Optional local HCA NUMA preference for this peer connection.
  optional uint32 hca_numa = 2;
}

message DiskSpec {
  // Device or backing-file path; paths must be unique across all caches.
  string path = 1;

  // Optional io_uring queue depth override for this disk.
  optional uint32 queue_depth = 2;

  // Optional cache page size override in bytes; defaults to the storage engine page size.
  optional uint64 page_size_bytes = 3;

  // Skips cache admission checks and writes fetched pages directly to this disk.
  bool bypass_admission = 4;

  // Skips the recovery scan when no metadata page is valid; intended only for fresh or benchmark disks.
  bool skip_recovery_scan_if_no_meta = 5;

  oneof config {
    // Opens path as a block device.
    BlockDiskConfig block = 6;

    // Opens path as a provisioned file-backed disk.
    FileDiskConfig file = 7;
  }
}

message BlockDiskConfig {
  // Optional NUMA node hint used when placing storage work for this block device.
  optional uint32 numa = 1;
}

message FileDiskConfig {
  // Required file-backed disk capacity in bytes; the file is provisioned to this size before opening.
  optional uint64 size = 1;
}

message CacheSpec {
  reserved 2;
  reserved "kind";

  // Unique cache id used by frontends and the runtime disk registry.
  string id = 1;

  // Backend or neighborhood id that cache misses are fetched through.
  string binds_to = 3;

  // Disk definitions attached to this cache.
  repeated DiskSpec disks = 4;
}

message BackendSpec {
  // Unique backend id used as an origin target in the binding graph.
  string id = 1;

  oneof config {
    // Plain HTTP/1.1 byte-range origin backend.
    HttpBackendConfig http = 2;

    // S3-compatible plaintext HTTP/1.1 origin backend.
    S3BackendConfig s3 = 3;

    // Azure Blob-compatible plaintext HTTP/1.1 origin backend.
    AzureBackendConfig azure = 4;

    // Synthetic zero-filled origin backend for benchmarks.
    FakeBackendConfig fake = 5;
  }
}

message HttpBackendConfig {
  // Origin host:port endpoint resolved to an IPv4 address for plaintext HTTP/1.1 fetches.
  string endpoint = 1;

  // Stripe granularity in bytes for origin references; must be a power of two and defaults to 4 MiB.
  uint64 stripe_size_bytes = 2;

  // Maximum concurrent origin HTTP fetches; 0 defaults to 64.
  uint32 http_concurrency = 3;
}

message S3BackendConfig {
  // S3-compatible origin host:port endpoint resolved to an IPv4 address for plaintext HTTP/1.1 fetches.
  string endpoint = 1;

  // Stripe granularity in bytes for origin references; must be a power of two and defaults to 4 MiB.
  uint64 stripe_size_bytes = 2;

  // Maximum concurrent origin HTTP fetches; 0 defaults to 64.
  uint32 http_concurrency = 3;
}

message AzureBackendConfig {
  // Azure Blob-compatible origin host:port endpoint resolved to an IPv4 address for plaintext HTTP/1.1 fetches.
  string endpoint = 1;

  // Stripe granularity in bytes for origin references; must be a power of two and defaults to 4 MiB.
  uint64 stripe_size_bytes = 2;

  // Maximum concurrent origin HTTP fetches; 0 defaults to 64.
  uint32 http_concurrency = 3;
}

message FakeBackendConfig {
  // Stripe granularity in bytes for synthetic origin references; must be a power of two and defaults to 4 MiB.
  uint64 stripe_size_bytes = 1;

  // Size of each synthetic zero-filled object in bytes; 0 defaults to 1 MiB.
  uint64 object_size_bytes = 2;
}

message FrontendSpec {
  // Unique frontend id used to reconcile listener or loadgen instances.
  string id = 1;

  // Backend, cache, or neighborhood id that this frontend reads through.
  string binds_to = 2;

  oneof config {
    // HTTP GET frontend served from a socket listener per shard.
    HttpFrontendConfig http = 3;

    // S3-compatible frontend served from a socket listener per shard.
    S3FrontendConfig s3 = 4;

    // Synthetic load generator that issues reads through the normal data path.
    LoadgenFrontendConfig loadgen = 5;
  }
}

message HttpFrontendConfig {
  // Socket address for HTTP listeners; each serving shard binds it with SO_REUSEPORT.
  string addr = 1;
}

message S3FrontendConfig {
  // Socket address for S3-compatible listeners; each serving shard binds it with SO_REUSEPORT.
  string addr = 1;
}

message LoadgenFrontendConfig {
  // Synthetic read workers per serving shard; 0 defaults to 1.
  uint32 workers = 1;

  // Deterministic object stream seed; 0 uses the loadgen frontend default.
  uint64 seed = 2;

  // Number of distinct synthetic object ids to cycle over; 0 defaults to 1,000,000.
  uint64 object_count = 3;

  // Bytes to read from the start of each object; 0 reads the full resolved object length.
  uint64 read_bytes = 4;

  // Verify every returned body byte is zero. Intended for fake backends.
  bool verify = 5;
}
