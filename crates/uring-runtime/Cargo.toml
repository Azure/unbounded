[package]
name = "uring-runtime"
version = "0.1.0"
description = "A small, explicitly driven, thread-per-core io_uring runtime for Linux"
readme = "README.md"
keywords = ["io-uring", "async", "runtime", "linux"]
categories = ["asynchronous", "network-programming", "filesystem", "os::linux-apis"]
edition = "2024"
# Keep in sync with the MSRV toolchain in .github/workflows/ci.yaml (crates-msrv).
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Azure/unbounded"

# A standalone package: it is not part of any enclosing workspace and keeps
# its own Cargo.lock.
[workspace]

[dependencies]
io-uring = "0.7"
libc = "0.2"

[dev-dependencies]
futures = "0.3"

# Keep in sync with crates/uring-runtime-sim/Cargo.toml.
[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
