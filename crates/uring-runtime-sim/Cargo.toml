[package]
name = "uring-runtime-sim"
version = "0.1.0"
description = "Deterministic simulation backend for uring-runtime"
readme = "README.md"
keywords = ["io-uring", "simulation", "deterministic", "testing"]
categories = ["asynchronous", "development-tools::testing", "simulation"]
edition = "2024"
# Keep in sync with the MSRV toolchain in .github/workflows/ci.yaml (crates-msrv).
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Azure/unbounded"

# A standalone package: it is not part of any enclosing workspace and keeps
# its own Cargo.lock.
[workspace]

[dependencies]
uring-runtime = { path = "../uring-runtime", version = "0.1.0" }
libc = "0.2"
sha2 = "0.10"

# Keep in sync with crates/uring-runtime/Cargo.toml.
[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
