[workspace]
resolver = "3"
members = ["uring-runtime", "uring-runtime-sim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Azure/unbounded"

[workspace.dependencies]
uring-runtime = { path = "uring-runtime", version = "0.1.0" }
io-uring = "0.7"
libc = "0.2"
sha2 = "0.10"
futures = "0.3"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

# Unwinding is kept in every profile: thread groups rely on catch_unwind.
[profile.release]
debug = 1

[profile.test]
debug = 1
