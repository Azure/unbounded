# Exercises the Trivy setup used by release.yaml. Release scans only run on tag
# pushes, so without this workflow a broken setup would first surface during a
# release.

name: Trivy Setup

on:
  pull_request:
    branches:
      - main
      - release-*
    paths:
      - .github/actions/trivy-scan/**
      - .github/workflows/trivy-setup.yaml
      - hack/scripts/setup-trivy.sh
      - hack/scripts/setup-trivy_test.sh
  workflow_dispatch:

concurrency:
  group: trivy-setup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run setup-trivy.sh tests
        run: timeout --kill-after=10s 300s ./hack/scripts/setup-trivy_test.sh

  scan:
    name: Scan (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # Old enough to have known HIGH and CRITICAL findings.
      SCAN_IMAGE: mirror.gcr.io/library/alpine:3.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull image
        run: timeout --kill-after=10s 300s docker pull "${SCAN_IMAGE}"

      - name: Scan (report-only)
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          exit-code: "0"

      # A second scan in the same job reuses the installed binary and DB, as
      # the net-images job in release.yaml does.
      - name: Scan again (gating)
        id: gating
        continue-on-error: true
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          severity: CRITICAL
          exit-code: "1"

      # The gating scan must fail because of findings, not because the setup
      # broke, so confirm the findings with the installed binary directly.
      - name: Verify findings
        env:
          GATING_OUTCOME: ${{ steps.gating.outcome }}
        run: |
          set -euo pipefail
          if [[ "${GATING_OUTCOME}" != "failure" ]]; then
            echo "::error::gating scan outcome was '${GATING_OUTCOME}', want 'failure'"
            exit 1
          fi
          test "${TRIVY_SKIP_DB_UPDATE}" = "true"
          rc=0
          timeout --kill-after=10s 300s trivy image --quiet --severity CRITICAL --exit-code 3 "${SCAN_IMAGE}" >/dev/null || rc=$?
          if [[ "${rc}" -ne 3 ]]; then
            echo "::error::trivy exited ${rc}, want 3 (CRITICAL findings)"
            exit 1
          fi
