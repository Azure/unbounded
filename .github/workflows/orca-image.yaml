name: Publish Orca development image

on:
  push:
    branches: [main]

concurrency:
  group: orca-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # Main's required pre-merge checks gate publication; do not rerun CI here.
  # Signed release images and SBOMs are handled by release.yaml.
  publish-orca:
    name: Publish Orca Image (main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalize container registry
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/orca/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=main-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/orca:main
            ${{ env.REGISTRY }}/orca:main-${{ github.sha }}
          cache-from: type=gha,scope=orca
          cache-to: type=gha,mode=max,scope=orca
