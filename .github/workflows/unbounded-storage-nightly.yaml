name: unbounded-storage-nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Wall-clock budget for the DST loop (e.g. 20m, 1h)."
        required: false
        default: "20m"
      proptest_cases:
        description: "PROPTEST_CASES per cargo test invocation."
        required: false
        default: "32768"

concurrency:
  group: unbounded-storage-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dst-soak:
    name: DST soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DST_DURATION: ${{ github.event.inputs.duration || '20m' }}
      PROPTEST_CASES: ${{ github.event.inputs.proptest_cases || '32768' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config liburing-dev \
            libibverbs-dev librdmacm-dev

      - name: Set up Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup default stable

      # The fabric shim is compiled against the pinned libfabric 2.5.1 built
      # from source (see the Makefile). Distro `libfabric-dev` predates the
      # `src_addr` member on `struct fi_cq_err_entry` that the shim references,
      # so building against it fails to compile.
      - name: Cache pinned libfabric
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: tmp/libfabric
          key: libfabric-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build pinned libfabric
        run: make libfabric

      - name: Export pinned libfabric to the environment
        run: |
          version="$(sed -n 's/^LIBFABRIC_VERSION ?= //p' Makefile | head -n1)"
          prefix="${PWD}/tmp/libfabric/${version}"
          echo "LIBFABRIC_PKG_CONFIG_PATH=${prefix}/lib/pkgconfig" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${prefix}/lib" >> "${GITHUB_ENV}"

      - name: Cache cargo registry and target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cmd/unbounded-storage/target
          # Key on lockfile + manifest plus the native build inputs. The
          # `-nightly-` tier lets the soak job share a key space with the PR
          # job's restore keys while keeping a dedicated primary key for
          # release-mode artifacts.
          key: cargo-unbounded-storage-nightly-${{ runner.os }}-fabric-${{ hashFiles('cmd/unbounded-storage/Cargo.lock', 'cmd/unbounded-storage/Cargo.toml', 'cmd/unbounded-storage/build.rs', 'cmd/unbounded-storage/src/fabric/shim.c') }}
          restore-keys: |
            cargo-unbounded-storage-nightly-${{ runner.os }}-fabric-
            cargo-unbounded-storage-nightly-${{ runner.os }}-
            cargo-unbounded-storage-${{ runner.os }}-fabric-
            cargo-unbounded-storage-${{ runner.os }}-

      - name: Build DST test binary
        working-directory: cmd/unbounded-storage
        run: cargo test --release --locked --test dst --no-run

      - name: Run DST soak
        working-directory: cmd/unbounded-storage
        # Loop `cargo test` against the `dst` integration test until
        # the wall-clock budget expires. Each iteration uses a fresh
        # PROPTEST_SEED so the soak keeps exploring new (seed, workload)
        # pairs rather than re-running the same cases. `timeout` exits
        # 124 when it kills the loop; treat that as success. Any
        # non-zero exit from cargo test itself fails the job.
        run: |
          set -u
          status=0
          iteration=0
          start=$SECONDS
          # `timeout --preserve-status` would propagate a SIGTERM exit;
          # instead we rely on the explicit 124 check below.
          timeout "${DST_DURATION}" bash -c '
            set -eu
            i=0
            while :; do
              i=$((i + 1))
              # Derive a per-iteration seed from /dev/urandom so each
              # cargo invocation explores fresh proptest inputs.
              PROPTEST_SEED="$(od -An -N8 -tu8 /dev/urandom | tr -d " ")"
              export PROPTEST_SEED
              echo "::group::DST iteration ${i} (seed=${PROPTEST_SEED}, elapsed=$((SECONDS))s)"
              cargo test --release --locked --test dst -- --nocapture
              echo "::endgroup::"
            done
          ' || status=$?
          elapsed=$((SECONDS - start))
          if [ "${status}" -eq 124 ] || [ "${status}" -eq 0 ]; then
            echo "DST soak completed after ${elapsed}s (timeout exit=${status})."
            exit 0
          fi
          echo "DST soak failed after ${elapsed}s with exit code ${status}." >&2
          exit "${status}"

  model-check:
    name: TLA+ model check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache tla2tools.jar
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: tmp/tla2tools.jar
          # Key derives from the pinned TLA_TOOLS_VERSION / SHA in the
          # top-level Makefile; bump those to invalidate this cache.
          key: tla2tools-v1.8.0-237332bd

      - name: Run TLC
        run: make unbounded-storage-model-check

  arm64-build:
    name: Arm64 build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      # Source of truth for the libfabric version is the Makefile default
      # (LIBFABRIC_VERSION). It is pinned here too so the cache key stays in
      # sync; the value is passed to make so the two never diverge.
      LIBFABRIC_VERSION: "2.5.1"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates curl liburing-dev \
            libibverbs-dev librdmacm-dev

      # The distro libfabric (1.x) predates the merge of the experimental
      # `net` provider into `tcp`, so it lacks a native FI_EP_RDM `tcp`
      # provider. `make libfabric` builds a pinned release from source and
      # installs it under tmp/libfabric (cached below to skip the rebuild).
      - name: Cache libfabric
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: tmp/libfabric
          key: libfabric-${{ env.LIBFABRIC_VERSION }}-arm64-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build libfabric
        run: make libfabric LIBFABRIC_VERSION="$LIBFABRIC_VERSION"

      - name: Set up Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cmd/unbounded-storage/target
          key: cargo-unbounded-storage-arm64-${{ runner.os }}-fabric-${{ hashFiles('cmd/unbounded-storage/Cargo.lock', 'cmd/unbounded-storage/Cargo.toml', 'cmd/unbounded-storage/build.rs', 'cmd/unbounded-storage/src/fabric/shim.c') }}
          restore-keys: |
            cargo-unbounded-storage-arm64-${{ runner.os }}-fabric-
            cargo-unbounded-storage-arm64-${{ runner.os }}-

      - name: Build release binary
        run: make unbounded-storage-build LIBFABRIC_VERSION="$LIBFABRIC_VERSION"
