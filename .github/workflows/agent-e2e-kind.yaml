name: unbounded agent e2e

on:
  pull_request:
    paths:
      - cmd/agent/**
      - cmd/kubectl-unbounded/**
      - internal/cloudprovider/**
      - pkg/agent/**
      - internal/provision/**
      - internal/agentartifacts/**
      - internal/kube/**
      - hack/agent/e2e-kind/**
      - hack/cmd/agent-artifacts-builder/**
      - deploy/machina/crd/**
      - deploy/machina/*.yaml.tmpl
      - deploy/net/crd/**
      - deploy/net/*.yaml.tmpl
      - deploy/net/controller/*.yaml.tmpl
      - deploy/net/node/*.yaml.tmpl
      - images/agent-azlinux3/**
      - go.mod
      - go.sum
      - .github/workflows/agent-e2e-kind.yaml
  push:
    # release-* included so a cherry-pick onto a release branch gets the same
    # post-merge validation as main. The pull_request trigger above is
    # path-filtered with no branch filter, so it already covers release branches.
    branches: [main, release-*]
    paths:
      - cmd/agent/**
      - cmd/kubectl-unbounded/**
      - internal/cloudprovider/**
      - pkg/agent/**
      - internal/provision/**
      - internal/agentartifacts/**
      - internal/kube/**
      - hack/agent/e2e-kind/**
      - hack/cmd/agent-artifacts-builder/**
      - deploy/machina/crd/**
      - deploy/machina/*.yaml.tmpl
      - deploy/net/crd/**
      - deploy/net/*.yaml.tmpl
      - deploy/net/controller/*.yaml.tmpl
      - deploy/net/node/*.yaml.tmpl
      - images/agent-azlinux3/**
      - go.mod
      - go.sum
      - .github/workflows/agent-e2e-kind.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # The Azure Container Linux image is not on a public mirror. It lives in a
  # storage account that disables anonymous access and shared keys alike, so it
  # is reachable only with a federated Azure login, and GitHub withholds secrets
  # from workflows triggered by a fork. Every other host downloads from a public
  # mirror and is unaffected.
  #
  # A job-level `if` would skip the whole matrix, and a static matrix cannot
  # drop one entry conditionally, so the list is built here instead. On a fork
  # the ACL entry is absent rather than failing, which is the difference between
  # a contributor seeing their PR pass and seeing a red check they cannot fix.
  select-hosts:
    name: select host matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select hosts
        id: select
        env:
          # Absent for non-pull_request events, where secrets are available.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # Presence only. The image needs a federated login, and the entry is
          # left out entirely until one is configured, rather than added and
          # failed. GitHub masks the value; nothing here reads it.
          ACL_CREDENTIAL: ${{ secrets.ACL_IMAGE_CLIENT_ID }}
        run: |
          set -euo pipefail

          # Fedora, AlmaLinux, and CentOS Stream cover RPM hosts with Azure
          # Linux nspawn. Azure Linux 3 does not currently publish a QEMU-ready
          # VHD that this e2e can boot directly as the host VM.
          hosts='[
            {"host-base-os":"ubuntu2404","nspawn-base-os":"ubuntu2404","timeout":60},
            {"host-base-os":"fedora","nspawn-base-os":"azlinux3","timeout":60},
            {"host-base-os":"almalinux9","nspawn-base-os":"azlinux3","timeout":60},
            {"host-base-os":"almalinux10","nspawn-base-os":"azlinux3","timeout":60},
            {"host-base-os":"centosstream9","nspawn-base-os":"azlinux3","timeout":60},
            {"host-base-os":"centosstream10","nspawn-base-os":"azlinux3","timeout":60},
            {"host-base-os":"ubuntu2604","nspawn-base-os":"ubuntu2604","timeout":60}
          ]'

          # Azure Container Linux gets longer: it downloads a 630 MiB image and
          # boots a 31 GiB sparse overlay through OVMF.
          acl='{"host-base-os":"acl","nspawn-base-os":"azlinux3","timeout":75}'

          if [ -n "${HEAD_REPO}" ] && [ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]; then
            echo "::notice::Azure Container Linux is skipped for forks: its image needs Azure credentials"
          elif [ -z "${ACL_CREDENTIAL}" ]; then
            echo "::notice::Azure Container Linux is skipped: ACL_IMAGE_CLIENT_ID is not configured"
          else
            hosts="$(printf '%s' "${hosts}" | jq -c ". + [${acl}]")"
          fi

          hosts="$(printf '%s' "${hosts}" | jq -c .)"

          printf 'matrix=%s\n' "$(printf '%s' "${hosts}" | jq -c '{include: .}')" >> "${GITHUB_OUTPUT}"

  agent-e2e:
    name: agent e2e (host ${{ matrix.host-base-os }}, nspawn ${{ matrix.nspawn-base-os }})
    needs: select-hosts
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      packages: read
      # Federated login for the Azure Container Linux image. Requested on this
      # job alone rather than for the workflow, because no other step needs it.
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-hosts.outputs.matrix) }}
    env:
      KIND_CLUSTER_NAME: agent-e2e-${{ matrix.host-base-os }}-${{ matrix.nspawn-base-os }}
      VM_NAME: agent-e2e-${{ matrix.host-base-os }}-${{ matrix.nspawn-base-os }}
      VM_SUBNET: "192.168.100"
      VM_IP: "192.168.100.10"
      AGENT_MACHINE_NAME: agent-e2e-${{ matrix.host-base-os }}-${{ matrix.nspawn-base-os }}
      HOST_BASE_OS: ${{ matrix.host-base-os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login
        if: matrix.host-base-os == 'acl'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.ACL_IMAGE_CLIENT_ID }}
          tenant-id: ${{ secrets.ACL_IMAGE_TENANT_ID }}
          subscription-id: ${{ secrets.ACL_IMAGE_SUBSCRIPTION_ID }}

      - name: Resolve the Azure Container Linux build
        if: matrix.host-base-os == 'acl'
        id: acl-image
        run: |
          set -euo pipefail

          # Fetched over REST rather than with `az storage blob download`,
          # which requires a seekable target and so cannot write to a pipe.
          # This is the same call e2e.py makes, for the same reason.
          token="$(az account get-access-token \
            --resource https://storage.azure.com/ --query accessToken -o tsv)"
          manifest="$(curl -fsSL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${token}" \
            -H "x-ms-version: 2021-12-02" \
            https://aksflexaclimagestme.blob.core.windows.net/images/latest.json)"

          build="$(printf '%s' "${manifest}" | jq -r .build_id)"
          if [ -z "${build}" ] || [ "${build}" = "null" ]; then
            echo "::error::latest.json does not name a build_id"; exit 1
          fi

          echo "Azure Container Linux build ${build}"
          printf 'build=%s\n' "${build}" >> "${GITHUB_OUTPUT}"

      # Keyed on the build, so a refreshed image misses and is downloaded once
      # rather than every run re-fetching 630 MiB from the storage account.
      - name: Restore the host image
        if: matrix.host-base-os == 'acl'
        uses: actions/cache@640a1c2554105b57832a23eea0b4672fc7a790d5 # v4.2.3
        with:
          path: .vm-e2e/acl-${{ steps.acl-image.outputs.build }}.qcow2
          key: acl-image-${{ steps.acl-image.outputs.build }}

      - name: Set up test control plane
        uses: ./.github/actions/agent-e2e-kind-control-plane
        with:
          cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          vm-subnet: ${{ env.VM_SUBNET }}

      - name: Set up machina resources
        uses: ./.github/actions/agent-e2e-machina-setup

      - name: Run shared host lifecycle suite
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose run-suite --suite lifecycle

      - name: Run fresh-instance bootstrap suite
        run: |
          python3 ./hack/agent/e2e-kind/e2e.py --verbose retire-lifecycle-vm
          python3 ./hack/agent/e2e-kind/e2e.py --verbose launch-vm
          python3 ./hack/agent/e2e-kind/e2e.py --verbose run-suite --suite fresh-bootstrap

      - name: Collect logs
        if: always()
        uses: ./.github/actions/agent-e2e-kind-logs
        with:
          artifact-name: agent-e2e-kind-${{ matrix.host-base-os }}-${{ matrix.nspawn-base-os }}-logs

      - name: Cleanup
        if: always()
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose cleanup

  agent-bootstrap-recovery:
    name: agent bootstrap recovery (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KIND_CLUSTER_NAME: agent-bootstrap-recovery
      VM_NAME: agent-bootstrap-recovery
      VM_SUBNET: "192.168.100"
      VM_IP: "192.168.100.10"
      AGENT_MACHINE_NAME: agent-bootstrap-recovery
      HOST_BASE_OS: ubuntu2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up test control plane
        uses: ./.github/actions/agent-e2e-kind-control-plane
        with:
          cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          vm-subnet: ${{ env.VM_SUBNET }}
      - name: Set up machina resources
        uses: ./.github/actions/agent-e2e-machina-setup
      - name: Retry late bootstrap and repair after ordinary repave
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose run-suite --suite bootstrap-recovery
      - name: Verify strict reset
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose reset-agent
      - name: Collect logs
        if: always()
        uses: ./.github/actions/agent-e2e-kind-logs
        with:
          artifact-name: agent-bootstrap-recovery-logs
      - name: Cleanup
        if: always()
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose cleanup

  agent-config-e2e:
    name: agent config e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KIND_CLUSTER_NAME: agent-config-e2e
      VM_NAME: agent-config-e2e
      VM_SUBNET: "192.168.110"
      VM_IP: "192.168.110.10"
      AGENT_MACHINE_NAME: agent-config-e2e
      GITHUB_TOKEN: ${{ github.token }}
      CONFIG_SCENARIO_WORKERS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up test control plane
        uses: ./.github/actions/agent-e2e-kind-control-plane
        with:
          cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          vm-subnet: ${{ env.VM_SUBNET }}
          create-vm: "false"

      - name: Set up machina resources
        uses: ./.github/actions/agent-e2e-machina-setup

      - name: Discover and validate node configs
        run: |
          set -o pipefail
          mkdir -p logs
          python3 ./hack/agent/e2e-kind/monitor_suite.py --timeout 2700 -- \
            python3 ./hack/agent/e2e-kind/e2e.py --verbose run-suite --suite configuration \
            2>&1 | tee logs/configuration-suite.log

      - name: Collect logs
        if: always()
        uses: ./.github/actions/agent-e2e-kind-logs
        with:
          artifact-name: agent-config-e2e-logs
          node-configs: "true"

      - name: Cleanup
        if: always()
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose cleanup
