name: unbounded agent e2e

on:
  pull_request:
    paths:
      - cmd/agent/**
      - cmd/kubectl-unbounded/**
      - internal/cloudprovider/**
      - pkg/agent/**
      - internal/provision/**
      - internal/agentartifacts/**
      - internal/kube/**
      - internal/hostroot/**
      - internal/fsutil/**
      - internal/executil/**
      - hack/agent/e2e-kind/**
      - hack/cmd/agent-artifacts-builder/**
      - deploy/machina/crd/**
      - deploy/machina/*.yaml.tmpl
      - deploy/net/crd/**
      - deploy/net/*.yaml.tmpl
      - deploy/net/controller/*.yaml.tmpl
      - deploy/net/node/*.yaml.tmpl
      - images/agent-azlinux3/**
      - go.mod
      - go.sum
      - .github/workflows/agent-e2e-kind.yaml
      - .github/actions/agent-e2e-*/**
  push:
    # release-* included so a cherry-pick onto a release branch gets the same
    # post-merge validation as main. The pull_request trigger above is
    # path-filtered with no branch filter, so it already covers release branches.
    branches: [main, release-*]
    paths:
      - cmd/agent/**
      - cmd/kubectl-unbounded/**
      - internal/cloudprovider/**
      - pkg/agent/**
      - internal/provision/**
      - internal/agentartifacts/**
      - internal/kube/**
      - internal/hostroot/**
      - internal/fsutil/**
      - internal/executil/**
      - hack/agent/e2e-kind/**
      - hack/cmd/agent-artifacts-builder/**
      - deploy/machina/crd/**
      - deploy/machina/*.yaml.tmpl
      - deploy/net/crd/**
      - deploy/net/*.yaml.tmpl
      - deploy/net/controller/*.yaml.tmpl
      - deploy/net/node/*.yaml.tmpl
      - images/agent-azlinux3/**
      - go.mod
      - go.sum
      - .github/workflows/agent-e2e-kind.yaml
      - .github/actions/agent-e2e-*/**
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  # Where the Azure Container Linux image comes from; see
  # hack/agent/e2e-kind/README.md. The gallery export creates its temporary
  # disk in this resource group, in the gallery image's region. "manifest"
  # switches back to the storage-account image and its identity.
  ACL_IMAGE_SOURCE: gallery
  ACL_IMAGE_RESOURCE_GROUP: unbounded-dev-infra-westus2

jobs:
  # The Azure Container Linux image needs a federated Azure login, which forks
  # do not get, and a static matrix cannot drop one entry conditionally. The ACL
  # entry is left out rather than failed; see hack/agent/e2e-kind/README.md.
  select-hosts:
    name: select host matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select hosts
        id: select
        env:
          # Absent for non-pull_request events, where secrets are available.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # Checked for presence only; the selected source's Azure login needs
          # all three. The prefix is a literal either way, so a secret missing
          # from one set never falls through to the other set's identity.
          ACL_SECRET_PREFIX: ${{ env.ACL_IMAGE_SOURCE == 'manifest' && 'ACL_IMAGE' || 'ACL_GALLERY' }}
          ACL_CLIENT_ID: ${{ secrets[format('{0}_CLIENT_ID', env.ACL_IMAGE_SOURCE == 'manifest' && 'ACL_IMAGE' || 'ACL_GALLERY')] }}
          ACL_TENANT_ID: ${{ secrets[format('{0}_TENANT_ID', env.ACL_IMAGE_SOURCE == 'manifest' && 'ACL_IMAGE' || 'ACL_GALLERY')] }}
          ACL_SUBSCRIPTION_ID: ${{ secrets[format('{0}_SUBSCRIPTION_ID', env.ACL_IMAGE_SOURCE == 'manifest' && 'ACL_IMAGE' || 'ACL_GALLERY')] }}
        run: |
          set -euo pipefail

          # Fedora and AlmaLinux cover RPM hosts with Azure Linux nspawn.
          # Azure Linux 3 does not currently publish a QEMU-ready VHD that this
          # e2e can boot directly as the host VM.
          hosts='[
            {"host-base-os":"ubuntu2404","nspawn-base-os":"ubuntu2404","timeout":60},
            {"host-base-os":"fedora","nspawn-base-os":"azlinux3","timeout":60},
            {"host-base-os":"almalinux9","nspawn-base-os":"azlinux3","timeout":60},
            {"host-base-os":"almalinux10","nspawn-base-os":"azlinux3","timeout":60},
            {"host-base-os":"ubuntu2604","nspawn-base-os":"ubuntu2604","timeout":60}
          ]'

          # Azure Container Linux gets longer: every run exports its image from
          # the gallery (about 850 MiB downloaded through a temporary managed
          # disk, about two minutes), and it boots a 32.5 GiB sparse overlay
          # through OVMF.
          acl='{"host-base-os":"acl","nspawn-base-os":"azlinux3","timeout":75}'

          if [ -n "${HEAD_REPO}" ] && [ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]; then
            echo "::notice::Azure Container Linux is skipped for forks: its image needs Azure credentials"
          elif [ -z "${ACL_CLIENT_ID}" ] || [ -z "${ACL_TENANT_ID}" ] || [ -z "${ACL_SUBSCRIPTION_ID}" ]; then
            echo "::notice::Azure Container Linux is skipped: ${ACL_SECRET_PREFIX}_CLIENT_ID, ${ACL_SECRET_PREFIX}_TENANT_ID and ${ACL_SECRET_PREFIX}_SUBSCRIPTION_ID are not all configured"
          else
            hosts="$(printf '%s' "${hosts}" | jq -c ". + [${acl}]")"
          fi

          printf 'matrix=%s\n' "$(printf '%s' "${hosts}" | jq -c '{include: .}')" >> "${GITHUB_OUTPUT}"

  agent-e2e:
    name: agent e2e (host ${{ matrix.host-base-os }}, nspawn ${{ matrix.nspawn-base-os }})
    needs: select-hosts
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      packages: read
      # The federated login for the Azure Container Linux image. Permissions
      # cannot vary by matrix entry, so every entry gets it, and only the ACL
      # entry's Azure login step uses it. Pull requests from forks never get
      # an OIDC token, whatever this says.
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-hosts.outputs.matrix) }}
    env:
      KIND_CLUSTER_NAME: agent-e2e-${{ matrix.host-base-os }}-${{ matrix.nspawn-base-os }}
      VM_NAME: agent-e2e-${{ matrix.host-base-os }}-${{ matrix.nspawn-base-os }}
      VM_SUBNET: "192.168.100"
      VM_IP: "192.168.100.10"
      AGENT_MACHINE_NAME: agent-e2e-${{ matrix.host-base-os }}-${{ matrix.nspawn-base-os }}
      HOST_BASE_OS: ${{ matrix.host-base-os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The gallery export's identity can create and delete disks in one
      # resource group; the manifest's can only read the image container.
      - name: Azure login
        if: matrix.host-base-os == 'acl'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          # Indexed by a literal prefix, not `cond && a || b`, which falls
          # through to the other identity when the selected secret is empty.
          client-id: ${{ secrets[format('{0}_CLIENT_ID', env.ACL_IMAGE_SOURCE == 'manifest' && 'ACL_IMAGE' || 'ACL_GALLERY')] }}
          tenant-id: ${{ secrets[format('{0}_TENANT_ID', env.ACL_IMAGE_SOURCE == 'manifest' && 'ACL_IMAGE' || 'ACL_GALLERY')] }}
          subscription-id: ${{ secrets[format('{0}_SUBSCRIPTION_ID', env.ACL_IMAGE_SOURCE == 'manifest' && 'ACL_IMAGE' || 'ACL_GALLERY')] }}

      # Exported for later e2e.py processes, so the job uses one build. The
      # image is exported or downloaded on every run, never put in the Actions
      # cache: a pull request from a fork can restore the base branch's caches,
      # and the image is only readable with the Azure login above.
      - name: Resolve the Azure Container Linux build
        if: matrix.host-base-os == 'acl'
        run: python3 ./hack/agent/e2e-kind/e2e.py resolve-host-image

      - name: Set up test control plane
        uses: ./.github/actions/agent-e2e-kind-control-plane
        with:
          cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          vm-subnet: ${{ env.VM_SUBNET }}

      - name: Set up machina resources
        uses: ./.github/actions/agent-e2e-machina-setup

      - name: Run shared host lifecycle suite
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose run-suite --suite lifecycle

      - name: Run fresh-instance bootstrap suite
        run: |
          python3 ./hack/agent/e2e-kind/e2e.py --verbose retire-lifecycle-vm
          python3 ./hack/agent/e2e-kind/e2e.py --verbose launch-vm
          python3 ./hack/agent/e2e-kind/e2e.py --verbose run-suite --suite fresh-bootstrap

      - name: Collect logs
        if: always()
        uses: ./.github/actions/agent-e2e-kind-logs
        with:
          artifact-name: agent-e2e-kind-${{ matrix.host-base-os }}-${{ matrix.nspawn-base-os }}-logs

      - name: Cleanup
        if: always()
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose cleanup

  agent-bootstrap-recovery:
    name: agent ${{ matrix.title }} (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: bootstrap-recovery
            title: bootstrap recovery
            suite: bootstrap-recovery
          # A host installed by the last release before the host root, linked
          # and then moved. That release cannot be installed on an immutable
          # host, so one conventional host covers it.
          - id: host-root-migration
            title: host root migration
            suite: migration
    env:
      KIND_CLUSTER_NAME: agent-${{ matrix.id }}
      VM_NAME: agent-${{ matrix.id }}
      VM_SUBNET: "192.168.100"
      VM_IP: "192.168.100.10"
      AGENT_MACHINE_NAME: agent-${{ matrix.id }}
      HOST_BASE_OS: ubuntu2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up test control plane
        uses: ./.github/actions/agent-e2e-kind-control-plane
        with:
          cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          vm-subnet: ${{ env.VM_SUBNET }}
      - name: Set up machina resources
        uses: ./.github/actions/agent-e2e-machina-setup
      - name: Run the ${{ matrix.title }} suite
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose run-suite --suite ${{ matrix.suite }}
      - name: Verify strict reset
        if: matrix.suite == 'bootstrap-recovery'
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose reset-agent
      - name: Collect logs
        if: always()
        uses: ./.github/actions/agent-e2e-kind-logs
        with:
          artifact-name: agent-${{ matrix.id }}-logs
      - name: Cleanup
        if: always()
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose cleanup

  agent-config-e2e:
    name: agent config e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KIND_CLUSTER_NAME: agent-config-e2e
      VM_NAME: agent-config-e2e
      VM_SUBNET: "192.168.110"
      VM_IP: "192.168.110.10"
      AGENT_MACHINE_NAME: agent-config-e2e
      GITHUB_TOKEN: ${{ github.token }}
      CONFIG_SCENARIO_WORKERS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up test control plane
        uses: ./.github/actions/agent-e2e-kind-control-plane
        with:
          cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          vm-subnet: ${{ env.VM_SUBNET }}
          create-vm: "false"

      - name: Set up machina resources
        uses: ./.github/actions/agent-e2e-machina-setup

      - name: Discover and validate node configs
        run: |
          set -o pipefail
          mkdir -p logs
          python3 ./hack/agent/e2e-kind/monitor_suite.py --timeout 2700 -- \
            python3 ./hack/agent/e2e-kind/e2e.py --verbose run-suite --suite configuration \
            2>&1 | tee logs/configuration-suite.log

      - name: Collect logs
        if: always()
        uses: ./.github/actions/agent-e2e-kind-logs
        with:
          artifact-name: agent-config-e2e-logs
          node-configs: "true"

      - name: Cleanup
        if: always()
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose cleanup
