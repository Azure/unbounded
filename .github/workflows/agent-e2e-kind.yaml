name: unbounded agent e2e

on:
  pull_request:
    paths:
      - cmd/agent/**
      - cmd/kubectl-unbounded/**
      - internal/cloudprovider/**
      - pkg/agent/**
      - internal/provision/**
      - internal/kube/**
      - hack/agent/e2e-kind/**
      - deploy/machina/crd/**
      - deploy/machina/*.yaml.tmpl
      - deploy/net/crd/**
      - deploy/net/*.yaml.tmpl
      - deploy/net/controller/*.yaml.tmpl
      - deploy/net/node/*.yaml.tmpl
      - images/agent-azlinux3/**
      - go.mod
      - go.sum
      - .github/workflows/agent-e2e-kind.yaml
  push:
    branches: [main]
    paths:
      - cmd/agent/**
      - cmd/kubectl-unbounded/**
      - internal/cloudprovider/**
      - pkg/agent/**
      - internal/provision/**
      - internal/kube/**
      - hack/agent/e2e-kind/**
      - deploy/machina/crd/**
      - deploy/machina/*.yaml.tmpl
      - deploy/net/crd/**
      - deploy/net/*.yaml.tmpl
      - deploy/net/controller/*.yaml.tmpl
      - deploy/net/node/*.yaml.tmpl
      - images/agent-azlinux3/**
      - go.mod
      - go.sum
      - .github/workflows/agent-e2e-kind.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-e2e:
    name: agent e2e (host ${{ matrix.host-base-os }}, nspawn ${{ matrix.nspawn-base-os }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - host-base-os: ubuntu2404
            nspawn-base-os: ubuntu2404
          # Fedora covers the RPM host path for Azure Linux nspawn testing.
          # Azure Linux 3 does not currently publish a QEMU-ready VHD that this
          # e2e can boot directly as the host VM.
          - host-base-os: fedora
            nspawn-base-os: azlinux3
          - host-base-os: ubuntu2604
            nspawn-base-os: ubuntu2604
    env:
      KIND_CLUSTER_NAME: agent-e2e-${{ matrix.host-base-os }}-${{ matrix.nspawn-base-os }}
      VM_NAME: agent-e2e-${{ matrix.host-base-os }}-${{ matrix.nspawn-base-os }}
      VM_SUBNET: "192.168.100"
      VM_IP: "192.168.100.10"
      AGENT_MACHINE_NAME: agent-e2e-${{ matrix.host-base-os }}-${{ matrix.nspawn-base-os }}
      HOST_BASE_OS: ${{ matrix.host-base-os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up test control plane
        uses: ./.github/actions/agent-e2e-kind-control-plane
        with:
          cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          vm-subnet: ${{ env.VM_SUBNET }}

      - name: Set up machina resources
        uses: ./.github/actions/agent-e2e-machina-setup

      # No Machine CR pre-created; agent self-registers during bootstrap.
      - name: Run agent to join VM to cluster
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose run-agent

      - name: Wait for node to become Ready
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose wait-for-node

      - name: Validate host and nspawn distro pair
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose validate-host-nspawn-distro

      - name: Validate controller health after join
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose validate-controllers-healthy

      - name: Dump persisted agent config
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose dump-persisted-agent-config

      - name: Validate kube-proxy on all nodes
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose validate-kube-proxy

      - name: Validate Machine CR (self-registered)
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose validate-machine-cr-created

      - name: Validate node restart operation
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose validate-node-reboot-operation

      - name: Validate agent upgrade operation
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose validate-agent-upgrade-operation

      - name: Validate agent upgrade rollback
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose validate-agent-upgrade-rollback

      - name: Validate workload on agent node
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose validate-workload

      - name: Reset agent on VM
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose reset-agent

      - name: Delete Machine CR
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose delete-machine-cr

      # Rejoin: run the agent again on the same VM after reset.
      - name: Ensure Kind bridge attachment for rejoin
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose ensure-kind-bridge

      - name: Rejoin agent to cluster
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose run-agent

      - name: Wait for node to become Ready (rejoin)
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose wait-for-node

      - name: Validate host and nspawn distro pair (rejoin)
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose validate-host-nspawn-distro

      - name: Validate controller health after rejoin
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose validate-controllers-healthy

      - name: Dump persisted agent config (rejoin)
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose dump-persisted-agent-config

      - name: Validate kube-proxy on all nodes (rejoin)
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose validate-kube-proxy

      - name: Validate Machine CR (rejoin)
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose validate-machine-cr-created

      - name: Validate node restart operation (rejoin)
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose validate-node-reboot-operation

      - name: Validate workload on rejoined agent node
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose validate-workload

      - name: Validate node repave upgrade
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose validate-node-repave-upgrade

      - name: Collect logs
        if: always()
        uses: ./.github/actions/agent-e2e-kind-logs
        with:
          artifact-name: agent-e2e-kind-${{ matrix.host-base-os }}-${{ matrix.nspawn-base-os }}-logs

      - name: Cleanup
        if: always()
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose cleanup

  agent-config-e2e:
    name: agent config e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KIND_CLUSTER_NAME: agent-config-e2e
      VM_NAME: agent-config-e2e
      VM_SUBNET: "192.168.110"
      VM_IP: "192.168.110.10"
      AGENT_MACHINE_NAME: agent-config-e2e
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up test control plane
        uses: ./.github/actions/agent-e2e-kind-control-plane
        with:
          cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          vm-subnet: ${{ env.VM_SUBNET }}
          create-vm: "false"

      - name: Set up machina resources
        uses: ./.github/actions/agent-e2e-machina-setup

      - name: Discover and validate node configs
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose validate-node-configs

      - name: Collect logs
        if: always()
        uses: ./.github/actions/agent-e2e-kind-logs
        with:
          artifact-name: agent-config-e2e-logs
          node-configs: "true"

      - name: Cleanup
        if: always()
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose cleanup
