name: unbounded docs staging

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-staging.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DOCS_STAGING_REPOSITORY != ''
    runs-on: ubuntu-latest
    environment:
      name: docs-staging
      url: ${{ vars.DOCS_STAGING_BASE_URL }}
    env:
      STAGING_REPOSITORY: ${{ vars.DOCS_STAGING_REPOSITORY }}
      STAGING_BASE_URL: ${{ vars.DOCS_STAGING_BASE_URL }}
    steps:
      - name: Validate staging settings
        run: |
          set -euo pipefail
          if [[ ! "$STAGING_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] ||
             [[ "${STAGING_REPOSITORY,,}" == "${GITHUB_REPOSITORY,,}" ]]; then
            echo "::error::DOCS_STAGING_REPOSITORY must name a separate owner/repository"
            exit 1
          fi
          if [[ ! "$STAGING_BASE_URL" =~ ^https://[^/[:space:]]+/([^[:space:]]*/)?$ ]]; then
            echo "::error::DOCS_STAGING_BASE_URL must be an HTTPS URL with a trailing slash"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "latest"
          extended: true

      - name: Build staging docs
        env:
          HUGO_TITLE: "Unbounded (staging)"
          HUGO_PARAMS_NOINDEX: "true"
        run: hugo --minify --baseURL "$STAGING_BASE_URL"
        working-directory: docs

      - name: Build search index
        run: npx --yes pagefind --site public
        working-directory: docs

      - name: Require staging deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_STAGING_DEPLOY_KEY }}
        run: |
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo "::error::DOCS_STAGING_DEPLOY_KEY is required to deploy staging docs"
            exit 1
          fi

      - name: Publish to staging repository
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          deploy_key: ${{ secrets.DOCS_STAGING_DEPLOY_KEY }}
          external_repository: ${{ vars.DOCS_STAGING_REPOSITORY }}
          publish_branch: gh-pages
          publish_dir: docs/public
          # Each deploy replaces CNAME. Leave the variable unset for github.io URLs.
          cname: ${{ vars.DOCS_STAGING_CNAME }}
