# The isolation mode change suites are too expensive for every change: each
# one boots a VM and reprovisions it more than once. They run here every night
# instead; see hack/agent/e2e-kind/README.md and
# designs/agent-isolation-modes-test-plan.md (T01 and T03).
name: unbounded agent isolation nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: agent-isolation-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent-isolation:
    name: agent isolation ${{ matrix.suite }} (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # nspawn -> none -> nspawn, each by reprovision, with a soft reboot
          # and a host reboot at each stop.
          - id: isolation-matrix
            suite: isolation-matrix
            timeout: 120
          # A same-mode declaration and a reprovision refused without the
          # allow-reprovision annotation.
          - id: isolation-rollback
            suite: isolation-rollback
            timeout: 60
    env:
      KIND_CLUSTER_NAME: agent-${{ matrix.id }}
      VM_NAME: agent-${{ matrix.id }}
      VM_SUBNET: "192.168.100"
      VM_IP: "192.168.100.10"
      AGENT_MACHINE_NAME: agent-${{ matrix.id }}
      HOST_BASE_OS: ubuntu2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up test control plane
        uses: ./.github/actions/agent-e2e-kind-control-plane
        with:
          cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          vm-subnet: ${{ env.VM_SUBNET }}
      - name: Set up machina resources
        uses: ./.github/actions/agent-e2e-machina-setup
      - name: Run the ${{ matrix.suite }} suite
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose run-suite --suite ${{ matrix.suite }}
      - name: Collect isolation evidence
        if: always()
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose collect-isolation-evidence
      - name: Collect logs
        if: always()
        uses: ./.github/actions/agent-e2e-kind-logs
        with:
          artifact-name: agent-${{ matrix.id }}-logs
      - name: Cleanup
        if: always()
        run: python3 ./hack/agent/e2e-kind/e2e.py --verbose cleanup
