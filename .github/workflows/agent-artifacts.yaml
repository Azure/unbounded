name: unbounded agent offline artifacts

# Publishes OCI artifact bundles using the tag shape documented in
# designs/agent-offline-bootstrap.md:
#
#   ghcr.io/<owner>/unbounded/bootstrap-artifacts:<tag-prefix>-k8s-<kubernetes-version>
#
# For example, pushing tag "agent-artifacts/v0.4.0" publishes:
#
#   ghcr.io/azure/unbounded/bootstrap-artifacts:v0.4.0-k8s-v1.34.2
#
# Manual dispatch uses the "tag" input as <tag-prefix>. If omitted, the first
# 12 characters of the commit SHA are used.
on:
  push:
    tags:
      - "agent-artifacts/*"

  workflow_dispatch:
    inputs:
      tag:
        description: "OCI tag prefix to publish, for example v0.4.0. Defaults to the commit SHA."
        required: false
        type: string
      kubernetes_versions:
        description: "Kubernetes versions to publish. Accepts comma, space, or newline separated values. Defaults to hack/cmd/agent-artifacts-builder/kubernetes-versions.txt."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      kubernetes_versions: ${{ steps.resolve.outputs.kubernetes_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build agent artifacts builder
        run: go build -o bin/agent-artifacts-builder ./hack/cmd/agent-artifacts-builder/main.go

      - name: Resolve publish inputs
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_KUBERNETES_VERSIONS: ${{ inputs.kubernetes_versions }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: bin/agent-artifacts-builder resolve-publish-inputs

      - name: Upload agent artifacts builder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-artifacts-builder
          path: bin/agent-artifacts-builder
          retention-days: 1

  publish:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Pushes target the same GHCR package. Keep them serialized to avoid
      # intermittent GHCR write_package failures from concurrent blob uploads.
      max-parallel: 1
      matrix:
        kubernetes_version: ${{ fromJson(needs.resolve.outputs.kubernetes_versions) }}
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}/unbounded
      ARTIFACT_TAG_PREFIX: ${{ needs.resolve.outputs.tag }}
      KUBERNETES_VERSION: ${{ matrix.kubernetes_version }}
    steps:
      - name: Download agent artifacts builder
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: agent-artifacts-builder
          path: bin

      - name: Prepare agent artifacts builder
        run: chmod +x bin/agent-artifacts-builder

      - name: Normalize registry
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish offline artifact bundle
        run: |
          set -euo pipefail
          # Keep this tag format in sync with designs/agent-offline-bootstrap.md.
          oci_ref="${REGISTRY}/bootstrap-artifacts:${ARTIFACT_TAG_PREFIX}-k8s-${KUBERNETES_VERSION}"
          output_dir="dist/bootstrap-artifacts/${KUBERNETES_VERSION}"

          echo "Artifact source version: ${KUBERNETES_VERSION}"
          echo "Output directory: ${output_dir}"
          echo "OCI reference: ${oci_ref}"

          bin/agent-artifacts-builder \
            --output-dir "$output_dir" \
            --kubernetes-version "$KUBERNETES_VERSION" \
            --arch amd64 \
            --arch arm64 \
            --oci-ref "$oci_ref"

          echo "::group::Offline artifact bundle contents"
          find "$output_dir" -type f -printf '%P %s bytes\n' | sort
          du -sh "$output_dir"
          echo "::endgroup::"

          echo "Published $oci_ref"

      - name: Upload filesystem artifact bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-artifacts-${{ matrix.kubernetes_version }}
          path: dist/bootstrap-artifacts/${{ matrix.kubernetes_version }}/
          retention-days: 7
