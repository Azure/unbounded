name: unbounded agent offline artifacts

# Publishes OCI artifact bundles using the tag shape documented in
# designs/agent-offline-bootstrap.md:
#
#   ghcr.io/<owner>/unbounded/bootstrap-artifacts:<tag-prefix>-k8s-<kubernetes-version>
#
# For example, pushing tag "v0.4.0" publishes:
#
#   ghcr.io/azure/unbounded/bootstrap-artifacts:v0.4.0-k8s-v1.34.2
#
# The main release workflow calls this workflow after GoReleaser creates the
# draft release. Manual dispatch can publish OCI and Actions artifacts without
# a release, or target an existing release explicitly.
on:
  workflow_call:
    inputs:
      tag:
        description: "OCI tag prefix to publish."
        required: true
        type: string
      release_tag:
        description: "Existing GitHub release tag to receive archive assets."
        required: false
        type: string
        default: ""
      kubernetes_versions:
        description: "Kubernetes versions to publish. Empty uses embedded defaults."
        required: false
        type: string
        default: ""
      rootfs_images:
        description: "Tagged rootfs OCI images to export. Empty uses embedded defaults."
        required: false
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      tag:
        description: "OCI tag prefix to publish, for example v0.4.0. Defaults to the commit SHA."
        required: false
        type: string
      release_tag:
        description: "Existing GitHub release tag to receive archive assets. Empty skips release upload."
        required: false
        type: string
      kubernetes_versions:
        description: "Kubernetes versions to publish. Accepts comma, space, or newline separated values. Defaults to hack/cmd/agent-artifacts-builder/kubernetes-versions.txt."
        required: false
        type: string
      rootfs_images:
        description: "Tagged rootfs OCI images to export. Accepts comma, space, or newline separated values. Defaults to hack/cmd/agent-artifacts-builder/rootfs-images.txt."
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      kubernetes_versions: ${{ steps.resolve.outputs.kubernetes_versions }}
      kubernetes_version_groups: ${{ steps.resolve.outputs.kubernetes_version_groups }}
      rootfs_images: ${{ steps.resolve.outputs.rootfs_images }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build agent artifacts builder
        run: go build -o bin/agent-artifacts-builder ./hack/cmd/agent-artifacts-builder/main.go

      - name: Resolve publish inputs
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_KUBERNETES_VERSIONS: ${{ inputs.kubernetes_versions }}
          INPUT_ROOTFS_IMAGES: ${{ inputs.rootfs_images }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: bin/agent-artifacts-builder resolve-publish-inputs

      - name: Upload agent artifacts builder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-artifacts-builder
          path: bin/agent-artifacts-builder
          retention-days: 1

  publish-rootfs-archives:
    needs: resolve
    runs-on: ubuntu-latest
    env:
      ROOTFS_IMAGES_JSON: ${{ needs.resolve.outputs.rootfs_images }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - name: Download agent artifacts builder
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: agent-artifacts-builder
          path: bin

      - name: Prepare agent artifacts builder
        run: chmod +x bin/agent-artifacts-builder

      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export rootfs OCI layout archives
        run: |
          mkdir -p dist/rootfs-images

          while IFS= read -r image_ref; do
            archive_name="${image_ref##*/}"
            archive_name="${archive_name//:/-}"
            archive_name="${archive_name//@/-}"

            bin/agent-artifacts-builder archive-oci-image \
              --source "${image_ref}" \
              --output "dist/rootfs-images/${archive_name}.oci.tar.gz"
          done < <(jq -r '.[]' <<< "${ROOTFS_IMAGES_JSON}")

      - name: Upload rootfs archives to GitHub release
        if: env.RELEASE_TAG != ''
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/release-assets

          for source in dist/rootfs-images/*.oci.tar.gz; do
            destination="dist/release-assets/rootfs-$(basename "${source}")"
            cp "${source}" "${destination}"
            sha256sum "${destination}" | sed 's#  dist/release-assets/#  #' > "${destination}.sha256"
          done

          gh release upload "${RELEASE_TAG}" \
            dist/release-assets/rootfs-*.oci.tar.gz \
            dist/release-assets/rootfs-*.oci.tar.gz.sha256 \
            --clobber

      - name: Upload rootfs OCI layout archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs-oci-layouts
          path: dist/rootfs-images/
          retention-days: 7

  publish:
    needs: resolve
    name: publish (${{ matrix.group.minor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Limit concurrent pushes to the same GHCR package to avoid intermittent
      # write_package failures from too many simultaneous blob uploads.
      max-parallel: 3
      matrix:
        group: ${{ fromJson(needs.resolve.outputs.kubernetes_version_groups) }}
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}/unbounded
      ARTIFACT_TAG_PREFIX: ${{ needs.resolve.outputs.tag }}
      KUBERNETES_MINOR: ${{ matrix.group.minor }}
      KUBERNETES_VERSIONS_JSON: ${{ toJson(matrix.group.versions) }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - name: Download agent artifacts builder
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: agent-artifacts-builder
          path: bin

      - name: Prepare agent artifacts builder
        run: chmod +x bin/agent-artifacts-builder

      - name: Normalize registry
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish offline artifact bundles
        run: bin/agent-artifacts-builder publish-version-group

      - name: Upload bootstrap archives to GitHub release
        if: env.RELEASE_TAG != ''
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/release-assets

          for source in dist/bootstrap-artifacts/*.tar.gz; do
            source_name=$(basename "${source}")
            suffix=${source_name#"bootstrap-artifacts-${ARTIFACT_TAG_PREFIX}-"}
            destination="dist/release-assets/bootstrap-artifacts-${suffix}"
            cp "${source}" "${destination}"
            sha256sum "${destination}" | sed 's#  dist/release-assets/#  #' > "${destination}.sha256"
          done

          gh release upload "${RELEASE_TAG}" \
            dist/release-assets/bootstrap-artifacts-k8s-*.tar.gz \
            dist/release-assets/bootstrap-artifacts-k8s-*.tar.gz.sha256 \
            --clobber

      - name: Upload filesystem and HTTPS artifact bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-artifacts-${{ matrix.group.minor }}
          path: dist/bootstrap-artifacts/
          retention-days: 7
