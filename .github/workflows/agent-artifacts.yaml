name: unbounded agent offline artifacts

# Publishes OCI artifact bundles using the tag shape documented in
# designs/agent-offline-bootstrap.md:
#
#   ghcr.io/<owner>/unbounded/bootstrap-artifacts:<tag-prefix>-k8s-<kubernetes-version>
#
# For example, pushing tag "v0.4.0" publishes:
#
#   ghcr.io/azure/unbounded/bootstrap-artifacts:v0.4.0-k8s-v1.34.2
#
# The main release workflow calls this workflow after GoReleaser creates the
# draft release. Manual dispatch can publish OCI and Actions artifacts without
# a release, or target an existing release explicitly.
on:
  workflow_call:
    inputs:
      tag:
        description: "OCI tag prefix to publish."
        required: true
        type: string
      release_tag:
        description: "Existing GitHub release tag to receive archive assets."
        required: false
        type: string
        default: ""
      kubernetes_versions:
        description: "Kubernetes versions to publish. Empty uses embedded defaults."
        required: false
        type: string
        default: ""
      rootfs_images:
        description: "Tagged rootfs OCI images to export. Empty uses embedded defaults."
        required: false
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      tag:
        description: "OCI tag prefix to publish, for example v0.4.0. Defaults to the commit SHA."
        required: false
        type: string
      release_tag:
        description: "Existing GitHub release tag to receive archive assets. Empty skips release upload."
        required: false
        type: string
      kubernetes_versions:
        description: "Kubernetes versions to publish. Accepts comma, space, or newline separated values. Defaults to hack/cmd/agent-artifacts-builder/kubernetes-versions.txt."
        required: false
        type: string
      rootfs_images:
        description: "Tagged rootfs OCI images to export. Accepts comma, space, or newline separated values. Defaults to hack/cmd/agent-artifacts-builder/rootfs-images.txt."
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                      /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL &
          sudo docker image prune -af &
          wait
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build agent artifacts builder
        run: go build -o bin/agent-artifacts-builder ./hack/cmd/agent-artifacts-builder/main.go

      - name: Resolve publish inputs
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_KUBERNETES_VERSIONS: ${{ inputs.kubernetes_versions }}
          INPUT_ROOTFS_IMAGES: ${{ inputs.rootfs_images }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: bin/agent-artifacts-builder resolve-publish-inputs

      - name: Normalize registry
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/unbounded
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish artifacts
        env:
          ARTIFACT_TAG_PREFIX: ${{ steps.resolve.outputs.tag }}
          KUBERNETES_VERSIONS_JSON: ${{ steps.resolve.outputs.kubernetes_versions }}
          ROOTFS_IMAGES_JSON: ${{ steps.resolve.outputs.rootfs_images }}
        run: |
          args=(build --output-dir dist \
            --legal-files-dir "${{ github.workspace }}" \
            --oci-registry "${REGISTRY}" \
            --artifact-tag-prefix "${ARTIFACT_TAG_PREFIX}")

          while IFS= read -r version; do
            args+=(--kubernetes-version "${version}")
          done < <(jq -r '.[]' <<< "${KUBERNETES_VERSIONS_JSON}")

          while IFS= read -r image_ref; do
            args+=(--rootfs-image "${image_ref}")
          done < <(jq -r '.[]' <<< "${ROOTFS_IMAGES_JSON}")

          bin/agent-artifacts-builder "${args[@]}"

      - name: Upload archives to GitHub release
        if: steps.resolve.outputs.release_tag != ''
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            dist/rootfs/*.oci.tar.gz \
            dist/rootfs/*.oci.tar.gz.sha256 \
            dist/bootstrap-artifacts/*.tar.gz \
            dist/bootstrap-artifacts/*.tar.gz.sha256 \
            --clobber

      - name: Upload rootfs OCI layout archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs-oci-layouts
          path: dist/rootfs/
          retention-days: 7

      - name: Upload bootstrap archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-artifacts
          path: dist/bootstrap-artifacts/
          retention-days: 7
