name: unbounded release prepare

# ---------------------------------------------------------------------------
# Phase 1 of the two-phase release: computes the next version and pushes the
# tag. It builds, signs and publishes nothing.
#
# Why split it out: release.yaml must run in the tag's context so its keyless
# cosign signatures carry the identity `release.yaml@refs/tags/vX.Y.Z`, which
# the deploy workflow verifies. A tag created mid-run by a workflow dispatched
# on a branch would sign as `@refs/heads/main` and fail that check. For the same
# reason release.yaml has deliberately NO workflow_dispatch fallback: if a tag
# lands without triggering a build, delete it and re-run this workflow.
#
# The tag is pushed with an SSH deploy key (RELEASE_TAG_DEPLOY_KEY), not
# GITHUB_TOKEN, because GitHub suppresses workflow triggers for tags pushed with
# the default token. A deploy-key push is exempt.
#
# Version resolution lives in hack/cmd/relctl, covered by its own Go tests. It
# used to be inline here, where the only way to test a change was to push a real
# tag, and where it grew three sharp edges: `bump` silently forking a train,
# `pre` accepting a value that went backwards, and `promote` guessing at the
# highest prerelease in the repository - which is what orphaned v0.1.24.
#
# What a branch is allowed to release is decided in the same place: main cuts
# minors (or a major when explicitly asked), a release-X.Y branch cuts patches.
# There is no `bump` input, because the answer is fully determined by where you
# are cutting from.
#
# NOTE: the release tooling comes from the default branch, not from the branch
# being released. That is deliberate for release branches: the branch supplies
# the history the version is computed against, main supplies the tool that
# computes it. An old branch would otherwise cut releases with old tooling, and
# would be running code from a branch with weaker protection.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "release: cut vX.Y.Z | prerelease: cut vX.Y.Z-<pre> | promote: finalize a prerelease"
        required: true
        type: choice
        options:
          - release
          - prerelease
          - promote
        default: release
      branch:
        description: "Branch to cut from: main, or a release-X.Y maintenance branch."
        required: true
        type: string
        default: main
      major:
        description: "main only: cut a major (vX.0.0) instead of a minor. Majors are never derived."
        type: boolean
        default: false
      pre:
        description: "Prerelease suffix (e.g. rc.3). Blank takes the next rc automatically, which is almost always what you want."
        required: false
        type: string
        default: ""
      version:
        description: "promote only: explicit final version to cut (e.g. v0.2.0); blank = the single live prerelease train"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Compute the version and print it without pushing a tag"
        type: boolean
        default: false
      allow_concurrent_trains:
        description: "Permit starting a second live prerelease train alongside an existing one"
        type: boolean
        default: false

# The tag push authenticates via the SSH deploy key, not GITHUB_TOKEN, so no
# contents:write is needed here.
permissions:
  contents: read

# Serialize prepares so two dispatches cannot race to mint tags.
concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch
        # Checked before the checkout, so an unexpected ref never reaches it.
        # Restricted to main and release-X.Y rather than accepting any ref:
        # `ref: main` used to be a hard guarantee that a release came from
        # reviewed code on a protected branch, and an unrestricted input would
        # give that up. A tag cut from a feature branch still signs correctly
        # and passes every downstream check, so nothing else would catch it.
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          if [[ ! "$BRANCH" =~ ^(main|release-(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8}))$ ]]; then
            echo "::error::branch must be main or release-X.Y, got: ${BRANCH}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          # Wires git to push over SSH with the deploy key so the resulting
          # tag push triggers release.yaml.
          ssh-key: ${{ secrets.RELEASE_TAG_DEPLOY_KEY }}

      - name: Preflight deploy key
        # Fail fast before any tag is created if the deploy key is missing or
        # cannot authenticate, so we never leave a pushed tag without a build.
        env:
          HAS_KEY: ${{ secrets.RELEASE_TAG_DEPLOY_KEY != '' }}
        run: |
          set -euo pipefail

          if [[ "$HAS_KEY" != "true" ]]; then
            echo "::error::RELEASE_TAG_DEPLOY_KEY secret is not set; cannot push the tag"
            exit 1
          fi

          if ! git ls-remote origin >/dev/null 2>&1; then
            echo "::error::cannot authenticate to origin with the deploy key (git ls-remote failed)"
            exit 1
          fi

          echo "Deploy key authenticates to origin."

      - name: Take the release tooling from the default branch
        # The branch supplies the history the version is computed against; main
        # supplies the tool that computes it. Without this, a release-0.3 branch
        # would resolve versions with whatever tooling existed when it was cut,
        # and would execute code from a branch protected less strictly than
        # main.
        #
        # A SEPARATE checkout rather than the overlay this used to be. The old
        # form copied hack/release/ over the working tree, which worked because
        # the tooling was self-contained shell. relctl is Go and needs go.mod
        # and go.sum, and overlaying main's module files onto a release branch
        # would change the module for every other step in this job.
        #
        # Cone mode includes root files, so go.mod and go.sum come along with
        # hack/cmd/relctl. relctl imports nothing else in this repository, which
        # is what makes that sufficient.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: _release-tools
          sparse-checkout: hack/cmd/relctl
          sparse-checkout-cone-mode: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: _release-tools/go.mod
          cache-dependency-path: _release-tools/go.sum

      - name: Build the release tooling
        # Built once rather than `go run` per invocation: this is on the path of
        # every release, and the binary is used again by the summary step.
        run: |
          set -euo pipefail

          cd _release-tools
          go build -o "${RUNNER_TEMP}/relctl" ./hack/cmd/relctl
          echo "Release tooling built from $(git rev-parse --short HEAD) on the default branch"

      - name: Compute tag
        # Inputs arrive as env vars, not interpolated into the script: `pre` and
        # `version` are free-form, and a `${{ }}` inlined in a run block is
        # expanded before bash parses it, so a shell metacharacter would become
        # script syntax.
        #
        # One call where there were two. relctl decides what the branch may cut
        # and resolves the version in the same pass, because it has to know the
        # first to do the second, and emits all four keys: tag, base, bump and
        # series. bump is reported below; series is no longer consumed by
        # anything, since the resolver applies it internally.
        id: compute
        env:
          MODE: ${{ inputs.mode }}
          BRANCH: ${{ inputs.branch }}
          MAJOR: ${{ inputs.major }}
          PRE: ${{ inputs.pre }}
          VERSION: ${{ inputs.version }}
          ALLOW_CONCURRENT_TRAINS: ${{ inputs.allow_concurrent_trains }}
        run: |
          set -euo pipefail

          # The `version` override only applies to promote.
          if [[ -n "$VERSION" && "$MODE" != "promote" ]]; then
            echo "::error::version is only valid with mode=promote (got mode=${MODE})"
            exit 1
          fi

          # A boolean input arrives as a string, and relctl takes a flag rather
          # than a value, so anything unexpected would silently become false.
          # The tool cannot make this refusal for us; it is made here.
          case "$MAJOR" in
            true | false) ;;
            *) echo "::error::major must be true or false, got: ${MAJOR}"; exit 1 ;;
          esac

          # Built as an array with explicit ifs: `[[ cond ]] && args+=(...)`
          # evaluates to false when the condition is false, which under `set -e`
          # exits the step. That would fire on the most ordinary invocation
          # there is, the one that passes no optional flags at all.
          args=(next --branch "$BRANCH" --mode "$MODE" --output github)

          # The BRANCH supplies the history; the tool comes from main. Passed
          # explicitly rather than relying on the working directory, because
          # pointing this at _release-tools would resolve main's tags while
          # reporting the branch's policy, and only a release branch would show
          # it.
          args+=(--repo-path "$GITHUB_WORKSPACE")

          if [[ "$MAJOR" == "true" ]]; then
            args+=(--major)
          fi

          if [[ -n "$PRE" ]]; then
            args+=(--pre "$PRE")
          fi

          if [[ -n "$VERSION" ]]; then
            args+=(--version "$VERSION")
          fi

          if [[ "$ALLOW_CONCURRENT_TRAINS" == "true" ]]; then
            args+=(--allow-concurrent-trains)
          fi

          "${RUNNER_TEMP}/relctl" "${args[@]}" >> "$GITHUB_OUTPUT"

      - name: Push tag
        # Compared explicitly, not by truthiness: `gh workflow run -f
        # dry_run=false` submits a string, and a NON-EMPTY STRING IS TRUTHY, so
        # `!inputs.dry_run` would skip the push on an ordinary run.
        if: ${{ inputs.dry_run != true && inputs.dry_run != 'true' }}
        env:
          TAG: ${{ steps.compute.outputs.tag }}
          BASE: ${{ steps.compute.outputs.base }}
          MODE: ${{ inputs.mode }}
          BRANCH: ${{ inputs.branch }}
          BUMP: ${{ steps.compute.outputs.bump }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # BASE is HEAD for release and prerelease, and the last candidate's
          # commit for promote, so promoting ships the tree that was soaked
          # rather than everything merged since.
          git tag "$TAG" "$BASE"
          git push origin "$TAG"

          echo "Pushed ${TAG} at ${BASE} (mode=${MODE}, branch=${BRANCH}, bump=${BUMP}); release.yaml will build and sign it in tag context."
          {
            echo "### Prepared release ${TAG}"
            echo ""
            echo "- Branch: \`${BRANCH}\`"
            echo "- Bump: \`${BUMP}\`"
            echo "- Commit: \`${BASE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report dry run
        if: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
        env:
          TAG: ${{ steps.compute.outputs.tag }}
          BASE: ${{ steps.compute.outputs.base }}
          BRANCH: ${{ inputs.branch }}
          BUMP: ${{ steps.compute.outputs.bump }}
        run: |
          set -euo pipefail

          echo "Dry run: would have pushed ${TAG} at ${BASE}. Nothing was created."
          {
            echo "### Dry run: would prepare ${TAG}"
            echo
            echo "- Branch: \`${BRANCH}\`"
            echo "- Bump: \`${BUMP}\`"
            echo "- Commit: \`${BASE}\`"
            echo "- Commits on HEAD not included: $(git rev-list --count "${BASE}..HEAD")"
            echo
            echo "No tag was pushed. Re-run with dry_run unchecked to cut it."
          } >> "$GITHUB_STEP_SUMMARY"
