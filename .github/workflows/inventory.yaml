name: Inventory

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "designs/**"

permissions:
  contents: read
  packages: write

env:
  CONTAINER_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  inventory:
    name: Build, Scan, and Push Inventory
    runs-on: ubuntu-latest
    steps:
      - name: Normalize container registry
        run: echo "CONTAINER_REGISTRY=${CONTAINER_REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build all inventory binaries
        run: make inventory-all

      - name: Build all inventory container images
        run: make image-inventory-all-local CONTAINER_ENGINE=docker

      - name: Vulnerability check
        run: make vulncheck

      - name: Log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push all inventory container images
        run: make image-inventory-all-push CONTAINER_ENGINE=docker
