name: Inventory

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  CONTAINER_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  inventory:
    name: Build, Scan, and Push Inventory
    runs-on: ubuntu-latest
    steps:
      - name: Normalize container registry
        run: echo "CONTAINER_REGISTRY=${CONTAINER_REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build all inventory binaries
        run: make inventory-all

      - name: Vulnerability check
        run: make vulncheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push inventory-aggregator image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/inventory/aggregator/Containerfile
          push: true
          tags: ${{ env.CONTAINER_REGISTRY }}/inventory-aggregator:latest
          cache-from: type=gha,scope=inventory-aggregator
          cache-to: type=gha,mode=max,scope=inventory-aggregator
          provenance: false

      - name: Build and push inventory-inspector image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/inventory/inspector/Containerfile
          push: true
          tags: ${{ env.CONTAINER_REGISTRY }}/inventory-inspector:latest
          cache-from: type=gha,scope=inventory-inspector
          cache-to: type=gha,mode=max,scope=inventory-inspector
          provenance: false

      - name: Build and push inventory-viewer image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/inventory/viewer/Containerfile
          push: true
          tags: ${{ env.CONTAINER_REGISTRY }}/inventory-viewer:latest
          cache-from: type=gha,scope=inventory-viewer
          cache-to: type=gha,mode=max,scope=inventory-viewer
          provenance: false
