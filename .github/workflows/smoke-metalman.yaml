name: unbounded metalman smoke test

on:
  pull_request:
    paths:
      - cmd/agent/**
      - cmd/metalman/**
      - cmd/kubectl-unbounded/**
      - internal/metalman/**
      - internal/playpen/**
      - e2e/metalman/**
      - api/machina/v1alpha3/**
      - deploy/machina/**
      - images/agent-ubuntu2404/**
      - images/host-ubuntu2404/**
      - images/netboot/**
      - hack/smoke-metalman-e2e.sh
      - Makefile
  push:
    branches: [main]
    paths:
      - cmd/agent/**
      - cmd/metalman/**
      - cmd/kubectl-unbounded/**
      - internal/metalman/**
      - internal/playpen/**
      - e2e/metalman/**
      - api/machina/v1alpha3/**
      - deploy/machina/**
      - images/agent-ubuntu2404/**
      - images/host-ubuntu2404/**
      - images/netboot/**
      - hack/smoke-metalman-e2e.sh
      - Makefile
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                      /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.30.0

      - name: Install network prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bridge-utils iproute2 iptables python3 tar wireguard-tools
          sudo modprobe wireguard || true
          ip -V
          wg --version

      - name: Write Playpen kubeconfig
        env:
          PLAYPEN_KUBECONFIG_B64: ${{ secrets.PLAYPEN_KUBECONFIG_B64 }}
        run: |
          if [ -z "${PLAYPEN_KUBECONFIG_B64}" ]; then
            echo "PLAYPEN_KUBECONFIG_B64 secret is required for metalman smoke" >&2
            exit 1
          fi
          mkdir -p "${HOME}/.kube"
          printf '%s' "${PLAYPEN_KUBECONFIG_B64}" | base64 -d > "${HOME}/.kube/config.bench"
          chmod 0600 "${HOME}/.kube/config.bench"

      - name: Run Go smoke test
        env:
          METALMAN_E2E_ARTIFACT_MODE: local
        run: |
          ./hack/smoke-metalman-e2e.sh
