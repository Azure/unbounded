name: unbounded metalman smoke test

on:
  pull_request:
    paths:
      - cmd/agent/**
      - cmd/metalman/**
      - cmd/kubectl-unbounded/**
      - cmd/playpen/**
      - internal/metalman/**
      - internal/playpen/**
      - internal/provision/**
      - pkg/agent/**
      - api/machina/v1alpha3/**
      - deploy/machina/06-metalman-rbac.yaml.tmpl
      - deploy/machina/crd/**
      - deploy/playpen/**
      - e2e/metalman/**
      - images/playpen/**
      - images/agent-ubuntu2404/**
      - images/host-ubuntu2404/**
      - images/netboot/**
      - hack/kind-smoke-config.yaml
      - Makefile
      - .github/workflows/smoke-metalman.yaml
  push:
    branches: [main]
    paths:
      - cmd/agent/**
      - cmd/metalman/**
      - cmd/kubectl-unbounded/**
      - cmd/playpen/**
      - internal/metalman/**
      - internal/playpen/**
      - internal/provision/**
      - pkg/agent/**
      - api/machina/v1alpha3/**
      - deploy/machina/06-metalman-rbac.yaml.tmpl
      - deploy/machina/crd/**
      - deploy/playpen/**
      - e2e/metalman/**
      - images/playpen/**
      - images/agent-ubuntu2404/**
      - images/host-ubuntu2404/**
      - images/netboot/**
      - hack/kind-smoke-config.yaml
      - Makefile
      - .github/workflows/smoke-metalman.yaml
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          # GitHub-hosted runners have ~14 GB free; the smoke test needs
          # much more because it builds two Docker images (one containing a
          # full Ubuntu cloud image) and creates a 20 GB sparse VM disk.
          # Remove the largest pre-installed toolchains
          # in parallel and prune unused Docker images.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                      /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL &
          sudo docker image prune -af &
          wait
          df -h /

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cpio curl iproute2 iptables

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: network=host

      - name: Build host-ubuntu2404 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/host-ubuntu2404/Containerfile
          load: true
          tags: localhost:5555/unbounded/host-ubuntu2404:smoke
          cache-from: type=gha,scope=host-ubuntu2404
          cache-to: type=gha,mode=max,scope=host-ubuntu2404
          provenance: false

      - name: Build netboot image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/netboot/Containerfile
          load: true
          tags: localhost:5555/unbounded/netboot:smoke
          cache-from: type=gha,scope=netboot
          cache-to: type=gha,mode=max,scope=netboot
          provenance: false

      - name: Build agent-ubuntu2404 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/agent-ubuntu2404
          file: images/agent-ubuntu2404/Containerfile
          load: true
          tags: localhost:5555/unbounded/agent-ubuntu2404:smoke
          cache-from: type=gha,scope=agent-ubuntu2404
          cache-to: type=gha,mode=max,scope=agent-ubuntu2404
          provenance: false

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: kind
          # The smoke test assigns 192.168.200.2 to the kind container on the
          # Playpen bridge and rewrites the apiserver URL to that IP.
          # Include it as an extra SAN so the kubelet in the VM can verify the
          # API server TLS certificate.
          config: hack/kind-smoke-config.yaml

      - name: Run smoke test
        run: |
          sudo -E env "PATH=$PATH" METALMAN_SMOKE_CLUSTER=kind \
            make e2e-metalman

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metalman-smoke-artifacts
          path: e2e/metalman/.artifacts
          if-no-files-found: ignore
