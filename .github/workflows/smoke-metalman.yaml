name: unbounded metalman smoke test

on:
  pull_request:
    paths:
      - cmd/agent/**
      - cmd/metalman/**
      - internal/metalman/**
      - api/machina/v1alpha3/**
      - deploy/machina/crd/**
      - hack/smoke-metalman.py
      - images/agent-ubuntu2404/**
      - images/host-ubuntu2404/**
      - images/netboot/**
      - .github/workflows/smoke-metalman.yaml
  push:
    branches: [main]
    paths:
      - cmd/agent/**
      - cmd/metalman/**
      - internal/metalman/**
      - api/machina/v1alpha3/**
      - deploy/machina/crd/**
      - hack/smoke-metalman.py
      - images/agent-ubuntu2404/**
      - images/host-ubuntu2404/**
      - images/netboot/**
      - .github/workflows/smoke-metalman.yaml
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.install-mode }}, ${{ matrix.boot-protocol }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - install-mode: Raw
            boot-protocol: PXE
          - install-mode: RAID1
            boot-protocol: PXE
          - install-mode: RAID1
            boot-protocol: HTTP
    env:
      SMOKE_INSTALL_MODE: ${{ matrix.install-mode }}
      SMOKE_BOOT_PROTOCOL: ${{ matrix.boot-protocol }}
    steps:
      - name: Free disk space
        run: |
          # GitHub-hosted runners have ~14 GB free; the smoke test needs
          # much more because it builds two Docker images (one containing a
          # full Ubuntu cloud image) and creates a 20 GB qcow2 VM disk that
          # grows dynamically.  Remove the largest pre-installed toolchains
          # in parallel and prune unused Docker images.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
                      /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL &
          sudo docker image prune -af &
          wait
          df -h /

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-smoke-noble-${{ hashFiles('.github/workflows/smoke-metalman.yaml') }}
          restore-keys: apt-smoke-noble-

      - name: Install system dependencies
        run: |
          retry_root() {
            local timeout_seconds=$1
            shift

            local attempt status
            for attempt in 1 2 3; do
              if sudo timeout --kill-after=30s "${timeout_seconds}s" "$@"; then
                return 0
              fi

              status=$?
              if [ "$attempt" -eq 3 ]; then
                return "$status"
              fi

              echo "command failed with status ${status} (attempt ${attempt}/3); retrying"
              sleep $((attempt * 10))
            done
          }

          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o DPkg::Lock::Timeout=120
          )

          retry_root 300 apt-get "${APT_OPTS[@]}" update
          retry_root 600 env DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
            dnsmasq qemu-kvm libvirt-daemon-system libvirt-clients virtinst \
            ovmf qemu-utils swtpm swtpm-tools \
            python3-pip python3-yaml cpio iptables
          EXTRA_PKGS=()
          if [ "${SMOKE_INSTALL_MODE}" = "RAID1" ] || [ "${SMOKE_BOOT_PROTOCOL}" = "HTTP" ]; then
            EXTRA_PKGS+=(libguestfs-tools)
          fi
          if [ "${SMOKE_INSTALL_MODE}" = "RAID1" ]; then
            EXTRA_PKGS+=(zstd)
          fi
          if [ "${#EXTRA_PKGS[@]}" -gt 0 ]; then
            retry_root 600 env DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTS[@]}" install -y --no-install-recommends "${EXTRA_PKGS[@]}"
          fi
          retry_root 300 pip3 install --break-system-packages --ignore-installed sushy-tools
          sudo systemctl start libvirtd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: network=host

      - name: Build host-ubuntu2404 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/host-ubuntu2404/Containerfile
          load: true
          tags: localhost:5555/unbounded/host-ubuntu2404:smoke
          cache-from: type=gha,scope=host-ubuntu2404
          cache-to: type=gha,mode=max,scope=host-ubuntu2404
          provenance: false

      - name: Build netboot image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/netboot/Containerfile
          load: true
          tags: localhost:5555/unbounded/netboot:smoke
          cache-from: type=gha,scope=netboot
          cache-to: type=gha,mode=max,scope=netboot
          provenance: false

      - name: Build agent-ubuntu2404 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/agent-ubuntu2404
          file: images/agent-ubuntu2404/Containerfile
          load: true
          tags: localhost:5555/unbounded/agent-ubuntu2404:smoke
          cache-from: type=gha,scope=agent-ubuntu2404
          cache-to: type=gha,mode=max,scope=agent-ubuntu2404
          provenance: false

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: kind
          # The smoke test assigns 192.168.200.2 (KIND_SMOKE_IP) to the kind
          # container on virbr-smoke and rewrites the apiserver URL to that IP.
          # Include it as an extra SAN so the kubelet in the VM can verify the
          # API server TLS certificate.
          config: hack/kind-smoke-config.yaml

      - name: Run smoke test
        run: |
          sudo mkdir -p /root/.kube
          sudo cp "${KUBECONFIG:-$HOME/.kube/config}" /root/.kube/config
          sudo -E env "PATH=$PATH" \
            python3 hack/smoke-metalman.py
