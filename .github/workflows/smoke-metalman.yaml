name: unbounded metalman smoke test

on:
  pull_request:
    paths:
      - cmd/agent/**
      - cmd/metalman/**
      - internal/metalman/**
      - internal/playpen/**
      - api/machina/v1alpha3/**
      - deploy/machina/crd/**
      - images/agent-ubuntu2404/**
      - images/host-ubuntu2404/**
      - images/netboot/**
      - e2e/metalman/**
      - .github/workflows/smoke-metalman.yaml
      - Makefile
  push:
    branches: [main]
    paths:
      - cmd/agent/**
      - cmd/metalman/**
      - internal/metalman/**
      - internal/playpen/**
      - api/machina/v1alpha3/**
      - deploy/machina/crd/**
      - images/agent-ubuntu2404/**
      - images/host-ubuntu2404/**
      - images/netboot/**
      - e2e/metalman/**
      - .github/workflows/smoke-metalman.yaml
      - Makefile
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      METALMAN_SMOKE_HOST_IMAGE: ${{ vars.METALMAN_SMOKE_HOST_IMAGE }}
      METALMAN_SMOKE_NETBOOT_IMAGE: ${{ vars.METALMAN_SMOKE_NETBOOT_IMAGE }}
      METALMAN_SMOKE_AGENT_IMAGE: ${{ vars.METALMAN_SMOKE_AGENT_IMAGE }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install tunnel dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iproute2 iptables wireguard-tools curl

      - name: Write Playpen kubeconfig
        env:
          PLAYPEN_KUBECONFIG_CONTENT: ${{ secrets.PLAYPEN_KUBECONFIG }}
          DEFAULT_KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          KUBECONFIG_CONTENT="${PLAYPEN_KUBECONFIG_CONTENT:-${DEFAULT_KUBECONFIG_CONTENT}}"
          if [[ -z "${KUBECONFIG_CONTENT}" ]]; then
            echo "::error::Set PLAYPEN_KUBECONFIG or KUBECONFIG to the Playpen cluster kubeconfig"
            exit 1
          fi
          printf '%s' "${KUBECONFIG_CONTENT}" > "$RUNNER_TEMP/playpen.kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/playpen.kubeconfig" >> "$GITHUB_ENV"

      - name: Check image refs
        run: |
          missing=0
          for name in METALMAN_SMOKE_HOST_IMAGE METALMAN_SMOKE_NETBOOT_IMAGE METALMAN_SMOKE_AGENT_IMAGE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repository or environment variable ${name} is required"
              missing=1
            fi
          done
          exit "$missing"

      - name: Run smoke test
        run: sudo -E env "PATH=$PATH" make e2e-metalman

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metalman-smoke-artifacts
          path: e2e/metalman/.artifacts
          if-no-files-found: ignore
