name: CodeQL

on:
  push:
    branches:
      - main
      # Release branches receive cherry-picked fixes, including security fixes,
      # so they need code scanning as much as main does.
      - release-*
  pull_request:
    branches:
      - main
      - release-*
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # In merge_group runs, GitHub's merge queue can complete and delete the
    # temporary gh-readonly-queue ref before this job finishes uploading its
    # SARIF results (Go analysis in particular can take 10+ minutes), which
    # makes the upload step fail with a spurious "ref not found" error even
    # though the merge itself already succeeded. Don't let that false
    # failure block/redden the check; the same commit is also analyzed via
    # the pull_request trigger before it ever enters the queue.
    continue-on-error: ${{ github.event_name == 'merge_group' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Rust build dependencies
        if: ${{ matrix.language == 'rust' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates curl liburing-dev \
            libibverbs-dev librdmacm-dev protobuf-compiler

      - name: Set up Rust toolchain
        if: ${{ matrix.language == 'rust' }}
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Rust crates
        if: ${{ matrix.language == 'rust' }}
        run: |
          make unbounded-storage-test
          cargo build --manifest-path cmd/racer/Cargo.toml --locked --all-targets
          cargo build --manifest-path cmd/racer/Cargo.toml --locked --all-targets --features sim

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:${{ matrix.language }}"
