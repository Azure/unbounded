name: racer e2e

# Path filters cover Racer sources only. The suite also exercises the operator
# install path, which the nightly schedule covers for unrelated operator changes.
on:
  pull_request:
    paths:
      - api/racer/**
      - cmd/racer-controller/**
      - cmd/racer-dataplane/**
      - cmd/racer-object/**
      - internal/racer/**
      - internal/racerobject/**
      - internal/operator/components/racer/**
      - pkg/racersdk/**
      - deploy/racer/**
      - images/racer-controller/**
      - images/racer-dataplane/**
      - images/racer-object/**
      - e2e/racer/**
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/racer-e2e.yaml
  push:
    # release-* included so a cherry-pick onto a release branch gets the same
    # post-merge validation as main. The pull_request trigger above is
    # path-filtered with no branch filter, so it already covers release branches.
    branches:
      - main
      - release-*
    paths:
      - api/racer/**
      - cmd/racer-controller/**
      - cmd/racer-dataplane/**
      - cmd/racer-object/**
      - internal/racer/**
      - internal/racerobject/**
      - internal/operator/components/racer/**
      - pkg/racersdk/**
      - deploy/racer/**
      - images/racer-controller/**
      - images/racer-dataplane/**
      - images/racer-object/**
      - e2e/racer/**
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/racer-e2e.yaml
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: racer-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONTAINER_ENGINE: docker
  KIND_EXPERIMENTAL_PROVIDER: docker

jobs:
  racer-e2e:
    name: racer e2e (kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.30.0

      # The suite skips when prerequisites are absent. Verify them first so CI
      # cannot report success without creating a cluster.
      - name: Verify e2e prerequisites
        run: |
          set -euo pipefail
          for bin in kind kubectl "$CONTAINER_ENGINE"; do
            command -v "$bin" >/dev/null 2>&1 || { echo "missing required binary: $bin" >&2; exit 1; }
          done
          "$CONTAINER_ENGINE" info >/dev/null

      # CI=1 makes missing Azure blob egress fail instead of skipping.
      - name: Run Racer e2e
        env:
          CI: "1"
        run: make e2e-racer

      - name: Upload Racer e2e logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: racer-e2e-logs
          path: e2e/.artifacts/racer/
          retention-days: 7
          if-no-files-found: ignore
