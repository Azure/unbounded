name: unbounded-storage smoke test

on:
  pull_request:
    paths:
      - cmd/unbounded-storage/**
      - hack/smoke-storage.py
      - hack/scripts/install-unbounded-storage.sh
      - Makefile
      - .github/workflows/smoke-storage.yaml
  push:
    # release-* included so a cherry-pick onto a release branch gets the same
    # post-merge validation as main. The pull_request trigger above is
    # path-filtered with no branch filter, so it already covers release branches.
    branches: [main, release-*]
    paths:
      - cmd/unbounded-storage/**
      - hack/smoke-storage.py
      - hack/scripts/install-unbounded-storage.sh
      - Makefile
      - .github/workflows/smoke-storage.yaml
  workflow_dispatch:

concurrency:
  group: smoke-storage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Source of truth for the libfabric version is the Makefile default
      # (LIBFABRIC_VERSION). It is pinned here too so the cache key and
      # runtime library path stay in sync; the value is passed to make so
      # the two never diverge.
      LIBFABRIC_VERSION: "2.5.1"
      # Likewise for OpenSSL (OPENSSL_VERSION in the Makefile). The backend's
      # kTLS receive path needs >= 3.5, which the runner's distro OpenSSL
      # (3.0.x) does not provide, so a pinned build is installed under
      # tmp/openssl and put ahead of the system libs at runtime.
      OPENSSL_VERSION: "3.5.1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates curl liburing-dev \
            libibverbs-dev librdmacm-dev

      # The distro libfabric (1.x) predates the merge of the experimental
      # `net` provider into `tcp`, so it lacks a native FI_EP_RDM `tcp`
      # provider. `make libfabric` builds a pinned release from source and
      # installs it under tmp/libfabric (cached below to skip the rebuild).
      - name: Cache libfabric
        id: cache-libfabric
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/libfabric
          key: libfabric-${{ env.LIBFABRIC_VERSION }}-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build libfabric
        run: make libfabric LIBFABRIC_VERSION="$LIBFABRIC_VERSION"

      # The distro OpenSSL (3.0.x) only wires up kTLS for the send direction
      # on TLS 1.3; the backend's receive offload assertion needs >= 3.5.
      # `make openssl` builds a pinned release from source and installs it
      # under tmp/openssl (cached below to skip the rebuild).
      - name: Cache openssl
        id: cache-openssl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ runner.os }}

      - name: Build openssl
        run: make openssl OPENSSL_VERSION="$OPENSSL_VERSION"

      - name: Set up Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cmd/unbounded-storage/target
          # Key on lockfile + manifest plus the native build inputs, since
          # changes to either invalidate compiled artifacts under target/.
          key: cargo-unbounded-storage-${{ runner.os }}-fabric-${{ hashFiles('cmd/unbounded-storage/Cargo.lock', 'cmd/unbounded-storage/Cargo.toml', 'cmd/unbounded-storage/build.rs', 'cmd/unbounded-storage/src/fabric/shim.c', 'cmd/unbounded-storage/src/tls/shim.c') }}
          restore-keys: |
            cargo-unbounded-storage-${{ runner.os }}-fabric-
            cargo-unbounded-storage-${{ runner.os }}-

      - name: Build release binary
        run: make unbounded-storage-build LIBFABRIC_VERSION="$LIBFABRIC_VERSION" OPENSSL_VERSION="$OPENSSL_VERSION"

      - name: Assemble release tarball
        run: |
          set -euo pipefail
          arch="$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64/arm64/')"
          make unbounded-storage-tarball LIBFABRIC_VERSION="$LIBFABRIC_VERSION" OPENSSL_VERSION="$OPENSSL_VERSION" STORAGE_DIST_DIR=dist
          echo "SMOKE_STORAGE_TARBALL=$PWD/dist/unbounded-storage-linux-$arch.tar.gz" >> "$GITHUB_ENV"

      - name: Run smoke test
        run: |
          sudo -E env "PATH=$PATH" \
            "SMOKE_STORAGE_SYSTEMD=1" \
            "SMOKE_STORAGE_TARBALL=$SMOKE_STORAGE_TARBALL" \
            python3 hack/smoke-storage.py
