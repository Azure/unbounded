name: unbounded release

# ---------------------------------------------------------------------------
# Phase 2 of the two-phase release: build, sign, and publish.
#
# Trigger:
#   push (tags v*)  - run the full pipeline against the pushed tag.
#
# This workflow is deliberately tag-driven only. The tag is minted by
# release-prepare.yaml (Phase 1), which pushes it with an SSH deploy key so
# this workflow runs in the tag's context. Running in tag context is what
# makes keyless cosign signatures carry the identity
# `release.yaml@refs/tags/vX.Y.Z`, which the deploy workflow verifies.
#
# Job topology:
#   version
#     -> changelog
#     -> frontend
#     -> binaries          (GoReleaser; creates draft GitHub release)
#     -> net-images        (matrix: amd64-native, arm64-native)
#         -> net-images-manifest (multi-arch tag stitch + sign + SBOM attest)
#     -> netboot-image     (PXE boot artifact image)
#         -> metalman-image (stamped with the matching default netboot image)
#     -> component-images  (matrix: machina, machine-ops-controller, unbounded-operator,
#                           orca, gantry, unbounded-storage-supervisor, host-ubuntu2404,
#                           inventory-aggregator, inventory-inspector, inventory-viewer)
#     -> manifests-tarball (make release-manifests + cosign sign)
#     -> storage-binaries  (matrix: amd64, arm64; binary + bundled libfabric)
#     -> finalize          (attach extras + krew manifest)
#
# All artifacts land on a single GitHub release that is left as a draft.
# Prerelease status is derived from the tag (a `-` suffix, e.g. v1.2.3-rc1).
# The release-upgrade workflow publishes the draft after a successful soak
# (deploy + smoke) on unbounded-stable; manual publish is still possible.
#
# RE-RUNNING THIS WORKFLOW MUST WORK. A release fails partway for reasons that
# have nothing to do with the tree - a registry outage, a runner, a permission
# - and the alternative to a re-run is deleting the tag and burning a version
# number. That means every step here has to tolerate having already run.
#
# THE RULE: EVERY WRITE TO THE RELEASE IS IDEMPOTENT. Around twenty jobs write
# to it and that is fine; what is not allowed is a writer that fails, or
# silently does nothing, the second time it runs. Two mechanisms hold that up:
#
#   1. The draft is opened ONCE, by `version`, before anything else runs. Every
#      other job needs `version` transitively, so no writer can ever find the
#      release missing. GoReleaser adopts that draft rather than making its own
#      (use_existing_draft in .goreleaser.yml).
#   2. Every writer replaces rather than appends: `gh release upload --clobber`
#      here and in agent-artifacts.yaml, and replace_existing_artifacts for
#      GoReleaser, which uploads the archives, checksums and signatures.
#
# (release-upgrade.yaml edits the release too, after this workflow is done.)
#
# Both mechanisms are load-bearing, and the second is not sufficient alone. The
# image jobs used to attach their SBOMs via anchore/sbom-action's built-in
# uploader, which failed in both directions:
#
#   - It 422s with `already_exists` on the second attempt, because the GitHub
#     API refuses a duplicate release asset name. Once one attempt had attached
#     an SBOM, that job could never succeed again. Four consecutive re-runs of
#     v0.5.0 died this way and the release was abandoned for v0.6.0.
#   - It silently attaches NOTHING when the release does not exist yet, and it
#     usually did not, because these jobs used to race GoReleaser for it. In
#     the v0.6.0 run the draft appeared at 18:36:05, and the nine image jobs
#     that finished after it are exactly the nine SBOMs that release carries.
#     The eight that finished before it are exactly the eight it is missing.
#     Every release before this carried an arbitrary subset for that reason.
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write
  packages: write
  # Required for keyless cosign signing via Sigstore OIDC.
  id-token: write
  # Required for attaching SBOMs and provenance attestations.
  attestations: write

# Prevent two release runs on the same ref from racing each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  CNI_PLUGINS_VERSION: v1.9.1

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the release tag from the pushed ref (this workflow is tag-driven;
  # the tag itself is minted by release-prepare.yaml). Also derive prerelease
  # status from the tag: a `-` suffix (e.g. v1.2.3-rc1) marks a prerelease.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must be in vX.Y.Z[-suffix] format, got: ${TAG}"
            exit 1
          fi

          VERSION="${TAG#v}"
          if [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Release: ${TAG} (version: ${VERSION}, prerelease: ${IS_PRERELEASE})"

      - name: Normalize container registry to lowercase
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      # Opening the draft here, rather than letting GoReleaser open it mid-run,
      # is what makes `gh release upload --clobber` legal in every other job.
      # Every job needs `version` transitively, so once this step returns the
      # release exists and no writer can find it missing. It used to be a race,
      # and the race silently cost most releases most of their image SBOMs.
      #
      # --title is NOT optional. `gh release create` sends no `name` at all
      # unless it is given one, and GoReleaser finds the draft to adopt by
      # comparing a release's NAME to the TAG: createOrUpdateRelease calls
      # findRelease(ctx, data.GetTagName()), and findDraftRelease matches
      # `r.GetDraft() && r.GetName() == name`. A nameless draft is invisible to
      # it, so it would open a second one and the release would split in two
      # with nothing failing loudly.
      - name: Open the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          # Guarded, because this step is itself subject to the rule it exists
          # to enforce: a bare `gh release create` fails on the second run, and
          # reintroducing that here would be the whole bug again, in the fix.
          if draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            # A published release is refused rather than written to. GoReleaser
            # with use_existing_draft only looks at drafts, so it would take an
            # opaque 422 here instead; this says what to do. Re-drafting first
            # is deliberate: silently rewriting the artifacts of a release that
            # has already shipped is worse than stopping.
            if [[ "$draft" != "true" ]]; then
              echo "::error::${TAG} is already published; re-draft it before re-running (gh release edit ${TAG} --draft=true)"
              exit 1
            fi

            echo "Draft ${TAG} already exists; reusing it."

            exit 0
          fi

          gh release create "$TAG" --draft --title "$TAG" --notes ""
          echo "Opened draft release ${TAG}."

  # ---------------------------------------------------------------------------
  # Extract the release notes section from CHANGELOG.md if present.
  # Falls back to GitHub's auto-generated notes when no section is found.
  # ---------------------------------------------------------------------------
  changelog:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.extract.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract changelog for tag
        id: extract
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          if [[ ! -f CHANGELOG.md ]]; then
            echo "::notice::No CHANGELOG.md present; will use auto-generated notes."
            echo "body=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY=$(awk "/^## ${TAG//./\\.}/{found=1; next} /^## v[0-9]/{if(found) exit} found" CHANGELOG.md)
          if [[ -z "$BODY" ]]; then
            echo "::warning::No CHANGELOG section found for ${TAG}, using auto-generated notes"
            echo "body=" >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<CHANGELOG_EOF"
              echo "$BODY"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Extracted changelog for ${TAG}"
          fi

  # ---------------------------------------------------------------------------
  # Build the React frontend; downstream net-images jobs consume the artifact.
  # ---------------------------------------------------------------------------
  frontend:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci --prefer-offline --no-audit && npm run build
        working-directory: frontend

      - name: Upload frontend dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          # 7, not 1. These bound how long `gh run rerun --failed` can
          # work: finalize downloads them by name, and a missing one is
          # a hard failure in a job that a --failed re-run will not
          # rebuild, because the job that produced it is still green.
          # Past the window the only recovery is a full re-run.
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Run GoReleaser against the pushed tag.
  # GoReleaser produces kubectl-unbounded, unbounded-agent, and
  # agent-artifacts-builder archives,
  # signs the checksums file, generates SBOMs, and creates a DRAFT GitHub
  # release. Subsequent jobs attach more artifacts to that draft.
  # ---------------------------------------------------------------------------
  binaries:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Normalize container registry to lowercase
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # v2.5 is the floor for use_existing_draft, which
          # .goreleaser.yml now depends on to adopt the draft
          # `version` opened instead of creating a second one.
          version: "~> v2.5"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.version.outputs.tag }}
          # The GoReleaser before-hook renders the operator manifests embedded in
          # kubectl-unbounded. Pass the (lowercased) release registry so a fork's
          # binary embeds its own registry/org instead of the ghcr.io/azure
          # Makefile default. REGISTRY is normalized to lowercase above because
          # ghcr rejects uppercase repository names (owner "Azure" -> "azure").
          CONTAINER_REGISTRY: ${{ env.REGISTRY }}

      - name: Upload dist artifact for downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goreleaser-dist
          path: dist/
          # 7, not 1. These bound how long `gh run rerun --failed` can
          # work: finalize downloads them by name, and a missing one is
          # a hard failure in a job that a --failed re-run will not
          # rebuild, because the job that produced it is still green.
          # Past the window the only recovery is a full re-run.
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish offline bootstrap bundles and rootfs OCI layout archives after
  # GoReleaser has created the draft GitHub release.
  # ---------------------------------------------------------------------------
  agent-offline-artifacts:
    needs: [version, binaries]
    uses: ./.github/workflows/agent-artifacts.yaml
    with:
      tag: ${{ needs.version.outputs.tag }}
      release_tag: ${{ needs.version.outputs.tag }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Build, push, sign, and SBOM-attest unbounded-net-controller and
  # unbounded-net-node images. Native runners per arch (CGO + heavy tdnf
  # installs make QEMU prohibitively slow). Per-arch tags are stitched into
  # multi-arch manifests by the net-images-manifest job below.
  # ---------------------------------------------------------------------------
  net-images:
    needs: [version, frontend]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Normalize container registry to lowercase
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Cache CNI plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources
          key: cni-plugins-${{ matrix.arch }}-${{ env.CNI_PLUGINS_VERSION }}

      - name: Download CNI plugins
        run: |
          mkdir -p resources
          file="resources/cni-plugins-linux-${{ matrix.arch }}-${CNI_PLUGINS_VERSION}.tgz"
          if [ ! -s "$file" ]; then
            curl -fsSL \
              "https://github.com/containernetworking/plugins/releases/download/${CNI_PLUGINS_VERSION}/cni-plugins-linux-${{ matrix.arch }}-${CNI_PLUGINS_VERSION}.tgz" \
              -o "$file"
          fi

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Go version for Docker
        id: goversion
        run: echo "go_version=$(awk '/^go /{split($2,v,"."); print v[1]"."v[2]}' go.mod)" >> "$GITHUB_OUTPUT"

      # Trivy scan on a single-platform load build before pushing.
      - name: Build controller for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/net/Containerfile
          target: controller
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            VERSION=${{ needs.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
          tags: scan/unbounded-net-controller:${{ needs.version.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=net-controller-${{ matrix.arch }}
          cache-to: type=gha,scope=net-controller-${{ matrix.arch }},mode=max

      - name: Scan controller with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/unbounded-net-controller:${{ needs.version.outputs.tag }}-${{ matrix.arch }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Build node for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/net/Containerfile
          target: node
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            VERSION=${{ needs.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
          tags: scan/unbounded-net-node:${{ needs.version.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=net-node-${{ matrix.arch }}
          cache-to: type=gha,scope=net-node-${{ matrix.arch }},mode=max

      - name: Scan node with Trivy (CRITICAL, gating)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/unbounded-net-node:${{ needs.version.outputs.tag }}-${{ matrix.arch }}
          format: table
          severity: CRITICAL
          exit-code: "1"

      # HIGH findings are reported but do not gate the release: net-node bundles
      # the upstream containernetworking/plugins CNI binaries, whose Go stdlib
      # CVEs we cannot fix without an upstream rebuild. Keep the scan visible so
      # regressions surface in the workflow log; promote back to gating once
      # upstream ships a clean toolchain.
      - name: Scan node with Trivy (HIGH, report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/unbounded-net-node:${{ needs.version.outputs.tag }}-${{ matrix.arch }}
          format: table
          severity: HIGH
          exit-code: "0"

      - name: Push controller image
        id: push_controller
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/net/Containerfile
          target: controller
          platforms: ${{ matrix.platform }}
          outputs: type=image,push=true,oci-mediatypes=true
          provenance: false
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            VERSION=${{ needs.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
          tags: ${{ env.REGISTRY }}/unbounded-net-controller:${{ needs.version.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=net-controller-${{ matrix.arch }}
          cache-to: type=gha,scope=net-controller-${{ matrix.arch }},mode=max

      - name: Push node image
        id: push_node
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/net/Containerfile
          target: node
          platforms: ${{ matrix.platform }}
          outputs: type=image,push=true,oci-mediatypes=true
          provenance: false
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            VERSION=${{ needs.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
          tags: ${{ env.REGISTRY }}/unbounded-net-node:${{ needs.version.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=net-node-${{ matrix.arch }}
          cache-to: type=gha,scope=net-node-${{ matrix.arch }},mode=max

      - name: Verify OCI image media types
        env:
          CONTROLLER_DIGEST: ${{ steps.push_controller.outputs.digest }}
          NODE_DIGEST: ${{ steps.push_node.outputs.digest }}
        run: |
          set -euo pipefail
          for image in controller node; do
            if [[ "$image" == "controller" ]]; then
              digest="$CONTROLLER_DIGEST"
            else
              digest="$NODE_DIGEST"
            fi
            ref="${REGISTRY}/unbounded-net-${image}@${digest}"
            docker buildx imagetools inspect --raw "$ref" | jq -e '
              .mediaType == "application/vnd.oci.image.manifest.v1+json" and
              .config.mediaType == "application/vnd.oci.image.config.v1+json" and
              all(.layers[];
                .mediaType | test("^application/vnd\\.oci\\.image\\.layer\\.v1\\.tar(\\+(gzip|zstd))?$"))
            '
          done

      - name: Sign per-arch net images
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/unbounded-net-controller@${{ steps.push_controller.outputs.digest }}"
          cosign sign --yes "${{ env.REGISTRY }}/unbounded-net-node@${{ steps.push_node.outputs.digest }}"

      - name: Generate and attest controller SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/unbounded-net-controller@${{ steps.push_controller.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          artifact-name: sbom-net-controller-${{ matrix.arch }}.spdx.json
          output-file: sbom-net-controller-${{ matrix.arch }}.spdx.json
          # Defaults to true, and its uploader is neither idempotent nor
          # able to cope with a release that does not exist yet. The next
          # step attaches this with --clobber instead; see the header.
          upload-release-assets: false

      - name: Attest controller SBOM
        run: |
          cosign attest --yes \
            --predicate sbom-net-controller-${{ matrix.arch }}.spdx.json \
            --type spdxjson \
            "${{ env.REGISTRY }}/unbounded-net-controller@${{ steps.push_controller.outputs.digest }}"

      - name: Generate and attest node SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/unbounded-net-node@${{ steps.push_node.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          artifact-name: sbom-net-node-${{ matrix.arch }}.spdx.json
          output-file: sbom-net-node-${{ matrix.arch }}.spdx.json
          # Defaults to true, and its uploader is neither idempotent nor
          # able to cope with a release that does not exist yet. The next
          # step attaches this with --clobber instead; see the header.
          upload-release-assets: false

      - name: Attest node SBOM
        run: |
          cosign attest --yes \
            --predicate sbom-net-node-${{ matrix.arch }}.spdx.json \
            --type spdxjson \
            "${{ env.REGISTRY }}/unbounded-net-node@${{ steps.push_node.outputs.digest }}"

      # After the attestations, not before: the attestation is the
      # authoritative, digest-bound copy, and it should never be blocked by the
      # releases API having a bad minute.
      - name: Attach SBOMs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail

          gh release upload "$TAG" \
            "sbom-net-controller-${{ matrix.arch }}.spdx.json" \
            "sbom-net-node-${{ matrix.arch }}.spdx.json" \
            --clobber

  # ---------------------------------------------------------------------------
  # Stitch per-arch net image tags into signed multi-arch manifests for :TAG.
  # ---------------------------------------------------------------------------
  net-images-manifest:
    needs: [version, net-images]
    runs-on: ubuntu-latest
    steps:
      - name: Normalize container registry to lowercase
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          for image in controller node; do
            SRC="${{ env.REGISTRY }}/unbounded-net-${image}"
            echo "Creating manifest ${SRC}:${TAG}..."
            metadata="$(mktemp)"
            docker buildx imagetools create \
              --tag "${SRC}:${TAG}" \
              --metadata-file "$metadata" \
              "${SRC}:${TAG}-amd64" \
              "${SRC}:${TAG}-arm64"

            jq -e '
              .["containerimage.descriptor"].mediaType == "application/vnd.oci.image.index.v1+json"
            ' "$metadata"
            docker buildx imagetools inspect --raw "${SRC}:${TAG}" | jq -e '
              .mediaType == "application/vnd.oci.image.index.v1+json" and
              all(.manifests[]; .mediaType == "application/vnd.oci.image.manifest.v1+json")
            '

            digest="$(jq -r '.["containerimage.descriptor"].digest // empty' "$metadata")"
            rm -f "$metadata"
            if [[ -z "$digest" ]]; then
              echo "could not resolve digest for ${SRC}:${TAG}" >&2
              exit 1
            fi
            cosign sign --yes "${SRC}@${digest}"
          done

  # ---------------------------------------------------------------------------
  # Build, push, sign, and SBOM-attest the netboot image before metalman is
  # built. The metalman binary is stamped with this exact default netboot tag.
  # ---------------------------------------------------------------------------
  netboot-image:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize container registry to lowercase
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/netboot/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            CONTAINER_REGISTRY=${{ env.REGISTRY }}
          tags: ${{ env.REGISTRY }}/netboot:${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=netboot
          cache-to: type=gha,scope=netboot,mode=max

      - name: Sign container image
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/netboot@${{ steps.push.outputs.digest }}"

      - name: Generate and attach SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/netboot@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          artifact-name: sbom-netboot.spdx.json
          output-file: sbom-netboot.spdx.json
          # Defaults to true, and its uploader is neither idempotent nor
          # able to cope with a release that does not exist yet. The next
          # step attaches this with --clobber instead; see the header.
          upload-release-assets: false

      - name: Attest SBOM to image
        run: |
          cosign attest --yes \
            --predicate sbom-netboot.spdx.json \
            --type spdxjson \
            "${{ env.REGISTRY }}/netboot@${{ steps.push.outputs.digest }}"

      # After the attestation, not before: the attestation is the
      # authoritative, digest-bound copy, and it should never be blocked by the
      # releases API having a bad minute.
      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail

          gh release upload "$TAG" sbom-netboot.spdx.json --clobber

  # ---------------------------------------------------------------------------
  # Build, scan, push, sign, and SBOM-attest metalman after its default netboot
  # image has been published.
  # ---------------------------------------------------------------------------
  metalman-image:
    needs: [version, netboot-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize container registry to lowercase
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/metalman/Containerfile
          push: false
          load: true
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            CONTAINER_REGISTRY=${{ env.REGISTRY }}
          tags: scan/metalman:${{ needs.version.outputs.tag }}

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/metalman:${{ needs.version.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: images/metalman/.trivyignore

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/metalman/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            CONTAINER_REGISTRY=${{ env.REGISTRY }}
          tags: ${{ env.REGISTRY }}/metalman:${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=metalman
          cache-to: type=gha,scope=metalman,mode=max

      - name: Sign container image
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/metalman@${{ steps.push.outputs.digest }}"

      - name: Generate and attach SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/metalman@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          artifact-name: sbom-metalman.spdx.json
          output-file: sbom-metalman.spdx.json
          # Defaults to true, and its uploader is neither idempotent nor
          # able to cope with a release that does not exist yet. The next
          # step attaches this with --clobber instead; see the header.
          upload-release-assets: false

      - name: Attest SBOM to image
        run: |
          cosign attest --yes \
            --predicate sbom-metalman.spdx.json \
            --type spdxjson \
            "${{ env.REGISTRY }}/metalman@${{ steps.push.outputs.digest }}"

      # After the attestation, not before: the attestation is the
      # authoritative, digest-bound copy, and it should never be blocked by the
      # releases API having a bad minute.
      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail

          gh release upload "$TAG" sbom-metalman.spdx.json --clobber

  # ---------------------------------------------------------------------------
  # Build, scan, push, sign, and SBOM-attest the component images that have no
  # release-time image ordering requirements.
  # Go components cross-compile natively for amd64 and arm64; host-ubuntu2404
  # publishes both platforms for PXE architecture support.
  # ---------------------------------------------------------------------------
  component-images:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      # One bad component must not cancel the other ten. Runner minutes are the
      # wrong thing to optimize on a release: knowing the full blast radius in
      # one pass beats discovering it one re-run at a time, and it keeps the
      # re-run down to the job that actually failed. When v0.5.0's
      # token-refresher push failed, fail-fast took seven healthy component
      # builds with it, and every subsequent attempt re-ran all eight.
      fail-fast: false
      matrix:
        component:
          - name: machina
            file: images/machina/Containerfile
            platforms: linux/amd64,linux/arm64
            trivy: true
          - name: token-refresher
            file: images/token-refresher/Containerfile
            platforms: linux/amd64,linux/arm64
            trivy: true
          - name: machine-ops-controller
            file: images/machine-ops-controller/Containerfile
            platforms: linux/amd64,linux/arm64
            trivy: true
          - name: unbounded-operator
            file: images/unbounded-operator/Containerfile
            platforms: linux/amd64,linux/arm64
            trivy: true
          - name: orca
            file: images/orca/Containerfile
            platforms: linux/amd64,linux/arm64
            trivy: true
          - name: gantry
            file: images/gantry/Containerfile
            platforms: linux/amd64,linux/arm64
            trivy: true
          - name: unbounded-storage-supervisor
            file: images/unbounded-storage-supervisor/Containerfile
            platforms: linux/amd64,linux/arm64
            trivy: true
          - name: host-ubuntu2404
            file: images/host-ubuntu2404/Containerfile
            platforms: linux/amd64,linux/arm64
            trivy: false
          - name: inventory-aggregator
            file: images/inventory/aggregator/Containerfile
            platforms: linux/amd64,linux/arm64
            trivy: true
          - name: inventory-inspector
            file: images/inventory/inspector/Containerfile
            platforms: linux/amd64,linux/arm64
            trivy: true
          - name: inventory-viewer
            file: images/inventory/viewer/Containerfile
            platforms: linux/amd64,linux/arm64
            trivy: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize container registry to lowercase
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scanning
        if: matrix.component.trivy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.component.file }}
          push: false
          load: true
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            CONTAINER_REGISTRY=${{ env.REGISTRY }}
          tags: scan/${{ matrix.component.name }}:${{ needs.version.outputs.tag }}

      - name: Scan with Trivy
        if: matrix.component.trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.component.name }}:${{ needs.version.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.component.file }}
          platforms: ${{ matrix.component.platforms }}
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            CONTAINER_REGISTRY=${{ env.REGISTRY }}
          tags: ${{ env.REGISTRY }}/${{ matrix.component.name }}:${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,scope=${{ matrix.component.name }},mode=max

      - name: Sign container image
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ matrix.component.name }}@${{ steps.push.outputs.digest }}"

      - name: Generate and attach SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ matrix.component.name }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.component.name }}.spdx.json
          output-file: sbom-${{ matrix.component.name }}.spdx.json
          # Defaults to true, and its uploader is neither idempotent nor
          # able to cope with a release that does not exist yet. The next
          # step attaches this with --clobber instead; see the header.
          upload-release-assets: false

      - name: Attest SBOM to image
        run: |
          cosign attest --yes \
            --predicate sbom-${{ matrix.component.name }}.spdx.json \
            --type spdxjson \
            "${{ env.REGISTRY }}/${{ matrix.component.name }}@${{ steps.push.outputs.digest }}"

      # After the attestation, not before: the attestation is the
      # authoritative, digest-bound copy, and it should never be blocked by the
      # releases API having a bad minute.
      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail

          gh release upload "$TAG" "sbom-${{ matrix.component.name }}.spdx.json" --clobber

  # ---------------------------------------------------------------------------
  # Build the stamped combined manifests tarball and directly applicable
  # operator manifest, sign the tarball with cosign, and upload both as workflow
  # artifacts for the finalize job.
  # ---------------------------------------------------------------------------
  manifests-tarball:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Normalize container registry to lowercase
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build release manifests
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          make release-manifests unbounded-operator-release-manifest \
            VERSION="${TAG}" \
            CONTAINER_REGISTRY="${{ env.REGISTRY }}" \
            NET_APISERVER_URL="" \
            UNBOUNDED_OPERATOR_API_SERVER_ENDPOINT=""

      - name: Sign release manifests with cosign (keyless)
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          ARCHIVE="build/unbounded-manifests-${TAG}.tar.gz"
          OPERATOR_MANIFEST="build/unbounded-operator-${TAG}.yaml"
          cosign sign-blob --yes \
            --bundle="${ARCHIVE}.bundle.json" \
            "${ARCHIVE}"
          cosign sign-blob --yes \
            --bundle="${OPERATOR_MANIFEST}.bundle.json" \
            "${OPERATOR_MANIFEST}"

      - name: Upload manifests artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifests-tarball
          path: |
            build/unbounded-manifests-*
            build/unbounded-operator-*.yaml
            build/unbounded-operator-*.yaml.bundle.json
          # 7, not 1. These bound how long `gh run rerun --failed` can
          # work: finalize downloads them by name, and a missing one is
          # a hard failure in a job that a --failed re-run will not
          # rebuild, because the job that produced it is still green.
          # Past the window the only recovery is a full re-run.
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build the unbounded-storage release binary together with its runtime
  # dependency libraries (the pinned libfabric, built from source) for amd64
  # and arm64 on native runners (no QEMU), package each as a self-contained
  # tarball, and hand them to the finalize job to attach to the release.
  # ---------------------------------------------------------------------------
  storage-binaries:
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve libfabric version from Makefile
        run: |
          set -euo pipefail
          version="$(sed -n 's/^LIBFABRIC_VERSION[[:space:]]*?=[[:space:]]*//p' Makefile | head -n1)"
          if [[ -z "$version" ]]; then
            echo "could not determine LIBFABRIC_VERSION from Makefile" >&2
            exit 1
          fi
          echo "LIBFABRIC_VERSION=$version" >> "$GITHUB_ENV"
          echo "Resolved libfabric version: $version"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates curl liburing-dev \
            libibverbs-dev librdmacm-dev

      # The distro libfabric (1.x) predates the merge of the experimental
      # `net` provider into `tcp`, so it lacks a native FI_EP_RDM `tcp`
      # provider. `make libfabric` builds the pinned release from source and
      # installs it under tmp/libfabric (cached below to skip the rebuild).
      - name: Cache libfabric
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/libfabric
          key: libfabric-${{ env.LIBFABRIC_VERSION }}-${{ matrix.arch }}-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build libfabric
        run: make libfabric LIBFABRIC_VERSION="$LIBFABRIC_VERSION"

      - name: Set up Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cmd/unbounded-storage/target
          key: cargo-unbounded-storage-${{ matrix.arch }}-${{ runner.os }}-fabric-${{ hashFiles('cmd/unbounded-storage/Cargo.lock', 'cmd/unbounded-storage/Cargo.toml', 'cmd/unbounded-storage/build.rs', 'cmd/unbounded-storage/src/fabric/shim.c') }}
          restore-keys: |
            cargo-unbounded-storage-${{ matrix.arch }}-${{ runner.os }}-fabric-
            cargo-unbounded-storage-${{ matrix.arch }}-${{ runner.os }}-

      - name: Build release binary
        run: make unbounded-storage-build LIBFABRIC_VERSION="$LIBFABRIC_VERSION"

      - name: Assemble tarball
        run: |
          set -euo pipefail
          make unbounded-storage-tarball \
            STORAGE_TARBALL_ARCH="${{ matrix.arch }}" \
            LIBFABRIC_VERSION="$LIBFABRIC_VERSION" \
            STORAGE_DIST_DIR=dist

      # Match the supply-chain treatment of the other release artifacts: an
      # SPDX SBOM (as GoReleaser produces per archive) and a keyless cosign
      # signature bundle (as the manifests tarball gets). Keyless signing uses
      # the workflow's OIDC identity; no long-lived keys.
      - name: Generate SBOM
        run: |
          set -euo pipefail
          NAME="unbounded-storage-linux-${{ matrix.arch }}"
          syft scan "dist/${NAME}.tar.gz" \
            -o spdx-json="dist/${NAME}.tar.gz.spdx.json"

      - name: Sign storage tarball with cosign (keyless)
        run: |
          set -euo pipefail
          ARCHIVE="dist/unbounded-storage-linux-${{ matrix.arch }}.tar.gz"
          cosign sign-blob --yes \
            --bundle="${ARCHIVE}.bundle.json" \
            "${ARCHIVE}"

      - name: Upload storage tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storage-tarball-${{ matrix.arch }}
          path: |
            dist/unbounded-storage-linux-${{ matrix.arch }}.tar.gz
            dist/unbounded-storage-linux-${{ matrix.arch }}.tar.gz.sha256
            dist/unbounded-storage-linux-${{ matrix.arch }}.tar.gz.spdx.json
            dist/unbounded-storage-linux-${{ matrix.arch }}.tar.gz.bundle.json
          # 7, not 1. These bound how long `gh run rerun --failed` can
          # work: finalize downloads them by name, and a missing one is
          # a hard failure in a job that a --failed re-run will not
          # rebuild, because the job that produced it is still green.
          # Past the window the only recovery is a full re-run.
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Attach the manifests tarball + krew manifest to the draft release that
  # GoReleaser created and set release notes. The release stays a draft here;
  # the release-upgrade workflow publishes it after a successful soak.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Build the Azure Container Linux nspawn system extension for each
  # architecture on a native runner, publish it to GHCR as an OCI artifact, and
  # hand the files to finalize to attach to the release.
  #
  # The extension is tagged by the systemd build it targets rather than by the
  # unbounded version: its content is a function of the former and unrelated to
  # the latter, so tying it to a release would force a new unbounded release
  # just to obtain an extension for a host OS with newer systemd.
  #
  # Native runners avoid QEMU. The azurelinux base image is multi-arch, but the
  # build runs tdnf inside it, which would otherwise need emulation.
  # ---------------------------------------------------------------------------
  acl-nspawn-sysext:
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve the targeted systemd release from the Makefile
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ACL_SYSEXT_SYSTEMD[[:space:]]*?=[[:space:]]*//p' Makefile | head -n1)"
          if [[ -z "$version" ]]; then
            echo "could not determine ACL_SYSEXT_SYSTEMD from Makefile" >&2
            exit 1
          fi
          echo "ACL_SYSEXT_SYSTEMD=$version" >> "$GITHUB_ENV"
          echo "Targeting systemd $version"

      - name: Normalize registry to lowercase
        env:
          SYSEXT_REGISTRY: ghcr.io/${{ github.repository_owner }}/unbounded
        run: echo "SYSEXT_REGISTRY=${SYSEXT_REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the system extension
        run: |
          make acl-nspawn-sysext \
            ACL_SYSEXT_ARCH="${{ matrix.arch }}" \
            ACL_SYSEXT_SYSTEMD="${ACL_SYSEXT_SYSTEMD}"

      - name: Publish the system extension to GHCR
        run: |
          set -euo pipefail
          go run ./hack/cmd/acl-sysext-publisher \
            --dir bin/acl-nspawn-sysext \
            --arch "${{ matrix.arch }}" \
            --ref "${SYSEXT_REGISTRY}/acl-nspawn-sysext:${ACL_SYSEXT_SYSTEMD}-${{ matrix.arch }}"

      # Release assets are shared across architectures, so the per-arch build
      # output is renamed. The agent derives the checksum and provenance paths
      # from the configured source by suffix, so those names must stay siblings
      # of the .raw.
      - name: Stage release assets
        run: |
          set -euo pipefail
          STEM="unbounded-nspawn-systemd-${ACL_SYSEXT_SYSTEMD}-linux-${{ matrix.arch }}"
          mkdir -p dist
          cp "bin/acl-nspawn-sysext/unbounded-nspawn.raw"            "dist/${STEM}.raw"
          cp "bin/acl-nspawn-sysext/unbounded-nspawn.provenance"     "dist/${STEM}.provenance"
          # Regenerate rather than copy so the checksum names the renamed file.
          cd dist && sha256sum "${STEM}.raw" > "${STEM}.raw.sha256"
          echo "SYSEXT_STEM=${STEM}" >> "$GITHUB_ENV"

      - name: Sign the system extension with cosign (keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle="dist/${SYSEXT_STEM}.raw.bundle.json" \
            "dist/${SYSEXT_STEM}.raw"

      - name: Upload system extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acl-nspawn-sysext-${{ matrix.arch }}
          path: |
            dist/unbounded-nspawn-systemd-*.raw
            dist/unbounded-nspawn-systemd-*.raw.sha256
            dist/unbounded-nspawn-systemd-*.provenance
            dist/unbounded-nspawn-systemd-*.raw.bundle.json
          retention-days: 1

  finalize:
    needs:
      - version
      - changelog
      - binaries
      - agent-offline-artifacts
      - net-images-manifest
      - netboot-image
      - metalman-image
      - component-images
      - manifests-tarball
      - storage-binaries
      - acl-nspawn-sysext
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize container registry to lowercase
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download goreleaser dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: goreleaser-dist
          path: dist/

      - name: Download manifests tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: manifests-tarball
          path: dist/

      - name: Download storage tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: storage-tarball-*
          path: dist/
          merge-multiple: true

      - name: Download system extensions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: acl-nspawn-sysext-*
          path: dist/
          merge-multiple: true

      - name: Render krew manifest
        run: |
          export VERSION="${{ needs.version.outputs.tag }}"
          export REPO="${{ github.repository }}"
          export SHA_LINUX_AMD64=$(sha256sum dist/kubectl-unbounded-linux-amd64.tar.gz | awk '{print $1}')
          export SHA_LINUX_ARM64=$(sha256sum dist/kubectl-unbounded-linux-arm64.tar.gz | awk '{print $1}')
          export SHA_DARWIN_AMD64=$(sha256sum dist/kubectl-unbounded-darwin-amd64.tar.gz | awk '{print $1}')
          export SHA_DARWIN_ARM64=$(sha256sum dist/kubectl-unbounded-darwin-arm64.tar.gz | awk '{print $1}')
          envsubst < hack/krew-manifest.yaml > dist/unbounded.yaml

      - name: Generate and sign release BOM
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          BOM="dist/unbounded-release-bom-${TAG}.json"
          make release-bom \
            VERSION="${TAG}" \
            GIT_COMMIT="${GITHUB_SHA}" \
            CONTAINER_REGISTRY="${{ env.REGISTRY }}" \
            RELEASE_BOM_OUTPUT="${BOM}"
          cosign sign-blob --yes \
            --bundle="${BOM}.bundle.json" \
            "${BOM}"

      - name: Attach extras to release and set notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          # Upload the additional artifacts to the draft release that `version`
          # opened.
          #
          # --clobber is what makes a re-run work: it replaces an asset that is
          # already there instead of failing the way a plain upload does. It is
          # not special to this step; every writer in the workflow uses it.
          gh release upload "${TAG}" \
            dist/unbounded.yaml \
            dist/unbounded-manifests-*.tar.gz \
            dist/unbounded-manifests-*.tar.gz.bundle.json \
            dist/unbounded-operator-*.yaml \
            dist/unbounded-operator-*.yaml.bundle.json \
            "dist/unbounded-release-bom-${TAG}.json" \
            "dist/unbounded-release-bom-${TAG}.json.bundle.json" \
            dist/unbounded-storage-linux-*.tar.gz \
            dist/unbounded-storage-linux-*.tar.gz.sha256 \
            dist/unbounded-storage-linux-*.tar.gz.spdx.json \
            dist/unbounded-storage-linux-*.tar.gz.bundle.json \
            dist/unbounded-nspawn-systemd-*.raw \
            dist/unbounded-nspawn-systemd-*.raw.sha256 \
            dist/unbounded-nspawn-systemd-*.provenance \
            dist/unbounded-nspawn-systemd-*.raw.bundle.json \
            --clobber

          # Apply CHANGELOG-derived release notes if present.
          NOTES=$(cat <<'EOF'
          ${{ needs.changelog.outputs.body }}
          EOF
          )
          if [[ -n "${NOTES// /}" ]]; then
            gh release edit "${TAG}" --notes "${NOTES}"
          fi

          # Flag prerelease when the tag carries a prerelease suffix
          # (e.g. v1.2.3-rc1). GoReleaser also sets this via `prerelease: auto`;
          # we reassert it here in case the draft was created differently.
          if [[ "${{ needs.version.outputs.is_prerelease }}" == "true" ]]; then
            gh release edit "${TAG}" --prerelease
          fi

          # The release is left as a draft here. The release-upgrade workflow
          # publishes it automatically after a successful soak (deploy +
          # smoke) on unbounded-stable; an operator can also publish manually.
          echo "Release ${TAG} left as draft; release-upgrade will publish it after a successful soak (or publish manually with 'gh release edit ${TAG} --draft=false')."
