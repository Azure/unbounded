name: unbounded release

# ---------------------------------------------------------------------------
# Phase 2 of the two-phase release: build, sign, and publish.
#
# Trigger:
#   push (tags v*)  - run the full pipeline against the pushed tag.
#
# This workflow is deliberately tag-driven only. The tag is minted by
# release-prepare.yaml (Phase 1), which pushes it with an SSH deploy key so
# this workflow runs in the tag's context. Running in tag context is what
# makes keyless cosign signatures carry the identity
# `release.yaml@refs/tags/vX.Y.Z`, which the deploy workflow verifies.
#
# Job topology:
#   version
#     -> changelog
#     -> frontend
#     -> binaries          (GoReleaser; creates draft GitHub release)
#     -> net-images        (matrix: amd64-native, arm64-native)
#         -> net-images-manifest (multi-arch tag stitch + sign + SBOM attest)
#     -> component-images  (matrix: machina, machine-ops-controller, metalman, host-ubuntu2404)
#     -> manifests-tarball (make release-manifests + cosign sign)
#     -> storage-binaries  (matrix: amd64, arm64; binary + bundled libfabric)
#     -> finalize          (attach extras + krew manifest)
#
# All artifacts land on a single GitHub release that is left as a draft.
# Prerelease status is derived from the tag (a `-` suffix, e.g. v1.2.3-rc1).
# Publishing is a manual step (GitHub UI or `gh release edit --draft=false`).
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write
  packages: write
  # Required for keyless cosign signing via Sigstore OIDC.
  id-token: write
  # Required for attaching SBOMs and provenance attestations.
  attestations: write

# Prevent two release runs on the same ref from racing each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  CNI_PLUGINS_VERSION: v1.9.1

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the release tag from the pushed ref (this workflow is tag-driven;
  # the tag itself is minted by release-prepare.yaml). Also derive prerelease
  # status from the tag: a `-` suffix (e.g. v1.2.3-rc1) marks a prerelease.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must be in vX.Y.Z[-suffix] format, got: ${TAG}"
            exit 1
          fi

          VERSION="${TAG#v}"
          if [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Release: ${TAG} (version: ${VERSION}, prerelease: ${IS_PRERELEASE})"

      - name: Normalize container registry to lowercase
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

  # ---------------------------------------------------------------------------
  # Extract the release notes section from CHANGELOG.md if present.
  # Falls back to GitHub's auto-generated notes when no section is found.
  # ---------------------------------------------------------------------------
  changelog:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.extract.outputs.body }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Extract changelog for tag
        id: extract
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          if [[ ! -f CHANGELOG.md ]]; then
            echo "::notice::No CHANGELOG.md present; will use auto-generated notes."
            echo "body=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY=$(awk "/^## ${TAG//./\\.}/{found=1; next} /^## v[0-9]/{if(found) exit} found" CHANGELOG.md)
          if [[ -z "$BODY" ]]; then
            echo "::warning::No CHANGELOG section found for ${TAG}, using auto-generated notes"
            echo "body=" >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<CHANGELOG_EOF"
              echo "$BODY"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Extracted changelog for ${TAG}"
          fi

  # ---------------------------------------------------------------------------
  # Build the React frontend; downstream net-images jobs consume the artifact.
  # ---------------------------------------------------------------------------
  frontend:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci --prefer-offline --no-audit && npm run build
        working-directory: frontend

      - name: Upload frontend dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Run GoReleaser against the pushed tag.
  # GoReleaser produces kubectl-unbounded + unbounded-agent archives,
  # signs the checksums file, generates SBOMs, and creates a DRAFT GitHub
  # release. Subsequent jobs attach more artifacts to that draft.
  # ---------------------------------------------------------------------------
  binaries:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.version.outputs.tag }}

      - name: Upload dist artifact for downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goreleaser-dist
          path: dist/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Build, push, sign, and SBOM-attest unbounded-net-controller and
  # unbounded-net-node images. Native runners per arch (CGO + heavy tdnf
  # installs make QEMU prohibitively slow). Per-arch tags are stitched into
  # multi-arch manifests by the net-images-manifest job below.
  # ---------------------------------------------------------------------------
  net-images:
    needs: [version, frontend]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Normalize container registry to lowercase
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Cache CNI plugins
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: resources
          key: cni-plugins-${{ matrix.arch }}-${{ env.CNI_PLUGINS_VERSION }}

      - name: Download CNI plugins
        run: |
          mkdir -p resources
          file="resources/cni-plugins-linux-${{ matrix.arch }}-${CNI_PLUGINS_VERSION}.tgz"
          if [ ! -s "$file" ]; then
            curl -fsSL \
              "https://github.com/containernetworking/plugins/releases/download/${CNI_PLUGINS_VERSION}/cni-plugins-linux-${{ matrix.arch }}-${CNI_PLUGINS_VERSION}.tgz" \
              -o "$file"
          fi

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Go version for Docker
        id: goversion
        run: echo "go_version=$(awk '/^go /{split($2,v,"."); print v[1]"."v[2]}' go.mod)" >> "$GITHUB_OUTPUT"

      # Trivy scan on a single-platform load build before pushing.
      - name: Build controller for scanning
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: images/net/Containerfile
          target: controller
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            VERSION=${{ needs.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
          tags: scan/unbounded-net-controller:${{ needs.version.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=net-controller-${{ matrix.arch }}
          cache-to: type=gha,scope=net-controller-${{ matrix.arch }},mode=max

      - name: Scan controller with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/unbounded-net-controller:${{ needs.version.outputs.tag }}-${{ matrix.arch }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Build node for scanning
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: images/net/Containerfile
          target: node
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            VERSION=${{ needs.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
          tags: scan/unbounded-net-node:${{ needs.version.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=net-node-${{ matrix.arch }}
          cache-to: type=gha,scope=net-node-${{ matrix.arch }},mode=max

      - name: Scan node with Trivy (CRITICAL, gating)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/unbounded-net-node:${{ needs.version.outputs.tag }}-${{ matrix.arch }}
          format: table
          severity: CRITICAL
          exit-code: "1"

      # HIGH findings are reported but do not gate the release: net-node bundles
      # the upstream containernetworking/plugins CNI binaries, whose Go stdlib
      # CVEs we cannot fix without an upstream rebuild. Keep the scan visible so
      # regressions surface in the workflow log; promote back to gating once
      # upstream ships a clean toolchain.
      - name: Scan node with Trivy (HIGH, report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/unbounded-net-node:${{ needs.version.outputs.tag }}-${{ matrix.arch }}
          format: table
          severity: HIGH
          exit-code: "0"

      - name: Push controller image
        id: push_controller
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: images/net/Containerfile
          target: controller
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            VERSION=${{ needs.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
          tags: ${{ env.REGISTRY }}/unbounded-net-controller:${{ needs.version.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=net-controller-${{ matrix.arch }}
          cache-to: type=gha,scope=net-controller-${{ matrix.arch }},mode=max

      - name: Push node image
        id: push_node
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: images/net/Containerfile
          target: node
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            VERSION=${{ needs.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
          tags: ${{ env.REGISTRY }}/unbounded-net-node:${{ needs.version.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=net-node-${{ matrix.arch }}
          cache-to: type=gha,scope=net-node-${{ matrix.arch }},mode=max

      - name: Sign per-arch net images
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/unbounded-net-controller@${{ steps.push_controller.outputs.digest }}"
          cosign sign --yes "${{ env.REGISTRY }}/unbounded-net-node@${{ steps.push_node.outputs.digest }}"

      - name: Generate and attest controller SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/unbounded-net-controller@${{ steps.push_controller.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          artifact-name: sbom-net-controller-${{ matrix.arch }}.spdx.json
          output-file: sbom-net-controller-${{ matrix.arch }}.spdx.json

      - name: Attest controller SBOM
        run: |
          cosign attest --yes \
            --predicate sbom-net-controller-${{ matrix.arch }}.spdx.json \
            --type spdxjson \
            "${{ env.REGISTRY }}/unbounded-net-controller@${{ steps.push_controller.outputs.digest }}"

      - name: Generate and attest node SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/unbounded-net-node@${{ steps.push_node.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          artifact-name: sbom-net-node-${{ matrix.arch }}.spdx.json
          output-file: sbom-net-node-${{ matrix.arch }}.spdx.json

      - name: Attest node SBOM
        run: |
          cosign attest --yes \
            --predicate sbom-net-node-${{ matrix.arch }}.spdx.json \
            --type spdxjson \
            "${{ env.REGISTRY }}/unbounded-net-node@${{ steps.push_node.outputs.digest }}"

  # ---------------------------------------------------------------------------
  # Stitch per-arch net image tags into multi-arch manifests for :TAG and
  # :latest.
  # ---------------------------------------------------------------------------
  net-images-manifest:
    needs: [version, net-images]
    runs-on: ubuntu-latest
    steps:
      - name: Normalize container registry to lowercase
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          for image in controller node; do
            SRC="${{ env.REGISTRY }}/unbounded-net-${image}"
            for release_tag in "${TAG}" "latest"; do
              echo "Creating manifest ${SRC}:${release_tag}..."
              docker buildx imagetools create \
                --tag "${SRC}:${release_tag}" \
                "${SRC}:${TAG}-amd64" \
                "${SRC}:${TAG}-arm64"
            done
          done

  # ---------------------------------------------------------------------------
  # Build, scan, push, sign, and SBOM-attest the component images.
  # machina/metalman cross-compile natively for amd64 and arm64;
  # host-ubuntu2404 is amd64-only because virt-customize cannot run
  # under QEMU user-mode emulation.
  # ---------------------------------------------------------------------------
  component-images:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - name: machina
            file: images/machina/Containerfile
            platforms: linux/amd64,linux/arm64
            trivy: true
          - name: machine-ops-controller
            file: images/machine-ops-controller/Containerfile
            platforms: linux/amd64,linux/arm64
            trivy: true
          - name: metalman
            file: images/metalman/Containerfile
            platforms: linux/amd64,linux/arm64
            trivy: true
          - name: orca
            file: images/orca/Containerfile
            platforms: linux/amd64,linux/arm64
            trivy: true
          - name: host-ubuntu2404
            file: images/host-ubuntu2404/Containerfile
            platforms: linux/amd64
            trivy: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Normalize container registry to lowercase
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scanning
        if: matrix.component.trivy
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.component.file }}
          push: false
          load: true
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
          tags: scan/${{ matrix.component.name }}:${{ needs.version.outputs.tag }}

      - name: Scan with Trivy
        if: matrix.component.trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.component.name }}:${{ needs.version.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.component.file }}
          platforms: ${{ matrix.component.platforms }}
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.component.name }}:${{ needs.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ matrix.component.name }}:latest
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,scope=${{ matrix.component.name }},mode=max

      - name: Sign container image
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ matrix.component.name }}@${{ steps.push.outputs.digest }}"

      - name: Generate and attach SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ matrix.component.name }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.component.name }}.spdx.json
          output-file: sbom-${{ matrix.component.name }}.spdx.json

      - name: Attest SBOM to image
        run: |
          cosign attest --yes \
            --predicate sbom-${{ matrix.component.name }}.spdx.json \
            --type spdxjson \
            "${{ env.REGISTRY }}/${{ matrix.component.name }}@${{ steps.push.outputs.digest }}"

  # ---------------------------------------------------------------------------
  # Build the stamped combined machina+net manifests tarball, sign with
  # cosign, and upload as a workflow artifact for the finalize job.
  # ---------------------------------------------------------------------------
  manifests-tarball:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Normalize container registry to lowercase
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build combined release manifests tarball
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          make release-manifests \
            VERSION="${TAG}" \
            CONTAINER_REGISTRY="${{ env.REGISTRY }}"

      - name: Sign manifests tarball with cosign (keyless)
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          ARCHIVE="build/unbounded-manifests-${TAG}.tar.gz"
          cosign sign-blob --yes \
            --bundle="${ARCHIVE}.bundle.json" \
            "${ARCHIVE}"

      - name: Upload manifests artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifests-tarball
          path: build/unbounded-manifests-*
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Build the unbounded-storage release binary together with its runtime
  # dependency libraries (the pinned libfabric, built from source) for amd64
  # and arm64 on native runners (no QEMU), package each as a self-contained
  # tarball, and hand them to the finalize job to attach to the release.
  # ---------------------------------------------------------------------------
  storage-binaries:
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve libfabric version from Makefile
        run: |
          set -euo pipefail
          version="$(sed -n 's/^LIBFABRIC_VERSION[[:space:]]*?=[[:space:]]*//p' Makefile | head -n1)"
          if [[ -z "$version" ]]; then
            echo "could not determine LIBFABRIC_VERSION from Makefile" >&2
            exit 1
          fi
          echo "LIBFABRIC_VERSION=$version" >> "$GITHUB_ENV"
          echo "Resolved libfabric version: $version"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates curl liburing-dev \
            libibverbs-dev librdmacm-dev

      # The distro libfabric (1.x) predates the merge of the experimental
      # `net` provider into `tcp`, so it lacks a native FI_EP_RDM `tcp`
      # provider. `make libfabric` builds the pinned release from source and
      # installs it under tmp/libfabric (cached below to skip the rebuild).
      - name: Cache libfabric
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: tmp/libfabric
          key: libfabric-${{ env.LIBFABRIC_VERSION }}-${{ matrix.arch }}-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build libfabric
        run: make libfabric LIBFABRIC_VERSION="$LIBFABRIC_VERSION"

      - name: Set up Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cmd/unbounded-storage/target
          key: cargo-unbounded-storage-${{ matrix.arch }}-${{ runner.os }}-fabric-${{ hashFiles('cmd/unbounded-storage/Cargo.lock', 'cmd/unbounded-storage/Cargo.toml', 'cmd/unbounded-storage/build.rs', 'cmd/unbounded-storage/src/fabric/shim.c') }}
          restore-keys: |
            cargo-unbounded-storage-${{ matrix.arch }}-${{ runner.os }}-fabric-
            cargo-unbounded-storage-${{ matrix.arch }}-${{ runner.os }}-

      - name: Build release binary
        run: make unbounded-storage-build LIBFABRIC_VERSION="$LIBFABRIC_VERSION"

      - name: Assemble tarball
        run: |
          set -euo pipefail
          make unbounded-storage-tarball \
            STORAGE_TARBALL_ARCH="${{ matrix.arch }}" \
            LIBFABRIC_VERSION="$LIBFABRIC_VERSION" \
            STORAGE_DIST_DIR=dist

      # Match the supply-chain treatment of the other release artifacts: an
      # SPDX SBOM (as GoReleaser produces per archive) and a keyless cosign
      # signature bundle (as the manifests tarball gets). Keyless signing uses
      # the workflow's OIDC identity; no long-lived keys.
      - name: Generate SBOM
        run: |
          set -euo pipefail
          NAME="unbounded-storage-linux-${{ matrix.arch }}"
          syft scan "dist/${NAME}.tar.gz" \
            -o spdx-json="dist/${NAME}.tar.gz.spdx.json"

      - name: Sign storage tarball with cosign (keyless)
        run: |
          set -euo pipefail
          ARCHIVE="dist/unbounded-storage-linux-${{ matrix.arch }}.tar.gz"
          cosign sign-blob --yes \
            --bundle="${ARCHIVE}.bundle.json" \
            "${ARCHIVE}"

      - name: Upload storage tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storage-tarball-${{ matrix.arch }}
          path: |
            dist/unbounded-storage-linux-${{ matrix.arch }}.tar.gz
            dist/unbounded-storage-linux-${{ matrix.arch }}.tar.gz.sha256
            dist/unbounded-storage-linux-${{ matrix.arch }}.tar.gz.spdx.json
            dist/unbounded-storage-linux-${{ matrix.arch }}.tar.gz.bundle.json
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Attach the manifests tarball + krew manifest to the draft release that
  # GoReleaser created, set release notes, and optionally flip from draft
  # to published.
  # ---------------------------------------------------------------------------
  finalize:
    needs:
      - version
      - changelog
      - binaries
      - net-images-manifest
      - component-images
      - manifests-tarball
      - storage-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download goreleaser dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: goreleaser-dist
          path: dist/

      - name: Download manifests tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: manifests-tarball
          path: dist/

      - name: Download storage tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: storage-tarball-*
          path: dist/
          merge-multiple: true

      - name: Render krew manifest
        run: |
          export VERSION="${{ needs.version.outputs.tag }}"
          export REPO="${{ github.repository }}"
          export SHA_LINUX_AMD64=$(sha256sum dist/kubectl-unbounded-linux-amd64.tar.gz | awk '{print $1}')
          export SHA_LINUX_ARM64=$(sha256sum dist/kubectl-unbounded-linux-arm64.tar.gz | awk '{print $1}')
          export SHA_DARWIN_AMD64=$(sha256sum dist/kubectl-unbounded-darwin-amd64.tar.gz | awk '{print $1}')
          export SHA_DARWIN_ARM64=$(sha256sum dist/kubectl-unbounded-darwin-arm64.tar.gz | awk '{print $1}')
          envsubst < hack/krew-manifest.yaml > dist/unbounded.yaml

      - name: Attach extras to release and set notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          # Upload the additional artifacts to the draft release that
          # GoReleaser created.
          gh release upload "${TAG}" \
            dist/unbounded.yaml \
            dist/unbounded-manifests-*.tar.gz \
            dist/unbounded-manifests-*.tar.gz.bundle.json \
            dist/unbounded-storage-linux-*.tar.gz \
            dist/unbounded-storage-linux-*.tar.gz.sha256 \
            dist/unbounded-storage-linux-*.tar.gz.spdx.json \
            dist/unbounded-storage-linux-*.tar.gz.bundle.json \
            --clobber

          # Apply CHANGELOG-derived release notes if present.
          NOTES=$(cat <<'EOF'
          ${{ needs.changelog.outputs.body }}
          EOF
          )
          if [[ -n "${NOTES// /}" ]]; then
            gh release edit "${TAG}" --notes "${NOTES}"
          fi

          # Flag prerelease when the tag carries a prerelease suffix
          # (e.g. v1.2.3-rc1). GoReleaser also sets this via `prerelease: auto`;
          # we reassert it here in case the draft was created differently.
          if [[ "${{ needs.version.outputs.is_prerelease }}" == "true" ]]; then
            gh release edit "${TAG}" --prerelease
          fi

          # The release is always left as a draft. Publishing is a deliberate
          # manual step once the release has soaked.
          echo "Release ${TAG} left as draft. Publish via the GitHub UI or 'gh release edit ${TAG} --draft=false'."
