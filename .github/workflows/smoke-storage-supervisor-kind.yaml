name: unbounded-storage supervisor kind smoke test

on:
  pull_request:
    paths:
      - api/unbounded-storage/**
      - cmd/unbounded-storage/**
      - cmd/unbounded-storage-supervisor/**
      - deploy/unbounded-storage-supervisor/**
      - hack/smoke-storage-supervisor-kind.py
      - internal/storagesupervisor/**
      - Makefile
      - .github/workflows/smoke-storage-supervisor-kind.yaml
  push:
    branches: [main]
    paths:
      - api/unbounded-storage/**
      - cmd/unbounded-storage/**
      - cmd/unbounded-storage-supervisor/**
      - deploy/unbounded-storage-supervisor/**
      - hack/smoke-storage-supervisor-kind.py
      - internal/storagesupervisor/**
      - Makefile
      - .github/workflows/smoke-storage-supervisor-kind.yaml
  workflow_dispatch:

concurrency:
  group: smoke-storage-supervisor-kind-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBFABRIC_VERSION: "2.5.1"
      SMOKE_STORAGE_SUPERVISOR_KIND_CLUSTER: unbounded-storage-supervisor-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates curl liburing-dev \
            libibverbs-dev librdmacm-dev

      - name: Cache libfabric
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: tmp/libfabric
          key: libfabric-${{ env.LIBFABRIC_VERSION }}-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build libfabric
        run: make libfabric LIBFABRIC_VERSION="$LIBFABRIC_VERSION"

      - name: Set up Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cmd/unbounded-storage/target
          key: cargo-unbounded-storage-${{ runner.os }}-fabric-${{ hashFiles('cmd/unbounded-storage/Cargo.lock', 'cmd/unbounded-storage/Cargo.toml', 'cmd/unbounded-storage/build.rs', 'cmd/unbounded-storage/src/fabric/shim.c') }}
          restore-keys: |
            cargo-unbounded-storage-${{ runner.os }}-fabric-
            cargo-unbounded-storage-${{ runner.os }}-

      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true

      - name: Run kind smoke test
        run: make unbounded-storage-supervisor-smoke-kind LIBFABRIC_VERSION="$LIBFABRIC_VERSION"
