name: playpen e2e

on:
  pull_request:
    paths:
      - cmd/playpen-operator/**
      - cmd/playpen-runner/**
      - internal/playpen/**
      - deploy/playpen/**
      - images/playpen/**
      - e2e/playpen/**
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/playpen-e2e.yaml
  push:
    # release-* included so a cherry-pick onto a release branch gets the same
    # post-merge validation as main. The pull_request trigger above is
    # path-filtered with no branch filter, so it already covers release branches.
    branches:
      - main
      - release-*
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playpen-e2e:
    name: playpen e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.30.0

      - name: Install network prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 kmod wireguard-tools
          sudo modprobe wireguard || true
          ip -V
          wg --version

      - name: Run playpen e2e
        run: make e2e-playpen
