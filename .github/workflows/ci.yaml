name: CI

on:
  push:
    branches:
      # Main is validated before merge by pull_request and merge_group.
      # Keep push validation for supported release branches.
      - release-*
  pull_request:
    branches:
      - main
      - release-*
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR to avoid wasted runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  CNI_PLUGINS_VERSION: v1.9.1

jobs:
  # ---------- Frontend ----------
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci --prefer-offline --no-audit && npm run build
        working-directory: frontend

      - name: Upload frontend dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ---------- Lint ----------
  lint:
    name: Lint
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cache golangci-lint analysis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yaml') }}
          restore-keys: |
            golangci-${{ runner.os }}-

      - name: Install tools
        run: make install-tools

      - name: Lint
        run: make lint

  # ---------- Test ----------
  test:
    name: Test
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify go.mod tidy
        run: |
          make gomod
          if [ -n "$(git diff --name-only go.mod go.sum)" ]; then
            echo "::error::go.mod or go.sum is not tidy. Run 'make gomod' and commit the changes."
            git diff go.mod go.sum
            exit 1
          fi

      - name: Test
        run: make test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
          if-no-files-found: ignore

  # ---------- Incremental Racer Rust workspace ----------
  racer-rust:
    name: Racer Rust Workspace
    # Library real-I/O tests need a VM rather than a seccomp-restricted container.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/bin/racer-cargo
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Rust
        run: timeout --signal=TERM --kill-after=10s 300s rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy

      - name: Enable io_uring
        run: timeout --signal=TERM --kill-after=10s 300s sudo sysctl -w kernel.io_uring_disabled=0

      - name: Cache Cargo dependencies and artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bin/racer-cargo
          key: racer-workspace-${{ runner.os }}-${{ runner.arch }}-1.96.0-${{ hashFiles('cmd/racer-dataplane/Cargo.lock', 'cmd/racer-dataplane/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            racer-workspace-${{ runner.os }}-${{ runner.arch }}-1.96.0-${{ hashFiles('cmd/racer-dataplane/Cargo.lock', 'cmd/racer-dataplane/**/Cargo.toml') }}-

      - name: Check Rust formatting
        run: timeout --signal=TERM --kill-after=10s 300s cargo +1.96.0 fmt --manifest-path cmd/racer-dataplane/Cargo.toml --all --check

      - name: Check default features
        run: timeout --signal=TERM --kill-after=10s 300s cargo +1.96.0 check --locked --manifest-path cmd/racer-dataplane/Cargo.toml --workspace --all-targets

      - name: Test default features
        run: timeout --signal=TERM --kill-after=10s 300s cargo +1.96.0 test --locked --manifest-path cmd/racer-dataplane/Cargo.toml --workspace

      - name: Check all features
        run: timeout --signal=TERM --kill-after=10s 300s cargo +1.96.0 check --locked --manifest-path cmd/racer-dataplane/Cargo.toml --workspace --all-targets --all-features

      - name: Test all features
        run: timeout --signal=TERM --kill-after=10s 300s cargo +1.96.0 test --locked --manifest-path cmd/racer-dataplane/Cargo.toml --workspace --all-features

      - name: Strict runtime Clippy
        run: |
          timeout --signal=TERM --kill-after=10s 300s cargo +1.96.0 clippy --locked --manifest-path cmd/racer-dataplane/Cargo.toml -p uring-runtime --all-targets --all-features -- -D warnings
          timeout --signal=TERM --kill-after=10s 300s cargo +1.96.0 clippy --locked --manifest-path cmd/racer-dataplane/Cargo.toml -p uring-runtime --all-targets --no-default-features -- -D warnings

      - name: Runtime production real I/O (no simulation)
        env:
          RUNTIME_REQUIRE_IO_URING: "1"
        run: timeout --signal=TERM --kill-after=10s 300s cargo +1.96.0 test --locked --manifest-path cmd/racer-dataplane/Cargo.toml -p uring-runtime --no-default-features

  racer-verbs:
    name: Racer Verbs (${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: no-default-features
            features: ""
            native: false
          - configuration: simulation
            features: simulation
            native: false
          - configuration: native
            features: native
            native: true
          - configuration: native-and-simulation
            features: native,simulation
            native: true
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/bin/racer-verbs-cargo
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
      VERBS_FEATURES: ${{ matrix.features }}
      LD_LIBRARY_PATH: ${{ github.workspace }}/bin/racer-verbs-native
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Rust
        run: timeout --signal=TERM --kill-after=10s 300s rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy

      - name: Install native adapter build dependencies
        if: matrix.native
        run: |
          # Ubuntu runner sources share this list; bypass the stalled Azure mirror.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | timeout --signal=TERM --kill-after=10s 300s sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          apt_options=(-o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=2)
          timeout --signal=TERM --kill-after=10s 300s sudo apt-get "${apt_options[@]}" update
          timeout --signal=TERM --kill-after=10s 300s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends build-essential pkg-config libibverbs-dev

      # Rust loads the adapter dynamically, so Cargo cannot compile-check its C ABI.
      - name: Compile native C adapter (not hardware validation)
        if: matrix.native
        run: timeout --signal=TERM --kill-after=10s 300s sh images/racer-dataplane/build-native.sh cmd/racer-dataplane/verbs/native/verbs.c bin/racer-verbs-native/librdma_verbs.so.1

      - name: Require native adapter ABI and symbols (no hardware)
        if: matrix.native
        run: timeout --signal=TERM --kill-after=10s 300s cargo +1.96.0 test --locked --manifest-path cmd/racer-dataplane/Cargo.toml -p rdma-verbs --no-default-features --features "$VERBS_FEATURES" --lib ffi::tests::required_native_adapter_loads_abi_and_symbols -- --exact --ignored

      - name: Test C discovery and open cleanup faults (no hardware)
        if: matrix.native
        run: |
          timeout --signal=TERM --kill-after=10s 300s sh images/racer-dataplane/build-native.sh cmd/racer-dataplane/verbs/native/discovery_faults.c bin/racer-verbs-faults/librdma_verbs.so.1
          timeout --signal=TERM --kill-after=10s 300s env LD_LIBRARY_PATH="$GITHUB_WORKSPACE/bin/racer-verbs-faults" cargo +1.96.0 test --locked --manifest-path cmd/racer-dataplane/Cargo.toml -p rdma-verbs --no-default-features --features "$VERBS_FEATURES" --lib ffi::discovery_fault_tests::internal_close_failures_keep_admission_and_adapter -- --exact --ignored
          timeout --signal=TERM --kill-after=10s 300s env LD_LIBRARY_PATH="$GITHUB_WORKSPACE/bin/racer-verbs-faults" cargo +1.96.0 test --locked --manifest-path cmd/racer-dataplane/Cargo.toml -p rdma-verbs --no-default-features --features "$VERBS_FEATURES" --lib ffi::discovery_fault_tests::open_cleanup_failures_keep_admission_and_adapter -- --exact --ignored

      - name: Check verbs formatting
        run: timeout --signal=TERM --kill-after=10s 300s cargo +1.96.0 fmt --manifest-path cmd/racer-dataplane/Cargo.toml -p rdma-verbs --check

      - name: Check verbs feature configuration
        run: |
          features=()
          if [ -n "$VERBS_FEATURES" ]; then features=(--features "$VERBS_FEATURES"); fi
          timeout --signal=TERM --kill-after=10s 300s cargo +1.96.0 check --locked --manifest-path cmd/racer-dataplane/Cargo.toml -p rdma-verbs --all-targets --no-default-features "${features[@]}"

      - name: Strict verbs Clippy
        run: |
          features=()
          if [ -n "$VERBS_FEATURES" ]; then features=(--features "$VERBS_FEATURES"); fi
          timeout --signal=TERM --kill-after=10s 300s cargo +1.96.0 clippy --locked --manifest-path cmd/racer-dataplane/Cargo.toml -p rdma-verbs --all-targets --no-default-features "${features[@]}" -- -D warnings

      # Explicit zero-port and active-provider tests remain ignored. A hosted
      # runner does not establish RDMA hardware or DMA/fencing correctness.
      - name: Test verbs without requiring RDMA hardware
        run: |
          features=()
          if [ -n "$VERBS_FEATURES" ]; then features=(--features "$VERBS_FEATURES"); fi
          timeout --signal=TERM --kill-after=10s 300s cargo +1.96.0 test --locked --manifest-path cmd/racer-dataplane/Cargo.toml -p rdma-verbs --no-default-features "${features[@]}"

  runtime-miri:
    name: Runtime Miri (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [channel, offload, scheduler, memory]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Miri
        run: timeout --signal=TERM --kill-after=10s 300s rustup toolchain install nightly-2025-11-21 --profile minimal --component miri,rust-src

      - name: Prepare Miri sysroot
        run: timeout --signal=TERM --kill-after=10s 300s cargo +nightly-2025-11-21 miri setup

      - name: Validate exact pure runtime test group
        run: timeout --signal=TERM --kill-after=10s 300s python3 hack/scripts/runtime-miri.py ${{ matrix.group }}
  racer-envtest:
    name: Racer API Server Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Provision envtest and run controller API-server race tests
        run: timeout --signal=TERM --kill-after=10s 300s make racer-envtest-ci

  # ---------- Orca Integration Tests ----------
  # Spins up Garage and Azurite via testcontainers-go and runs the
  # orca in-process integration suite (internal/orca/inttest). Docker
  # is preinstalled on GitHub-hosted Ubuntu runners; no extra services:
  # block is required.
  orca-inttest:
    name: Orca Integration Tests
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run orca-inttest
        run: make orca-inttest

  # ---------- Build ----------
  build:
    name: Build
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: make build

  # ---------- Vulnerability Check ----------
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vulnerability check
        run: make vulncheck

  # ---------- Verify Generated Files ----------
  verify-generated:
    name: Verify Generated Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install tools
        run: make install-tools

      - name: Install clang/llvm for bpf2go
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 llvm-18 libbpf-dev

      - name: Verify BPF CO-RE pin artifacts
        run: make net-ebpf-verify

      - name: Regenerate
        run: make generate

      - name: Check for drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make generate' and commit the results."
            exit 1
          fi

  # ---------- Verify BPF binary reproducibility ----------
  #
  # Recompiles bpf/unbounded_encap.c via bpf2go using the pinned clang
  # version (bpf/clang-version) and diffs the result against the
  # committed internal/net/ebpf/unboundedencap_bpfel.{go,o}. Catches any
  # PR that edits the BPF source (or its CO-RE inputs in bpf/vmlinux.h)
  # without re-running `make generate` and committing the updated
  # bindings.
  #
  # Reproducibility relies on every build path using the same clang
  # binary: contributors invoke clang-18 via `make generate`, this CI
  # job installs the same package. Bump the pin by updating
  # bpf/clang-version and the references it documents.
  verify-bpf-binary:
    name: Verify BPF Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify pinned clang version
        run: |
          pinned="$(grep -v '^#' bpf/clang-version | grep -v '^$' | head -n1)"
          if [ "$pinned" != "clang-18" ]; then
            echo "::error::bpf/clang-version pins '$pinned' but this CI job installs clang-18."
            echo "::error::Update the apt-get line in .github/workflows/ci.yaml (verify-bpf-binary job) to match."
            exit 1
          fi

      - name: Install pinned clang for bpf2go
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libbpf-dev

      - name: Recompile BPF bindings via bpf2go
        run: go generate ./internal/net/ebpf/...

      - name: Check for drift in bpf2go output
        run: |
          if ! git diff --exit-code -- internal/net/ebpf/ bpf/; then
            echo "::error::Committed BPF bindings are out of date."
            echo "::error::Run 'make generate' locally (with $(grep -v '^#' bpf/clang-version | grep -v '^$' | head -n1) installed) and commit the updated"
            echo "::error::internal/net/ebpf/unboundedencap_bpfel.{go,o}."
            exit 1
          fi

  # ---------- Verify licenses ----------
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check repository license declarations
        run: make license-check

  # ---------- Verify NOTICE ----------
  notice-check:
    name: NOTICE Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefer-offline --no-audit
        working-directory: frontend

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Provision locked Cargo sources for NOTICE
        run: |
          timeout --signal=TERM --kill-after=10s 300s rustup toolchain install 1.96.0 --profile minimal
          timeout --signal=TERM --kill-after=10s 300s cargo +1.96.0 fetch --locked --manifest-path cmd/racer-dataplane/Cargo.toml

      - name: Verify NOTICE
        run: timeout --signal=TERM --kill-after=10s 300s make notice-check

  # ---------- Build Container Images ----------
  build-images:
    name: Build Images (${{ matrix.arch }})
    needs: [frontend]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Normalize container registry
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Cache CNI plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources
          key: cni-plugins-${{ matrix.arch }}-${{ env.CNI_PLUGINS_VERSION }}

      - name: Download CNI plugins
        run: |
          mkdir -p resources
          file="resources/cni-plugins-linux-${{ matrix.arch }}-${CNI_PLUGINS_VERSION}.tgz"
          if [ ! -s "$file" ]; then
            curl -fsSL "https://github.com/containernetworking/plugins/releases/download/${CNI_PLUGINS_VERSION}/cni-plugins-linux-${{ matrix.arch }}-${CNI_PLUGINS_VERSION}.tgz" -o "$file"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Compute Go version for Docker
        id: goversion
        run: echo "go_version=$(awk '/^go /{split($2,v,"."); print v[1]"."v[2]}' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Build controller image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: images/net/Containerfile
          target: controller
          platforms: ${{ matrix.platform }}
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/unbounded-net-controller:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/net-controller.oci.tar,oci-mediatypes=true
          provenance: false

      - name: Build node image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: images/net/Containerfile
          target: node
          platforms: ${{ matrix.platform }}
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/unbounded-net-node:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/net-node.oci.tar,oci-mediatypes=true
          provenance: false

      - name: Verify OCI image layouts
        run: |
          set -euo pipefail

          validate_layout() {
            local name="$1"
            local archive="${RUNNER_TEMP}/net-${name}.oci.tar"
            local index
            index="$(tar -xOf "$archive" index.json)"

            jq -e '
              .schemaVersion == 2 and
              .mediaType == "application/vnd.oci.image.index.v1+json" and
              (.manifests | length > 0) and
              all(.manifests[]; .mediaType == "application/vnd.oci.image.manifest.v1+json")
            ' <<<"$index"

            while IFS= read -r digest; do
              local algorithm="${digest%%:*}"
              local encoded="${digest#*:}"
              local manifest="blobs/$algorithm/$encoded"
              tar -xOf "$archive" "$manifest" | jq -e '
                .mediaType == "application/vnd.oci.image.manifest.v1+json" and
                .config.mediaType == "application/vnd.oci.image.config.v1+json" and
                all(.layers[];
                  .mediaType | test("^application/vnd\\.oci\\.image\\.layer\\.v1\\.tar(\\+(gzip|zstd))?$"))
              '
            done < <(jq -r '.manifests[].digest' <<<"$index")
          }

          validate_layout controller
          validate_layout node
