name: CI

on:
  push:
    branches:
      - main
      # Release branches cut supported releases, so they get the same checks as
      # main. Every check this repository requires to merge comes from this
      # workflow, so a release branch without it could not merge a cherry-pick.
      - release-*
  pull_request:
    branches:
      - main
      - release-*
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR to avoid wasted runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  CNI_PLUGINS_VERSION: v1.9.1

jobs:
  # ---------- Frontend ----------
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci --prefer-offline --no-audit && npm run build
        working-directory: frontend

      - name: Upload frontend dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ---------- Lint ----------
  lint:
    name: Lint
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cache golangci-lint analysis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yaml') }}
          restore-keys: |
            golangci-${{ runner.os }}-

      - name: Install tools
        run: make install-tools

      - name: Lint
        run: make lint

  # ---------- Test ----------
  test:
    name: Test
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify go.mod tidy
        run: |
          make gomod
          if [ -n "$(git diff --name-only go.mod go.sum)" ]; then
            echo "::error::go.mod or go.sum is not tidy. Run 'make gomod' and commit the changes."
            git diff go.mod go.sum
            exit 1
          fi

      - name: Test
        run: make test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
          if-no-files-found: ignore

  # ---------- Racer ----------
  racer:
    name: Racer Rust and Cross-language Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RACER_REQUIRE_URING: "1"
      RUST_TEST_THREADS: "2"
      GOTOOLCHAIN: go1.26.6
      ENVTEST_K8S_VERSION: "1.37.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install matching envtest assets
        run: |
          mkdir -p bin tmp/racer-tests
          GOBIN="$GITHUB_WORKSPACE/bin" go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.25
          assets=$(bin/setup-envtest use "$ENVTEST_K8S_VERSION" --bin-dir "$GITHUB_WORKSPACE/bin/envtest" -p path)
          test -x "$assets/kube-apiserver"
          test -x "$assets/etcd"
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"
      - name: Test operator against the real API server
        if: ${{ !cancelled() }}
        run: |
          test -n "$KUBEBUILDER_ASSETS"
          export TMPDIR="$GITHUB_WORKSPACE/tmp/racer-tests"
          python3 hack/scripts/racer-test.py run operator-api 600 go test -json -mod=readonly -race -count=1 -timeout=9m -v \
            ./internal/operator/components/racer \
            -run '^(TestSiteWorkloadAdmission|TestAPIDefaultedResourcesAreNoOp)$'
      - name: Install native dependencies
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libibverbs-dev ibverbs-providers libssl-dev pkg-config jq iproute2 util-linux
      - name: Set up Rust
        if: ${{ !cancelled() }}
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt
          rustup default 1.96.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cmd/racer-controlplane/target
            cmd/racer-dataplane/target
          key: racer-rust-1.96.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmd/racer-controlplane/Cargo.lock', 'cmd/racer-dataplane/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            racer-rust-1.96.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmd/racer-controlplane/Cargo.lock', 'cmd/racer-dataplane/Cargo.lock') }}-
            racer-rust-1.96.0-${{ runner.os }}-${{ runner.arch }}-
      - name: Check Rust formatting including attached tests
        if: ${{ !cancelled() }}
        run: make racer-fmt-check
      - name: Check bounded harness and hermetic context
        if: ${{ !cancelled() }}
        run: make racer-harness-test
      # Build the native daemon before capturing test executable identities.
      # Later runtime-only steps consume this binary without invoking Cargo.
      - name: Build native GantryRacer e2e
        if: ${{ !cancelled() }}
        run: python3 hack/scripts/racer-test.py run gantry-build 1200 make e2e-gantry-racer-build
      - name: Compile all test targets
        if: ${{ !cancelled() }}
        run: make racer-rust-test-compile
      - name: Test Rust control plane and doctests
        if: ${{ !cancelled() }}
        run: |
          export TMPDIR="$GITHUB_WORKSPACE/tmp/racer-tests"
          make racer-controlplane-test-run
      # This job runs for every CI event, including Gantry core, SDK, Rust,
      # api/racer, and e2e/racer changes. Reuse its native Rust cache and host
      # capabilities rather than placing the suite on the generic Go test job.
      - name: Test Gantry with real Racer and containerd
        if: ${{ !cancelled() }}
        run: |
          sudo -n prlimit --pid $$ --memlock=unlimited:unlimited
          # The runner's Docker installation supplies containerd. The Make target
          # fails if it or namespace/mount privileges, ext4, or io_uring are absent.
          export TMPDIR="$GITHUB_WORKSPACE/tmp/racer-tests"
          make e2e-gantry-racer
      - name: Test Rust with required kernel coverage and doctests
        if: ${{ !cancelled() }}
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          mkdir -p tmp/racer-tests
          export TMPDIR="$GITHUB_WORKSPACE/tmp/racer-tests"
          make racer-dataplane-test-run
      - name: Require real TX and RX kTLS offload
        if: ${{ !cancelled() }}
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          export TMPDIR="$GITHUB_WORKSPACE/tmp/racer-tests"
          # Linux >= 6.14 and the vendored kTLS OpenSSL are required.
          # A missing capability fails this step instead of becoming a skip.
          uname -a
          python3 - <<'PY'
          import platform
          release = tuple(map(int, platform.release().split('-')[0].split('.')[:2]))
          assert release >= (6, 14), f"required kTLS lane needs Linux >= 6.14, got {platform.release()}"
          PY
          make racer-ktls-test RACER_TEST_TIMEOUT_SECONDS=90
      - name: Test full production-duration timing contracts
        if: ${{ !cancelled() }}
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          export TMPDIR="$GITHUB_WORKSPACE/tmp/racer-tests"
          make racer-timing-test
      - name: Test opt-in Rust benchmark contracts
        if: ${{ !cancelled() }}
        run: make racer-bench-test
      - name: Build Rust control plane and Go tools
        if: ${{ !cancelled() }}
        run: python3 hack/scripts/racer-test.py run production-build 1200 make -k racer-controlplane-build racer-loadgen-build racer-dataplane-build
      - name: Test shared Go components
        if: ${{ !cancelled() }}
        run: make racer-go-test
      - name: Compile Racer e2e and validate operator fixtures
        if: ${{ !cancelled() }}
        run: make -k e2e-racer-compile e2e-racer-fixtures
      - name: Test actual Rust control planes and dataplanes against the real API server
        if: ${{ !cancelled() }}
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          export TMPDIR="$GITHUB_WORKSPACE/tmp/racer-tests"
          mkdir -p "$GITHUB_WORKSPACE/tmp/racer-sockets"
          # A short alias to workspace-owned scratch keeps production UDS names valid.
          ln -s "$GITHUB_WORKSPACE/tmp/racer-sockets" "$RUNNER_TEMP/racer"
          export RACER_LIVE_SOCKET_ROOT="$RUNNER_TEMP/racer"
          test "${#RACER_LIVE_SOCKET_ROOT}" -le 36
          export RACER_CONTROLPLANE_BINARY="$GITHUB_WORKSPACE/bin/racer-controlplane"
          export RACER_DATAPLANE_BINARY="$GITHUB_WORKSPACE/bin/racer-dataplane"
          bash hack/scripts/racer-controlplane-live.sh
      - name: Test SDK against the real dataplane
        if: ${{ !cancelled() }}
        run: |
          # This fixture uses one I/O and one compute worker on the first allowed
          # NUMA node. Count allowed physical cores, not SMT threads or CPU quota.
          cores=$(python3 - <<'PY'
          import os
          from pathlib import Path
          nodes = {}
          for cpu in os.sched_getaffinity(0):
              path = Path(f"/sys/devices/system/cpu/cpu{cpu}")
              node = int(next(path.glob("node[0-9]*")).name[4:])
              siblings = (path / "topology/thread_siblings_list").read_text().strip()
              nodes.setdefault(node, set()).add(siblings)
          print(len(nodes[min(nodes)]) if nodes else 0)
          PY
          )
          if [ "$cores" -lt 2 ]; then
            echo "::error::SDK dataplane tests require two allowed physical cores on the first NUMA node"
            exit 1
          fi
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          export TMPDIR="$GITHUB_WORKSPACE/tmp/racer-tests"
          export RACER_DATAPLANE_BINARY="$GITHUB_WORKSPACE/bin/racer-dataplane"
          python3 hack/scripts/racer-test.py run sdk-interop 300 go test -json -mod=readonly -race -count=1 -timeout=4m -v ./pkg/racer
      - name: Upload production-binary campaign diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: racer-controlplane-live
          path: |
            tmp/racer-test-logs/**
            tmp/racer-tests/racer-live-run-*.log
            tmp/racer-tests/racer-live-artifacts-*/**
          if-no-files-found: ignore
          retention-days: 7

  # The live deployment suite runs on a fresh runner for every CI event.
  racer-e2e:
    name: Racer E2E (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: deployment
            target: e2e-racer
    env:
      GOTOOLCHAIN: go1.26.6
      KIND_VERSION: v0.29.0
      RACER_E2E_NODE_IMAGE: kindest/node:v1.33.1
      RACER_E2E_DIR: ${{ github.workspace }}/e2e/racer/.artifacts
      RACER_E2E_IMAGE_TAG: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install kind
        run: |
          curl -fsSL -o ./kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 ./kind /usr/local/bin/kind
          rm -f ./kind
      - name: Prepare kind host limits
        run: sudo sysctl -w fs.inotify.max_user_instances=8192 fs.inotify.max_user_watches=1048576
      - name: Verify deployment prerequisites
        run: |
          mkdir -p "$RACER_E2E_DIR"
          {
            docker info
            kind version
            kubectl version --client
            uname -a
            findmnt -T "$RACER_E2E_DIR"
            free -m
            sysctl fs.inotify.max_user_instances fs.inotify.max_user_watches
          } > "$RACER_E2E_DIR/prerequisites.log" 2>&1
          # Fail explicitly instead of reporting unexercised live coverage as a
          # pass. The actual daemon exercises NUMA allocation, registered buffers,
          # and io_uring during startup, with no test bypass.
          test "$(findmnt -n -o FSTYPE -T "$RACER_E2E_DIR")" = ext4
          test "$(getconf PAGESIZE)" = 4096
          test -f /sys/fs/cgroup/cgroup.controllers
          python3 - <<'PY'
          import os
          from pathlib import Path
          nodes = {}
          for cpu in os.sched_getaffinity(0):
              path = Path(f"/sys/devices/system/cpu/cpu{cpu}")
              node = int(next(path.glob("node[0-9]*")).name[4:])
              siblings = (path / "topology/thread_siblings_list").read_text().strip()
              nodes.setdefault(node, set()).add(siblings)
          assert nodes and len(nodes[min(nodes)]) >= 2, "need two physical cores on first NUMA node"
          assert len(os.sched_getaffinity(0)) >= 4, "need capacity for 3-CPU dataplane plus system pods"
          memory = os.sysconf("SC_PHYS_PAGES") * os.sysconf("SC_PAGE_SIZE")
          assert memory >= 12 * 1024**3, "need at least 12 GiB for two dataplanes, builds, and kind"
          PY
      - name: Compile and check fixture wiring
        run: make e2e-racer-compile e2e-racer-fixtures
      - name: Prepare tracked-source Docker context
        run: |
          mkdir -p tmp
          python3 hack/scripts/racer-source-context.py tmp/racer-image-context
      # Preload the exact images the suite consumes. GHA layer caches survive
      # fresh runners.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build cached controlplane
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: tmp/racer-image-context
          file: images/racer-controlplane/Containerfile
          load: true
          tags: racer-controlplane:${{ env.RACER_E2E_IMAGE_TAG }}
          build-args: |
            VERSION=${{ env.RACER_E2E_IMAGE_TAG }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=racer-e2e-${{ matrix.suite }}-controlplane
          cache-to: type=gha,scope=racer-e2e-${{ matrix.suite }}-controlplane,mode=max
      - name: Build cached dataplane
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: tmp/racer-image-context
          file: images/racer-dataplane/Containerfile
          load: true
          tags: racer-dataplane:${{ env.RACER_E2E_IMAGE_TAG }}
          cache-from: type=gha,scope=racer-e2e-${{ matrix.suite }}-dataplane
          cache-to: type=gha,scope=racer-e2e-${{ matrix.suite }}-dataplane,mode=max
      - name: Build cached operator
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: tmp/racer-image-context
          file: images/unbounded-operator/Containerfile
          load: true
          tags: unbounded-operator:${{ env.RACER_E2E_IMAGE_TAG }}
          cache-from: type=gha,scope=racer-e2e-${{ matrix.suite }}-operator
          cache-to: type=gha,scope=racer-e2e-${{ matrix.suite }}-operator,mode=max
      - name: Build cached origin and probe fixture
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: tmp/racer-image-context
          file: e2e/racer/fixture/Containerfile
          load: true
          tags: racer-fixture:${{ env.RACER_E2E_IMAGE_TAG }}
          cache-from: type=gha,scope=racer-e2e-${{ matrix.suite }}-fixture
          cache-to: type=gha,scope=racer-e2e-${{ matrix.suite }}-fixture,mode=max
      - name: Run ${{ matrix.suite }} e2e
        run: |
          set -o pipefail
          make ${{ matrix.target }} 2>&1 | tee "$RACER_E2E_DIR/${{ matrix.suite }}.log"
      - name: Upload Racer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: racer-e2e-${{ matrix.suite }}
          include-hidden-files: true
          path: |
            tmp/racer-test-logs/**
            e2e/racer/.artifacts/**
            !e2e/racer/.artifacts/**/cache-*/**
            !e2e/racer/.artifacts/**/kubeconfig
            !e2e/racer/.artifacts/**/*.kubeconfig
          if-no-files-found: warn
          retention-days: 7

  racer-images:
    name: Racer Images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Prepare tracked-source Docker context
        run: |
          mkdir -p tmp
          python3 hack/scripts/racer-source-context.py tmp/racer-image-context
      - name: Build controlplane
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: tmp/racer-image-context
          file: images/racer-controlplane/Containerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: racer-controlplane:ci-${{ matrix.arch }}
          build-args: |
            VERSION=ci-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=ci-${{ github.run_id }}
          cache-from: type=gha,scope=racer-controlplane-${{ matrix.arch }}
          cache-to: type=gha,scope=racer-controlplane-${{ matrix.arch }},mode=max
      - name: Check native controlplane image and version stamps
        env:
          EXPECTED_VERSION: ci-${{ github.sha }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_BUILD_TIME: ci-${{ github.run_id }}
        run: |
          version=$(docker run --rm racer-controlplane:ci-${{ matrix.arch }} version)
          [[ "$version" == *"$EXPECTED_VERSION"* ]]
          [[ "$version" == *"$EXPECTED_COMMIT"* ]]
          [[ "$version" == *"$EXPECTED_BUILD_TIME"* ]]
          docker run --rm --entrypoint /bin/sh racer-controlplane:ci-${{ matrix.arch }} -ec \
            '/usr/local/bin/racer-controlplane --version'
      - name: Build dataplane
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: tmp/racer-image-context
          file: images/racer-dataplane/Containerfile
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=racer-dataplane-${{ matrix.arch }}
          cache-to: type=gha,scope=racer-dataplane-${{ matrix.arch }},mode=max
      - name: Build test-only loadgen
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: tmp/racer-image-context
          file: images/racer-loadgen/Containerfile
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=racer-loadgen-${{ matrix.arch }}
          cache-to: type=gha,scope=racer-loadgen-${{ matrix.arch }},mode=max

  # ---------- Orca Integration Tests ----------
  # Spins up Garage and Azurite via testcontainers-go and runs the
  # orca in-process integration suite (internal/orca/inttest). Docker
  # is preinstalled on GitHub-hosted Ubuntu runners; no extra services:
  # block is required.
  orca-inttest:
    name: Orca Integration Tests
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run orca-inttest
        run: make orca-inttest

  # ---------- Build ----------
  build:
    name: Build
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: make build

  # ---------- Vulnerability Check ----------
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vulnerability check
        run: make vulncheck

  # ---------- Verify Generated Files ----------
  verify-generated:
    name: Verify Generated Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install tools
        run: make install-tools

      - name: Install clang/llvm for bpf2go
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 llvm-18 libbpf-dev

      - name: Verify BPF CO-RE pin artifacts
        run: make net-ebpf-verify

      - name: Regenerate
        run: make generate

      - name: Check for drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make generate' and commit the results."
            exit 1
          fi

  # ---------- Verify BPF binary reproducibility ----------
  #
  # Recompiles bpf/unbounded_encap.c via bpf2go using the pinned clang
  # version (bpf/clang-version) and diffs the result against the
  # committed internal/net/ebpf/unboundedencap_bpfel.{go,o}. Catches any
  # PR that edits the BPF source (or its CO-RE inputs in bpf/vmlinux.h)
  # without re-running `make generate` and committing the updated
  # bindings.
  #
  # Reproducibility relies on every build path using the same clang
  # binary: contributors invoke clang-18 via `make generate`, this CI
  # job installs the same package. Bump the pin by updating
  # bpf/clang-version and the references it documents.
  verify-bpf-binary:
    name: Verify BPF Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify pinned clang version
        run: |
          pinned="$(grep -v '^#' bpf/clang-version | grep -v '^$' | head -n1)"
          if [ "$pinned" != "clang-18" ]; then
            echo "::error::bpf/clang-version pins '$pinned' but this CI job installs clang-18."
            echo "::error::Update the apt-get line in .github/workflows/ci.yaml (verify-bpf-binary job) to match."
            exit 1
          fi

      - name: Install pinned clang for bpf2go
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libbpf-dev

      - name: Recompile BPF bindings via bpf2go
        run: go generate ./internal/net/ebpf/...

      - name: Check for drift in bpf2go output
        run: |
          if ! git diff --exit-code -- internal/net/ebpf/ bpf/; then
            echo "::error::Committed BPF bindings are out of date."
            echo "::error::Run 'make generate' locally (with $(grep -v '^#' bpf/clang-version | grep -v '^$' | head -n1) installed) and commit the updated"
            echo "::error::internal/net/ebpf/unboundedencap_bpfel.{go,o}."
            exit 1
          fi

  # ---------- Verify licenses ----------
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check repository license declarations
        run: make license-check

  # ---------- Verify NOTICE ----------
  notice-check:
    name: NOTICE Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefer-offline --no-audit
        working-directory: frontend

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Fetch Rust dependencies
        run: |
          for manifest in cmd/*/Cargo.toml; do
            cargo fetch --manifest-path "$manifest" --locked
          done

      - name: Verify NOTICE
        run: make notice-check

  # ---------- Build Container Images ----------
  build-images:
    name: Build Images (${{ matrix.arch }})
    needs: [frontend]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Normalize container registry
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Cache CNI plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources
          key: cni-plugins-${{ matrix.arch }}-${{ env.CNI_PLUGINS_VERSION }}

      - name: Download CNI plugins
        run: |
          mkdir -p resources
          file="resources/cni-plugins-linux-${{ matrix.arch }}-${CNI_PLUGINS_VERSION}.tgz"
          if [ ! -s "$file" ]; then
            curl -fsSL "https://github.com/containernetworking/plugins/releases/download/${CNI_PLUGINS_VERSION}/cni-plugins-linux-${{ matrix.arch }}-${CNI_PLUGINS_VERSION}.tgz" -o "$file"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Compute Go version for Docker
        id: goversion
        run: echo "go_version=$(awk '/^go /{split($2,v,"."); print v[1]"."v[2]}' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Build controller image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/net/Containerfile
          target: controller
          platforms: ${{ matrix.platform }}
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/unbounded-net-controller:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/net-controller.oci.tar,oci-mediatypes=true
          provenance: false

      - name: Build node image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/net/Containerfile
          target: node
          platforms: ${{ matrix.platform }}
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/unbounded-net-node:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/net-node.oci.tar,oci-mediatypes=true
          provenance: false

      - name: Verify OCI image layouts
        run: |
          set -euo pipefail

          validate_layout() {
            local name="$1"
            local archive="${RUNNER_TEMP}/net-${name}.oci.tar"
            local index
            index="$(tar -xOf "$archive" index.json)"

            jq -e '
              .schemaVersion == 2 and
              .mediaType == "application/vnd.oci.image.index.v1+json" and
              (.manifests | length > 0) and
              all(.manifests[]; .mediaType == "application/vnd.oci.image.manifest.v1+json")
            ' <<<"$index"

            while IFS= read -r digest; do
              local algorithm="${digest%%:*}"
              local encoded="${digest#*:}"
              local manifest="blobs/$algorithm/$encoded"
              tar -xOf "$archive" "$manifest" | jq -e '
                .mediaType == "application/vnd.oci.image.manifest.v1+json" and
                .config.mediaType == "application/vnd.oci.image.config.v1+json" and
                all(.layers[];
                  .mediaType | test("^application/vnd\\.oci\\.image\\.layer\\.v1\\.tar(\\+(gzip|zstd))?$"))
              '
            done < <(jq -r '.manifests[].digest' <<<"$index")
          }

          validate_layout controller
          validate_layout node

  # ---------- Publish Orca image (main only) ----------
  # Publishes a dev Orca image to ghcr on every merge to main so the
  # long-lived AKS integration cluster has something to pull. Gated on
  # the core quality jobs so a broken main is never published. Release
  # builds (signed + SBOM) are handled separately by release.yaml.
  # Tags: `:main` (moving) and `:main-<sha>` (immutable, for pinning).
  publish-orca:
    name: Publish Orca Image (main)
    needs: [lint, test, orca-inttest, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalize container registry
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/orca/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=main-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/orca:main
            ${{ env.REGISTRY }}/orca:main-${{ github.sha }}
          cache-from: type=gha,scope=orca
          cache-to: type=gha,mode=max,scope=orca
