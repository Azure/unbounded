name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR to avoid wasted runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  CNI_PLUGINS_VERSION: v1.9.1

jobs:
  # ---------- Frontend ----------
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci --prefer-offline --no-audit && npm run build
        working-directory: frontend

      - name: Upload frontend dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ---------- Lint ----------
  lint:
    name: Lint
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cache golangci-lint analysis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yaml') }}
          restore-keys: |
            golangci-${{ runner.os }}-

      - name: Install tools
        run: make install-tools

      - name: Lint
        run: make lint

  # ---------- Test ----------
  test:
    name: Test
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify go.mod tidy
        run: |
          make gomod
          if [ -n "$(git diff --name-only go.mod go.sum)" ]; then
            echo "::error::go.mod or go.sum is not tidy. Run 'make gomod' and commit the changes."
            git diff go.mod go.sum
            exit 1
          fi

      - name: Test
        run: make test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
          if-no-files-found: ignore

  # ---------- Orca Integration Tests ----------
  # Spins up Garage and Azurite via testcontainers-go and runs the
  # orca in-process integration suite (internal/orca/inttest). Docker
  # is preinstalled on GitHub-hosted Ubuntu runners; no extra services:
  # block is required.
  orca-inttest:
    name: Orca Integration Tests
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run orca-inttest
        run: make orca-inttest

  # ---------- Storage Integration ----------
  # Verifies the unbounded-storage S3 frontend end to end: a client GET
  # through an out-of-process two-node unbounded-storage ring flows
  # through its S3 backend into an in-process orca edge and on to the
  # same Garage S3 backend orca's own integration tests use. Needs the
  # Rust toolchain + pinned libfabric (to build unbounded-storage) and
  # sudo (RLIMIT_MEMLOCK for io_uring pinned buffers); Docker provides
  # Garage + Azurite via testcontainers. This job builds and runs only
  # the storage integration test, not the rest of the orca suite, so it
  # does not depend on the frontend dist.
  storage-inttest:
    name: Storage Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBFABRIC_VERSION: "2.5.1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates curl liburing-dev \
            libibverbs-dev librdmacm-dev

      - name: Cache libfabric
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/libfabric
          key: libfabric-${{ env.LIBFABRIC_VERSION }}-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Build libfabric
        run: make libfabric LIBFABRIC_VERSION=$LIBFABRIC_VERSION

      - name: Set up Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo + crate target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cmd/unbounded-storage/target
          # Match the smoke-storage job's key so the two share the crate
          # target cache, and invalidate on the native FFI inputs cargo
          # cannot fingerprint from Cargo.lock alone.
          key: cargo-unbounded-storage-${{ runner.os }}-fabric-${{ hashFiles('cmd/unbounded-storage/Cargo.lock', 'cmd/unbounded-storage/Cargo.toml', 'cmd/unbounded-storage/build.rs', 'cmd/unbounded-storage/src/fabric/shim.c') }}
          restore-keys: |
            cargo-unbounded-storage-${{ runner.os }}-fabric-
            cargo-unbounded-storage-${{ runner.os }}-

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run storage-inttest
        run: make storage-inttest LIBFABRIC_VERSION=$LIBFABRIC_VERSION

  # ---------- Build ----------
  build:
    name: Build
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: make build

  # ---------- Vulnerability Check ----------
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vulnerability check
        run: make vulncheck

  # ---------- Verify Generated Files ----------
  verify-generated:
    name: Verify Generated Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install tools
        run: make install-tools

      - name: Install clang/llvm for bpf2go
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 llvm-18 libbpf-dev

      - name: Verify BPF CO-RE pin artifacts
        run: make net-ebpf-verify

      - name: Regenerate
        run: make generate

      - name: Check for drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make generate' and commit the results."
            exit 1
          fi

  # ---------- Verify BPF binary reproducibility ----------
  #
  # Recompiles bpf/unbounded_encap.c via bpf2go using the pinned clang
  # version (bpf/clang-version) and diffs the result against the
  # committed internal/net/ebpf/unboundedencap_bpfel.{go,o}. Catches any
  # PR that edits the BPF source (or its CO-RE inputs in bpf/vmlinux.h)
  # without re-running `make generate` and committing the updated
  # bindings.
  #
  # Reproducibility relies on every build path using the same clang
  # binary: contributors invoke clang-18 via `make generate`, this CI
  # job installs the same package. Bump the pin by updating
  # bpf/clang-version and the references it documents.
  verify-bpf-binary:
    name: Verify BPF Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify pinned clang version
        run: |
          pinned="$(grep -v '^#' bpf/clang-version | grep -v '^$' | head -n1)"
          if [ "$pinned" != "clang-18" ]; then
            echo "::error::bpf/clang-version pins '$pinned' but this CI job installs clang-18."
            echo "::error::Update the apt-get line in .github/workflows/ci.yaml (verify-bpf-binary job) to match."
            exit 1
          fi

      - name: Install pinned clang for bpf2go
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libbpf-dev

      - name: Recompile BPF bindings via bpf2go
        run: go generate ./internal/net/ebpf/...

      - name: Check for drift in bpf2go output
        run: |
          if ! git diff --exit-code -- internal/net/ebpf/ bpf/; then
            echo "::error::Committed BPF bindings are out of date."
            echo "::error::Run 'make generate' locally (with $(grep -v '^#' bpf/clang-version | grep -v '^$' | head -n1) installed) and commit the updated"
            echo "::error::internal/net/ebpf/unboundedencap_bpfel.{go,o}."
            exit 1
          fi

  # ---------- Verify NOTICE ----------
  notice-check:
    name: NOTICE Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefer-offline --no-audit
        working-directory: frontend

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify NOTICE
        run: make notice-check

  # ---------- Build Container Images ----------
  build-images:
    name: Build Images (${{ matrix.arch }})
    needs: [frontend]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Normalize container registry
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Cache CNI plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources
          key: cni-plugins-${{ matrix.arch }}-${{ env.CNI_PLUGINS_VERSION }}

      - name: Download CNI plugins
        run: |
          mkdir -p resources
          file="resources/cni-plugins-linux-${{ matrix.arch }}-${CNI_PLUGINS_VERSION}.tgz"
          if [ ! -s "$file" ]; then
            curl -fsSL "https://github.com/containernetworking/plugins/releases/download/${CNI_PLUGINS_VERSION}/cni-plugins-linux-${{ matrix.arch }}-${CNI_PLUGINS_VERSION}.tgz" -o "$file"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Compute Go version for Docker
        id: goversion
        run: echo "go_version=$(awk '/^go /{split($2,v,"."); print v[1]"."v[2]}' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Build controller image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/net/Containerfile
          target: controller
          platforms: ${{ matrix.platform }}
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/unbounded-net-controller:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/net-controller.oci.tar,oci-mediatypes=true
          provenance: false

      - name: Build node image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/net/Containerfile
          target: node
          platforms: ${{ matrix.platform }}
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/unbounded-net-node:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/net-node.oci.tar,oci-mediatypes=true
          provenance: false

      - name: Verify OCI image layouts
        run: |
          set -euo pipefail

          validate_layout() {
            local name="$1"
            local archive="${RUNNER_TEMP}/net-${name}.oci.tar"
            local index
            index="$(tar -xOf "$archive" index.json)"

            jq -e '
              .schemaVersion == 2 and
              .mediaType == "application/vnd.oci.image.index.v1+json" and
              (.manifests | length > 0) and
              all(.manifests[]; .mediaType == "application/vnd.oci.image.manifest.v1+json")
            ' <<<"$index"

            while IFS= read -r digest; do
              local algorithm="${digest%%:*}"
              local encoded="${digest#*:}"
              local manifest="blobs/$algorithm/$encoded"
              tar -xOf "$archive" "$manifest" | jq -e '
                .mediaType == "application/vnd.oci.image.manifest.v1+json" and
                .config.mediaType == "application/vnd.oci.image.config.v1+json" and
                all(.layers[];
                  .mediaType | test("^application/vnd\\.oci\\.image\\.layer\\.v1\\.tar(\\+(gzip|zstd))?$"))
              '
            done < <(jq -r '.manifests[].digest' <<<"$index")
          }

          validate_layout controller
          validate_layout node

  # ---------- Publish Orca image (main only) ----------
  # Publishes a dev Orca image to ghcr on every merge to main so the
  # long-lived AKS integration cluster has something to pull. Gated on
  # the core quality jobs so a broken main is never published. Release
  # builds (signed + SBOM) are handled separately by release.yaml.
  # Tags: `:main` (moving) and `:main-<sha>` (immutable, for pinning).
  publish-orca:
    name: Publish Orca Image (main)
    needs: [lint, test, orca-inttest, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalize container registry
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/orca/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=main-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/orca:main
            ${{ env.REGISTRY }}/orca:main-${{ github.sha }}
          cache-from: type=gha,scope=orca
          cache-to: type=gha,mode=max,scope=orca
