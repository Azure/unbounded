name: CI

on:
  push:
    branches:
      # Main is validated before merge by pull_request and merge_group.
      # Keep push validation for supported release branches.
      - release-*
  pull_request:
    branches:
      - main
      - release-*
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR to avoid wasted runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  CNI_PLUGINS_VERSION: v1.9.1

jobs:
  # ---------- Change scope ----------
  # Racer changes skip the jobs that cannot observe them. A change limited to
  # Racer, its docs and NOTICE skips the frontend, BPF, orca and net image
  # builds. A change limited to the Rust dataplane also skips the Go jobs,
  # since no Go package builds it; racer.yaml tests it instead.
  #
  # Skipped jobs pass required checks, so the gated jobs run unless an output
  # is exactly 'false' and use !cancelled() to run even if this job fails. An
  # unclassified change therefore runs everything rather than nothing.
  changes:
    name: Change Scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      go: ${{ steps.scope.outputs.go }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Classify changed files
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          TEMP_FILES: 'internal/racer/server/handlers.go\ncmd/racer-dataplane/src/main.rs\nNOTICE'
        run: |
          set -euo pipefail

          case "$EVENT" in
            pull_request)
              # The checked-out merge commit's first parent is the target branch.
              base=HEAD^1
              ;;
            merge_group)
              base="$MERGE_GROUP_BASE"
              git fetch --no-tags --depth=1 origin "$base"
              ;;
            *)
              echo "full=true" >> "$GITHUB_OUTPUT"
              echo "go=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          files="$(git diff --name-only --no-renames "$base" HEAD)"
          files="$(printf '%b' "$TEMP_FILES")"
          full=false
          go=false
          racer=false
          while IFS= read -r path; do
            case "$path" in
              docs/* | designs/* | NOTICE)
                ;;
              cmd/racer-dataplane/* | images/racer-dataplane/* | hack/scripts/runtime-miri.py)
                racer=true
                ;;
              api/racer/* | cmd/racer-*/* | internal/racer/* | internal/racerobject/* | \
                internal/operator/components/racer/* | pkg/racersdk/* | deploy/racer/* | \
                deploy/racer-*/* | images/racer-*/* | e2e/racer/* | .github/workflows/racer*.yaml)
                racer=true
                go=true
                ;;
              *)
                echo "Outside Racer: $path"
                full=true
                ;;
            esac
          done <<< "$files"

          if [ "$racer" = false ]; then
            full=true
          fi
          if [ "$full" = true ]; then
            go=true
          fi

          echo "full=$full go=$go"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  # ---------- Frontend ----------
  frontend:
    name: Build Frontend
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci --prefer-offline --no-audit && npm run build
        working-directory: frontend

      - name: Upload frontend dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ---------- Lint ----------
  lint:
    name: Lint
    needs: [changes, frontend]
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cache golangci-lint analysis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yaml') }}
          restore-keys: |
            golangci-${{ runner.os }}-

      - name: Install tools
        run: make install-tools

      - name: Lint
        run: make lint

  # ---------- Test ----------
  test:
    name: Test
    needs: [changes, frontend]
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify go.mod tidy
        run: |
          make gomod
          if [ -n "$(git diff --name-only go.mod go.sum)" ]; then
            echo "::error::go.mod or go.sum is not tidy. Run 'make gomod' and commit the changes."
            git diff go.mod go.sum
            exit 1
          fi

      - name: Test
        run: make test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
          if-no-files-found: ignore

  # ---------- Orca Integration Tests ----------
  # Spins up Garage and Azurite via testcontainers-go and runs the
  # orca in-process integration suite (internal/orca/inttest). Docker
  # is preinstalled on GitHub-hosted Ubuntu runners; no extra services:
  # block is required.
  orca-inttest:
    name: Orca Integration Tests
    needs: [changes, frontend]
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run orca-inttest
        run: make orca-inttest

  # ---------- Build ----------
  build:
    name: Build
    needs: [changes, frontend]
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend dist
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: make build

  # ---------- Vulnerability Check ----------
  govulncheck:
    name: Vulnerability Check
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vulnerability check
        run: make vulncheck

  # ---------- Verify Generated Files ----------
  verify-generated:
    name: Verify Generated Files
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install tools
        run: make install-tools

      - name: Install clang/llvm for bpf2go
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 llvm-18 libbpf-dev

      - name: Verify BPF CO-RE pin artifacts
        run: make net-ebpf-verify

      - name: Regenerate
        run: make generate

      - name: Check for drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make generate' and commit the results."
            exit 1
          fi

  # ---------- Verify BPF binary reproducibility ----------
  #
  # Recompiles bpf/unbounded_encap.c via bpf2go using the pinned clang
  # version (bpf/clang-version) and diffs the result against the
  # committed internal/net/ebpf/unboundedencap_bpfel.{go,o}. Catches any
  # PR that edits the BPF source (or its CO-RE inputs in bpf/vmlinux.h)
  # without re-running `make generate` and committing the updated
  # bindings.
  #
  # Reproducibility relies on every build path using the same clang
  # binary: contributors invoke clang-18 via `make generate`, this CI
  # job installs the same package. Bump the pin by updating
  # bpf/clang-version and the references it documents.
  verify-bpf-binary:
    name: Verify BPF Binary
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify pinned clang version
        run: |
          pinned="$(grep -v '^#' bpf/clang-version | grep -v '^$' | head -n1)"
          if [ "$pinned" != "clang-18" ]; then
            echo "::error::bpf/clang-version pins '$pinned' but this CI job installs clang-18."
            echo "::error::Update the apt-get line in .github/workflows/ci.yaml (verify-bpf-binary job) to match."
            exit 1
          fi

      - name: Install pinned clang for bpf2go
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libbpf-dev

      - name: Recompile BPF bindings via bpf2go
        run: go generate ./internal/net/ebpf/...

      - name: Check for drift in bpf2go output
        run: |
          if ! git diff --exit-code -- internal/net/ebpf/ bpf/; then
            echo "::error::Committed BPF bindings are out of date."
            echo "::error::Run 'make generate' locally (with $(grep -v '^#' bpf/clang-version | grep -v '^$' | head -n1) installed) and commit the updated"
            echo "::error::internal/net/ebpf/unboundedencap_bpfel.{go,o}."
            exit 1
          fi

  # ---------- Verify licenses ----------
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check repository license declarations
        run: make license-check

  # ---------- Verify NOTICE ----------
  notice-check:
    name: NOTICE Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefer-offline --no-audit
        working-directory: frontend

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Provision locked Cargo sources for NOTICE
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          cargo +1.96.0 fetch --locked --manifest-path cmd/racer-dataplane/Cargo.toml

      - name: Verify NOTICE
        run: make notice-check

  # ---------- Build Container Images ----------
  build-images:
    name: Build Images (${{ matrix.arch }})
    # This job always runs and gates its steps instead: a skipped matrix job
    # reports one unexpanded check name, which leaves the required per-arch
    # checks pending.
    needs: [changes, frontend]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    env:
      NET_IMAGES: ${{ needs.changes.outputs.full != 'false' }}
      RACER_IMAGES: ${{ needs.changes.outputs.go != 'false' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Normalize container registry
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Checkout
        if: env.RACER_IMAGES == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download frontend dist
        if: env.NET_IMAGES == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: internal/net/html/dist

      - name: Cache CNI plugins
        if: env.NET_IMAGES == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources
          key: cni-plugins-${{ matrix.arch }}-${{ env.CNI_PLUGINS_VERSION }}

      - name: Download CNI plugins
        if: env.NET_IMAGES == 'true'
        run: |
          mkdir -p resources
          file="resources/cni-plugins-linux-${{ matrix.arch }}-${CNI_PLUGINS_VERSION}.tgz"
          if [ ! -s "$file" ]; then
            curl -fsSL "https://github.com/containernetworking/plugins/releases/download/${CNI_PLUGINS_VERSION}/cni-plugins-linux-${{ matrix.arch }}-${CNI_PLUGINS_VERSION}.tgz" -o "$file"
          fi

      - name: Set up Docker Buildx
        if: env.RACER_IMAGES == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Compute Go version for Docker
        if: env.NET_IMAGES == 'true'
        id: goversion
        run: echo "go_version=$(awk '/^go /{split($2,v,"."); print v[1]"."v[2]}' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Build controller image
        if: env.NET_IMAGES == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: images/net/Containerfile
          target: controller
          platforms: ${{ matrix.platform }}
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/unbounded-net-controller:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/net-controller.oci.tar,oci-mediatypes=true
          provenance: false

      - name: Build node image
        if: env.NET_IMAGES == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: images/net/Containerfile
          target: node
          platforms: ${{ matrix.platform }}
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/unbounded-net-node:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/net-node.oci.tar,oci-mediatypes=true
          provenance: false

      - name: Build racer-loadgen image
        if: env.RACER_IMAGES == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        timeout-minutes: 5
        with:
          context: .
          file: images/racer-loadgen/Containerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: racer-loadgen:ci
          cache-from: type=gha,scope=racer-loadgen-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=racer-loadgen-${{ matrix.arch }}
          provenance: false

      - name: Smoke-test racer-loadgen entrypoint
        if: env.RACER_IMAGES == 'true'
        run: docker run --rm --network=none racer-loadgen:ci --help

      - name: Build racer-object image
        if: env.RACER_IMAGES == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        timeout-minutes: 5
        with:
          context: .
          file: images/racer-object/Containerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: racer-object:ci
          cache-from: type=gha,scope=racer-object-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=racer-object-${{ matrix.arch }}
          provenance: false

      - name: Smoke-test racer-object entrypoint
        if: env.RACER_IMAGES == 'true'
        run: docker run --rm --network=none racer-object:ci --help

      - name: Verify OCI image layouts
        if: env.NET_IMAGES == 'true'
        run: |
          set -euo pipefail

          validate_layout() {
            local name="$1"
            local archive="${RUNNER_TEMP}/net-${name}.oci.tar"
            local index
            index="$(tar -xOf "$archive" index.json)"

            jq -e '
              .schemaVersion == 2 and
              .mediaType == "application/vnd.oci.image.index.v1+json" and
              (.manifests | length > 0) and
              all(.manifests[]; .mediaType == "application/vnd.oci.image.manifest.v1+json")
            ' <<<"$index"

            while IFS= read -r digest; do
              local algorithm="${digest%%:*}"
              local encoded="${digest#*:}"
              local manifest="blobs/$algorithm/$encoded"
              tar -xOf "$archive" "$manifest" | jq -e '
                .mediaType == "application/vnd.oci.image.manifest.v1+json" and
                .config.mediaType == "application/vnd.oci.image.config.v1+json" and
                all(.layers[];
                  .mediaType | test("^application/vnd\\.oci\\.image\\.layer\\.v1\\.tar(\\+(gzip|zstd))?$"))
              '
            done < <(jq -r '.manifests[].digest' <<<"$index")
          }

          validate_layout controller
          validate_layout node
