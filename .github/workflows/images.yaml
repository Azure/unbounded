name: unbounded container images

on:
  push:
    tags:
      - "images/*/*"

  workflow_dispatch:
    inputs:
      image:
        description: "Image to build (directory name under images/, e.g. \"agent-ubuntu2404\")"
        required: true
        type: string
      azhpc-vhd-url-amd64:
        description: "Azure HPC VHD URL for linux/amd64 host-azhpc images"
        required: false
        type: string
      azhpc-vhd-url-arm64:
        description: "Azure HPC VHD URL for linux/arm64 host-azhpc images"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  CONTAINER_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the image name and tag from the trigger context.
  #
  #   Tag push  (images/<name>/<version>)  →  <name>:<version>
  #   workflow_dispatch                     →  <name>:<sha>
  # ---------------------------------------------------------------------------
  resolve:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.resolve.outputs.name }}
      tag: ${{ steps.resolve.outputs.tag }}
      file: ${{ steps.resolve.outputs.file }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve image name and tag
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag is like "images/agent-ubuntu2404/v1.0.0"
            ref="${{ github.ref_name }}"            # e.g. images/agent-ubuntu2404/v1.0.0
            name=$(echo "$ref" | cut -d/ -f2)       # e.g. agent-ubuntu2404
            tag=$(echo "$ref" | cut -d/ -f3-)       # e.g. v1.0.0
          else
            # workflow_dispatch
            name="${{ inputs.image }}"
            tag="${{ github.sha }}"
          fi

          file="images/${name}/Containerfile"

          if [[ ! -f "$file" ]]; then
            echo "::error::No Containerfile found at ${file}"
            exit 1
          fi

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "file=${file}" >> "$GITHUB_OUTPUT"

          echo "Image: ${name}:${tag}"
          echo "Containerfile: ${file}"

  # ---------------------------------------------------------------------------
  # Build and push multi-arch container image.
  # ---------------------------------------------------------------------------
  build:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Normalize container registry
        run: echo "CONTAINER_REGISTRY=${CONTAINER_REGISTRY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ needs.resolve.outputs.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.CONTAINER_REGISTRY }}/${{ needs.resolve.outputs.name }}:${{ needs.resolve.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            AZHPC_VHD_URL_AMD64=${{ inputs['azhpc-vhd-url-amd64'] || (needs.resolve.outputs.name == 'host-azhpc-ubuntu2404' && vars.AZHPC_UBUNTU2404_VHD_URL_AMD64) || (needs.resolve.outputs.name == 'host-azhpc-azlinux3' && vars.AZHPC_AZLINUX3_VHD_URL_AMD64) || '' }}
            AZHPC_VHD_URL_ARM64=${{ inputs['azhpc-vhd-url-arm64'] || (needs.resolve.outputs.name == 'host-azhpc-ubuntu2404' && vars.AZHPC_UBUNTU2404_VHD_URL_ARM64) || (needs.resolve.outputs.name == 'host-azhpc-azlinux3' && vars.AZHPC_AZLINUX3_VHD_URL_ARM64) || '' }}
