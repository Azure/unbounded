name: unbounded container images

on:
  push:
    tags:
      - "images/*/*"

  workflow_dispatch:
    inputs:
      image:
        description: "Image to build (directory name under images/, e.g. \"agent-ubuntu2404\")"
        required: true
        type: string
      platforms:
        description: "Platforms to build, e.g. linux/amd64 or linux/amd64,linux/arm64"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  CONTAINER_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the image name and tag from the trigger context.
  #
  #   Tag push  (images/<name>/<version>)  →  <name>:<version>
  #   workflow_dispatch                     →  <name>:<sha>
  # ---------------------------------------------------------------------------
  resolve:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.resolve.outputs.name }}
      tag: ${{ steps.resolve.outputs.tag }}
      file: ${{ steps.resolve.outputs.file }}
      platforms: ${{ steps.resolve.outputs.platforms }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image name and tag
        id: resolve
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms || '' }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag is like "images/agent-ubuntu2404/v1.0.0"
            ref="${{ github.ref_name }}"            # e.g. images/agent-ubuntu2404/v1.0.0
            name=$(echo "$ref" | cut -d/ -f2)       # e.g. agent-ubuntu2404
            tag=$(echo "$ref" | cut -d/ -f3-)       # e.g. v1.0.0
          else
            # workflow_dispatch
            name="${{ inputs.image }}"
            tag="${{ github.sha }}"
          fi

          file="images/${name}/Containerfile"

          if [[ ( "$name" == playpen || "$name" == playpen-* ) && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "::notice::Skipping ${name}; playpen images are manual-only. Dispatch this workflow with image=${name}."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! -f "$file" ]]; then
            echo "::error::No Containerfile found at ${file}"
            exit 1
          fi

          if [[ "$name" == host-ubuntu2404-gb200* ]]; then
            if [[ -n "$INPUT_PLATFORMS" && "$INPUT_PLATFORMS" != linux/arm64 ]]; then
              echo "::error::host-ubuntu2404-gb200 requires linux/arm64"
              exit 1
            fi
            platforms="linux/arm64"
          elif [[ -n "$INPUT_PLATFORMS" ]]; then
            platforms="$INPUT_PLATFORMS"
          else
            platforms="linux/amd64,linux/arm64"
          fi

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "file=${file}" >> "$GITHUB_OUTPUT"
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

          echo "Image: ${name}:${tag}"
          echo "Containerfile: ${file}"
          echo "Platforms: ${platforms}"

  # ---------------------------------------------------------------------------
  # Build and push multi-arch container image.
  # ---------------------------------------------------------------------------
  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ${{ startsWith(needs.resolve.outputs.name, 'host-ubuntu2404-gb200') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Normalize container registry
        run: echo "CONTAINER_REGISTRY=${CONTAINER_REGISTRY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check GB200 Ubuntu producer contracts
        if: startsWith(needs.resolve.outputs.name, 'host-ubuntu2404-gb200')
        run: |
          test "$(uname -m)" = aarch64
          python3 -m unittest discover -s images/host-ubuntu2404-gb200/assets -p test_verify.py

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: ${{ !startsWith(needs.resolve.outputs.name, 'host-ubuntu2404-gb200') }}
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push netboot dependency
        if: needs.resolve.outputs.name == 'metalman'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/netboot/Containerfile
          platforms: ${{ needs.resolve.outputs.platforms }}
          push: true
          tags: ${{ env.CONTAINER_REGISTRY }}/netboot:${{ needs.resolve.outputs.tag }}
          cache-from: type=gha,scope=netboot
          cache-to: type=gha,scope=netboot,mode=max

      - name: Build and push Azure Linux netboot dependency
        if: needs.resolve.outputs.name == 'metalman'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/netboot/Containerfile
          platforms: ${{ needs.resolve.outputs.platforms }}
          push: true
          build-args: |
            INSTALLER_KERNEL=azurelinux
          tags: ${{ env.CONTAINER_REGISTRY }}/netboot-azurelinux:${{ needs.resolve.outputs.tag }}
          cache-from: type=gha,scope=netboot-azurelinux
          cache-to: type=gha,scope=netboot-azurelinux,mode=max

      - name: Build and push
        if: ${{ !startsWith(needs.resolve.outputs.name, 'host-ubuntu2404-gb200') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ needs.resolve.outputs.file }}
          platforms: ${{ needs.resolve.outputs.platforms }}
          push: true
          tags: ${{ env.CONTAINER_REGISTRY }}/${{ needs.resolve.outputs.name }}:${{ needs.resolve.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.resolve.outputs.tag }}
            CONTAINER_REGISTRY=${{ env.CONTAINER_REGISTRY }}

      - name: Build GB200 Ubuntu candidate without publishing
        if: startsWith(needs.resolve.outputs.name, 'host-ubuntu2404-gb200')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ needs.resolve.outputs.file }}
          platforms: linux/arm64
          load: true
          tags: ${{ env.CONTAINER_REGISTRY }}/${{ needs.resolve.outputs.name }}:${{ needs.resolve.outputs.tag }}
          cache-from: type=gha,scope=${{ needs.resolve.outputs.name }}
          cache-to: type=gha,scope=${{ needs.resolve.outputs.name }},mode=max
          build-args: SOURCE_COMMIT=${{ github.sha }}

      - name: Qualify GB200 Ubuntu disk boot
        if: startsWith(needs.resolve.outputs.name, 'host-ubuntu2404-gb200')
        env:
          IMAGE: ${{ env.CONTAINER_REGISTRY }}/${{ needs.resolve.outputs.name }}:${{ needs.resolve.outputs.tag }}
        run: |
          test "$(uname -m)" = aarch64
          if ! command -v qemu-system-aarch64 || ! test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64
          fi
          if ! command -v mcopy || ! command -v mkfs.vfat; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends mtools dosfstools
          fi
          mkdir -p gb200-evidence
          docker create --name gb200-image "$IMAGE" /unused
          docker cp gb200-image:/disk gb200-evidence/disk
          docker rm gb200-image
          bash images/host-ubuntu2404-gb200/verify-boot.sh gb200-evidence/disk

      - name: Retain GB200 Ubuntu qualification evidence
        if: always() && startsWith(needs.resolve.outputs.name, 'host-ubuntu2404-gb200')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.resolve.outputs.name }}-qualification
          if-no-files-found: warn
          path: |
            gb200-evidence/disk/image-inputs.json
            gb200-evidence/disk/disk.img.gz.sha256
            gb200-evidence/disk/boot.log

      - name: Publish qualified GB200 Ubuntu candidate
        if: success() && startsWith(needs.resolve.outputs.name, 'host-ubuntu2404-gb200')
        env:
          IMAGE: ${{ env.CONTAINER_REGISTRY }}/${{ needs.resolve.outputs.name }}:${{ needs.resolve.outputs.tag }}
        run: docker push "$IMAGE"
