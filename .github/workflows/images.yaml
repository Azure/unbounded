name: unbounded container images

on:
  push:
    tags:
      - "images/*/*"

  workflow_dispatch:
    inputs:
      image:
        description: "Image to build (directory name under images/, e.g. \"agent-ubuntu2404\")"
        required: true
        type: string
      azhpc-vhd-url-amd64:
        description: "Azure HPC VHD URL for linux/amd64 host-azhpc images"
        required: false
        type: string
      azhpc-vhd-url-arm64:
        description: "Azure HPC VHD URL for linux/arm64 host-azhpc images"
        required: false
        type: string
      platforms:
        description: "Platforms to build, e.g. linux/amd64 or linux/amd64,linux/arm64"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  CONTAINER_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the image name and tag from the trigger context.
  #
  #   Tag push  (images/<name>/<version>)  →  <name>:<version>
  #   workflow_dispatch                     →  <name>:<sha>
  # ---------------------------------------------------------------------------
  resolve:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.resolve.outputs.name }}
      tag: ${{ steps.resolve.outputs.tag }}
      file: ${{ steps.resolve.outputs.file }}
      platforms: ${{ steps.resolve.outputs.platforms }}
      azhpc_vhd_url_amd64: ${{ steps.resolve.outputs.azhpc_vhd_url_amd64 }}
      azhpc_vhd_url_arm64: ${{ steps.resolve.outputs.azhpc_vhd_url_arm64 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve image name and tag
        id: resolve
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms || '' }}
          INPUT_AZHPC_VHD_URL_AMD64: ${{ inputs['azhpc-vhd-url-amd64'] || '' }}
          INPUT_AZHPC_VHD_URL_ARM64: ${{ inputs['azhpc-vhd-url-arm64'] || '' }}
          AZHPC_UBUNTU2404_VHD_URL_AMD64: ${{ vars.AZHPC_UBUNTU2404_VHD_URL_AMD64 || '' }}
          AZHPC_UBUNTU2404_VHD_URL_ARM64: ${{ vars.AZHPC_UBUNTU2404_VHD_URL_ARM64 || '' }}
          AZHPC_AZLINUX3_VHD_URL_AMD64: ${{ vars.AZHPC_AZLINUX3_VHD_URL_AMD64 || '' }}
          AZHPC_AZLINUX3_VHD_URL_ARM64: ${{ vars.AZHPC_AZLINUX3_VHD_URL_ARM64 || '' }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag is like "images/agent-ubuntu2404/v1.0.0"
            ref="${{ github.ref_name }}"            # e.g. images/agent-ubuntu2404/v1.0.0
            name=$(echo "$ref" | cut -d/ -f2)       # e.g. agent-ubuntu2404
            tag=$(echo "$ref" | cut -d/ -f3-)       # e.g. v1.0.0
          else
            # workflow_dispatch
            name="${{ inputs.image }}"
            tag="${{ github.sha }}"
          fi

          file="images/${name}/Containerfile"

          if [[ ! -f "$file" ]]; then
            echo "::error::No Containerfile found at ${file}"
            exit 1
          fi

          azhpc_vhd_url_amd64=""
          azhpc_vhd_url_arm64=""
          case "$name" in
            host-azhpc-ubuntu2404)
              azhpc_vhd_url_amd64="${INPUT_AZHPC_VHD_URL_AMD64:-$AZHPC_UBUNTU2404_VHD_URL_AMD64}"
              azhpc_vhd_url_arm64="${INPUT_AZHPC_VHD_URL_ARM64:-$AZHPC_UBUNTU2404_VHD_URL_ARM64}"
              ;;
            host-azhpc-azlinux3)
              azhpc_vhd_url_amd64="${INPUT_AZHPC_VHD_URL_AMD64:-$AZHPC_AZLINUX3_VHD_URL_AMD64}"
              azhpc_vhd_url_arm64="${INPUT_AZHPC_VHD_URL_ARM64:-$AZHPC_AZLINUX3_VHD_URL_ARM64}"
              ;;
          esac

          if [[ -n "$INPUT_PLATFORMS" ]]; then
            platforms="$INPUT_PLATFORMS"
          elif [[ "$name" == host-azhpc-* ]]; then
            platforms=()
            if [[ -n "$azhpc_vhd_url_amd64" ]]; then platforms+=("linux/amd64"); fi
            if [[ -n "$azhpc_vhd_url_arm64" ]]; then platforms+=("linux/arm64"); fi

            if [[ ${#platforms[@]} -eq 0 ]]; then
              echo "::error::No AZHPC VHD URLs configured for ${name}"
              exit 1
            fi

            platforms=$(IFS=,; echo "${platforms[*]}")
          else
            platforms="linux/amd64,linux/arm64"
          fi

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "file=${file}" >> "$GITHUB_OUTPUT"
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"
          echo "azhpc_vhd_url_amd64=${azhpc_vhd_url_amd64}" >> "$GITHUB_OUTPUT"
          echo "azhpc_vhd_url_arm64=${azhpc_vhd_url_arm64}" >> "$GITHUB_OUTPUT"

          echo "Image: ${name}:${tag}"
          echo "Containerfile: ${file}"
          echo "Platforms: ${platforms}"

  # ---------------------------------------------------------------------------
  # Build and push multi-arch container image.
  # ---------------------------------------------------------------------------
  build:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Normalize container registry
        run: echo "CONTAINER_REGISTRY=${CONTAINER_REGISTRY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ needs.resolve.outputs.file }}
          platforms: ${{ needs.resolve.outputs.platforms }}
          push: true
          tags: ${{ env.CONTAINER_REGISTRY }}/${{ needs.resolve.outputs.name }}:${{ needs.resolve.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.resolve.outputs.tag }}
            CONTAINER_REGISTRY=${{ env.CONTAINER_REGISTRY }}
            AZHPC_VHD_URL_AMD64=${{ needs.resolve.outputs.azhpc_vhd_url_amd64 }}
            AZHPC_VHD_URL_ARM64=${{ needs.resolve.outputs.azhpc_vhd_url_arm64 }}
