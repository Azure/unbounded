name: unbounded-operator reaper e2e

on:
  pull_request:
    paths:
      - internal/operator/**
      - internal/net/controller/**
      - cmd/unbounded-operator/**
      - deploy/unbounded-operator/**
      - deploy/machina/crd/**
      - deploy/net/crd/**
      - e2e/operator/**
      - go.mod
      - go.sum
      - .github/workflows/operator-e2e-kind.yaml
  push:
    # release-* included so a cherry-pick onto a release branch gets the same
    # post-merge validation as main. The pull_request trigger above is
    # path-filtered with no branch filter, so it already covers release branches.
    branches: [main, release-*]
    paths:
      - internal/operator/**
      - internal/net/controller/**
      - cmd/unbounded-operator/**
      - deploy/unbounded-operator/**
      - deploy/machina/crd/**
      - deploy/net/crd/**
      - e2e/operator/**
      - go.mod
      - go.sum
      - .github/workflows/operator-e2e-kind.yaml
  workflow_dispatch:

concurrency:
  group: operator-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to match the kind release validated locally. Bump alongside the
  # kindest/node image kind selects by default for this version.
  KIND_VERSION: v0.29.0

jobs:
  operator-reaper-e2e:
    name: operator reaper e2e (kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-go's built-in cache shares one key across every workflow and
      # saves from pull requests too. Use a build cache scoped to this suite
      # instead, saved only from push runs.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Only GOCACHE is cached. Modules download quickly from the proxy, and
      # leaving them out keeps the entry small.
      - name: Restore Go build cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-e2e-operator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-e2e-operator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-

      - name: Install kind
        run: |
          set -euo pipefail
          curl -fsSL -o ./kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 ./kind /usr/local/bin/kind
          rm -f ./kind
          kind version

      # Fail fast if the runner is missing tooling, so the suite (which would
      # otherwise t.Skip on absent binaries) cannot silently pass without
      # exercising the reaper.
      - name: Verify e2e prerequisites
        run: |
          set -euo pipefail
          for bin in kind kubectl docker; do
            command -v "$bin" >/dev/null 2>&1 || { echo "missing required binary: $bin" >&2; exit 1; }
          done
          docker info >/dev/null

      - name: Run operator reaper e2e
        run: go test -tags=e2e -count=1 -timeout=900s -v ./e2e/operator/...

      - name: Save Go build cache
        if: github.event_name == 'push' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
