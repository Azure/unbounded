name: unbounded-storage

on:
  pull_request:
    paths:
      - cmd/unbounded-storage/**
      - Makefile
      - .github/workflows/unbounded-storage.yaml
  push:
    branches: [main]
    paths:
      - cmd/unbounded-storage/**
      - Makefile
      - .github/workflows/unbounded-storage.yaml
  workflow_dispatch:

concurrency:
  group: unbounded-storage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfabric-dev

      - name: Set up Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cmd/unbounded-storage/target
          # Key on lockfile + manifest plus the native build inputs, since
          # changes to either invalidate compiled artifacts under target/.
          key: cargo-unbounded-storage-${{ runner.os }}-fabric-${{ hashFiles('cmd/unbounded-storage/Cargo.lock', 'cmd/unbounded-storage/Cargo.toml', 'cmd/unbounded-storage/build.rs', 'cmd/unbounded-storage/src/fabric/shim.c') }}
          restore-keys: |
            cargo-unbounded-storage-${{ runner.os }}-fabric-
            cargo-unbounded-storage-${{ runner.os }}-

      - name: Test
        env:
          # Override the in-source `cases: 256` proptest default for CI
          # so we get meaningful DST coverage on every run. Each case is
          # cheap (sub-millisecond on a debug build), so a few thousand
          # cases per property keeps the job well under a minute while
          # exercising orders of magnitude more (seed, workload) pairs
          # than the local default. Bump via workflow_dispatch or set
          # `PROPTEST_CASES` locally for soak runs.
          PROPTEST_CASES: "4096"
        run: make unbounded-storage-test
