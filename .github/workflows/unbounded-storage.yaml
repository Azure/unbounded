name: unbounded-storage

on:
  pull_request:
    paths:
      - cmd/unbounded-storage/**
      - .github/workflows/unbounded-storage.yaml
  push:
    branches: [main]
    paths:
      - cmd/unbounded-storage/**
      - .github/workflows/unbounded-storage.yaml
  workflow_dispatch:

concurrency:
  group: unbounded-storage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/unbounded-storage
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cmd/unbounded-storage/target
          key: cargo-unbounded-storage-${{ runner.os }}-${{ hashFiles('cmd/unbounded-storage/Cargo.lock', 'cmd/unbounded-storage/Cargo.toml') }}
          restore-keys: |
            cargo-unbounded-storage-${{ runner.os }}-

      - name: Test
        env:
          # Override the in-source `cases: 256` proptest default for CI
          # so we get meaningful DST coverage on every run. Each case is
          # cheap (sub-millisecond on a debug build), so a few thousand
          # cases per property keeps the job well under a minute while
          # exercising orders of magnitude more (seed, workload) pairs
          # than the local default. Bump via workflow_dispatch or set
          # `PROPTEST_CASES` locally for soak runs.
          PROPTEST_CASES: "4096"
        run: cargo test --locked --all-targets
