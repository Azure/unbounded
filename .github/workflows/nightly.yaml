name: nightly

# ---------------------------------------------------------------------------
# Builds a snapshot of `main` from source every morning and deploys it to the
# integration cluster (unbounded-nightly) so the tip of the tree gets the same
# soak treatment releases get on unbounded-stable.
#
# The nightly sibling of release-upgrade.yaml, which deploys a published signed
# release to unbounded-stable. This one has no release and no tag: it builds
# main HEAD, pushes images tagged `nightly-<shortsha>`, and lets the operator
# reconcile them in, using the same deploy gate and smoke tests. Deliberately no
# cosign, SBOM or Trivy: the nightly cluster is a throwaway soak target, and the
# supply chain stays on the release path.
#
# Schedule
# --------
# 06:00 UTC daily, which is 01:00/02:00 ET depending on daylight saving (Actions
# cron is UTC-only). Early on purpose: a from-source build of everything plus a
# deploy and smoke pass has to finish before the US working day.
#
# Target cluster
# --------------
# The target cluster is configured via the `unbounded-nightly` GitHub
# Environment, which provides:
#   - secret KUBECONFIG                 (raw kubeconfig file contents)
#   - vars   SITE_NAME, CLUSTER_NODE_CIDR, CLUSTER_POD_CIDR,
#            SITE_NODE_CIDR, SITE_POD_CIDR, MANAGE_CNI_PLUGIN,
#            ORCA_AZURE_ACCOUNT, ORCA_AZURE_CONTAINER, ORCA_AZURE_ENDPOINT
#   - cluster Secret unbounded-system/orca-credentials for confidential Orca
#     values (Azure account key and Garage S3 credentials)
#
# First-time setup (run once, out of band):
#
#     hack/scripts/setup-nightly-cluster.sh \
#       --subscription <sub-id> [--location <loc>]
#
#   Creates the AKS cluster with forge (gateway pool already labeled), the Orca
#   origin and the orca-credentials Secret, configures this Environment, and
#   triggers the first force_init deploy. CIDRs are auto-detected. This workflow
#   must already be on the default branch for the trigger step to work.
#
# Customization points (search for "CUSTOMIZE:" in this file)
# ------------------------------------------------------------
#   - Add a smoke test       -> drop a script in hack/release/smoke/
#                               (shared with release-upgrade.yaml)
#   - Change the schedule    -> edit the cron below
#   - Change target cluster  -> change `environment:` on the relevant jobs
# ---------------------------------------------------------------------------

on:
  schedule:
    # 06:00 UTC daily. See the "Schedule" note in the header above.
    - cron: "0 6 * * *"

  # Manual trigger for re-deploys, first bootstrap, and testing a specific ref.
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to snapshot (default: the default branch)"
        required: false
        type: string
      force_init:
        description: "Run 'site init' instead of upgrade-apply (use for first-ever bootstrap)"
        type: boolean
        default: false
      max_notready_nodes:
        description: "Override how many NotReady nodes may be tolerated (blank = workflow default)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

# Only the freshest snapshot matters. If a new nightly starts while an old one
# is still running, cancel the old one.
concurrency:
  group: deploy-nightly
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  CNI_PLUGINS_VERSION: v1.9.1

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the commit to snapshot and derive the nightly image tag.
  #
  # The downstream build and deploy jobs all pin to `resolve.outputs.sha` so a
  # branch advance mid-run cannot split the snapshot across two commits.
  # ---------------------------------------------------------------------------
  resolve:
    if: github.repository == 'Azure/unbounded'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Snapshot the default-branch head (github.sha) on schedule/dispatch.
          # inputs.ref overrides for a manual snapshot of a specific ref.
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Resolve snapshot commit and tag
        id: resolve
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          TAG="nightly-${SHORT}"
          {
            echo "sha=${SHA}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Snapshot commit: ${SHA}"
          echo "Nightly tag:     ${TAG}"

  # ---------------------------------------------------------------------------
  # Build and push the net controller/node images for the snapshot (amd64).
  #
  # Mirrors release.yaml's net-images job minus the multi-arch matrix, Trivy
  # gating, cosign signing, and SBOM attestation. The frontend is built inline
  # (release.yaml shares it across a per-arch matrix via an artifact; we have a
  # single amd64 build, so inline is simpler) and staged into the embed dir.
  # ---------------------------------------------------------------------------
  net-images:
    needs: resolve
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Normalize container registry to lowercase
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend and stage into the net embed dir
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit
          npm run build
          # internal/net/html/pages.go embeds internal/net/html/dist via
          # go:embed; the Containerfile copies the whole context, so the Go
          # build picks up exactly this snapshot's UI.
          rm -rf ../internal/net/html/dist
          mkdir -p ../internal/net/html/dist
          cp -R dist/. ../internal/net/html/dist/
        working-directory: frontend

      - name: Cache CNI plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources
          key: cni-plugins-amd64-${{ env.CNI_PLUGINS_VERSION }}

      - name: Download CNI plugins
        run: |
          set -euo pipefail
          mkdir -p resources
          file="resources/cni-plugins-linux-amd64-${CNI_PLUGINS_VERSION}.tgz"
          if [ ! -s "$file" ]; then
            curl -fsSL \
              "https://github.com/containernetworking/plugins/releases/download/${CNI_PLUGINS_VERSION}/cni-plugins-linux-amd64-${CNI_PLUGINS_VERSION}.tgz" \
              -o "$file"
          fi

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Go version for Docker
        id: goversion
        run: echo "go_version=$(awk '/^go /{split($2,v,"."); print v[1]"."v[2]}' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Build and push controller image
        id: push_controller
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/net/Containerfile
          target: controller
          platforms: linux/amd64
          outputs: type=image,push=true,oci-mediatypes=true
          provenance: false
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            VERSION=${{ env.TAG }}
            GIT_COMMIT=${{ env.SHA }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
          tags: ${{ env.REGISTRY }}/unbounded-net-controller:${{ env.TAG }}
          cache-from: type=gha,scope=nightly-net-controller
          cache-to: type=gha,scope=nightly-net-controller,mode=max

      - name: Build and push node image
        id: push_node
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/net/Containerfile
          target: node
          platforms: linux/amd64
          outputs: type=image,push=true,oci-mediatypes=true
          provenance: false
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.go_version }}
            VERSION=${{ env.TAG }}
            GIT_COMMIT=${{ env.SHA }}
            CNI_PLUGINS_VERSION=${{ env.CNI_PLUGINS_VERSION }}
          tags: ${{ env.REGISTRY }}/unbounded-net-node:${{ env.TAG }}
          cache-from: type=gha,scope=nightly-net-node
          cache-to: type=gha,scope=nightly-net-node,mode=max

      - name: Verify OCI image media types
        env:
          CONTROLLER_DIGEST: ${{ steps.push_controller.outputs.digest }}
          NODE_DIGEST: ${{ steps.push_node.outputs.digest }}
        run: |
          set -euo pipefail
          for image in controller node; do
            if [[ "$image" == "controller" ]]; then
              digest="$CONTROLLER_DIGEST"
            else
              digest="$NODE_DIGEST"
            fi
            ref="${REGISTRY}/unbounded-net-${image}@${digest}"
            docker buildx imagetools inspect --raw "$ref" | jq -e '
              .mediaType == "application/vnd.oci.image.manifest.v1+json" and
              .config.mediaType == "application/vnd.oci.image.config.v1+json" and
              all(.layers[];
                .mediaType | test("^application/vnd\\.oci\\.image\\.layer\\.v1\\.tar(\\+(gzip|zstd))?$"))
            '
          done

  # ---------------------------------------------------------------------------
  # Build and push the remaining images the deploy needs (amd64).
  #
  # The operator resolves EVERY component image as
  # <registry>/<repository>:<its own compiled version>, so all of them have to
  # exist at the nightly tag or the workload stalls in ImagePullBackOff:
  #   - machina                       : machina-controller Deployment
  #   - token-refresher               : token-refresher Deployment
  #   - unbounded-operator            : bootstrapped by 'kubectl unbounded
  #                                     install'; its VERSION build-arg is what
  #                                     picks the tag for everything else
  #   - metalman                      : synthesized per-Site Deployment; bakes
  #                                     the netboot image from CONTAINER_REGISTRY
  #   - netboot                       : PXE artifact referenced by metalman
  #   - unbounded-storage-supervisor  : per-Site storage supervisor DaemonSet
  #   - gantry                        : cluster-wide gantry DaemonSet
  #   - orca                          : deployed separately by deploy-orca
  #
  # machine-ops-controller is omitted on purpose: the operator synthesizes
  # metalman per Site instead, so machine-ops is never rolled out here.
  #
  # Anything added to internal/operator/reconciler.go's component list needs an
  # entry here and in the deploy job's rollout wait.
  # ---------------------------------------------------------------------------
  component-images:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - name: machina
            file: images/machina/Containerfile
          - name: token-refresher
            file: images/token-refresher/Containerfile
          - name: netboot
            file: images/netboot/Containerfile
          - name: metalman
            file: images/metalman/Containerfile
          - name: unbounded-storage-supervisor
            file: images/unbounded-storage-supervisor/Containerfile
          - name: unbounded-operator
            file: images/unbounded-operator/Containerfile
          - name: gantry
            file: images/gantry/Containerfile
          - name: orca
            file: images/orca/Containerfile
          - name: inventory-aggregator
            file: images/inventory/aggregator/Containerfile
          - name: inventory-inspector
            file: images/inventory/inspector/Containerfile
          - name: inventory-viewer
            file: images/inventory/viewer/Containerfile
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Normalize container registry to lowercase
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute per-component build args
        # metalman bakes its default netboot image from CONTAINER_REGISTRY, so
        # it needs that arg (images/metalman/Containerfile declares it and feeds
        # it to make). REGISTRY is lowercased by the step above.
        #
        # Nothing else needs one. Which component images the operator deploys is
        # decided at reconcile time from its own compiled version, so VERSION,
        # passed to every build below, is what selects them.
        run: |
          set -euo pipefail
          {
            echo 'EXTRA_BUILD_ARGS<<EOF'
            case "${{ matrix.component.name }}" in
              metalman)
                echo "CONTAINER_REGISTRY=${REGISTRY}"
                ;;
            esac
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Build and push ${{ matrix.component.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.component.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ env.TAG }}
            GIT_COMMIT=${{ env.SHA }}
            ${{ env.EXTRA_BUILD_ARGS }}
          tags: ${{ env.REGISTRY }}/${{ matrix.component.name }}:${{ env.TAG }}
          cache-from: type=gha,scope=nightly-${{ matrix.component.name }}
          cache-to: type=gha,scope=nightly-${{ matrix.component.name }},mode=max

  # ---------------------------------------------------------------------------
  # Deploy the snapshot to unbounded-nightly.
  #
  # Operator-driven, matching release-upgrade.yaml: 'kubectl unbounded install'
  # bootstraps the CRDs and the operator, the operator reconciles the Site and
  # rolls out every component into unbounded-system, and the reaper migrates any
  # legacy split-namespace state. Component manifests are never applied here.
  #
  #   MODE=init     -> 'install' then 'site init', creating the Site. First
  #                    bootstrap only.
  #   MODE=upgrade  -> 'install' only; the operator reconciles the existing Site.
  #
  # The plugin is built from the snapshot checkout rather than downloaded and
  # cosign-verified, because a nightly has no release artifact. Building it
  # stamps the embedded operator manifests with this snapshot's tags.
  # ---------------------------------------------------------------------------
  deploy:
    needs: [resolve, net-images, component-images]
    if: github.repository == 'Azure/unbounded'
    runs-on: ubuntu-latest
    environment: unbounded-nightly
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SITE_NAME: ${{ vars.SITE_NAME }}
      CLUSTER_NODE_CIDR: ${{ vars.CLUSTER_NODE_CIDR }}
      CLUSTER_POD_CIDR: ${{ vars.CLUSTER_POD_CIDR }}
      SITE_NODE_CIDR: ${{ vars.SITE_NODE_CIDR }}
      SITE_POD_CIDR: ${{ vars.SITE_POD_CIDR }}
      MANAGE_CNI_PLUGIN: ${{ vars.MANAGE_CNI_PLUGIN }}
      # Same cap as the release gate: a node dropping out of unbounded-nightly
      # says no more about this snapshot than one dropping out of
      # unbounded-stable says about a release, and a stricter cap would only
      # mean a permanently red nightly the first time a site goes offline. `||`
      # is safe only because the input is typed `string`, where "0" is truthy.
      MAX_NOTREADY_NODES: ${{ inputs.max_notready_nodes || '2' }}
      # Stamped into the operator binary, so it is the tag the operator resolves
      # every component image at. wait-rollouts.sh will not excuse a shortfall
      # on a workload that does not carry it yet.
      EXPECTED_IMAGE_TAG: ${{ needs.resolve.outputs.tag }}
      # Where we publish. The gate needs it to tell the images this release
      # ships from the third-party ones pinned beside them, such as gantry's
      # busybox init, which never carries a release tag. Lowercased by the
      # script, since the owner is not.
      EXPECTED_IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Validate environment configuration
        run: |
          set -euo pipefail
          missing=()
          for v in SITE_NAME CLUSTER_NODE_CIDR CLUSTER_POD_CIDR SITE_NODE_CIDR SITE_POD_CIDR MANAGE_CNI_PLUGIN; do
            if [[ -z "${!v}" ]]; then
              missing+=("$v")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Environment variables: ${missing[*]}"
            echo "::error::Configure with hack/scripts/setup-deploy-environment.sh"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Write kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "${KUBECONFIG_CONTENT}" ]]; then
            echo "::error::Environment secret KUBECONFIG is empty"
            exit 1
          fi
          umask 077
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Verify cluster connectivity
        run: |
          set -euo pipefail
          kubectl version
          kubectl cluster-info

      - name: Determine deploy mode
        id: mode
        run: |
          set -euo pipefail
          MODE=upgrade
          if [[ "${{ inputs.force_init }}" == "true" ]]; then
            MODE=init
            echo "force_init=true; selecting init mode"
          elif kubectl get crd sites.net.unbounded-cloud.io >/dev/null 2>&1 && ! kubectl get crd sites.unbounded-cloud.io >/dev/null 2>&1; then
            # First upgrade from the pre-redesign (v0.1) split-namespace
            # layout: the old net-group Site CRD exists, and the new one is
            # absent because the operator creates it during the later
            # 'Bootstrap CRDs and operator' step. Upgrade mode is correct: the
            # operator's always-on LegacyReaper migrates the old Site and the
            # split layout into unbounded-system. 'site init' would create a
            # fresh Site instead of migrating the existing one.
            MODE=upgrade
            echo "Legacy Site CRD present and new Site CRD absent; first v0.1->v0.2 upgrade. Operator migrates automatically. Selecting upgrade mode"
          elif ! kubectl get crd sites.unbounded-cloud.io >/dev/null 2>&1; then
            MODE=init
            echo "Site CRD not present; selecting init mode"
          elif ! kubectl get site.unbounded-cloud.io "${SITE_NAME}" >/dev/null 2>&1; then
            MODE=init
            echo "Site '${SITE_NAME}' not present; selecting init mode"
          else
            echo "Site '${SITE_NAME}' exists; selecting upgrade mode"
          fi
          echo "MODE=${MODE}" >> "$GITHUB_ENV"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"

      - name: Build kubectl-unbounded plugin
        # Building the plugin re-renders the embedded operator manifests stamped
        # with this snapshot's nightly operator + metalman tags, so 'install'
        # bootstraps an operator that references the images built above. Needed
        # for both modes: upgrade also runs 'install'.
        run: |
          set -euo pipefail
          make kubectl-unbounded-build VERSION="${TAG}" CONTAINER_REGISTRY="${REGISTRY,,}"

      - name: Bootstrap CRDs and operator
        # Applies the operator manifests and waits for its rollout; the operator
        # establishes the CRDs at startup. Runs for both init and upgrade.
        run: |
          set -euo pipefail
          ./bin/kubectl-unbounded install --timeout=5m

      - name: Run site init (first install)
        if: env.MODE == 'init'
        run: |
          set -euo pipefail
          ./bin/kubectl-unbounded site init \
            --name "${SITE_NAME}" \
            --cluster-node-cidr "${CLUSTER_NODE_CIDR}" \
            --cluster-pod-cidr  "${CLUSTER_POD_CIDR}" \
            --node-cidr         "${SITE_NODE_CIDR}" \
            --pod-cidr          "${SITE_POD_CIDR}" \
            --manage-cni-plugin="${MANAGE_CNI_PLUGIN}"

      - name: Fetch deploy tooling from the workflow's own commit
        # The job's primary checkout is pinned to the resolved SNAPSHOT commit,
        # which on a workflow_dispatch can be any ref the caller names. The
        # rollout gate is tooling rather than part of the snapshot under test,
        # and a ref that predates it would fail with "No such file or directory"
        # before the cluster is ever contacted.
        #
        # github.workflow_sha is the commit of the workflow FILE now executing,
        # so the gate is always the exact sibling of the workflow that calls it,
        # and release-upgrade.yaml resolves it the same way. On the scheduled
        # run this is the default-branch head, i.e. identical to the snapshot,
        # so the normal path is unchanged. See "check out its own source code"
        # in the Actions contexts reference.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: _deploy-tools
          sparse-checkout: hack/release
          sparse-checkout-cone-mode: true

      - name: Wait for rollouts
        # Shared with release-upgrade.yaml so the two deploy gates cannot drift.
        # Component workloads are created asynchronously after the operator
        # reconciles the Site, so the script waits for each to exist before
        # checking its rollout status, and fails fast naming the image when a pod
        # cannot pull one.
        run: |
          _deploy-tools/hack/release/wait-rollouts.sh \
            deploy/unbounded-operator \
            deploy/unbounded-net-controller \
            ds/unbounded-net-node \
            deploy/machina-controller \
            deploy/token-refresher \
            ds/gantry

      - name: Diagnose failed rollout
        # Runs only when a prior step failed (e.g. the operator never created a
        # component workload). The operator is what materializes net/machina/etc.
        # in unbounded-system, so its logs and the Site status are the ground
        # truth. Every command is best-effort so diagnostics never mask the real
        # failure. Explicitly surfaces the applied component images because an
        # empty/invalid image is silently rejected by the API server, which
        # presents as a workload that "never gets created".
        if: failure()
        run: |
          set +e
          NS=unbounded-system
          echo "::group::Site CRDs"
          kubectl get crd sites.unbounded-cloud.io sites.net.unbounded-cloud.io 2>&1
          echo "::endgroup::"
          echo "::group::Sites (new + legacy)"
          kubectl get sites.unbounded-cloud.io -o wide 2>&1
          kubectl get sites.unbounded-cloud.io -o yaml 2>&1
          kubectl get sites.net.unbounded-cloud.io -A -o wide 2>&1
          echo "::endgroup::"
          echo "::group::Node readiness"
          # A DaemonSet counts every node toward desiredNumberScheduled, so a
          # single unreachable node stalls a rollout indefinitely. This is the
          # first thing to check when a rollout times out, and its absence is
          # why one such stall went unexplained for weeks.
          kubectl get nodes -o wide 2>&1
          echo "--- not Ready ---"
          kubectl get nodes \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.conditions[?(@.type=="Ready")].status}{"\t"}{.metadata.labels.unbounded-cloud\.io/site}{"\n"}{end}' 2>&1 \
            | awk -F'\t' '$2 != "True" { printf "%s (site=%s, Ready=%s)\n", $1, ($3 == "" ? "none" : $3), $2 }'
          echo "::endgroup::"
          echo "::group::Workloads in ${NS}"
          kubectl -n "$NS" get deploy,ds,pods -o wide 2>&1
          echo "::endgroup::"
          echo "::group::Applied component images"
          for kn in "deploy/unbounded-operator" "deploy/unbounded-net-controller" "ds/unbounded-net-node" "deploy/machina-controller" "deploy/token-refresher" "ds/gantry"; do
            img=$(kubectl -n "$NS" get "$kn" -o jsonpath='{.spec.template.spec.containers[*].image}' 2>/dev/null)
            printf '%s image=[%s]\n' "$kn" "$img"
          done
          echo "::endgroup::"
          echo "::group::Operator config"
          kubectl -n "$NS" get configmap unbounded-operator-config -o yaml 2>&1
          echo "::endgroup::"
          echo "::group::Operator logs"
          kubectl -n "$NS" logs deploy/unbounded-operator --all-containers --tail=300 2>&1
          echo "::endgroup::"
          echo "::group::Recent events in ${NS}"
          kubectl -n "$NS" get events --sort-by=.lastTimestamp 2>&1 | tail -60
          echo "::endgroup::"
          exit 0

      - name: Summarize deploy
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Nightly deploy"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Mode: \`${MODE:-unknown}\`"
            echo "- Environment: \`unbounded-nightly\`"
            echo "- Site: \`${SITE_NAME}\`"
            echo ""
            echo "### Workload images"
            echo ""
            echo '```'
            kubectl -n unbounded-system get deploy unbounded-operator       -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}' 2>/dev/null || true
            kubectl -n unbounded-system  get deploy unbounded-net-controller -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}' 2>/dev/null || true
            kubectl -n unbounded-system  get ds     unbounded-net-node       -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}' 2>/dev/null || true
            kubectl -n unbounded-system get deploy machina-controller       -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}' 2>/dev/null || true
            kubectl -n unbounded-system get deploy token-refresher          -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}' 2>/dev/null || true
            kubectl -n unbounded-system get ds     gantry                   -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}' 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Deploy Orca (origin cache) to unbounded-nightly. Reuses the shared,
  # deployment-neutral hack/orca/deploy-integration.sh (same script the stable
  # deploy uses); it targets whatever cluster KUBECONFIG points at.
  # ---------------------------------------------------------------------------
  deploy-orca:
    needs: [resolve, deploy]
    if: github.repository == 'Azure/unbounded'
    runs-on: ubuntu-latest
    environment: unbounded-nightly
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      ORCA_AZURE_ACCOUNT: ${{ vars.ORCA_AZURE_ACCOUNT }}
      ORCA_AZURE_CONTAINER: ${{ vars.ORCA_AZURE_CONTAINER }}
      ORCA_AZURE_ENDPOINT: ${{ vars.ORCA_AZURE_ENDPOINT }}
    steps:
      - name: Validate Orca environment configuration
        run: |
          set -euo pipefail
          missing=()
          for v in ORCA_AZURE_ACCOUNT ORCA_AZURE_CONTAINER; do
            if [[ -z "${!v}" ]]; then
              missing+=("$v")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Environment variables: ${missing[*]}"
            echo "::error::Configure with hack/scripts/setup-deploy-environment.sh"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Write kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "${KUBECONFIG_CONTENT}" ]]; then
            echo "::error::Environment secret KUBECONFIG is empty"
            exit 1
          fi
          umask 077
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Verify cluster connectivity
        run: |
          set -euo pipefail
          kubectl version
          kubectl cluster-info

      - name: Verify orca-credentials Secret exists
        run: |
          set -euo pipefail
          if ! kubectl -n unbounded-system get secret orca-credentials >/dev/null 2>&1; then
            echo "::error::Secret orca-credentials not found in unbounded-system; pre-create it with ORCA_AZUREBLOB_ACCOUNT_KEY, ORCA_CACHESTORE_S3_ACCESS_KEY, ORCA_CACHESTORE_S3_SECRET_KEY"
            exit 1
          fi

      - name: Deploy Orca
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY,,}/orca:${TAG}"
          echo "Deploying Orca image: ${IMAGE}"
          # Single replica: unbounded-nightly is a soak target, not HA, and
          # the default forge cluster (2-node system pool) cannot fit Orca's
          # default 3 replicas alongside Garage + net/machina.
          ./hack/orca/deploy-integration.sh \
            --image "${IMAGE}" \
            --replicas 1 \
            --azure-account "${ORCA_AZURE_ACCOUNT}" \
            --azure-container "${ORCA_AZURE_CONTAINER}" \
            --azure-endpoint "${ORCA_AZURE_ENDPOINT}"

      - name: Summarize Orca deploy
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Orca deploy"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Image: \`${REGISTRY,,}/orca:${TAG}\`"
            echo "- Environment: \`unbounded-nightly\`"
            echo ""
            echo '```'
            kubectl -n unbounded-system get deploy orca   -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}' 2>/dev/null || true
            kubectl -n unbounded-system get deploy garage -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}' 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Discover smoke tests (shared with release-upgrade.yaml: hack/release/smoke).
  # Runs from the snapshot checkout and emits a JSON matrix. Finding none fails:
  # a snapshot with no smoke tests is a repository regression, and it used to
  # produce a green nightly that had validated nothing.
  # ---------------------------------------------------------------------------
  smoke-discover:
    needs: [resolve, deploy]
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.list.outputs.tasks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Discover smoke tasks
        id: list
        run: |
          set -euo pipefail
          # `find` exits non-zero on a missing path, so the directory is checked
          # first to give the real reason rather than a find error.
          if [[ ! -d hack/release/smoke ]]; then
            echo "::error::hack/release/smoke does not exist at this snapshot; the nightly has no smoke tests"
            exit 1
          fi
          tasks=$(
            find hack/release/smoke -maxdepth 1 -type f -name '*.sh' \
              | sort \
              | jq -R -s -c 'split("\n") | map(select(length>0)) |
                  map({name: (. | sub(".*/"; "") | sub(".sh$"; "")), script: .})'
          )
          if [[ -z "$tasks" || "$tasks" == "[]" ]]; then
            echo "::error::no smoke tasks found in hack/release/smoke/; the nightly has no smoke tests"
            exit 1
          fi
          echo "tasks=${tasks}" >> "$GITHUB_OUTPUT"
          echo "Discovered smoke tasks:"
          echo "${tasks}" | jq .

  # ---------------------------------------------------------------------------
  # Smoke tests. Runs once per deploy, after core + Orca deploys complete. Each
  # task gets TAG, KUBECONFIG, and SITE_NAME exported. See the CUSTOMIZE block
  # in release-upgrade.yaml for the smoke-script contract (it is shared).
  # ---------------------------------------------------------------------------
  smoke-tests:
    needs: [resolve, deploy, deploy-orca, smoke-discover]
    runs-on: ubuntu-latest
    environment: unbounded-nightly
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.smoke-discover.outputs.tasks) }}
    name: smoke (${{ matrix.task.name }})
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SITE_NAME: ${{ vars.SITE_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Write kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "${KUBECONFIG_CONTENT}" ]]; then
            echo "::error::Environment secret KUBECONFIG is empty"
            exit 1
          fi
          umask 077
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Run smoke task ${{ matrix.task.name }}
        timeout-minutes: 15
        env:
          SMOKE_SCRIPT: ${{ matrix.task.script }}
        run: |
          set -euo pipefail
          chmod +x "$SMOKE_SCRIPT"
          "$SMOKE_SCRIPT"
