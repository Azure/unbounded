name: Set up agent e2e controllers
description: Install CRDs and deploy/validate in-cluster controllers for agent e2e tests.
runs:
  using: composite
  steps:
    # The setup sequence is defined once in the harness and shared with the
    # local runner. It used to be listed here and, separately, partially in
    # run-local.sh, which is how the two drifted: CI deployed the controllers
    # and the local runner did not, so validate-machine-cr-created asserted
    # different things in the two places.
    - name: Run controller setup suite
      shell: bash
      run: python3 ./hack/agent/e2e-kind/e2e.py --verbose run-suite --suite setup
