[package]
name = "racer-authority"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Racer control plane embedded in racer: Lease seats, primary, and control API"

[features]
# Deterministic simulation support (the `simulation` module and the fake
# Kubernetes API server). Enabled by racer-dst; never by the production binary.
sim = []

[dependencies]
racer-wire = { path = "../wire" }
racer-core = { path = "../core" }
racer-io = { path = "../io" }
regex = "1"
base64 = "0.22"
futures = "0.3"
getrandom = "0.2"
http1 = { path = "../http" }
libc = "0.2"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x509-parser = { version = "0.16", features = ["verify"] }
zeroize = "1"

[dev-dependencies]
racer-crypto = { path = "../crypto" }
