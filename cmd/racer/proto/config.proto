// The node configuration: the only input the control plane gives the dataplane.
//
// This file is the contract between the Go control plane and the Rust dataplane, and
// the source of both. Neither side hand-writes these types.
//
// Delivery. The control plane rename(2)s a complete new file into the watched
// directory; the node watches the directory, not the file. Every push is the whole
// configuration - no partial updates, no per-field patches.
//
// Applying. A new file is validated in full, then validated again against the config
// the node is already running. Either failure rejects the entire file: the node keeps
// running what it has, nothing is partially applied, and the only signal is the
// rejected-configs counter in the node's metrics. A control plane that pushes a config
// the node refuses gets no other feedback, so watch that counter.
//
// Zero is reserved. No node, zone, universe, extent or device id may be zero, so zero
// always reads as "none" and never as a name: `Extent.next_zone = 0` is "not migrating"
// and nothing else.
//
// The shape of the model. A *universe* is a flat, sparse address space in 4 KiB units
// that spans a set of nodes, and simultaneously the transport that reaches them, the
// security boundary around them, and the consensus domain they agree in. An *extent* is
// a contiguous run of that space with one page size, one kind, one home zone and one
// tombstone epoch: the unit of placement, sealing, migration and accounting. A *device*
// is a local block device this node exports, composed of whole extents in whatever
// order this node wants them. Two nodes may compose entirely different devices out of
// the same extents, and a node may hold extents it exports through no device at all.
//
// What a reload can and cannot change is structural here. Everything in `Node.store` is
// baked into the store's superblock at format time or read once at startup, so a change
// to it is accepted and does nothing until the process restarts. An existing extent's
// `base_lba`, `pages` and `kind` are frozen for its life, and an existing device's
// extent list is frozen for its life. Every other field is hot.

syntax = "proto3";

package racer.config;

message NodeConfig {
  // Strictly increasing per node: a value equal to or below the running one is
  // rejected, so bump it on every push. It is also echoed in the node's PING, so a peer
  // that redirected us on a stale topology can tell whether we have yet picked up the
  // file it expects us to have. The value itself is opaque; nothing compares
  // generations across nodes.
  uint64 generation = 1;

  Node node = 2;

  // The universes this node participates in. Each one costs a ublk device and an
  // exported namespace, and each device below costs another; the two together are
  // capped by the node's device budget (256).
  repeated Universe universes = 3;

  // The block devices this node exports. Adding and removing devices is free; an
  // existing device's extent list is frozen (see Device).
  repeated Device devices = 4;

  // Optional; absent means every default below.
  Policy policy = 5;
}

// ---- identity ---------------------------------------------------------------------

message Node {
  // NodeId, non-zero. This node's identity to its peers, and the value matched against
  // a catalog group to find our position in it. One identity across every universe: a
  // node is the same node wherever it is admitted.
  uint32 id = 1;

  // The fault domain, ~300 nodes. Each universe's `catalog` describes this zone and no
  // other, and must not also appear in that universe's `zones`.
  uint32 zone = 2;

  // The column of every catalog group that is our cooperative-cache roster: cohort `c`
  // takes column `c` of the whole catalog, which is why member order in a group is
  // normative. One column across every universe, because it is a property of this node
  // and not of any one address space. Required: a config that names no cohort is
  // refused, so a control plane that forgets the field cannot silently ship cohort 0.
  optional Cohort cohort = 3;

  // The local backing store this node owns outright, and what is carved out of it. One
  // store behind every universe: partitioning is enforced above it, in what this node is
  // admitted to and what it will answer for, not by giving each universe its own file.
  Store store = 4;
}

enum Cohort {
  COHORT_0 = 0;
  COHORT_1 = 1;
  COHORT_2 = 2;
}

// The local backing store this node owns outright: one regular file, of exactly the
// length named here. Nothing in this message is on an IO path: every field is written
// into the superblock when the store is formatted, read once at startup, or checked when
// a config is validated, so a change is accepted and takes effect on the next restart.
//
// The path is deliberately absent. Where the file lives is a property of how the node
// was deployed, not of the cluster the control plane describes, so it comes from the
// `RACER_STORE` environment variable instead (default /var/lib/racer/store.img).
message Store {
  // The length the backing file is held at, in bytes. Non-zero and a multiple of 4096.
  // The file is created at this length on first start and extended to it on a later one,
  // so raising this value and restarting is how a node is given more capacity.
  //
  // It may never be lowered: a config that asks for less than the file already has is
  // rejected, and so is a start that finds a file longer than this. The store's contents
  // are addressed by absolute offset and there is nothing that could move them.
  //
  // Everything the node holds comes out of this: the superblocks, the metadata region,
  // and the data slabs sized from every universe's extents. A configuration that does
  // not fit is refused at startup, naming this field.
  //
  // Whatever is left over is the read cache. There is nothing to configure: every 4 MiB
  // the slabs did not claim is handed to the cache, which gives it back if a later
  // config grows the slabs into it. Raising this field is therefore how a node is given
  // more cache as well as more capacity, and `policy.cache_index_bytes` is what bounds
  // the DRAM that cache costs.
  uint64 size_bytes = 1;

  // The rate this node will drive its own storage at. Storage that meters a client and
  // then delays or fails whatever exceeds the meter is better served by staying under
  // it: pacing our own submissions costs a bounded wait, overshooting costs an
  // unbounded one applied to whichever IO happens to be in flight. Set these below what
  // the device under the file will actually take, not at it.
  //
  // Both are enforced at once and either can bind first - small writes exhaust
  // operations while the byte budget idles, and a 4 MiB page does the reverse. A
  // transfer larger than 256 KiB is charged as several operations, matching how such
  // devices are usually metered. Zero leaves that resource unmetered; zero on both is a
  // free path with nothing to account.
  //
  // When the budget is committed far enough ahead, work that can be dropped is dropped:
  // cache admission and anti-entropy stand down so that guest IO and consensus keep the
  // whole of what is left.
  uint64 max_iops          = 2;
  uint64 max_bytes_per_sec = 3;
}

// ---- universes ---------------------------------------------------------------------

// A universe: one flat address space, one transport, one security boundary, one
// consensus domain.
//
// The dataplane exports one ublk device per universe and the control plane publishes it
// as a namespace to that universe's members and to nobody else. A frame's universe is
// therefore not a field on the wire - it is which namespace the frame arrived on - and
// partitioning is enforced by the transport rather than by a check the dataplane could
// get wrong. A node not admitted to a universe cannot address it at all.
//
// Universes share this node's store, its cores and its cache; they share nothing else.
// Each carries its own topology epoch, its own catalog, its own peer zones and its own
// links, and no address, group, seal or migration ever crosses from one to another.
message Universe {
  // Globally unique and never reused, non-zero, below 2^26. It is the high 26 bits of
  // every address in this universe: an address is `universe:26 | lba:38`, so a universe
  // spans 2^38 4 KiB blocks, or 1 PiB. Zero is reserved because a zero address means
  // "free" in the on-device index.
  uint32 id = 1;

  // Bumped by the control plane whenever this universe's topology changes. It rides in
  // the trailer of every routed write and is the term used when an extent is sealed,
  // which is persisted to the device. Treat it as monotonic: nothing enforces that, and
  // a decrease silently walks seal terms backwards. Per universe, so churn in one is
  // invisible to the rest.
  uint32 epoch = 2;

  // The consensus groups of this zone within this universe; an entry's index is its
  // group index. Each is three distinct, non-zero nodes. ~300 entries.
  //
  // An address is hashed to one of 16384 slots with a fixed function, and the slot
  // rather than the group is what travels on the wire; the group that owns it is
  // `slot % len(catalog)`. So the length is fixed for the life of the zone and a reload
  // that changes it is refused: the group a slot lands on also selects the core that
  // serves the address and the key anti-entropy accumulates digests under, and nothing
  // moves pages between groups. Ownership moves by changing a group's members instead,
  // which every one of those derivations survives.
  //
  // The nodes of a zone are homogeneous, so the catalog must be balanced: every node it
  // names appears in exactly `3 * len(catalog) / n` groups, where `n` is the number of
  // distinct nodes named, and `n` must divide `3 * len(catalog)`. A catalog that gives
  // one node more groups than another is refused. There is no other capacity model: a
  // node sizes its store from that equal share in each universe it joins, so every node
  // of a zone formats identically and any of them can be replaced by any other.
  //
  // Between consecutive generations the set of members may differ by at most one id:
  // the catalog replaces one node at a time. The newcomer inherits the departing node's
  // groups, replays them from its peers, and the departing node drops what it held once
  // the new members confirm they have it. A node that has missed generations is held to
  // no such step, since it is being handed a settled state rather than a transient.
  //
  // A node this catalog does not name is not a member of this zone in this universe. It
  // is either being decommissioned, and runs the config that drops it in order to drain,
  // or it only routes for others.
  repeated Trio catalog = 3;

  // The other zones of this universe, with their entry nodes. Exactly the set an
  // extent's `zone` and `next_zone` may name besides our own, which keeps this message
  // O(zones) rather than O(cluster). Must not list our own zone, and ids must be unique.
  repeated Zone zones = 4;

  // One NVMe link per entry, each to this universe's namespace on the named node. A peer
  // reached in two universes appears once in each, with a different device path, and the
  // two links are unrelated: a frame is answered in the universe it arrived on.
  //
  // Fully hot: a peer whose device path is unchanged keeps its open fd across a reload,
  // and a dropped peer is torn down only after the previous generation retires.
  //
  // A universe with no peers is its own quorum of one - deliberate isolation, not a
  // degraded mode. Do not ship an empty peer list for a universe meant to be replicated.
  repeated Peer peers = 5;

  // The extents of this universe that this node has been told about, sorted by
  // `base_lba` and non-overlapping. This is the control plane's map of the universe's
  // address space, and it is what makes an address meaningful: an address outside every
  // extent is unmapped and every operation on it is refused.
  //
  // A node is told about the extents it stores, the extents it exports, and the extents
  // it routes for. It need not be told about the rest of the universe.
  repeated Extent extents = 6;
}

// One end of a fabric link, within one universe. No address, port or NQN here on
// purpose: connecting is the control plane's job, and by the time the dataplane sees
// this the link is just a local file to open.
message Peer {
  // The remote node's id. Non-zero, not our own, and unique within this universe's peer
  // list. This is what turns a catalog group member into a link.
  uint32 id = 1;

  // Local path to this peer's namespace *for this universe*, already attached by the
  // control plane. Two universes reaching the same node name two different paths.
  string device = 2;
}

// Three node ids in cohort order. Position is normative in both of its uses: in a
// catalog group it is the paxos member index, with quorum 2 of 3, and in a zone it is
// that cohort's entry node. A permuted trio is a different trio.
message Trio {
  uint32 cohort_0 = 1;
  uint32 cohort_1 = 2;
  uint32 cohort_2 = 3;
}

// A peer zone of this universe. The sender picks an entry node by hashing the address,
// so cross-zone load spreads over all three cohorts and both ends agree without
// negotiating.
message Zone {
  uint32 id    = 1;
  Trio   entry = 2;
}

// ---- extents ----------------------------------------------------------------------

message Extent {
  // Non-zero, and unique across every universe in this file, not merely within its own.
  // The dataplane keys seals, the census and the per-extent metrics by this id alone,
  // and a device names its extents by it, so control planes should allocate extent ids
  // from one space. Never reused.
  uint32 id = 1;

  // Where this extent starts in its universe's address space, in 4 KiB blocks. Frozen
  // for the extent's life: the address of a page is `universe | base_lba + offset`, and
  // there is nothing that could move stored pages to a new address.
  //
  // The control plane places extents; the dataplane never picks a base. For an
  // IMMUTABLE_4M extent this must be a multiple of 1024, since each of its pages spans
  // 1024 blocks. `base_lba` plus the extent's span must fit in 2^38.
  uint64 base_lba = 2;

  // Length in *pages* of this extent's kind, not in blocks and not in bytes, so a
  // misaligned extent is unrepresentable. Non-zero. Summed across every universe this
  // sizes the store at format time and is what the index budget is checked against, so
  // it cannot change once the extent exists. Grow capacity by adding an extent, not by
  // extending one.
  uint64 pages = 3;

  // Frozen for the extent's life. Determines the guard a write must present and the page
  // size, and nothing else - the kinds share one code path.
  Kind kind = 4;

  // Home zone: where these bytes live. Must be our own zone or one listed in this
  // universe's `zones`.
  uint32 zone = 5;

  // 0 = not migrating; else the zone the bytes are being pulled to. Must differ from
  // `zone` and must also be a zone known to this universe.
  //
  // Setting this starts a migration: the source zone seals the extent and pushes it, and
  // the destination treats incoming writes for it as local. It keeps pushing until the
  // control plane declares the move done by setting `zone` to this value and clearing
  // this field to 0. That flip is the only completion signal there is - the dataplane
  // never decides a migration has finished. A home zone may only move to the value
  // `next_zone` previously held.
  //
  // A migration moves an extent between zones of one universe. Nothing moves an extent
  // between universes; that is what the boundary means.
  uint32 next_zone = 6;

  // The most load-bearing scalar in this file, and scoped to this extent alone. Page
  // versions in it are `3*epoch + state`: `3e` empty, `3e+1` live, `3e+2` trimmed.
  // Advancing it does three things at once with no consensus round - the extent's
  // tombstones from every earlier epoch become reclaimable, every cached immutable page
  // in it is invalidated, and the guard an immutable write to it must present moves to
  // `3*epoch`. Other extents are untouched, so one extent's collection never waits on
  // another's.
  //
  // It may never decrease: that would put the fill point below entries the extent
  // already holds, and every later write to them would conflict forever. Any forward
  // step is legal - nothing in the dataplane observes the size of one, so a node down
  // for several generations adopts the current value rather than refusing the whole
  // file.
  //
  // Advancing is destructive, not just a collection: every page still live below the new
  // epoch becomes unreadable and its slot is never reclaimed. Advance only once every
  // node reports `racer_extent_live_pages{extent=...} == 0` at the current epoch;
  // afterwards `racer_extent_tombstones{extent=...}` draining to zero is the sweep
  // finishing.
  uint32 tombstone_epoch = 7;
}

enum Kind {
  // Last writer wins: the guard is the page's current version, so a write always lands.
  LWW = 0;
  // Optimistic concurrency: the guard is the version *this node* last read, so a write
  // with no prior read here conflicts. Acceptors keep no read state, which is what makes
  // the check cluster-wide rather than per-replica.
  OCC = 1;
  // Write-once per tombstone epoch, in 4 KiB pages: the guard is
  // `3 * Extent.tombstone_epoch`, which every replica derives from this file
  // identically. The only guard needing no bits on the wire.
  IMMUTABLE = 2;
  // The same guard, in 4 MiB pages. The only kind at that size, and the reason the
  // guard being derived matters: a 4 MiB frame is all payload, with no room to carry
  // one on the wire.
  IMMUTABLE_4M = 3;
}

// ---- devices ----------------------------------------------------------------------

// A block device this node exports, assembled from whole extents.
//
// The device is the concatenation of `extents` in the order given: extent N's pages
// begin where N-1's ended. Nothing here is stored - a device is a view, and the same
// extent may appear in devices on several nodes, in different positions, alongside
// different neighbours. What a device may not do is name the same extent twice, which
// would alias two offsets onto one page.
//
// Every extent in the list must have the same page size, since the exported device
// advertises one page as both its maximum transfer and its chunk size. Mixing 4 KiB and
// 4 MiB extents in one device is refused.
message Device {
  // Non-zero and unique in this file. Names the exported ublk device for its life; a
  // device that keeps its id and its extent list across a reload keeps its identity and
  // its open handles.
  uint32 id = 1;

  // Extent ids, in the order they are concatenated. Non-empty, no duplicates, and every
  // id must name an extent of some universe in this file. Extents from different
  // universes may share a device: composing is a local act and the boundary is about who
  // may address a universe, not about which of a node's own devices its bytes appear in.
  //
  // Frozen for the device's life: a guest that has the device open is addressing
  // positions in it, and reordering or resizing under it would silently redirect every
  // offset past the change. Publish a new device id instead.
  repeated uint32 extents = 2;
}

// ---- policy -----------------------------------------------------------------------

message Policy {
  // DRAM ceiling for the 4 KiB index, in bytes. Checked once when a config is loaded:
  // the total 4 KiB page count times 52 B must fit, or the config is refused by name
  // rather than allowed to OOM later. 4 MiB pages are not counted. Absent means the
  // default, 8 GiB. An admission check only - nothing enforces it at runtime - and
  // lowering it below the current working set rejects the whole file.
  optional uint64 max_index_bytes = 1;

  // DRAM ceiling for the OCC read pool, in bytes. Split evenly across cores at 48 B per
  // record, minimum one record per core. Absent means the default, 256 MiB.
  //
  // Genuinely hot: shrinking it evicts on the next tick. Too small only turns would-be
  // successful OCC writes into conflicts the client retries - never a wrong answer.
  optional uint64 occ_bytes = 2;

  // tau, the cooperative cache's target rate, in *requests per 250 ms decay interval* -
  // not IOPS. The underlying counter saturates at 15 per interval, so the range is 1..15
  // and anything above is rejected rather than quietly clamped.
  //
  // 0, the default, disables the cooperative cache entirely; a node that has not been
  // told a target rate does not guess one. Otherwise a page is replicated to
  // `ceil(observed rate / tau)` peers, capped at the cohort size or 64, whichever is
  // smaller. Lower tau means wider replication of more pages.
  uint32 cache_target_rate = 3;

  // Registers one anti-entropy sweep will pull while replaying a group, and the number
  // it will push per extent while handing one to another zone. Absent means the default,
  // 4096. Zero is refused.
  //
  // This is the rate a member replacement runs at. A group being replayed is a group
  // running two of three with no fault tolerance left, so the window wants to be short;
  // against that, every register costs a prepare round at the whole group, and the
  // members sourcing it are serving clients. Raise it to finish a replacement or an
  // extent handover faster on a cluster with headroom, lower it to keep either out of
  // the way of the write path.
  optional uint32 repairs_per_replay = 4;

  // DRAM ceiling for the read cache's index, in bytes, across every core and both page
  // classes. Absent means the default, 1 GiB; zero disables the cache by leaving it no
  // slots to hold.
  //
  // This is what bounds the cache, because the media no longer does: the cache is given
  // every 4 MiB the slabs did not claim, and on a large store that is more space than
  // any sane amount of DRAM can index. One resident page costs 48 B here, so a 4 MiB
  // chunk costs 48 B as one huge page and 48 KiB as 1024 small ones - the small class is
  // 1024 times more expensive per byte of media, and this ceiling is why a node full of
  // small cache does not OOM. Unlike max_index_bytes this is not an admission check: the
  // cache sizes itself to fit and simply holds less.
  optional uint64 cache_index_bytes = 5;
}
