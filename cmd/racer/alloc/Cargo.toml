[package]
name = "page-alloc"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Worker-local aligned buffers and lease-fenced sparse slab storage"

[dependencies]
libc = "0.2"
zeroize = "1"
racer-io = { path = "../io" }

[dev-dependencies]
racer-io = { path = "../io" }

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
