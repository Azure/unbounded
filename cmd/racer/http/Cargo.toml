[package]
name = "http1"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Strict fixed-length HTTP/1.1 over an explicitly driven racer-io reactor"

[features]
test-util = []

[dependencies]
futures = "0.3"
flow-control = { path = "../flow" }
racer-io = { path = "../io" }
httparse = "1"
zeroize = "1"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
rcgen = { version = "0.13", features = ["pem", "ring"] }

[[test]]
name = "pool"
required-features = ["test-util"]

[[test]]
name = "tls"
required-features = ["test-util"]
