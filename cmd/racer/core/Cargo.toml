[package]
name = "racer-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Sans-IO Racer decision logic shared by the dataplane and the simulator"

[lib]
name = "racer_core"

[dependencies]
topology = { path = "../topology" }
racer-wire = { path = "../wire" }
racer-flow-core = { path = "../flow-core" }
sha2 = "0.10"

[dev-dependencies]
racer-wire = { path = "../wire", features = ["test-util"] }
