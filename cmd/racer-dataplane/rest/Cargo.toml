[package]
name = "rest-client"
version = "0.1.0"
edition = "2024"
publish = false
description = "Worker-local bounded TLS JSON HTTP client"

[features]
default = []
simulation = ["uring-runtime/simulation"]

[dependencies]
uring-runtime = { path = "../runtime" }
httparse = "1"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
futures = "0.3"
rcgen = { version = "0.13", features = ["pem", "ring"] }
