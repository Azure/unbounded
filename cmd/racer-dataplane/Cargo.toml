[workspace]
members = [".", "runtime", "topology"]
resolver = "3"

[package]
name = "racer-dataplane"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Racer node-local read-through cache dataplane"

[dependencies]
topology = { path = "topology" }
uring-runtime = { path = "runtime" }

# Keep debug assertions, overflow checks, and debug info while optimizing the
# runtime tests and exhaustive topology checks.
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 3
