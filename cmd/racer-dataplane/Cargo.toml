[package]
name = "racer-dataplane"
version = "0.1.0"
edition = "2024"
publish = false
description = "Racer node-local read-through cache dataplane"

[features]
default = []
# Enables the separately loaded native verbs adapter; unavailable hardware uses HTTP.
rdma = []
# Opt-in standalone client interoperability fixture with crate-private test hooks.
subscription-interop = []
# Binary-only jemalloc allocator and dedicated, opt-in pprof HTTP listener.
heap-profiling = ["dep:jemalloc_pprof", "dep:tikv-jemallocator"]

[[test]]
name = "subscription_interop"
path = "tests/subscription_interop.rs"
required-features = ["subscription-interop"]

[dependencies]
base64 = "0.22"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
# chacha20/zeroize wipes its core but does not forward to the buffered wrapper.
cipher = { version = "0.5", features = ["zeroize"] }
crc64fast = "1.1.0"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
futures = "0.3"
getrandom = "0.2"
httparse = "1"
io-uring = "0.7"
jemalloc_pprof = { version = "0.9", optional = true, features = ["symbolize"] }
libc = "0.2"
# chacha20poly1305/zeroize does not enable Poly1305 state wiping. Unify its
# transitive dependency with this explicit feature until upstream forwards it.
poly1305 = { version = "0.9", features = ["zeroize"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tikv-jemallocator = { version = "0.7", optional = true, features = ["profiling_libunwind"] }
x509-parser = { version = "0.16", features = ["verify"] }
zeroize = "1"

[dev-dependencies]
flate2 = "1"
prost = "0.14"

# Full-page crypto and exhaustive topology checks dominate unoptimized test runs.
# Keep debug assertions, overflow checks, and debug info while optimizing hot loops.
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 3
