[package]
name = "racer-dataplane"
version = "1.0.0"
edition = "2024"
autotests = false

[features]
dev-bench = []

[[bin]]
name = "metadata-bench"
path = "bench/metadata.rs"
required-features = ["dev-bench"]

[[bin]]
name = "tcp-page-bench"
path = "bench/tcp_page.rs"
required-features = ["dev-bench"]

[[bin]]
name = "rdma-bench"
path = "bench/rdma.rs"
required-features = ["dev-bench"]

[[bin]]
name = "http-bench"
path = "bench/http.rs"

[[bin]]
name = "crypto-bench"
path = "bench/crypto.rs"

[dependencies]
crc-fast = { version = "1.10", default-features = false, features = ["std"] }
getrandom = "0.2"
sha2 = "0.10"
zeroize = "1"
blake3 = "1"
libc = "0.2"
openssl = { version = "0.10", features = ["vendored"] }
# Expose the selected OpenSSL headers to build.rs for the native TLS shim.
openssl-sys = "0.9"
foreign-types = "0.3"
prost = "0.13"
pbjson = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[build-dependencies]
cc = "1"
# Unify with openssl-sys's source build and explicitly enable kernel TLS.
openssl-src = { version = "300.6.1", features = ["ktls"] }
prost-build = "0.13"
pbjson-build = "0.7"
protoc-bin-vendored = "3"
