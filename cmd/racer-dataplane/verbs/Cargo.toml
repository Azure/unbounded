[package]
name = "rdma-verbs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Bounded paired-thread RDMA verbs ownership and simulated fabric"

[features]
default = []
native = []
simulation = ["racer-platform/simulation"]

[dependencies]
futures = "0.3"
libc = "0.2"
serde_json = "1"
racer-platform = { path = "../platform" }

[dev-dependencies]
racer-platform = { path = "../platform", features = ["simulation"] }
