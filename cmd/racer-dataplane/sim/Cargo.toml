[package]
name = "racer-sim"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Discrete-event simulator for Racer decision logic at cluster scale"

[[bin]]
name = "racer-sim"
path = "src/main.rs"

[dependencies]
racer-core = { path = "../core" }
topology = { path = "../topology" }
flow-control = { path = "../flow" }
page-alloc = { path = "../alloc" }
serde_json = "1"
