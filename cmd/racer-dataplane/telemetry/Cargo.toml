[package]
name = "telemetry"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Fixed metrics and bounded diagnostic primitives"

[dependencies]
uring-runtime = { package = "uring-runtime-legacy", path = "../runtime" }
httparse = "1"
zeroize = "1"

[dev-dependencies]
uring-runtime = { package = "uring-runtime-legacy", path = "../runtime", features = ["simulation"] }
