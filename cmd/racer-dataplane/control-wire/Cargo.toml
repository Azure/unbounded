[package]
name = "racer-control-wire"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bounded Racer control records and canonical JSON contract"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x509-parser = "0.16"
zeroize = "1"
