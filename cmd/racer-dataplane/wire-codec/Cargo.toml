[package]
name = "wire-codec"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Bounded byte codecs, canonical lowercase hexadecimal, and optional REST transport"

[features]
default = []
rest = ["dep:uring-runtime", "dep:httparse", "dep:libc", "dep:rustls", "dep:rustls-pemfile", "dep:sha2", "dep:zeroize"]
simulation = ["rest", "uring-runtime/simulation"]

[dependencies]
uring-runtime = { path = "../runtime", optional = true }
httparse = { version = "1", optional = true }
libc = { version = "0.2", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rustls-pemfile = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }
zeroize = { version = "1", optional = true }

[dev-dependencies]
futures = "0.3"
rcgen = { version = "0.13", features = ["pem", "ring"] }

[[test]]
name = "transport"
required-features = ["rest"]
