[package]
name = "racer-identity"
version = "0.1.0"
edition = "2024"
publish = false
description = "Racer certificate identities and immutable purpose-bound key epochs"

[features]
default = []
test-util = []

[dependencies]
racer-control-wire = { path = "../control-wire" }
racer-crypto = { path = "../crypto" }
uring-runtime = { path = "../runtime" }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
x509-parser = { version = "0.16", features = ["verify"] }
zeroize = "1"

[dev-dependencies]
uring-runtime = { path = "../runtime", features = ["simulation"] }
