[package]
name = "racer-platform"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Racer policy and ergonomic surface over the uring-runtime library"

[dependencies]
uring = { package = "uring-runtime", path = "../../../crates/uring-runtime" }
futures = "0.3"
zeroize = "1"
libc = "0.2"
uring-runtime-sim = { path = "../../../crates/uring-runtime-sim", optional = true }

[features]
default = []
# Shared wake instrumentation for downstream tests.
test-util = []
# Deterministic simulation: ambient simulated clock and entropy, the
# `simulation` facade over uring-runtime-sim, and the simulated backend.
simulation = ["dep:uring-runtime-sim"]
