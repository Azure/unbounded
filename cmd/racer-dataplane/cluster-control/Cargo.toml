[package]
name = "racer-cluster-control"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Racer control plane embedded in racer-dataplane: Lease seats, primary, and control API"

[dependencies]
racer-control-wire = { path = "../control-wire" }
racer-admission = { path = "../admission" }
regex = "1"
wire-codec = { path = "../wire-codec" }
base64 = "0.22"
futures = "0.3"
getrandom = "0.2"
httparse = "1"
libc = "0.2"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x509-parser = { version = "0.16", features = ["verify"] }
zeroize = "1"

[dev-dependencies]
racer-crypto = { path = "../crypto" }
