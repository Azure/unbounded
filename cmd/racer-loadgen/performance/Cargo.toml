[package]
name = "racer-performance-control"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "racer-performance-control"
path = "control.rs"

[dependencies]
racer-dataplane = { path = "../../racer-dataplane" }
base64 = "0.22"
getrandom = "0.2"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
