SPECIFICATION Spec

INVARIANT SingleFlight
INVARIANT LeaderConsistency
INVARIANT PageConservation
INVARIANT HoldsConsistent
INVARIANT TeeSafety
INVARIANT WaitQConsistent

PROPERTY WaiterLiveness

CONSTRAINT StateConstraint

\* SYMMETRY is intentionally NOT declared here. TLC warns that symmetry
\* reduction during liveness checking can cause it to MISS violations of a
\* temporal property, so the run explores the full (un-reduced) state space.
\* It still completes in a few seconds (~11.5k distinct states with
\* MaxCancels=3). The Symmetry operator remains defined in the .tla for
\* documentation / safety-only experimentation.
\*
\* SCOPE OF THE WaiterLiveness PROPERTY (read before trusting it as a proof).
\* WaiterLiveness is checked UNDER the `cancels <= MaxCancels` CONSTRAINT
\* below (StateConstraint). The liveness guarantee is therefore SCOPED: it
\* covers every interleaving in which at most MaxCancels (= 3) leader
\* cancellations occur, NOT the unbounded-cancellation case. Raising
\* MaxCancels widens that scope; it does not make the result unconditional.
\*
\* TLC documents (Specifying Systems sec 14.3.5) that declaring a state/action
\* constraint during liveness checking is dangerous, because a constraint can
\* prune successor states and thereby hide a real non-progress cycle. The run
\* is still meaningful here for a specific structural reason: `cancels` is
\* MONOTONICALLY non-decreasing (only LeaderCancel changes it, always +1), so
\* `cancels <= MaxCancels` can only ever prune a FINITE SUFFIX of any behaviour
\* (the steps after the (MaxCancels+1)-th cancel). It never removes an internal
\* transition, so it cannot manufacture or break a liveness cycle WITHIN the
\* explored prefix. WaiterLiveness is thus genuinely exercised across all
\* interleavings up to the cancel bound. Treat it as a bounded-cancellation
\* proof, not an unconditional one.

CONSTANTS
  Tasks             = {t1, t2, t3}
  Keys              = {k1, k2, k3}
  P                 = 2
  StripePages       = 2
  MaxCancels        = 3
  ReleaseBeforeWake = TRUE
  PreserveOnCancel  = TRUE
  NONE              = NONE

\* Deadlock detection is intentionally ON. Genuine task completion is
\* modelled, and the legitimate "all tasks done" terminal carries an
\* explicit Done stutter self-loop, so the only states TLC can report as
\* deadlocks are real wedges (a task still wanting progress with nothing
\* enabled). The committed run checks the release/preserve-before-wake
\* configuration used by this model. Alternate constants are useful for
\* safety-only experiments.
CHECK_DEADLOCK TRUE
