SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT BoundedInflight
INVARIANT RingCorrelation
INVARIANT GenerationDetectable
INVARIANT ExactlyOnceCompletion
INVARIANT SendZcBufferSafety
INVARIANT NoCompletionOnDown

PROPERTY EventualCompletion

CONSTRAINT StateConstraint

\* SYMMETRY is intentionally NOT declared here. TLC warns that symmetry
\* reduction during liveness checking can cause it to MISS violations of a
\* temporal property, so to keep EventualCompletion a sound proof the run
\* explores the full (un-reduced) state space. It still completes quickly.
\* The Symmetry operator remains defined in the .tla.

CONSTANTS
  Ids         = {r1, r2, r3}
  MaxInflight = 2
  MaxOps      = 3

CHECK_DEADLOCK FALSE
