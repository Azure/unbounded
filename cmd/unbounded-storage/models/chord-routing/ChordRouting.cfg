SPECIFICATION Spec

\* Convergent baseline: every node sees the full cluster (the production
\* stated assumption, fingers.rs:26-29). All four invariants hold, including
\* NoHopLimit, so termination is established by monotone progress alone.
INVARIANT ProgressInv
INVARIANT OwnershipUnique
INVARIANT NoSelfLoop
INVARIANT NoHopLimit

CONSTRAINT StateConstraint

\* No SYMMETRY: Successor / Predecessor / ClosestPreceding all CHOOSE over
\* ring positions with an order-dependent tie-break, exactly the situation
\* CowBtreeCrash warns makes symmetry reduction unsound. Node is small
\* enough that full enumeration is fast.

CONSTANTS
  Modulus    = 8
  Node       = {0, 2, 4, 6}
  MaxHops    = 6
  K          = 2
  MaxReloads = 2
  Lookups    = {l1, l2}
  Divergent  = FALSE
  NONE       = NONE

CHECK_DEADLOCK FALSE
