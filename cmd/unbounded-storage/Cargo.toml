[package]
name = "unbounded-storage"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "unbounded-storage"
path = "src/main.rs"

[lib]
name = "unbounded_storage"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
rand = "0.8"
rand_chacha = "0.3"

