[package]
name = "unbounded-storage"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "unbounded-storage"
path = "src/main.rs"

[lib]
name = "unbounded_storage"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
httparse = "1"
http = "1"
blake3 = "1.5"
arc-swap = "1.7"
twox-hash = { version = "1.6", default-features = false }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
toml = "0.8"
notify = "6"
prometheus = { version = "0.13", default-features = false }
prost = "0.13"
pprof = { version = "0.15", default-features = false, features = ["protobuf-codec"], optional = true }

[features]
# CPU sampling profiler. Off by default so standard builds stay
# dependency-free; enable with `--features profiling`. When enabled the
# daemon listens for SIGUSR1 and writes a pprof protobuf file. See
# src/profiling.rs.
profiling = ["dep:pprof"]

[build-dependencies]
cc = "1"
pkg-config = "0.3"
prost-build = "0.13"
protoc-bin-vendored = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
io-uring = "0.6"

[dev-dependencies]
proptest = "1"
tempfile = "3"
