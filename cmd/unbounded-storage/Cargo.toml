[package]
name = "unbounded-storage"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "unbounded-storage"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[lib]
name = "unbounded_storage"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
arc-swap = "1.7"
twox-hash = { version = "1.6", default-features = false }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
toml = "0.8"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
io-uring = "0.6"

[dev-dependencies]
proptest = "1"
tempfile = "3"

