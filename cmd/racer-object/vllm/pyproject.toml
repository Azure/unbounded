[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "racer-object-vllm"
version = "0.1.0"
description = "Explicit-file Racer object loader for vLLM"
requires-python = ">=3.10"
dependencies = ["vllm==0.29.0", "runai-model-streamer[s3]==0.16.1"]

[project.entry-points."vllm.general_plugins"]
racer_object = "racer_object_vllm:register"

[tool.setuptools]
py-modules = ["racer_object_vllm"]
