apiVersion: signal.unbounded-cloud.io/v1alpha1
kind: CertificationProfile
metadata:
  name: gpu-rack-full-node-example
  annotations:
    signal.unbounded-cloud.io/example: "disabled sample; replace all placeholders before use"
spec:
  participants:
    count: 2
    nodeNames:
      - REPLACE_WITH_APPROVED_RACK_NODE_A
      - REPLACE_WITH_APPROVED_RACK_NODE_B
    topologyKey: REPLACE_WITH_VERIFIED_RACK_LABEL
    selector:
      matchLabels:
        node.kubernetes.io/instance-type: REPLACE_WITH_VERIFIED_INSTANCE_TYPE
        nvidia.com/gpu.product: REPLACE_WITH_VERIFIED_GPU_PRODUCT_LABEL
    requiredResources:
      nvidia.com/gpu: "1"
  script:
    name: REPLACE_WITH_RELEASE_SCRIPT_CONFIGMAP
    key: gpu-full-node-mpi.sh
  workflow:
    name: project-signal-rack-certification
  backend:
    apiVersion: kubeflow.org/v2beta1
    kind: MPIJob
  runnerImage: REPLACE_WITH_REVIEWED_GPU_RUNNER_IMAGE
  purpose: FullCertification
  parameters:
    mpi-payload-mode: script
    node-workflow-template: project-signal-gpu-full-node-certification
    rack-tests: "[]"
    expected-gpu-product-regex: ^REPLACE_WITH_VERIFIED_NVIDIA_SMI_PRODUCT$
    expected-gpu-count: "REPLACE_WITH_VERIFIED_GPU_COUNT"
  evidencePath: project-signal/rack-example
  deadline: 15m
  maxAttempts: 2
  recurring:
    enabled: false
    nodeNames:
      - REPLACE_WITH_APPROVED_RACK_NODE_A
      - REPLACE_WITH_APPROVED_RACK_NODE_B
    minIdleDuration: 15m
    validFor: 1h
    expiresAt: "1970-01-01T00:00:00Z"
    evaluationInterval: 1m
    failureBackoff: 30m
    maxConsecutiveFailures: 2
    maxConcurrent: 1
    failureDomainLabel: topology.kubernetes.io/zone
    maxConcurrentPerFailureDomain: 1
    exclusiveProfiles: []
