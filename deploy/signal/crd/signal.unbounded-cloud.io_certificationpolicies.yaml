---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: certificationpolicies.signal.unbounded-cloud.io
spec:
  group: signal.unbounded-cloud.io
  names:
    kind: CertificationPolicy
    listKind: CertificationPolicyList
    plural: certificationpolicies
    shortNames:
    - certpolicy
    singular: certificationpolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.requirements.size()
      name: Requirements
      type: integer
    - jsonPath: .spec.validity
      name: Validity
      type: string
    - jsonPath: .spec.gateProjection.mode
      name: Gate
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              gateProjection:
                properties:
                  mode:
                    description: |-
                      Mode ProtectedLabel projects only the fixed
                      node-restriction.kubernetes.io/project-signal-qualified=true contract.
                      The shared label is present only when protection is positively verified,
                      at least one ProtectedLabel Policy exists, and every ProtectedLabel Policy
                      has a Qualified, unexpired NodeCertification for the exact Node UID.
                      Otherwise controllers must remove it. Protection requires the Node
                      authorizer and NodeRestriction admission plugin; the API cannot discover
                      their configuration. Deployment must provide verified configuration and
                      RBAC must restrict non-node identities that can patch Nodes.
                    enum:
                    - None
                    - ProtectedLabel
                    type: string
                required:
                - mode
                type: object
              invalidationFingerprintFields:
                items:
                  enum:
                  - NodeUID
                  - BootID
                  - KernelVersion
                  - OSImage
                  - KubeletVersion
                  - SystemUUID
                  - DriverVersion
                  - GPUInventory
                  type: string
                maxItems: 8
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              nonPassBehavior:
                enum:
                - Ignore
                - Reset
                - Revoke
                type: string
              renewBefore:
                type: string
              requirements:
                items:
                  properties:
                    acceptedPlans:
                      properties:
                        digests:
                          items:
                            pattern: ^sha256:[0-9a-f]{64}$
                            type: string
                          maxItems: 32
                          type: array
                          x-kubernetes-list-type: set
                        mode:
                          enum:
                          - Current
                          - Listed
                          type: string
                      required:
                      - mode
                      type: object
                      x-kubernetes-validations:
                      - message: Listed plan acceptance requires at least one digest
                        rule: self.mode != 'Listed' || (has(self.digests) && size(self.digests)
                          > 0)
                      - message: plan digests are only valid in Listed mode
                        rule: self.mode == 'Listed' || !has(self.digests) || size(self.digests)
                          == 0
                    creditRule:
                      enum:
                      - Requester
                      - AllParticipants
                      - PerParticipant
                      type: string
                    name:
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    profile:
                      properties:
                        name:
                          maxLength: 253
                          minLength: 1
                          type: string
                        uid:
                          description: UID optionally restricts credit to one Profile
                            identity.
                          type: string
                      required:
                      - name
                      type: object
                    requiredPassCount:
                      format: int32
                      maximum: 64
                      minimum: 1
                      type: integer
                    variation:
                      properties:
                        minDistinctPlanDigests:
                          description: MinDistinctPlanDigests requires qualification
                            credit to span distinct plans.
                          format: int32
                          maximum: 32
                          minimum: 1
                          type: integer
                        minRunSeparation:
                          description: MinRunSeparation is the minimum start-time
                            separation between credited Runs.
                          type: string
                          x-kubernetes-validations:
                          - message: minRunSeparation must be positive
                            rule: duration(self) > duration('0s')
                      type: object
                  required:
                  - acceptedPlans
                  - creditRule
                  - name
                  - profile
                  - requiredPassCount
                  type: object
                  x-kubernetes-validations:
                  - message: minDistinctPlanDigests must not exceed the number of
                      listed plan digests
                    rule: self.acceptedPlans.mode != 'Listed' || !has(self.variation)
                      || !has(self.variation.minDistinctPlanDigests) || self.variation.minDistinctPlanDigests
                      <= size(self.acceptedPlans.digests)
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              validity:
                type: string
            required:
            - gateProjection
            - invalidationFingerprintFields
            - nonPassBehavior
            - renewBefore
            - requirements
            - validity
            type: object
            x-kubernetes-validations:
            - message: invalidationFingerprintFields must include NodeUID
              rule: self.invalidationFingerprintFields.exists(x, x == 'NodeUID')
            - message: the total required pass count must not exceed the contributing
                Run limit
              rule: self.requirements.map(x, x.requiredPassCount).sum() <= 64
            - message: validity must be positive
              rule: duration(self.validity) > duration('0s')
            - message: renewBefore must be positive
              rule: duration(self.renewBefore) > duration('0s')
            - message: renewBefore must be less than validity
              rule: duration(self.renewBefore) < duration(self.validity)
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
