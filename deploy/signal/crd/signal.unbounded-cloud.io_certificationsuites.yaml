          spec:
            properties:
              checks:
                description: |-
                  Checks is the ordered executable test plan. A check's position defines
                  its stable ID. New Suites should use phases and named stages.
                items:
                  properties:
                    backend:
                      enum:
                      - Pod
                      - MPIJob
                      type: string
                    backendActiveDeadline:
                      type: string
