                      description: Continuity declares the evidence required to prove
                        uninterrupted execution.
                      properties:
                        maxSampleGap:
                          description: MaxSampleGap is the maximum permitted gap between
                            consecutive evidence samples.
                          type: string
                          x-kubernetes-validations:
                          - message: maxSampleGap must be positive
                            rule: duration(self) > duration('0s')
                        requirePerDeviceCoverage:
                          description: RequirePerDeviceCoverage requires evidence
                            for every device in the starting inventory.
                          type: boolean
                        requireSameBootID:
                          description: RequireSameBootID rejects evidence spanning
                            a participant reboot.
                          type: boolean
                      type: object
                    execution:
                      description: |-
                        Execution declares runner-owned stage scheduling. When omitted, the check
                        has legacy RunOnce semantics and is ineligible for sustained-duration
                        qualification.
                      properties:
                        coverageWindow:
                          description: CoverageWindow is the sustained activity window
                            owned by the runner.
                          type: string
                        interval:
                          description: Interval is the target separation between Periodic
                            invocation starts.
                          type: string
                        iterationTimeout:
                          description: IterationTimeout bounds each runner-owned script
                            invocation.
                          type: string
                        maxGap:
                          description: MaxGap bounds the observed gap between consecutive
                            invocation starts.
                          type: string
                        minExecutions:
                          description: MinExecutions is the minimum completed invocation
                            count in the window.
                          format: int32
                          maximum: 1000000
                          minimum: 2
                          type: integer
                        mode:
                          enum:
                          - RunOnce
                          - Continuous
                          - Periodic
                          type: string
                        role:
                          enum:
                          - Startup
                          - Validation
                          - Terminal
                          type: string
                      required:
                      - mode
                      - role
                      type: object
                      x-kubernetes-validations:
                      - message: Startup and Terminal stages must use RunOnce mode
                        rule: self.role == 'Validation' || self.mode == 'RunOnce'
                      - message: RunOnce mode must not declare repeated-execution
                          fields
                        rule: self.mode != 'RunOnce' || (!has(self.coverageWindow)
                          && !has(self.iterationTimeout) && !has(self.interval) &&
                          !has(self.minExecutions) && !has(self.maxGap))
                      - message: Continuous and Periodic modes require coverageWindow,
                          iterationTimeout, minExecutions, and maxGap
                        rule: self.mode == 'RunOnce' || (has(self.coverageWindow)
                          && has(self.iterationTimeout) && has(self.minExecutions)
                          && has(self.maxGap))
                      - message: Periodic mode requires interval
                        rule: self.mode != 'Periodic' || has(self.interval)
                      - message: only Periodic mode may declare interval
                        rule: self.mode == 'Periodic' || !has(self.interval)
                      - message: coverageWindow must be positive
                        rule: '!has(self.coverageWindow) || duration(self.coverageWindow)
                          > duration(''0s'')'
                      - message: coverageWindow must use whole-second precision
                        rule: '!has(self.coverageWindow) || duration(self.coverageWindow).getMilliseconds()
                          % 1000 == 0'
                      - message: iterationTimeout must be positive
                        rule: '!has(self.iterationTimeout) || duration(self.iterationTimeout)
                          > duration(''0s'')'
                      - message: iterationTimeout must use whole-second precision
                        rule: '!has(self.iterationTimeout) || duration(self.iterationTimeout).getMilliseconds()
                          % 1000 == 0'
                      - message: iterationTimeout must not exceed coverageWindow
                        rule: '!has(self.coverageWindow) || !has(self.iterationTimeout)
                          || duration(self.iterationTimeout) <= duration(self.coverageWindow)'
                      - message: interval must be positive
                        rule: '!has(self.interval) || duration(self.interval) > duration(''0s'')'
                      - message: interval must use whole-second precision
                        rule: '!has(self.interval) || duration(self.interval).getMilliseconds()
                          % 1000 == 0'
                      - message: Periodic iterationTimeout must not exceed interval
                        rule: '!has(self.interval) || !has(self.iterationTimeout)
                          || duration(self.iterationTimeout) <= duration(self.interval)'
                      - message: maxGap must be positive
                        rule: '!has(self.maxGap) || duration(self.maxGap) > duration(''0s'')'
                      - message: maxGap must use whole-second precision
                        rule: '!has(self.maxGap) || duration(self.maxGap).getMilliseconds()
                          % 1000 == 0'
                      - message: maxGap must not exceed coverageWindow
                        rule: '!has(self.coverageWindow) || !has(self.maxGap) || duration(self.maxGap)
                          <= duration(self.coverageWindow)'
                      - message: Periodic maxGap must not be less than interval
                        rule: '!has(self.interval) || !has(self.maxGap) || duration(self.interval)
                          <= duration(self.maxGap)'
                      - message: minExecutions must fit within coverageWindow
                        rule: '!has(self.interval) || !has(self.coverageWindow) ||
                          !has(self.iterationTimeout) || !has(self.minExecutions)
                          || duration(self.iterationTimeout).getMilliseconds() + duration(self.interval).getMilliseconds()
                          * (self.minExecutions - 1) <= duration(self.coverageWindow).getMilliseconds()'
