                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                required:
                - generation
                - name
                - uid
                type: object
                x-kubernetes-validations:
                - message: uid is required
                  rule: size(self.uid) > 0
            required:
            - nodeName
            - nodeUID
            - policy
            type: object
            x-kubernetes-validations:
            - message: policy name is immutable
              rule: self.policy.name == oldSelf.policy.name
            - message: policy UID is immutable
              rule: self.policy.uid == oldSelf.policy.uid
            - message: policy generation cannot decrease
              rule: self.policy.generation >= oldSelf.policy.generation
            - message: nodeName is immutable
              rule: self.nodeName == oldSelf.nodeName
            - message: nodeUID is immutable
              rule: self.nodeUID == oldSelf.nodeUID
