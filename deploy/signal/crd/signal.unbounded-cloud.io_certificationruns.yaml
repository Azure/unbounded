  name: certificationruns.signal.unbounded-cloud.io
spec:
  group: signal.unbounded-cloud.io
  names:
    kind: CertificationRun
    listKind: CertificationRunList
    plural: certificationruns
    shortNames:
    - certrun
    singular: certificationrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.profile.name
