                      maximum: 64
                      minimum: 1
                      type: integer
                    role:
                      description: Role names the participant role whose selected
                        Nodes are evaluated.
                      type: string
                  required:
                  - labelKey
                  - minDistinctValues
                  - role
                  type: object
                maxItems: 16
                type: array
