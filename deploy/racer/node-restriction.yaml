apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: racer-node-write-restriction
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["nodes", "nodes/status"]
  matchConditions:
    - name: racer-controller
      expression: >-
        request.userInfo.username == "system:serviceaccount:unbounded-system:racer-controller"
  variables:
    - name: allowedAnnotations
      expression: >-
        ['racer.unbounded-cloud.io/enrolled-shares',
         'racer.unbounded-cloud.io/enrolled-rdma-nics',
         'racer.unbounded-cloud.io/last-admitted-member']
    - name: annotations
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    - name: oldAnnotations
      expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
  validations:
    # Compare both directions so additions and removals cannot bypass the guard.
    - expression: >-
        object.all(k, k == 'metadata' || (k in oldObject && object[k] == oldObject[k])) &&
        oldObject.all(k, k == 'metadata' || (k in object && oldObject[k] == object[k]))
      message: Racer may not change Node fields outside metadata
      reason: Forbidden
    # managedFields is API-server field-management bookkeeping, not Node state.
    - expression: >-
        object.metadata.all(k, k in ['annotations', 'managedFields'] ||
          (k in oldObject.metadata && object.metadata[k] == oldObject.metadata[k])) &&
        oldObject.metadata.all(k, k in ['annotations', 'managedFields'] ||
          (k in object.metadata && oldObject.metadata[k] == object.metadata[k]))
      message: Racer may not change other Node metadata
      reason: Forbidden
    - expression: >-
        variables.annotations.all(k, k in variables.allowedAnnotations ||
          (k in variables.oldAnnotations && variables.annotations[k] == variables.oldAnnotations[k])) &&
        variables.oldAnnotations.all(k, k in variables.allowedAnnotations ||
          (k in variables.annotations && variables.annotations[k] == variables.oldAnnotations[k]))
      message: Racer may only change its three enrollment and recovery Node annotations
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: racer-node-write-restriction
spec:
  policyName: racer-node-write-restriction
  validationActions: [Deny]
