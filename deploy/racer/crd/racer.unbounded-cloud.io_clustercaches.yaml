---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clustercaches.racer.unbounded-cloud.io
spec:
  group: racer.unbounded-cloud.io
  names:
    kind: ClusterCache
    listKind: ClusterCacheList
    plural: clustercaches
    shortNames:
    - rcache
    singular: clustercache
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterCache names a disposable cache. Its Kubernetes UID is its wire identity.
          Socket paths are derived from metadata.name. Client access is controlled by pod volume mounts.
          The name limit keeps /run/racer/<name>/origin/socket within Linux sockaddr_un.
          Each DNS label is limited to 63 characters to match the wire contract;
          Kubernetes metadata validation enforces DNS subdomain spelling.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
        type: object
        x-kubernetes-validations:
        - message: name must fit the canonical Unix socket path
          rule: size(self.metadata.name) <= 82
        - message: each name label must be at most 63 characters
          rule: self.metadata.name.split('.').all(label, size(label) <= 63)
    served: true
    storage: true
