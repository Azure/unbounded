apiVersion: apps/v1
kind: Deployment
metadata:
  name: racer-controller
  namespace: unbounded-system
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: racer-controller
  template:
    metadata:
      labels:
        app: racer-controller
    spec:
      serviceAccountName: racer-controller
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: racer-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # Kubelet needs a UID to own the 0400 projected replication token.
        runAsUser: 65532
      containers:
        - name: controller
          image: ghcr.io/azure/racer-controller:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          envFrom:
            - configMapRef:
                name: racer-config
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - name: https
              containerPort: 8443
            - name: probes
              containerPort: 8081
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          volumeMounts:
            - name: tls
              mountPath: /etc/racer/tls
              readOnly: true
            - name: replication-token
              mountPath: /var/run/secrets/racer-controller
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: racer-controller-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              # Current and retained roots, never CA private keys or rotation state.
              - key: ca-bundle.crt
                path: ca.crt
        - name: replication-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  audience: racer-controller-replication
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: racer-controller
  namespace: unbounded-system
spec:
  selector:
    app: racer-controller
  ports:
    - name: https
      port: 8443
      targetPort: https
