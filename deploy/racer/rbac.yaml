apiVersion: v1
kind: ServiceAccount
metadata:
  name: racer-controller
  namespace: unbounded-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: racer-controller
rules:
  # Admission restricts Node patches to three enrollment/recovery annotations.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["racer.unbounded-cloud.io"]
    resources: ["clustercaches"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: racer-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: racer-controller
subjects:
  - kind: ServiceAccount
    name: racer-controller
    namespace: unbounded-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: racer-controller
  namespace: unbounded-system
rules:
  - apiGroups: [""]
    resources: ["pods", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["racer-credentials"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["racer-installation", "racer-version"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # External workload identity checks only; no workload writes.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["racer-controller"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: racer-controller
  namespace: unbounded-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: racer-controller
subjects:
  - kind: ServiceAccount
    name: racer-controller
    namespace: unbounded-system
