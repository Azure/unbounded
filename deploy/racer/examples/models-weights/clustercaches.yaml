# Model-weight caches, one per site. Replace every <placeholder>; see
# README.md.
apiVersion: racer.unbounded-cloud.io/v1alpha1
kind: ClusterCache
metadata:
  name: models-hillsboro
spec:
  priority: 900
  nodeSelector:
    matchLabels:
      unbounded-cloud.io/site: <hillsboro-site>
  origin:
    metadataTTL: 1h
    azure:
      containerURL: https://<storage-account>.blob.core.windows.net/models
      credential:
        workloadIdentity:
          clientID: <managed-identity-client-id>
---
apiVersion: racer.unbounded-cloud.io/v1alpha1
kind: ClusterCache
metadata:
  name: models-dapple
spec:
  priority: 900
  nodeSelector:
    matchLabels:
      unbounded-cloud.io/site: <dapple-site>
  origin:
    metadataTTL: 1h
    azure:
      containerURL: https://<storage-account>.blob.core.windows.net/models
      credential:
        workloadIdentity:
          clientID: <managed-identity-client-id>
