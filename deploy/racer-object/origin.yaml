apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: racer-object-origin
  labels:
    app.kubernetes.io/name: racer-object-origin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: racer-object-origin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: racer-object-origin
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: racer.unbounded-cloud.io/exclude
                    operator: DoesNotExist
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: origin
          image: racer-object:dev
          imagePullPolicy: IfNotPresent
          args:
            - origin
            - --cache=racer-object
            # Replace on both origin and sidecar with one stable upstream identity.
            - --namespace=example-store
            - --bucket=example-bucket
            - --region=us-east-1
            - --path-style=true
            - --metadata-ttl=30s
            - --request-timeout=1m
          envFrom:
            - secretRef:
                name: racer-object-aws
                optional: true
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: origin
              mountPath: /run/racer/racer-object/origin
              readOnly: false
      volumes:
        - name: origin
          hostPath:
            path: /run/racer/racer-object/origin
            type: DirectoryOrCreate
