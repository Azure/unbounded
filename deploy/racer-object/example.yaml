# Replace the account, managed identity client ID, image tag and Site selector.
apiVersion: v1
kind: Namespace
metadata:
  name: racer-weights
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: azure-origin
  namespace: racer-weights
  annotations:
    azure.workload.identity/client-id: REPLACE_MANAGED_IDENTITY_CLIENT_ID
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: objects
  namespace: racer-weights
data:
  objects.json: |
    {
      "azure_endpoint": "https://REPLACE_ACCOUNT.blob.core.windows.net",
      "objects": [{"bucket":"models", "key":"model.safetensors",
                   "container":"weights", "blob":"immutable/model.safetensors"}]
    }
---
apiVersion: racer.unbounded-cloud.io/v1alpha1
kind: P2PCache
metadata:
  name: weights
spec:
  siteSelector:
    matchLabels:
      kubernetes.io/metadata.name: REPLACE_SITE
  cacheGeneration: 1
---
# Place an origin on every node participating in this P2PCache.
# Apply this node label only to those nodes.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: azure-origin
  namespace: racer-weights
spec:
  selector:
    matchLabels: {app: azure-origin}
  template:
    metadata:
      labels:
        app: azure-origin
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: azure-origin
      nodeSelector: {racer-weights: "true"}
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        # Must match the Racer cache socket directory's shared group.
        supplementalGroups: [65532]
      containers:
        - name: origin
          image: ghcr.io/azure/racer-object:REPLACE_TAG
          args: [backend, --config=/config/objects.json, --socket=/dev/racer/weights/origin, --concurrency=32]
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: sockets, mountPath: /dev/racer/weights}
          resources:
            requests: {cpu: "1", memory: 160Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: config
          configMap: {name: objects}
        - name: sockets
          hostPath: {path: /dev/racer/weights, type: Directory}
---
# Example frontend and vLLM pod. Supply the pinned plugin in the vLLM image,
# a local config/tokenizer PVC, and suitable GPU resources for your model.
apiVersion: v1
kind: Pod
metadata:
  name: weights-client
  namespace: racer-weights
spec:
  automountServiceAccountToken: false
  nodeSelector: {racer-weights: "true"}
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    supplementalGroups: [65532]
  containers:
    - name: vllm
      image: REPLACE_VLLM_IMAGE_WITH_RACER_OBJECT_PLUGIN
      command: [vllm, serve, /models/local-config]
      args:
        - --load-format=racer_object
        - '--model-loader-extra-config={"files":["s3://models/model.safetensors"],"concurrency":16}'
      env:
        - {name: AWS_ENDPOINT_URL, value: "http://127.0.0.1:8000"}
        - {name: RUNAI_STREAMER_S3_ENDPOINT, value: "http://127.0.0.1:8000"}
        - {name: AWS_ACCESS_KEY_ID, value: local}
        - {name: AWS_SECRET_ACCESS_KEY, value: local}
        - {name: AWS_DEFAULT_REGION, value: us-east-1}
        - {name: AWS_EC2_METADATA_DISABLED, value: "true"}
      volumeMounts:
        - {name: model-config, mountPath: /models/local-config, readOnly: true}
      resources:
        limits: {nvidia.com/gpu: "1"}
  initContainers:
    # A native sidecar starts before vLLM; HTTP accepts only after initialization.
    - name: frontend
      restartPolicy: Always
      image: ghcr.io/azure/racer-object:REPLACE_TAG
      args: [frontend, --config=/config/objects.json, --socket=/dev/racer/weights/cache, --concurrency=64]
      startupProbe:
        exec:
          command: [/bin/bash, -c, 'test -S /dev/racer/weights/cache && : >/dev/tcp/127.0.0.1/8000']
        failureThreshold: 60
        periodSeconds: 2
      volumeMounts:
        - {name: config, mountPath: /config, readOnly: true}
        - {name: sockets, mountPath: /dev/racer/weights, readOnly: true}
      resources:
        requests: {cpu: "1", memory: 32Mi}
        limits: {memory: 128Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
  volumes:
    - name: model-config
      persistentVolumeClaim: {claimName: REPLACE_LOCAL_CONFIG_PVC}
    - name: config
      configMap: {name: objects}
    - name: sockets
      hostPath: {path: /dev/racer/weights, type: Directory}
