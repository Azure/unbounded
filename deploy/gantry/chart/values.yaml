image:
  reference: ""
  repository: ghcr.io/azure/gantry
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

namespace:
  create: false

manager: helm

# Rollout strategy for the agent DaemonSet. Lower maxUnavailable on large
# clusters to bound how many nodes lose the local mirror at once.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 50%

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - operator: Exists

containerd:
  hostPath: /run/containerd
  mountPath: /run/containerd
  socketPath: /run/containerd/containerd.sock
  namespace: k8s.io
  socketGroup: 0

nodeConfig:
  enabled: true
  hostPath: /etc/containerd/certs.d
  reconcileIntervalSeconds: 5

# Optional headless Service over the agents' Prometheus endpoint (:9095), for
# scrapers that discover targets from Services or their annotations.
metricsService:
  enabled: false
  annotations: {}

overlaybdConfig:
  enabled: false
  # The socket must be directly inside the shared /run/gantry-overlaybd directory.
  address: /run/gantry-overlaybd/gantry-overlaybd.sock
  # Both snapshotter reads and configurator readiness use this listener.
  gantryEndpoint: http://127.0.0.1:5000/blobs
  snapshotterRoot: /var/lib/gantry/snapshotter
  fallbackSnapshotter: overlayfs
  nbdDeviceGlob: /dev/nbd*
  nbdMaxDevices: "1024"
  nbdMinDevices: "64"
  image:
    reference: ""
    repository: ghcr.io/azure/gantry-node-config
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  nodeSelector: {}
  tolerations:
    - operator: Exists

registryCredentials:
  secretName: gantry-registry-credentials

resources:
  agent:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: "8"
      memory: 8Gi
  # gantry init loads the full gantry binary. Its working set on a cold node is
  # about 46Mi, and a limit close to that makes it thrash instead of exiting.
  init:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  nodeConfig:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      cpu: 50m
      memory: 16Mi
  overlaybdConfig:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
  overlaybdSnapshotter:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "4"
      memory: 4Gi

gantry:
  config: ""
  pprofListen: ""
  chairCount: 64
  chairSeedCount: 8
  peerFetchTimeout: 15m
  transferMaxConcurrentServes: 10
  artifactStreaming:
    enabled: false
    allowedHostSuffixes:
      - .azurecr.io
      - .data.mcr.microsoft.com
      - .blob.core.windows.net
  upstreamRegistries:
    - name: registry.example.com
      endpoint: https://registry.example.com
      credentialsPath: ""
      namespaceAlias: ""
  # Optional cachemesh content path (designs/gantry-cachemesh.md). Off by
  # default; when disabled nothing below is rendered and the agent behaves
  # exactly as without it. When enabled, blobs are striped into chunks owned
  # by individual agents, which pull each chunk from the origin once and relay
  # it hop by hop through the cachemesh grid; tags are cached with a TTL.
  # Zero or empty values use the agent defaults shown in parentheses.
  cachemesh:
    enabled: false
    # Expected number of agents (cachemesh default 1000). Set it close to the
    # node count: the first agent of a new mesh waits about expectedSize/20
    # seconds before it bootstraps.
    expectedSize: 0
    # Data-plane neighbors per agent (32). 32 forces multi-hop relays that
    # spread popular chunks over relay caches. The cachemesh library sizes
    # for 100k nodes with 256, which at about 150 agents makes every agent a
    # direct neighbor of every other one (a 1-D grid); set 256 to get that.
    maxNeighbors: 0
    # Stripe size in bytes, a power of two between 1MiB and 1GiB (64MiB).
    # Must be the same on every agent.
    chunkSize: 0
    # containerd content store directory on the node (holding blobs/ and
    # ingest/). It is mounted read-only into the agent at the same path,
    # and is the only on-disk copy of image data: agents keep chunks only
    # in memory and serve peers from the blobs (and in-progress downloads)
    # containerd writes there. The agent runs as a non-root user, so the
    # directory and blobs/ and ingest/ must be world-readable (containerd's
    # defaults are). Empty uses
    # /var/lib/containerd/io.containerd.content.v1.content.
    contentRoot: ""
    # Memory fills borrow beyond their 4MiB window when a reader lags behind
    # a fill that peers also read and the content store does not hold the
    # bytes yet, and to keep chunks peers read (or this agent owns) in
    # memory for later peers (up to 30s unused). When exhausted, the slowest
    # such reader paces the fill (2GiB). Chunk memory is at most about this
    # plus 4MiB per concurrent fill plus 1MiB per active reader; measured
    # peaks were about 3GiB during a 142-node 40GB pull and about 0.6GiB
    # idle. The default 8Gi memory limit is ample; 4Gi also held in the
    # benchmark.
    inflightBytes: 0
    # Concurrent chunk fills from peers or the origin (64).
    maxConcurrentChunkFills: 0
    # Serve anonymous manifest-by-tag requests from the mesh metadata cache.
    cacheTags: true
    # Hash every full blob served through the mesh; a mismatch aborts the
    # response before its last byte and drops the cached chunks.
    verifyDigest: true
