image:
  reference: ""
  repository: ghcr.io/azure/gantry
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

namespace:
  create: false

manager: helm

# Rollout strategy for the agent DaemonSet. Lower maxUnavailable on large
# clusters to bound how many nodes lose the local mirror at once.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 50%

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - operator: Exists

containerd:
  hostPath: /run/containerd
  mountPath: /run/containerd
  socketPath: /run/containerd/containerd.sock
  namespace: k8s.io
  socketGroup: 0

nodeConfig:
  enabled: true
  hostPath: /etc/containerd/certs.d
  reconcileIntervalSeconds: 5

# Optional headless Service over the agents' Prometheus endpoint (:9095), for
# scrapers that discover targets from Services or their annotations.
metricsService:
  enabled: false
  annotations: {}

registryCredentials:
  secretName: gantry-registry-credentials

resources:
  agent:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: "8"
      memory: 8Gi
  # gantry init loads the full gantry binary. Its working set on a cold node is
  # about 46Mi, and a limit close to that makes it thrash instead of exiting.
  init:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  nodeConfig:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      cpu: 50m
      memory: 16Mi

gantry:
  config: ""
  pprofListen: ""
  chairCount: 64
  chairSeedCount: 8
  peerFetchTimeout: 15m
  transferMaxConcurrentServes: 10
  upstreamRegistries:
    - name: registry.example.com
      endpoint: https://registry.example.com
      credentialsPath: ""
      namespaceAlias: ""
  # Optional cachemesh content path (designs/gantry-cachemesh.md). Off by
  # default; when disabled nothing below is rendered and the agent behaves
  # exactly as without it. When enabled, blobs are striped into chunks owned
  # by individual agents, which pull each chunk from the origin once and relay
  # it hop by hop through the cachemesh grid; tags are cached with a TTL.
  # Zero or empty values use the agent defaults shown in parentheses.
  cachemesh:
    enabled: false
    # Expected number of agents (cachemesh default 1000). Set it close to the
    # node count: the first agent of a new mesh waits about expectedSize/20
    # seconds before it bootstraps.
    expectedSize: 0
    # Data-plane neighbors per agent (32). 32 forces multi-hop relays that
    # spread popular chunks over relay caches. The cachemesh library sizes
    # for 100k nodes with 256, which at about 150 agents makes every agent a
    # direct neighbor of every other one (a 1-D grid); set 256 to get that.
    maxNeighbors: 0
    # Agents per grid cell (4).
    cellSize: 0
    # log2 of the partition count (20).
    partitionBits: 0
    # Stripe size in bytes, a power of two between 1MiB and 1GiB (64MiB).
    # Must be the same on every agent.
    chunkSize: 0
    # Chunks live in files in an emptyDir volume mounted at
    # /var/lib/gantry/cachemesh (wiped at agent start). Disk budget in bytes
    # for chunk files, including chunks being written (20GiB).
    diskCacheBytes: 0
    # Optional sizeLimit of the chunk emptyDir, for example "24Gi". Keep it
    # above diskCacheBytes: the kubelet evicts the pod when it is exceeded.
    chunkDirSizeLimit: ""
    # Hot page tier in bytes: pages read from disk by concurrent readers that
    # stay in memory (256MiB). Chunk memory is about this plus pageSize x
    # (fillPages x maxConcurrentChunkFills + one page per active reader), so
    # the defaults stay under 1GiB and the default 8Gi memory limit is ample.
    memoryCacheBytes: 0
    # Unit of in-flight buffers, disk I/O, read coalescing, and the hot tier
    # (1MiB): a power of two between 64KiB and chunkSize.
    pageSize: 0
    # In-flight pages per chunk fill (4).
    fillPages: 0
    # Page cache use of chunk files: bypass (O_DIRECT), drop (buffered, then
    # fadvise DONTNEED), or keep ("bypass").
    pageCache: ""
    # Chunks written to disk: all, shared (only chunks this agent owns or
    # serves to a peer), or owned (only chunks this agent owns) ("all").
    persist: ""
    # Chunks of one blob fetched ahead of the one being written (8).
    lookahead: 0
    # Concurrent chunk fills from peers or the origin (64).
    maxConcurrentChunkFills: 0
    # Concurrent chunk responses to peers (512); more get 429.
    maxConcurrentChunkServes: 0
    # Per-attempt chunk timeout (5m) and no-progress timeout (30s).
    chunkTimeout: ""
    chunkStallTimeout: ""
    # Attempts per chunk (4).
    chunkAttempts: 0
    # Freshness of cached tag resolutions, at least 5m (5m).
    metadataTTL: ""
    # Serve anonymous manifest-by-tag requests from the mesh metadata cache.
    cacheTags: true
    # Hash every full blob served through the mesh; a mismatch aborts the
    # response before its last byte and drops the cached chunks.
    verifyDigest: true
    # Hedge slow chunk requests to an alternate peer.
    hedge: true
    # Lease that elects the mesh leader ("gantry-cachemesh").
    leaseName: ""
