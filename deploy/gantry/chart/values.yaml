image:
  reference: ""
  repository: ghcr.io/azure/gantry
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

namespace:
  create: false

manager: helm

# Rollout strategy for the agent DaemonSet. Lower maxUnavailable on large
# clusters to bound how many nodes lose the local mirror at once.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 50%

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - operator: Exists

containerd:
  hostPath: /run/containerd
  mountPath: /run/containerd
  socketPath: /run/containerd/containerd.sock
  namespace: k8s.io
  socketGroup: 0

nodeConfig:
  enabled: true
  hostPath: /etc/containerd/certs.d
  reconcileIntervalSeconds: 5

# Optional headless Service over the agents' Prometheus endpoint (:9095), for
# scrapers that discover targets from Services or their annotations.
metricsService:
  enabled: false
  annotations: {}

overlaybdConfig:
  enabled: false
  address: /run/gantry-overlaybd/gantry-overlaybd.sock
  gantryEndpoint: http://127.0.0.1:5000/blobs
  snapshotterRoot: /var/lib/gantry/snapshotter
  containerdAddress: /run/containerd/containerd.sock
  fallbackSnapshotter: overlayfs
  nbdDeviceGlob: /dev/nbd*
  nbdMaxDevices: "1024"
  nbdMinDevices: "64"
  image:
    reference: ""
    repository: ghcr.io/azure/gantry-node-config
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  nodeSelector: {}
  tolerations:
    - operator: Exists

registryCredentials:
  secretName: gantry-registry-credentials

resources:
  agent:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: "8"
      memory: 8Gi
  init:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 32Mi
  nodeConfig:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      cpu: 50m
      memory: 16Mi
  overlaybdConfig:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
  overlaybdSnapshotter:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "4"
      memory: 4Gi

gantry:
  config: ""
  pprofListen: ""
  chairCount: 64
  chairSeedCount: 8
  peerFetchTimeout: 15m
  transferMaxConcurrentServes: 10
  artifactStreaming:
    enabled: false
    allowedHostSuffixes:
      - .azurecr.io
      - .data.mcr.microsoft.com
      - .blob.core.windows.net
  upstreamRegistries:
    - name: registry.example.com
      endpoint: https://registry.example.com
      credentialsPath: ""
      namespaceAlias: ""
