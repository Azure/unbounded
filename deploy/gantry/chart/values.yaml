image:
  reference: ""
  repository: ghcr.io/azure/gantry
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

namespace:
  create: false

manager: helm

# Rollout strategy for the agent DaemonSet. Lower maxUnavailable on large
# clusters to bound how many nodes lose the local mirror at once.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 50%

# Opt into the Racer backend and its root-owned Unix socket deployment model.
# Requires a separate ClusterVolume named gantry with spec.type: Cache.
# Runtime tuning remains in gantry.config (the complete Gantry config YAML).
racer:
  enabled: false

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - operator: Exists

containerd:
  hostPath: /run/containerd
  mountPath: /run/containerd
  socketPath: /run/containerd/containerd.sock
  namespace: k8s.io
  socketGroup: 0

nodeConfig:
  enabled: true
  hostPath: /etc/containerd/certs.d
  reconcileIntervalSeconds: 5

# Optional headless Service over the agents' Prometheus endpoint (:9095), for
# scrapers that discover targets from Services or their annotations.
metricsService:
  enabled: false
  annotations: {}

resources:
  agent:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: "8"
      memory: 8Gi
  init:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 32Mi
  nodeConfig:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      cpu: 50m
      memory: 16Mi

gantry:
  config: ""
  pprofListen: ""
  chairCount: 64
  chairSeedCount: 8
  peerFetchTimeout: 15m
  transferMaxConcurrentServes: 10
  upstreamRegistries:
    - name: registry.example.com
      endpoint: https://registry.example.com
      namespaceAlias: ""
