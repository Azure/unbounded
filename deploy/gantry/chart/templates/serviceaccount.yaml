# ServiceAccount + RBAC for the gantry agent.
#
# The agent manages fixed Lease chairs and reads its DaemonSet's desired
# capacity. It opens no watches and reads no Pods or Nodes.
{{- if .Values.namespace.create }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    {{- include "gantry.labels" . | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gantry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gantry.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gantry-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gantry.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gantry-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gantry.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gantry-agent
subjects:
  - kind: ServiceAccount
    name: gantry
    namespace: {{ .Release.Namespace }}
---
# Low priority class so the agent never displaces workload pods under
# cluster pressure. Containerd falls back to origin if the agent is
# absent, so a brief outage is workload-visible only as elevated
# origin pull rate.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: gantry-low
  labels:
    {{- include "gantry.labels" . | nindent 4 }}
  annotations:
    gantry.unbounded-cloud.io/manager: {{ .Values.manager | quote }}
    {{- if eq .Values.manager "helm" }}
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
    {{- end }}
value: -1000
globalDefault: false
description: "gantry P2P distribution agent (preemptible under cluster pressure)."