{{- include "gantry.validate" . }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gantry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gantry.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gantry
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
  template:
    metadata:
      labels:
        {{- include "gantry.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent
      {{- if eq .Values.manager "helm" }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: gantry
      hostNetwork: false
      dnsPolicy: ClusterFirst
      priorityClassName: gantry-low
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      terminationGracePeriodSeconds: 30
      {{- if not .Values.racer.enabled }}
      initContainers:
        - name: chown-hostpaths
          image: mcr.microsoft.com/cbl-mariner/busybox:2.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              chown -R 65532:65532 /var/lib/gantry/libp2p
              chmod 0700 /var/lib/gantry/libp2p
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.resources.init | nindent 12 }}
          volumeMounts:
            - name: libp2p
              mountPath: /var/lib/gantry/libp2p
      {{- end }}
      containers:
        - name: gantry
          image: {{ include "gantry.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - agent
            - --config=/etc/gantry/config.yaml
          env:
            {{- if .Values.racer.enabled }}
            - name: GANTRY_RACER_ENABLED
              value: "true"
            {{- end }}
            - name: GANTRY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GANTRY_CHAIR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: mirror
              containerPort: 5000
              hostPort: 5000
              hostIP: 127.0.0.1
              protocol: TCP
            {{- if not .Values.racer.enabled }}
            - name: transfer
              containerPort: 5001
              protocol: TCP
            - name: chaircall
              containerPort: 5002
              protocol: TCP
            - name: libp2p-tcp
              containerPort: 4001
              protocol: TCP
            {{- end }}
            - name: metrics
              containerPort: 9095
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.agent | nindent 12 }}
          securityContext:
            {{- if .Values.racer.enabled }}
            # Match root Racer's access to Gantry's private 0600 origin socket.
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            {{- else }}
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: {{ .Values.containerd.socketGroup }}
            {{- end }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            {{- if .Values.racer.enabled }}
            - name: racer-sockets
              mountPath: /run/racer/gantry
            {{- else }}
            - name: libp2p
              mountPath: /var/lib/gantry/libp2p
            {{- end }}
            - name: config
              mountPath: /etc/gantry
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if not .Values.racer.enabled }}
            - name: containerd-runtime
              mountPath: {{ .Values.containerd.mountPath }}
            {{- end }}
      volumes:
        {{- if .Values.racer.enabled }}
        - name: racer-sockets
          hostPath:
            path: /run/racer/gantry
            type: DirectoryOrCreate
        {{- else }}
        - name: libp2p
          hostPath:
            path: /var/lib/gantry/libp2p
            type: DirectoryOrCreate
        {{- end }}
        - name: config
          configMap:
            name: gantry-config
        - name: tmp
          emptyDir: {}
        {{- if not .Values.racer.enabled }}
        - name: containerd-runtime
          hostPath:
            path: {{ .Values.containerd.hostPath }}
            type: Directory
        {{- end }}
