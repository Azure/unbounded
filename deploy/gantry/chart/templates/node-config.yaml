{{- if .Values.nodeConfig.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gantry-containerd-hosts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gantry-containerd-config
    {{- include "gantry.managerLabel" . | nindent 4 }}
    app.kubernetes.io/component: node-config
data:
  {{- include "gantry.nodeConfigPayload" . | nindent 2 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gantry-containerd-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gantry-containerd-config
    {{- include "gantry.managerLabel" . | nindent 4 }}
    app.kubernetes.io/component: node-config
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gantry-containerd-config
      app.kubernetes.io/component: node-config
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gantry-containerd-config
        {{- include "gantry.managerLabel" . | nindent 8 }}
        app.kubernetes.io/component: node-config
      annotations:
        checksum/hosts-config: {{ include "gantry.nodeConfigPayload" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      priorityClassName: gantry-low
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: configure
          image: mcr.microsoft.com/cbl-mariner/busybox:2.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    set -eu
                    for managed_file in /host-certs/.gantry-managed/*/hosts.toml; do
                      [ -f "$managed_file" ] || continue
                      relative_path=${managed_file#/host-certs/.gantry-managed/}
                      target_file=/host-certs/$relative_path
                      if cmp -s "$managed_file" "$target_file"; then
                        rm -f "$target_file"
                      fi
                      rm -f "$managed_file"
                    done
          command:
            - sh
            - -c
            - |
              set -eu

              while true; do
                for managed_file in /host-certs/.gantry-managed/*/hosts.toml; do
                  [ -f "$managed_file" ] || continue
                  relative_path=${managed_file#/host-certs/.gantry-managed/}
                  [ ! -f "/config/$relative_path" ] || continue
                  target_file=/host-certs/$relative_path
                  if cmp -s "$managed_file" "$target_file"; then
                    rm -f "$target_file"
                    echo "removed stale $target_file"
                  else
                    echo "preserved modified or missing $target_file"
                  fi
                  rm -f "$managed_file"
                done
                for source_file in /config/*/hosts.toml; do
                  [ -f "$source_file" ] || continue
                  relative_path=${source_file#/config/}
                  target_file=/host-certs/$relative_path
                  target_dir=$(dirname "$target_file")
                  temp_file="$target_dir/.hosts.toml.gantry.tmp"
                  managed_file=/host-certs/.gantry-managed/$relative_path

                  mkdir -p "$target_dir" "$(dirname "$managed_file")"
                  if ! cmp -s "$source_file" "$managed_file"; then
                    cp "$source_file" "$managed_file.tmp"
                    mv "$managed_file.tmp" "$managed_file"
                  fi
                  if ! cmp -s "$managed_file" "$target_file"; then
                    cp "$managed_file" "$temp_file"
                    chmod 0644 "$temp_file"
                    mv "$temp_file" "$target_file"
                    echo "reconciled $target_file"
                  fi
                done
                sleep {{ .Values.nodeConfig.reconcileIntervalSeconds }}
              done
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  for source_file in /config/*/hosts.toml; do
                    [ -f "$source_file" ] || continue
                    relative_path=${source_file#/config/}
                    cmp -s "$source_file" "/host-certs/$relative_path" || exit 1
                  done
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.nodeConfig | nindent 12 }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: host-certs
              mountPath: /host-certs
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: host-certs
          hostPath:
            path: {{ .Values.nodeConfig.hostPath }}
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: gantry-containerd-hosts
            items:
              {{- if .Values.gantry.artifactStreaming.enabled }}
              {{- range $index, $registry := .Values.gantry.upstreamRegistries }}
              - key: hosts-{{ $index }}.toml
                path: {{ $registry.name }}/hosts.toml
              {{- end }}
              {{- else }}
              - key: hosts.toml
                path: _default/hosts.toml
              {{- end }}
{{- end }}