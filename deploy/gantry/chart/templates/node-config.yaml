{{- if .Values.nodeConfig.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gantry-containerd-hosts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gantry-containerd-config
    {{- include "gantry.managerLabel" . | nindent 4 }}
    app.kubernetes.io/component: node-config
data:
  hosts.toml: |
    {{- include "gantry.nodeConfigHosts" . | nindent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gantry-containerd-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gantry-containerd-config
    {{- include "gantry.managerLabel" . | nindent 4 }}
    app.kubernetes.io/component: node-config
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gantry-containerd-config
      app.kubernetes.io/component: node-config
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gantry-containerd-config
        {{- include "gantry.managerLabel" . | nindent 8 }}
        app.kubernetes.io/component: node-config
      annotations:
        checksum/hosts-config: {{ include "gantry.nodeConfigHosts" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      priorityClassName: gantry-low
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: configure
          image: mcr.microsoft.com/cbl-mariner/busybox:2.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    target_file=/host-certs/_default/hosts.toml
                    if cmp -s /config/hosts.toml "$target_file"; then
                      rm -f "$target_file"
                    fi
          command:
            - sh
            - -c
            - |
              set -eu

              target_dir=/host-certs/_default
              target_file="$target_dir/hosts.toml"
              source_file=/config/hosts.toml
              temp_file="$target_dir/.hosts.toml.gantry.tmp"

              while true; do
                mkdir -p "$target_dir"
                if ! cmp -s "$source_file" "$target_file"; then
                  cp "$source_file" "$temp_file"
                  chmod 0644 "$temp_file"
                  mv "$temp_file" "$target_file"
                  echo "reconciled $target_file"
                fi
                sleep {{ .Values.nodeConfig.reconcileIntervalSeconds }}
              done
          readinessProbe:
            exec:
              command:
                - cmp
                - -s
                - /config/hosts.toml
                - /host-certs/_default/hosts.toml
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.nodeConfig | nindent 12 }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: host-certs
              mountPath: /host-certs
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: host-certs
          hostPath:
            path: {{ .Values.nodeConfig.hostPath }}
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: gantry-containerd-hosts
{{- end }}