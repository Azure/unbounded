# Merge this data key into an existing overrides ConfigMap when one is present.
# Provision ClusterCache/gantry before activating the workload.
apiVersion: v1
kind: ConfigMap
metadata:
  name: unbounded-component-overrides
  namespace: unbounded-system
data:
  gantry-racer.yaml: |
    apiVersion: overrides.unbounded-cloud.io/v1alpha1
    overrides:
      - component: gantry
        kind: DaemonSet
        patch:
          spec:
            template:
              spec:
                containers:
                  - name: gantry
                    env:
                      - name: GANTRY_RACER_ENABLED
                        value: "true"
                    securityContext:
                      runAsNonRoot: false
                      runAsUser: 0
                      runAsGroup: 0
                    volumeMounts:
                      - name: racer-sockets
                        mountPath: /run/racer/gantry
                volumes:
                  - name: racer-sockets
                    hostPath:
                      path: /run/racer/gantry
                      type: DirectoryOrCreate
