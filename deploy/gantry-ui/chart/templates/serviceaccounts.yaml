apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gantry-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gantry-ui.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.azure.clientID | quote }}
{{- if .Values.builder.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gantry-ui.fullname" . }}-builder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gantry-ui.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.builder.azure.clientID | quote }}
{{- end }}
{{- if .Values.reclaimer.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gantry-ui.fullname" . }}-reclaimer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gantry-ui.labels" . | nindent 4 }}
{{- end }}
