apiVersion: v1
kind: ServiceAccount
metadata:
  name: gantry-reclaimer
  namespace: gantry-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gantry-demo-reclaimer-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gantry-demo-reclaimer-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gantry-demo-reclaimer-nodes
subjects:
  - kind: ServiceAccount
    name: gantry-reclaimer
    namespace: gantry-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gantry-reclaimer
  namespace: gantry-demo
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gantry-reclaimer
  namespace: gantry-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gantry-reclaimer
subjects:
  - kind: ServiceAccount
    name: gantry-reclaimer
    namespace: gantry-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gantry-ui-reclaim-retry
  namespace: gantry-demo
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: ["gantry-reclaim"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gantry-ui-reclaim-retry
  namespace: gantry-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gantry-ui-reclaim-retry
subjects:
  - kind: ServiceAccount
    name: gantry-ui
    namespace: gantry-demo
