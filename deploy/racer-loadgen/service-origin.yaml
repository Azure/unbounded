apiVersion: v1
kind: Service
metadata:
  name: racer-loadgen-origin
  labels:
    app.kubernetes.io/name: racer-loadgen
spec:
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: racer-loadgen
  ports:
    - name: origin
      port: 8080
      targetPort: origin
      protocol: TCP
