apiVersion: v1
kind: Service
metadata:
  name: racer-loadgen-origin
  labels:
    app.kubernetes.io/name: racer-loadgen
spec:
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: racer-loadgen
  ports:
    - name: origin
      port: 8080
      targetPort: origin
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: racer-s3-loadgen-metrics
spec:
  selector:
    app.kubernetes.io/name: racer-s3-loadgen
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
