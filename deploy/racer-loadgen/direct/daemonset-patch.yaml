apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: racer-loadgen
spec:
  template:
    spec:
      # Inherits the base pod securityContext: runAsNonRoot with UID/GID 65532,
      # the owner the racer-dataplane assigns to the origin directory.
      containers:
        - name: racer-loadgen
          # Replace all OCI arguments: generic blobs exclude image sizing flags.
          args:
            - --backend=uds
            - --cache=racer-loadgen
            - --metrics-listen=:9090
            - --catalog-blobs=128
            - --blob-bytes=67108864
            - --seed=benchmark-v1
            - --profile=shuffle
            - --concurrency=8
            - --blob-concurrency=1
            - --pull-timeout=2m
            - --retry-delay=1s
            - --interval=0s
            - --verify=true
            - --start-delay=10s
          ports:
            - name: origin
              containerPort: 8080
              $patch: delete
          resources:
            requests:
              memory: 256Mi
          volumeMounts:
            - name: racer-client
              mountPath: /run/racer/racer-loadgen/client
            - name: racer-origin
              mountPath: /run/racer/racer-loadgen/origin
      # The racer-dataplane creates both directories once it publishes the
      # cache. Type Directory keeps the pod in ContainerCreating until then
      # instead of creating root-owned directories the origin cannot use.
      volumes:
        - name: racer-client
          hostPath:
            path: /run/racer/racer-loadgen/client
            type: Directory
        - name: racer-origin
          hostPath:
            path: /run/racer/racer-loadgen/origin
            type: Directory
