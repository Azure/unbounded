---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: unboundednodeclasses.karpenter.unbounded-cloud.io
spec:
  group: karpenter.unbounded-cloud.io
  names:
    categories:
    - karpenter
    kind: UnboundedNodeClass
    listKind: UnboundedNodeClassList
    plural: unboundednodeclasses
    shortNames:
    - unc
    - uncs
    singular: unboundednodeclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          UnboundedNodeClass selects existing Machine inventory and describes the
          instance capacity Karpenter may allocate from it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              configurationRef:
                description: |-
                  ConfigurationRef selects the MachineConfiguration applied before
                  provisioning a reserved Machine.
                properties:
                  name:
                    description: Name is the name of the MachineConfiguration.
                    minLength: 1
                    type: string
                  version:
                    description: |-
                      Version is the specific MachineConfigurationVersion number to
                      use. If omitted, the controller selects the latest locked
                      (deployed) version and populates this field.
                    format: int32
                    type: integer
                required:
                - name
                type: object
              domain:
                description: Domain restricts Machines to unbounded-cloud.io/capacity-domain.
                type: string
              imagePolicy:
                description: ImagePolicy defines the exact configured and observed
                  worker image.
                properties:
                  requireNVIDIA:
                    description: |-
                      RequireNVIDIA requires NVIDIA worker support. Dedicated GB200 capacity
                      always requires this field.
                    type: boolean
                  requiredImage:
                    description: RequiredImage is an exact OCI image reference.
                    pattern: ^.+@sha256:[a-f0-9]{64}$
                    type: string
                required:
                - requiredImage
                type: object
              instanceTypes:
                description: InstanceTypes lists every capacity shape exposed to Karpenter.
                items:
                  properties:
                    architecture:
                      default: amd64
                      description: Architecture is a Kubernetes architecture label
                        value.
                      type: string
                    capacity:
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      description: |-
                        Capacity is the full resource capacity. CPU, memory, and pods are
                        required. GPU profiles must also declare nvidia.com/gpu.
                      type: object
                    capacityType:
                      default: on-demand
                      description: CapacityType is the Karpenter capacity type.
                      type: string
                    gpu:
                      description: GPU defines exact accelerator and health requirements.
                      properties:
                        count:
                          format: int32
                          minimum: 1
                          type: integer
                        model:
                          minLength: 1
                          type: string
                        requireFabric:
                          type: boolean
                        vendor:
                          enum:
                          - NVIDIA
                          type: string
                      required:
                      - count
                      - model
                      - vendor
                      type: object
                    name:
                      description: Name is the value of node.kubernetes.io/instance-type.
                      minLength: 1
                      type: string
                    operatingSystem:
                      default: linux
                      description: OperatingSystem is a Kubernetes OS label value.
                      type: string
                    zone:
                      description: Zone is the topology zone exposed to Karpenter.
                      minLength: 1
                      type: string
                  required:
                  - capacity
                  - name
                  - zone
                  type: object
                  x-kubernetes-validations:
                  - message: GB200 instance capacity requires NVIDIA, exactly 4 GPUs,
                      and fabric health
                    rule: '!has(self.gpu) || self.gpu.model != ''GB200'' || (self.gpu.vendor
                      == ''NVIDIA'' && self.gpu.count == 4 && self.gpu.requireFabric)'
                minItems: 1
                type: array
              labels:
                additionalProperties:
                  type: string
                description: Labels are applied to hydrated NodeClaims and joining
                  Nodes.
                type: object
              machineSelector:
                description: MachineSelector selects the physical Machine inventory
                  this class owns.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              requirements:
                description: Requirements are additional fixed provider requirements.
                items:
                  description: |-
                    A node selector requirement is a selector that contains values, a key, and an operator
                    that relates the key and values.
                  properties:
                    key:
                      description: The label key that the selector applies to.
                      type: string
                    operator:
                      description: |-
                        Represents a key's relationship to a set of values.
                        Valid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt.
                      type: string
                    values:
                      description: |-
                        An array of string values. If the operator is In or NotIn,
                        the values array must be non-empty. If the operator is Exists or DoesNotExist,
                        the values array must be empty. If the operator is Gt or Lt, the values
                        array must have a single element, which will be interpreted as an integer.
                        This array is replaced during a strategic merge patch.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                  required:
                  - key
                  - operator
                  type: object
                type: array
              site:
                description: Site restricts Machines to unbounded-cloud.io/site.
                type: string
            required:
            - configurationRef
            - imagePolicy
            - instanceTypes
            - machineSelector
            type: object
            x-kubernetes-validations:
            - message: requireNVIDIA requires an exact requiredImage trust anchor
              rule: '!self.imagePolicy.requireNVIDIA || size(self.imagePolicy.requiredImage)
                > 0'
          status:
            properties:
              conditions:
                description: Conditions contains the standard operator Ready condition.
                items:
                  description: Condition aliases the upstream type and adds additional
                    helper methods
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
