          status:
            description: MachineStatus defines the observed state of a Machine.
            properties:
              agent:
                description: Agent holds the applied agent settings.
                properties:
                  image:
                    description: |-
                      Image is the agent image from spec.agent.image, recorded when the
                      machine is set up over SSH. It is empty for the default image and does
                      not change on repave.
                    type: string
                type: object
              bootstrap:
                description: |-
                  Bootstrap records the bootstrap credential most recently issued to
                  this Machine by TPM attestation.
                properties:
                  credentialID:
                    description: |-
                      CredentialID is the ID of the most recent bootstrap ServiceAccount
                      token issued for this Machine, in the form the API server reports in
                      the authentication.kubernetes.io/credential-id user extra
                      (for example "JTI=<uuid>"). Kubelet client certificate requests made
                      with the token are approved only for NodeName.
                    type: string
                  issuedAt:
                    description: IssuedAt is when the credential was issued.
                    format: date-time
                    type: string
                  nodeName:
                    description: |-
                      NodeName is the Kubernetes Node name the credential was issued for.
                      It is the name written into the agent config served to the host, so
                      later spec.kubernetes.nodeRef edits do not change which node the
                      credential may claim.
                    type: string
                type: object
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  machine's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              configuration:
                description: |-
                  Configuration is the configuration version last applied to the node,
                  recorded when the Node object is deleted. Not set at first install yet.
                properties:
                  name:
                    description: Name is the MachineConfiguration name.
                    type: string
                  version:
                    description: Version is the MachineConfigurationVersion number
                      that was applied.
                    format: int32
                    type: integer
                  versionName:
                    description: |-
                      VersionName is the full MachineConfigurationVersion object name
                      (e.g. "myconfig-v3").
                    type: string
                type: object
              message:
                description: Message provides additional status information.
                type: string
              observedProvisioningFormat:
                description: |-
                  ObservedProvisioningFormat is the agent's explicit installation observation.
                  It does not override desired replacement image settings.
                enum:
                - CloudInit
                - Ignition
                type: string
              phase:
                description: |-
                  Phase is the machine's current stage: Pending, Provisioning, Joining,
                  Ready or Failed. It is set by the system; conditions give more detail.
                type: string
              redfish:
                description: Redfish holds observed Redfish state.
                properties:
                  certFingerprint:
                    description: |-
                      CertFingerprint is the TLS certificate fingerprint for the
                      Redfish endpoint, pinned on first connection.
                    type: string
                type: object
              ssh:
                description: SSH holds observed SSH state.
                properties:
                  fingerprint:
                    description: |-
                      Fingerprint is meant to hold the SSH host key seen on first connection.
                      Not set yet, and SSH host keys are not checked.
                    type: string
                type: object
              tpm:
                description: TPM holds observed TPM state.
                properties:
                  ekPublicKey:
                    description: |-
                      EKPublicKey is the TPM endorsement key public key, written
                      when the PXE boot image requests a bootstrap token.
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
