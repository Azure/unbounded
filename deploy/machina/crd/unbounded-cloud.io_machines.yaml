                          name:
                            description: Name of the Secret.
                            type: string
                          namespace:
                            description: |-
                              Namespace of the Secret. Ignored for SSH and bastion keys, which must be
                              in machina's namespace.
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      username:
                        default: azureuser
                        description: Username is the SSH username for the bastion.
                        type: string
                    required:
                    - host
                    type: object
                  host:
                    description: |-
                      Host is the hostname or IP address of the machine, optionally
                      including the port (e.g. "1.2.3.4:2222"). When the port is
                      omitted, 22 is assumed.
                    type: string
                  privateKeyRef:
                    description: PrivateKeyRef references a secret containing the
