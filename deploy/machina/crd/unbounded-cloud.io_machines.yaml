---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: machines.unbounded-cloud.io
spec:
  group: unbounded-cloud.io
  names:
    kind: Machine
    listKind: MachineList
    plural: machines
    shortNames:
    - mach
    singular: machine
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.ssh.host
      name: Host
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.kubernetes.version
      name: K8s Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: Machine represents a machine that can be managed by machina.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MachineSpec defines the desired state of a Machine.
            properties:
              agent:
                description: Agent contains settings for the unbounded node agent.
                properties:
                  baseURL:
                    description: |-
                      BaseURL overrides the base URL used to construct the
                      unbounded-agent download URL. Defaults to the upstream GitHub
                      releases URL. The layout under BaseURL must match the GitHub
                      releases layout (<base>/latest/download/<asset> and
                      <base>/download/<tag>/<asset>).
                    type: string
                  downloads:
                    description: |-
                      Downloads overrides the download sources for the binaries the
                      agent installs into the nspawn rootfs (kubelet, containerd, runc,
                      CNI plugins, crictl). When unset the agent downloads each
                      artifact from its upstream default host.
                    properties:
                      cni:
                        description: |-
                          CNI overrides the download source for CNI plugins
                          (upstream default: https://github.com/containernetworking/plugins).
                        properties:
                          baseURL:
                            description: |-
                              BaseURL replaces the upstream host + path prefix used to
                              construct the download URL. Version and arch substitution are
                              preserved so mirrors need to publish assets under the same
                              layout as the upstream project.
                            type: string
                          url:
                            description: |-
                              URL is a fully qualified download URL template. Version/arch
                              substitution via fmt directives is preserved. When set it
                              overrides BaseURL entirely.
                            type: string
                          version:
                            description: |-
                              Version overrides the version of the artifact that would
                              otherwise be derived from the cluster Kubernetes version or the
                              agent's compiled-in defaults.
                            type: string
                        type: object
                      containerd:
                        description: |-
                          Containerd overrides the download source for containerd
                          (upstream default: https://github.com/containerd/containerd).
                        properties:
                          baseURL:
                            description: |-
                              BaseURL replaces the upstream host + path prefix used to
                              construct the download URL. Version and arch substitution are
                              preserved so mirrors need to publish assets under the same
                              layout as the upstream project.
                            type: string
                          url:
                            description: |-
                              URL is a fully qualified download URL template. Version/arch
                              substitution via fmt directives is preserved. When set it
                              overrides BaseURL entirely.
                            type: string
                          version:
                            description: |-
                              Version overrides the version of the artifact that would
                              otherwise be derived from the cluster Kubernetes version or the
                              agent's compiled-in defaults.
                            type: string
                        type: object
                      coreDNS:
                        description: CoreDNS overrides the download source for CoreDNS.
                        properties:
                          baseURL:
                            description: |-
                              BaseURL replaces the upstream host + path prefix used to
                              construct the download URL. Version and arch substitution are
                              preserved so mirrors need to publish assets under the same
                              layout as the upstream project.
                            type: string
                          url:
                            description: |-
                              URL is a fully qualified download URL template. Version/arch
                              substitution via fmt directives is preserved. When set it
                              overrides BaseURL entirely.
                            type: string
                          version:
                            description: |-
                              Version overrides the version of the artifact that would
                              otherwise be derived from the cluster Kubernetes version or the
                              agent's compiled-in defaults.
                            type: string
                        type: object
                      crictl:
                        description: |-
                          Crictl overrides the download source for crictl
                          (upstream default: https://github.com/kubernetes-sigs/cri-tools).
                        properties:
                          baseURL:
                            description: |-
                              BaseURL replaces the upstream host + path prefix used to
                              construct the download URL. Version and arch substitution are
                              preserved so mirrors need to publish assets under the same
                              layout as the upstream project.
                            type: string
                          url:
                            description: |-
                              URL is a fully qualified download URL template. Version/arch
                              substitution via fmt directives is preserved. When set it
                              overrides BaseURL entirely.
                            type: string
                          version:
                            description: |-
                              Version overrides the version of the artifact that would
                              otherwise be derived from the cluster Kubernetes version or the
                              agent's compiled-in defaults.
                            type: string
                        type: object
                      kubernetes:
                        description: |-
                          Kubernetes overrides the download source for kubelet/kubectl/kube-proxy
                          (upstream default: https://dl.k8s.io).
                        properties:
                          baseURL:
                            description: |-
                              BaseURL replaces the upstream host + path prefix used to
                              construct the download URL. Version and arch substitution are
                              preserved so mirrors need to publish assets under the same
                              layout as the upstream project.
                            type: string
                          url:
                            description: |-
                              URL is a fully qualified download URL template. Version/arch
                              substitution via fmt directives is preserved. When set it
                              overrides BaseURL entirely.
                            type: string
                          version:
                            description: |-
                              Version overrides the version of the artifact that would
                              otherwise be derived from the cluster Kubernetes version or the
                              agent's compiled-in defaults.
                            type: string
                        type: object
                      runc:
                        description: |-
                          Runc overrides the download source for runc
                          (upstream default: https://github.com/opencontainers/runc).
                        properties:
                          baseURL:
                            description: |-
                              BaseURL replaces the upstream host + path prefix used to
                              construct the download URL. Version and arch substitution are
                              preserved so mirrors need to publish assets under the same
                              layout as the upstream project.
                            type: string
                          url:
                            description: |-
                              URL is a fully qualified download URL template. Version/arch
                              substitution via fmt directives is preserved. When set it
                              overrides BaseURL entirely.
                            type: string
                          version:
                            description: |-
                              Version overrides the version of the artifact that would
                              otherwise be derived from the cluster Kubernetes version or the
                              agent's compiled-in defaults.
                            type: string
                        type: object
                    type: object
                  image:
                    description: |-
                      Image is the OCI image reference used for provisioning the
                      nspawn machine (e.g. "ghcr.io/org/repo:tag"). When empty the
                      agent falls back to its built-in default image.
                    type: string
                  localDNS:
                    description: LocalDNS configures the optional CoreDNS cache inside
                      the nspawn machine.
                    properties:
                      clusterListenerIP:
                        description: |-
                          ClusterListenerIP is the address where the cache answers DNS queries
                          from pods and passes them to the cluster DNS service. Defaults to
                          169.254.10.11.
                        type: string
                      corefileTemplate:
                        description: |-
                          CorefileTemplate replaces the default CoreDNS configuration. It is a Go
                          template that can use NodeListenerIP, ClusterListenerIP,
                          NodeUpstreamIPs, NodeUpstreamIPsJoined, ClusterDNSServiceIP and
                          MetricsAddress.
                        type: string
                      cpuLimitInMilliCores:
                        description: CPULimitInMilliCores limits the cache's CPU.
                          Defaults to 2000.
                        format: int32
                        type: integer
                      enabled:
                        description: |-
                          Enabled runs a CoreDNS cache on the node. The other fields apply only
                          when it is true.
                        type: boolean
                      memoryLimitInMB:
                        description: MemoryLimitInMB limits the cache's memory. Defaults
                          to 128.
                        format: int32
                        type: integer
                      metricsAddress:
                        description: |-
                          MetricsAddress is the IPv4 address and port, such as 10.0.0.5:9253, on
                          which the cache serves Prometheus metrics. Defaults to port 9253 on the
                          node's IPv4 address.
                        type: string
                      nodeListenerIP:
                        description: |-
                          NodeListenerIP is the address where the cache answers DNS queries from
                          the node itself and passes them to the host's DNS servers. Defaults to
                          169.254.10.10.
                        type: string
                      requiredPlugins:
                        description: |-
                          RequiredPlugins lists extra CoreDNS plugins that the CoreDNS binary
                          must include. Installation fails if one is missing.
                        items:
                          type: string
                        type: array
                    type: object
                  url:
                    description: |-
                      URL is a fully qualified download URL for the unbounded-agent
                      tarball. When set it overrides Version and BaseURL entirely.
                    type: string
                  version:
                    description: |-
                      Version pins the unbounded-agent release tag that is downloaded
                      onto the host (e.g. "v0.0.10"). When empty the install script
                      tracks the latest published release.
                    type: string
                type: object
              configurationRef:
                description: |-
                  ConfigurationRef names the MachineConfiguration, and optionally the
                  version, that this Machine uses. If empty, it is set automatically when
                  a MachineConfiguration's machineSelector matches. The version's node
                  settings are applied when the Node object is deleted, and its host image
                  by HostReplace; they are not used at first install yet.
                properties:
                  name:
                    description: Name is the name of the MachineConfiguration.
                    minLength: 1
                    type: string
                  version:
                    description: |-
                      Version is the MachineConfigurationVersion number to use. If empty, it
                      is set to the newest version. It does not move to newer versions on its
                      own.
                    format: int32
                    type: integer
                required:
                - name
                type: object
              host:
                description: |-
                  Host contains desired host settings and exactly one optional host owner.
                  New Machines should set one of Netboot, Azure, or External. Image alone
                  may be used with deprecated ownership fields during migration.
                properties:
                  azure:
                    description: Azure identifies an Azure VM managed by the built-in
                      Azure provider.
                    properties:
                      resourceID:
                        description: ResourceID is the full Azure Resource Manager
                          ID of the virtual machine.
                        minLength: 1
                        type: string
                    required:
                    - resourceID
                    type: object
                    x-kubernetes-validations:
                    - message: resourceID is immutable
                      rule: self.resourceID == oldSelf.resourceID
                  external:
                    description: External identifies a host managed by a registered
                      external provider.
                    properties:
                      machineRef:
                        description: |-
                          MachineRef identifies an optional provider-owned resource containing rich
                          provider-specific state for this Machine.
                        properties:
                          apiGroup:
                            description: APIGroup is the API group of the provider-owned
                              Machine resource.
                            minLength: 1
                            type: string
                          kind:
                            description: Kind is the kind of the provider-owned Machine
                              resource.
                            minLength: 1
                            type: string
                          name:
                            description: Name is the name of the cluster-scoped provider-owned
                              Machine resource.
                            minLength: 1
                            type: string
                        required:
                        - apiGroup
                        - kind
                        - name
                        type: object
                      provider:
                        description: Provider selects the registered provider controller
                          and its credentials.
                        minLength: 1
                        type: string
                      providerID:
                        description: |-
                          ProviderID is an opaque provider-specific host identifier. Providers that
                          replace the underlying resource may update it after a successful handoff.
                        type: string
                    required:
                    - provider
                    type: object
                    x-kubernetes-validations:
                    - message: providerID or machineRef is required
                      rule: has(self.providerID) || has(self.machineRef)
                    - message: machineRef is immutable
                      rule: has(self.machineRef) == has(oldSelf.machineRef) && (!has(self.machineRef)
                        || self.machineRef == oldSelf.machineRef)
                    - message: provider is immutable
                      rule: self.provider == oldSelf.provider
                  image:
                    description: |-
                      Image is an opaque provider-interpreted image identifier that HostReplace
                      installs. If empty, HostReplace uses the host image from the version in
                      configurationRef, or keeps the current image. Not used for netboot
                      hosts, which use netboot.image.
                    type: string
                  netboot:
                    description: |-
                      Netboot contains the machine-specific network boot configuration owned by
                      Metalman.
                    properties:
                      architecture:
                        default: amd64
                        description: |-
                          Architecture is the target CPU architecture for PXE boot artifacts and
                          machine images.
                        enum:
                        - amd64
                        - arm64
                        type: string
                      bootProtocol:
                        default: PXE
                        description: |-
                          BootProtocol selects how metalman should trigger network boot for
                          repaves. PXE uses DHCP/TFTP bootfile options. HTTP uses Redfish UEFI
                          HTTP boot with a URL derived from the netboot image metadata.
                          VirtualMedia mounts an operation-owned bootstrap ISO through Redfish.
                          It requires redfish, a digest Image, and a digest NetbootImage.
                        enum:
                        - PXE
                        - HTTP
                        - VirtualMedia
                        type: string
                      cloudInit:
                        description: |-
                          CloudInit contains optional cloud-init customization for PXE-booted
                          machines.
                        properties:
                          userDataConfigMapRef:
                            description: |-
                              UserDataConfigMapRef references a ConfigMap containing custom
                              cloud-init user-data. The referenced key (default "user-data")
                              must contain a valid cloud-init configuration (e.g. a
                              #cloud-config YAML document).
                            properties:
                              key:
                                default: user-data
                                description: Key within the ConfigMap.
                                type: string
                              name:
                                description: Name of the ConfigMap.
                                type: string
                              namespace:
                                description: Namespace of the ConfigMap.
                                type: string
                            required:
                            - name
                            - namespace
                            type: object
                        type: object
                      dhcpLeases:
                        description: |-
                          DHCPLeases defines static IPv4 provisioning network settings. PXE boot
                          uses them as DHCP leases. HTTP boot uses the first entry to configure the
                          Redfish UEFI HTTP boot client.
                        items:
                          description: DHCPLease defines static IPv4 provisioning
                            network settings.
                          properties:
                            dns:
                              description: DNS is a list of DNS server addresses.
                              items:
                                type: string
                              type: array
                            gateway:
                              description: Gateway is the default gateway.
                              type: string
                            ipv4:
                              description: IPv4 is the IP address to assign.
                              type: string
                            mac:
                              description: MAC is the MAC address of the network interface.
                              type: string
                            subnetMask:
                              description: SubnetMask is the subnet mask for the lease.
                              type: string
                          required:
                          - gateway
                          - ipv4
                          - mac
                          - subnetMask
                          type: object
                        type: array
                      image:
                        description: |-
                          Image is an OCI image reference containing the machine disk image.
                          The image must contain /disk/disk.img.gz.
                          VirtualMedia requires a digest reference (image@sha256:...).
                          Example: "ghcr.io/azure/host-ubuntu2404:v1"
                        type: string
                      netbootImage:
                        description: |-
                          NetbootImage is an OCI image reference containing the PXE boot
                          artifacts used to install Image. When omitted, metalman uses the
                          default netboot image that corresponds to its release.
                          VirtualMedia requires this field to be set to a digest reference
                          (image@sha256:...).
                        type: string
                      netbootPullSecretRef:
                        description: |-
                          NetbootPullSecretRef references a Docker registry credential Secret used to
                          pull NetbootImage. It is ignored when NetbootImage is omitted; metalman's
                          configured default netboot pull secret is used for the default netboot image.
                          The Secret must be type kubernetes.io/dockerconfigjson or
                          kubernetes.io/dockercfg.
                        properties:
                          name:
                            description: Name of the secret.
                            minLength: 1
                            type: string
                          namespace:
                            description: Namespace of the secret.
                            minLength: 1
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      pullSecretRef:
                        description: |-
                          PullSecretRef references a Docker registry credential Secret used to pull
                          Image. The Secret must be type kubernetes.io/dockerconfigjson or
                          kubernetes.io/dockercfg.
                        properties:
                          name:
                            description: Name of the secret.
                            minLength: 1
                            type: string
                          namespace:
                            description: Namespace of the secret.
                            minLength: 1
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      redfish:
                        description: Redfish configures optional Redfish BMC access.
                        properties:
                          deviceID:
                            default: "1"
                            description: |-
                              DeviceID is the Redfish system device ID. Defaults to "1".
                              It is ignored when the endpoint exposes a single system selected by its URL.
                            type: string
                          passwordRef:
                            description: |-
                              PasswordRef points to the Secret that holds the Redfish password. Set
                              key, because it defaults to "ssh-privatekey".
                            properties:
                              key:
                                default: ssh-privatekey
                                description: |-
                                  Key within the Secret. Defaults to "ssh-privatekey"; set it when the
                                  value is stored under another key, as it usually is for a Redfish
                                  password.
                                type: string
                              name:
                                description: Name of the Secret.
                                type: string
                              namespace:
                                description: |-
                                  Namespace of the Secret. Ignored for SSH and bastion keys, which must be
                                  in machina's namespace.
                                type: string
                            required:
                            - name
                            - namespace
                            type: object
                          url:
                            description: |-
                              URL is the Redfish endpoint URL. It may include a per-system path prefix,
                              for example https://manager:8080/7. Do not include /redfish/v1.
                            type: string
                          username:
                            description: Username is the Redfish username.
                            type: string
                        required:
                        - passwordRef
                        - url
                        - username
                        type: object
                      targetDisk:
                        description: |-
                          TargetDisk is the block device the installer writes the machine image to.
                          Examples: /dev/nvme0n1, /dev/sda, /dev/disk/by-id/...
                          When omitted, the installer chooses a target disk automatically.
                        type: string
                    required:
                    - image
                    type: object
                    x-kubernetes-validations:
                    - message: VirtualMedia requires redfish
                      rule: '!has(self.bootProtocol) || self.bootProtocol != ''VirtualMedia''
                        || has(self.redfish)'
                  provisioningFormat:
                    description: |-
                      ProvisioningFormat declares the first-boot format for the desired host
                      image. When preserving an image, omission falls back to the installed
                      observation, then CloudInit for legacy hosts. Image identifiers are opaque;
                      an explicit replacement image on a known Ignition host requires a format.
                    enum:
                    - CloudInit
                    - Ignition
                    type: string
                type: object
                x-kubernetes-validations:
                - message: at most one of netboot, azure, or external may be set
                  rule: '(has(self.netboot) ? 1 : 0) + (has(self.azure) ? 1 : 0) +
                    (has(self.external) ? 1 : 0) <= 1'
                - message: netboot host ownership is immutable once set
                  rule: '!has(oldSelf.netboot) || has(self.netboot)'
                - message: azure host ownership is immutable once set
                  rule: '!has(oldSelf.azure) || has(self.azure)'
                - message: external host ownership is immutable once set
                  rule: '!has(oldSelf.external) || has(self.external)'
              kubernetes:
                description: Kubernetes contains Kubernetes-specific configuration.
                properties:
                  bootstrapTokenRef:
                    description: |-
                      BootstrapTokenRef references a bootstrap token Secret in
                      kube-system. The secret must be of type
                      bootstrap.kubernetes.io/token with the well-known keys
                      "token-id" and "token-secret".
                    properties:
                      name:
                        description: Name of the referenced resource.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  nodeLabels:
                    additionalProperties:
                      type: string
                    description: NodeLabels are labels passed to kubelet's --node-labels
                      flag.
                    type: object
                  nodeRef:
                    description: NodeRef references the Node that corresponds to this
                      Machine.
                    properties:
                      name:
                        description: Name of the referenced resource.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  registerWithTaints:
                    description: |-
                      RegisterWithTaints are taints passed to kubelet's --register-with-taints flag.
                      Each entry uses the standard Kubernetes taint format: key=value:Effect.
                    items:
                      type: string
                    type: array
                  version:
                    description: |-
                      Version is the Kubernetes version to install (e.g., "v1.34.0").
                      When omitted the controller falls back to the cluster's
                      Kubernetes version.
                    type: string
                type: object
              provider:
                description: |-
                  Provider identifies the legacy external control provider for this machine.
                  New callers should use Host.External.Provider or Host.Azure.
                minLength: 1
                type: string
              providerID:
                description: |-
                  ProviderID identifies the underlying infrastructure resource for this
                  machine, using a Kubernetes-style provider ID such as
                  azure:///subscriptions/.../virtualMachines/name or oci://ocid1.instance...

                  This is a legacy field. New callers should use Host.External.ProviderID,
                  Host.External.MachineRef, or Host.Azure.ResourceID.
                type: string
              pxe:
                description: |-
                  PXE contains legacy PXE boot configuration for the machine. New callers
                  should use Host.Netboot.
                properties:
                  architecture:
                    default: amd64
                    description: |-
                      Architecture is the target CPU architecture for PXE boot artifacts and
                      machine images.
                    enum:
                    - amd64
                    - arm64
                    type: string
                  bootProtocol:
                    default: PXE
                    description: |-
                      BootProtocol selects how metalman should trigger network boot for
                      repaves. PXE uses DHCP/TFTP bootfile options. HTTP uses Redfish UEFI
                      HTTP boot with a URL derived from the netboot image metadata.
                      VirtualMedia mounts an operation-owned bootstrap ISO through Redfish.
                      It requires redfish, a digest Image, and a digest NetbootImage.
                    enum:
                    - PXE
                    - HTTP
                    - VirtualMedia
                    type: string
                  cloudInit:
                    description: |-
                      CloudInit contains optional cloud-init customization for PXE-booted
                      machines.
                    properties:
                      userDataConfigMapRef:
                        description: |-
                          UserDataConfigMapRef references a ConfigMap containing custom
                          cloud-init user-data. The referenced key (default "user-data")
                          must contain a valid cloud-init configuration (e.g. a
                          #cloud-config YAML document).
                        properties:
                          key:
                            default: user-data
                            description: Key within the ConfigMap.
                            type: string
                          name:
                            description: Name of the ConfigMap.
                            type: string
                          namespace:
                            description: Namespace of the ConfigMap.
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                    type: object
                  dhcpLeases:
                    description: |-
                      DHCPLeases defines static IPv4 provisioning network settings. PXE boot
                      uses them as DHCP leases. HTTP boot uses the first entry to configure the
                      Redfish UEFI HTTP boot client.
                    items:
                      description: DHCPLease defines static IPv4 provisioning network
                        settings.
                      properties:
                        dns:
                          description: DNS is a list of DNS server addresses.
                          items:
                            type: string
                          type: array
                        gateway:
                          description: Gateway is the default gateway.
                          type: string
                        ipv4:
                          description: IPv4 is the IP address to assign.
                          type: string
                        mac:
                          description: MAC is the MAC address of the network interface.
                          type: string
                        subnetMask:
                          description: SubnetMask is the subnet mask for the lease.
                          type: string
                      required:
                      - gateway
                      - ipv4
                      - mac
                      - subnetMask
                      type: object
                    type: array
                  image:
                    description: |-
                      Image is an OCI image reference containing the machine disk image.
                      The image must contain /disk/disk.img.gz.
                      VirtualMedia requires a digest reference (image@sha256:...).
                      Example: "ghcr.io/azure/host-ubuntu2404:v1"
                    type: string
                  netbootImage:
                    description: |-
                      NetbootImage is an OCI image reference containing the PXE boot
                      artifacts used to install Image. When omitted, metalman uses the
                      default netboot image that corresponds to its release.
                      VirtualMedia requires this field to be set to a digest reference
                      (image@sha256:...).
                    type: string
                  netbootPullSecretRef:
                    description: |-
                      NetbootPullSecretRef references a Docker registry credential Secret used to
                      pull NetbootImage. It is ignored when NetbootImage is omitted; metalman's
                      configured default netboot pull secret is used for the default netboot image.
                      The Secret must be type kubernetes.io/dockerconfigjson or
                      kubernetes.io/dockercfg.
                    properties:
                      name:
                        description: Name of the secret.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  pullSecretRef:
                    description: |-
                      PullSecretRef references a Docker registry credential Secret used to pull
                      Image. The Secret must be type kubernetes.io/dockerconfigjson or
                      kubernetes.io/dockercfg.
                    properties:
                      name:
                        description: Name of the secret.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  redfish:
                    description: Redfish configures optional Redfish BMC access.
                    properties:
                      deviceID:
