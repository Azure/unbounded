---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: machines.unbounded-cloud.io
spec:
  group: unbounded-cloud.io
  names:
    kind: Machine
    listKind: MachineList
    plural: machines
    shortNames:
    - mach
    singular: machine
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.ssh.host
      name: Host
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.kubernetes.version
      name: K8s Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: Machine represents a machine that can be managed by machina.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MachineSpec defines the desired state of a Machine.
            properties:
              agent:
                description: Agent contains settings for the unbounded node agent.
                properties:
                  baseURL:
                    description: |-
                      BaseURL overrides the base URL used to construct the
                      unbounded-agent download URL. Defaults to the upstream GitHub
                      releases URL. The layout under BaseURL must match the GitHub
                      releases layout (<base>/latest/download/<asset> and
                      <base>/download/<tag>/<asset>).
                    type: string
                  downloads:
                    description: |-
                      Downloads overrides the download sources for the binaries the
                      agent installs into the nspawn rootfs (kubelet, containerd, runc,
                      CNI plugins, crictl). When unset the agent downloads each
                      artifact from its upstream default host.
                    properties:
                      cni:
                        description: |-
                          CNI overrides the download source for CNI plugins
                          (upstream default: https://github.com/containernetworking/plugins).
                        properties:
                          baseURL:
                            description: |-
                              BaseURL replaces the upstream host + path prefix used to
                              construct the download URL. Version and arch substitution are
                              preserved so mirrors need to publish assets under the same
                              layout as the upstream project.
                            type: string
                          url:
                            description: |-
                              URL is a fully qualified download URL template. Version/arch
                              substitution via fmt directives is preserved. When set it
                              overrides BaseURL entirely.
                            type: string
                          version:
                            description: |-
                              Version overrides the version of the artifact that would
                              otherwise be derived from the cluster Kubernetes version or the
                              agent's compiled-in defaults.
                            type: string
                        type: object
                      containerd:
                        description: |-
                          Containerd overrides the download source for containerd
                          (upstream default: https://github.com/containerd/containerd).
                        properties:
                          baseURL:
                            description: |-
                              BaseURL replaces the upstream host + path prefix used to
                              construct the download URL. Version and arch substitution are
                              preserved so mirrors need to publish assets under the same
                              layout as the upstream project.
                            type: string
                          url:
                            description: |-
                              URL is a fully qualified download URL template. Version/arch
                              substitution via fmt directives is preserved. When set it
                              overrides BaseURL entirely.
                            type: string
                          version:
                            description: |-
                              Version overrides the version of the artifact that would
                              otherwise be derived from the cluster Kubernetes version or the
                              agent's compiled-in defaults.
                            type: string
                        type: object
                      coreDNS:
                        description: CoreDNS overrides the download source for CoreDNS.
                        properties:
                          baseURL:
                            description: |-
                              BaseURL replaces the upstream host + path prefix used to
                              construct the download URL. Version and arch substitution are
                              preserved so mirrors need to publish assets under the same
                              layout as the upstream project.
                            type: string
                          url:
                            description: |-
                              URL is a fully qualified download URL template. Version/arch
                              substitution via fmt directives is preserved. When set it
                              overrides BaseURL entirely.
                            type: string
                          version:
                            description: |-
                              Version overrides the version of the artifact that would
                              otherwise be derived from the cluster Kubernetes version or the
                              agent's compiled-in defaults.
                            type: string
                        type: object
                      crictl:
                        description: |-
                          Crictl overrides the download source for crictl
                          (upstream default: https://github.com/kubernetes-sigs/cri-tools).
                        properties:
                          baseURL:
                            description: |-
                              BaseURL replaces the upstream host + path prefix used to
                              construct the download URL. Version and arch substitution are
                              preserved so mirrors need to publish assets under the same
                              layout as the upstream project.
                            type: string
                          url:
                            description: |-
                              URL is a fully qualified download URL template. Version/arch
                              substitution via fmt directives is preserved. When set it
                              overrides BaseURL entirely.
                            type: string
                          version:
                            description: |-
                              Version overrides the version of the artifact that would
                              otherwise be derived from the cluster Kubernetes version or the
                              agent's compiled-in defaults.
                            type: string
                        type: object
                      kubernetes:
                        description: |-
                          Kubernetes overrides the download source for kubelet/kubectl/kube-proxy
                          (upstream default: https://dl.k8s.io).
                        properties:
                          baseURL:
                            description: |-
                              BaseURL replaces the upstream host + path prefix used to
                              construct the download URL. Version and arch substitution are
                              preserved so mirrors need to publish assets under the same
                              layout as the upstream project.
                            type: string
                          url:
                            description: |-
                              URL is a fully qualified download URL template. Version/arch
                              substitution via fmt directives is preserved. When set it
                              overrides BaseURL entirely.
                            type: string
                          version:
                            description: |-
                              Version overrides the version of the artifact that would
                              otherwise be derived from the cluster Kubernetes version or the
                              agent's compiled-in defaults.
                            type: string
                        type: object
                      runc:
                        description: |-
                          Runc overrides the download source for runc
                          (upstream default: https://github.com/opencontainers/runc).
                        properties:
                          baseURL:
                            description: |-
                              BaseURL replaces the upstream host + path prefix used to
                              construct the download URL. Version and arch substitution are
                              preserved so mirrors need to publish assets under the same
                              layout as the upstream project.
                            type: string
                          url:
                            description: |-
                              URL is a fully qualified download URL template. Version/arch
                              substitution via fmt directives is preserved. When set it
                              overrides BaseURL entirely.
                            type: string
                          version:
                            description: |-
                              Version overrides the version of the artifact that would
                              otherwise be derived from the cluster Kubernetes version or the
                              agent's compiled-in defaults.
                            type: string
                        type: object
                    type: object
                  image:
                    description: |-
                      Image is the OCI image reference used for provisioning the
                      nspawn machine (e.g. "ghcr.io/org/repo:tag"). When empty the
                      agent falls back to its built-in default image.
                    type: string
                  localDNS:
                    description: LocalDNS configures the optional CoreDNS cache inside
                      the nspawn machine.
                    properties:
                      clusterListenerIP:
                        type: string
                      corefileTemplate:
                        type: string
                      cpuLimitInMilliCores:
                        format: int32
                        type: integer
                      enabled:
                        type: boolean
                      memoryLimitInMB:
                        format: int32
                        type: integer
                      metricsAddress:
                        type: string
                      nodeListenerIP:
                        type: string
                      requiredPlugins:
                        items:
                          type: string
                        type: array
                    type: object
                  url:
                    description: |-
                      URL is a fully qualified download URL for the unbounded-agent
                      tarball. When set it overrides Version and BaseURL entirely.
                    type: string
                  version:
                    description: |-
                      Version pins the unbounded-agent release tag that is downloaded
                      onto the host (e.g. "v0.0.10"). When empty the install script
                      tracks the latest published release.
                    type: string
                type: object
              allocationRef:
                description: |-
                  AllocationRef identifies the MachineAllocation this Machine was
                  created for. It can be set only when the Machine is created.
                properties:
                  name:
                    description: Name is the object name.
                    minLength: 1
                    type: string
                  uid:
                    description: UID is the object UID.
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
              configurationRef:
                description: |-
                  ConfigurationRef references a MachineConfiguration (and
                  optionally a specific version) that defines the configuration
                  profile for this machine. If a specific version is set, that
                  version is used at provisioning time; otherwise the latest
                  locked version is used and the version field is set by the
                  controller.
                properties:
                  name:
                    description: Name is the name of the MachineConfiguration.
                    minLength: 1
                    type: string
                  version:
                    description: |-
                      Version is the specific MachineConfigurationVersion number to
                      use. If omitted, the controller selects the latest locked
                      (deployed) version and populates this field.
                    format: int32
                    type: integer
                required:
                - name
                type: object
              fenced:
                description: |-
                  Fenced forbids the agent from starting this Machine's node again. It
                  can only change from false to true, and requires AllocationRef.
                type: boolean
              host:
                description: |-
                  Host contains desired host settings and exactly one optional host owner.
                  New Machines should set one of Netboot, Azure, or External. Image alone
                  may be used with deprecated ownership fields during migration.
                properties:
                  azure:
                    description: Azure identifies an Azure VM managed by the built-in
                      Azure provider.
                    properties:
                      resourceID:
                        description: ResourceID is the full Azure Resource Manager
                          ID of the virtual machine.
                        minLength: 1
                        type: string
                    required:
                    - resourceID
                    type: object
                    x-kubernetes-validations:
                    - message: resourceID is immutable
                      rule: self.resourceID == oldSelf.resourceID
                  external:
                    description: External identifies a host managed by a registered
                      external provider.
                    properties:
                      machineRef:
                        description: |-
                          MachineRef identifies an optional provider-owned resource containing rich
                          provider-specific state for this Machine.
                        properties:
                          apiGroup:
                            description: APIGroup is the API group of the provider-owned
                              Machine resource.
                            minLength: 1
                            type: string
                          kind:
                            description: Kind is the kind of the provider-owned Machine
                              resource.
                            minLength: 1
                            type: string
                          name:
                            description: Name is the name of the cluster-scoped provider-owned
                              Machine resource.
                            minLength: 1
                            type: string
                        required:
                        - apiGroup
                        - kind
                        - name
                        type: object
                      provider:
                        description: Provider selects the registered provider controller
                          and its credentials.
                        minLength: 1
                        type: string
                      providerID:
                        description: |-
                          ProviderID is an opaque provider-specific host identifier. Providers that
                          replace the underlying resource may update it after a successful handoff.
                        type: string
                    required:
                    - provider
                    type: object
                    x-kubernetes-validations:
                    - message: providerID or machineRef is required
                      rule: has(self.providerID) || has(self.machineRef)
                    - message: machineRef is immutable
                      rule: has(self.machineRef) == has(oldSelf.machineRef) && (!has(self.machineRef)
                        || self.machineRef == oldSelf.machineRef)
                    - message: provider is immutable
                      rule: self.provider == oldSelf.provider
                  image:
                    description: |-
                      Image is an opaque provider-interpreted image identifier. If omitted,
                      HostReplace preserves the host's current image.
                    type: string
                  netboot:
                    description: |-
                      Netboot contains the machine-specific network boot configuration owned by
                      Metalman.
                    properties:
                      architecture:
                        default: amd64
                        description: |-
                          Architecture is the target CPU architecture for PXE boot artifacts and
                          machine images.
                        enum:
                        - amd64
                        - arm64
                        type: string
                      bootProtocol:
                        default: PXE
                        description: |-
                          BootProtocol selects how metalman should trigger network boot for
                          repaves. PXE uses DHCP/TFTP bootfile options. HTTP uses Redfish UEFI
                          HTTP boot with a URL derived from the netboot image metadata.
                          VirtualMedia mounts an operation-owned bootstrap ISO through Redfish.
                          It requires redfish, a digest Image, and a digest NetbootImage.
                        enum:
                        - PXE
                        - HTTP
                        - VirtualMedia
                        type: string
                      cloudInit:
                        description: |-
                          CloudInit contains optional cloud-init customization for PXE-booted
                          machines.
                        properties:
                          userDataConfigMapRef:
                            description: |-
                              UserDataConfigMapRef references a ConfigMap containing custom
                              cloud-init user-data. The referenced key (default "user-data")
                              must contain a valid cloud-init configuration (e.g. a
                              #cloud-config YAML document).
                            properties:
                              key:
                                default: user-data
                                description: Key within the ConfigMap.
                                type: string
                              name:
                                description: Name of the ConfigMap.
                                type: string
                              namespace:
                                description: Namespace of the ConfigMap.
                                type: string
                            required:
                            - name
                            - namespace
                            type: object
                        type: object
                      dhcpLeases:
                        description: |-
                          DHCPLeases defines static IPv4 provisioning network settings. PXE boot
                          uses them as DHCP leases. HTTP boot uses the first entry to configure the
                          Redfish UEFI HTTP boot client.
                        items:
                          description: DHCPLease defines static IPv4 provisioning
                            network settings.
                          properties:
                            dns:
                              description: DNS is a list of DNS server addresses.
                              items:
                                type: string
                              type: array
                            gateway:
                              description: Gateway is the default gateway.
                              type: string
                            holdLease:
                              description: |-
                                HoldLease, when true, makes the installed host also run a DHCPv4
                                client on this lease's NIC so the site DHCP server keeps the lease
                                for IPv4 and does not reassign it to another host. The static
                                address, gateway, and DNS remain authoritative; routes, DNS, NTP,
                                hostname, and domains from DHCP are ignored. The site DHCP server
                                should reserve IPv4 for MAC. Leave unset where there is no DHCP
                                server.
                              type: boolean
                            ipv4:
                              description: IPv4 is the IP address to assign.
                              type: string
                            mac:
                              description: MAC is the MAC address of the network interface.
                              type: string
                            subnetMask:
                              description: SubnetMask is the subnet mask for the lease.
                              type: string
                          required:
                          - gateway
                          - ipv4
                          - mac
                          - subnetMask
                          type: object
                        type: array
                      image:
                        description: |-
                          Image is an OCI image reference containing the machine disk image.
                          The image must contain /disk/disk.img.gz.
                          VirtualMedia requires a digest reference (image@sha256:...).
                          Example: "ghcr.io/azure/host-ubuntu2404:v1"
                        type: string
                      netbootImage:
                        description: |-
                          NetbootImage is an OCI image reference containing the PXE boot
                          artifacts used to install Image. When omitted, metalman uses the
                          default netboot image that corresponds to its release.
                          VirtualMedia requires this field to be set to a digest reference
                          (image@sha256:...).
                        type: string
                      netbootPullSecretRef:
                        description: |-
                          NetbootPullSecretRef references a Docker registry credential Secret used to
                          pull NetbootImage. It is ignored when NetbootImage is omitted; metalman's
                          configured default netboot pull secret is used for the default netboot image.
                          The Secret must be type kubernetes.io/dockerconfigjson or
                          kubernetes.io/dockercfg.
                        properties:
                          name:
                            description: Name of the secret.
                            minLength: 1
                            type: string
                          namespace:
                            description: Namespace of the secret.
                            minLength: 1
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      network:
                        description: |-
                          Network declares the host's static network topology: physical
                          ethernets identified by MAC address, bonds, and VLANs. The installer
                          brings it up before fetching install instructions and persists it as
                          netplan or systemd-networkd configuration on the installed host.
                          It requires the VirtualMedia boot protocol: metalman then boots the
                          installer from the bootstrap ISO without network access, so links that
                          only pass traffic once LACP negotiates (no switch fallback) still work.
                          The first DHCPLeases entry remains the provisioning identity: its IPv4
                          address and gateway must be configured on exactly one declared
                          interface, and its MAC must be one of the declared ethernets.
                          When omitted, metalman keeps the single-NIC behavior driven by
                          DHCPLeases.
                        properties:
                          bonds:
                            description: Bonds declares link aggregation interfaces
                              built from ethernets.
                            items:
                              description: BondSpec declares a link aggregation interface.
                              properties:
                                addresses:
                                  description: |-
                                    Addresses lists static IPv4 addresses in CIDR notation, for example
                                    192.0.2.10/24.
                                  items:
                                    maxLength: 18
                                    type: string
                                  maxItems: 8
                                  type: array
                                gateway:
                                  description: |-
                                    Gateway is the IPv4 default gateway reachable through this interface.
                                    At most one interface in the host network may set it.
                                  maxLength: 15
                                  type: string
                                interfaces:
                                  description: Interfaces lists the names of the ethernets
                                    aggregated by this bond.
                                  items:
                                    maxLength: 15
                                    type: string
                                  maxItems: 8
                                  minItems: 1
                                  type: array
                                  x-kubernetes-list-type: set
                                lacpRate:
                                  description: |-
                                    LACPRate is the LACPDU transmit rate requested from the link partner in
                                    802.3ad mode.
                                  enum:
                                  - slow
                                  - fast
                                  type: string
                                miiMonitorInterval:
                                  default: 100
                                  description: MIIMonitorInterval is the link monitoring
                                    interval in milliseconds.
                                  format: int32
                                  maximum: 10000
                                  minimum: 0
                                  type: integer
                                mode:
                                  default: 802.3ad
                                  description: Mode is the bonding mode.
                                  enum:
                                  - 802.3ad
                                  - active-backup
                                  - balance-xor
                                  type: string
                                mtu:
                                  description: |-
                                    MTU is the interface MTU in bytes. When omitted, the kernel default is
                                    used.
                                  format: int32
                                  maximum: 9216
                                  minimum: 576
                                  type: integer
                                name:
                                  description: Name is the bond interface name, for
                                    example bond0.
                                  maxLength: 15
                                  pattern: ^[a-zA-Z][a-zA-Z0-9_-]{0,14}$
                                  type: string
                                routes:
                                  description: Routes lists static IPv4 routes through
                                    this interface.
                                  items:
                                    description: RouteSpec declares a static IPv4
                                      route.
                                    properties:
                                      to:
                                        description: |-
                                          To is the destination prefix in CIDR notation, for example
                                          198.51.100.0/24.
                                        maxLength: 18
                                        type: string
                                      via:
                                        description: Via is the IPv4 next-hop address.
                                        maxLength: 15
                                        type: string
                                    required:
                                    - to
                                    - via
                                    type: object
                                  maxItems: 32
                                  type: array
                                transmitHashPolicy:
                                  description: |-
                                    TransmitHashPolicy selects the member used to transmit each flow in
                                    802.3ad and balance-xor modes.
                                  enum:
                                  - layer2
                                  - layer2+3
                                  - layer3+4
                                  - encap2+3
                                  - encap3+4
                                  type: string
                              required:
                              - interfaces
                              - name
                              type: object
                              x-kubernetes-validations:
                              - message: lacpRate requires mode 802.3ad
                                rule: '!has(self.lacpRate) || self.mode == ''802.3ad'''
                            maxItems: 8
                            type: array
                            x-kubernetes-list-map-keys:
                            - name
                            x-kubernetes-list-type: map
                          dns:
                            description: DNS is the list of IPv4 nameserver addresses
                              for the host.
                            items:
                              maxLength: 15
                              type: string
                            maxItems: 3
                            type: array
                          ethernets:
                            description: |-
                              Ethernets declares the physical network interfaces, matched by their
                              permanent MAC addresses.
                            items:
                              description: EthernetSpec declares a physical network
                                interface.
                              properties:
                                addresses:
                                  description: |-
                                    Addresses lists static IPv4 addresses in CIDR notation, for example
                                    192.0.2.10/24.
                                  items:
                                    maxLength: 18
                                    type: string
                                  maxItems: 8
                                  type: array
                                gateway:
                                  description: |-
                                    Gateway is the IPv4 default gateway reachable through this interface.
                                    At most one interface in the host network may set it.
                                  maxLength: 15
                                  type: string
                                macAddress:
                                  description: |-
                                    MACAddress is the permanent MAC address of the physical interface, as
                                    lowercase colon-separated hex (aa:bb:cc:dd:ee:ff).
                                  pattern: ^([0-9a-f]{2}:){5}[0-9a-f]{2}$
                                  type: string
                                mtu:
                                  description: |-
                                    MTU is the interface MTU in bytes. When omitted, the kernel default is
                                    used.
                                  format: int32
                                  maximum: 9216
                                  minimum: 576
                                  type: integer
                                name:
                                  description: |-
                                    Name is the interface name persisted on the installed host, for example
                                    enp1s0f0. Metalman matches the device by MACAddress and does not rely
                                    on the kernel's naming during installation.
                                  maxLength: 15
                                  pattern: ^[a-zA-Z][a-zA-Z0-9_-]{0,14}$
                                  type: string
                                routes:
                                  description: Routes lists static IPv4 routes through
                                    this interface.
                                  items:
                                    description: RouteSpec declares a static IPv4
                                      route.
                                    properties:
                                      to:
                                        description: |-
                                          To is the destination prefix in CIDR notation, for example
                                          198.51.100.0/24.
                                        maxLength: 18
                                        type: string
                                      via:
                                        description: Via is the IPv4 next-hop address.
                                        maxLength: 15
                                        type: string
                                    required:
                                    - to
                                    - via
                                    type: object
                                  maxItems: 32
                                  type: array
                              required:
                              - macAddress
                              - name
                              type: object
                            maxItems: 16
                            minItems: 1
                            type: array
                            x-kubernetes-list-map-keys:
                            - name
                            x-kubernetes-list-type: map
                          vlans:
                            description: VLANs declares 802.1Q VLAN interfaces on
                              top of ethernets or bonds.
                            items:
                              description: VLANSpec declares an 802.1Q VLAN interface.
                              properties:
                                addresses:
                                  description: |-
                                    Addresses lists static IPv4 addresses in CIDR notation, for example
                                    192.0.2.10/24.
                                  items:
                                    maxLength: 18
                                    type: string
                                  maxItems: 8
                                  type: array
                                gateway:
                                  description: |-
                                    Gateway is the IPv4 default gateway reachable through this interface.
                                    At most one interface in the host network may set it.
                                  maxLength: 15
                                  type: string
                                id:
                                  description: ID is the 802.1Q VLAN identifier.
                                  format: int32
                                  maximum: 4094
                                  minimum: 1
                                  type: integer
                                link:
                                  description: Link is the name of the ethernet or
                                    bond carrying the VLAN.
                                  maxLength: 15
                                  type: string
                                mtu:
                                  description: |-
                                    MTU is the interface MTU in bytes. When omitted, the kernel default is
                                    used.
                                  format: int32
                                  maximum: 9216
                                  minimum: 576
                                  type: integer
                                name:
                                  description: Name is the VLAN interface name, for
                                    example bond0.64.
                                  maxLength: 15
                                  pattern: ^[a-zA-Z][a-zA-Z0-9_.-]{0,14}$
                                  type: string
                                routes:
                                  description: Routes lists static IPv4 routes through
                                    this interface.
                                  items:
                                    description: RouteSpec declares a static IPv4
                                      route.
                                    properties:
                                      to:
                                        description: |-
                                          To is the destination prefix in CIDR notation, for example
                                          198.51.100.0/24.
                                        maxLength: 18
                                        type: string
                                      via:
                                        description: Via is the IPv4 next-hop address.
                                        maxLength: 15
                                        type: string
                                    required:
                                    - to
                                    - via
                                    type: object
                                  maxItems: 32
                                  type: array
                              required:
                              - id
                              - link
                              - name
                              type: object
                            maxItems: 32
                            type: array
                            x-kubernetes-list-map-keys:
                            - name
                            x-kubernetes-list-type: map
                        required:
                        - ethernets
                        type: object
                      pullSecretRef:
                        description: |-
                          PullSecretRef references a Docker registry credential Secret used to pull
                          Image. The Secret must be type kubernetes.io/dockerconfigjson or
                          kubernetes.io/dockercfg.
                        properties:
                          name:
                            description: Name of the secret.
                            minLength: 1
                            type: string
                          namespace:
                            description: Namespace of the secret.
                            minLength: 1
                            type: string
                        required:
                        - name
                        - namespace
