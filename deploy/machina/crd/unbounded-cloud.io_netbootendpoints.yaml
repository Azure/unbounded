---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: netbootendpoints.unbounded-cloud.io
spec:
  group: unbounded-cloud.io
  names:
    kind: NetbootEndpoint
    listKind: NetbootEndpointList
    plural: netbootendpoints
    shortNames:
    - nbe
    singular: netbootendpoint
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.siteRef
      name: Site
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.externalURL
      name: URL
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          NetbootEndpoint declares a stable client-facing netboot endpoint and its edge
          placement. The endpoint URL is snapshotted into each NetbootSession.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetbootEndpointSpec defines a stable edge endpoint.
            properties:
              externalURL:
                description: ExternalURL is the stable base URL advertised to firmware
                  and installers.
                pattern: ^https?://
                type: string
              http:
                description: HTTP configures an operator-managed HTTP edge Service.
                properties:
                  serviceType:
                    default: ClusterIP
                    description: ServiceType controls how the edge Service is exposed.
                    enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                    type: string
                type: object
              managedL2:
                description: ManagedL2 configures an operator-managed edge on a provisioning
                  LAN.
                properties:
                  address:
                    description: Address is the stable address advertised by DHCP
                      and used by the edge.
                    minLength: 1
                    type: string
                  interface:
                    description: Interface is the host interface used for DHCP and
                      TFTP.
                    minLength: 1
                    type: string
                  nodeSelector:
                    description: NodeSelector selects nodes attached to the provisioning
                      network.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - address
                - interface
                - nodeSelector
                type: object
              siteRef:
                description: SiteRef names the Site whose Machines may use this endpoint.
                minLength: 1
                type: string
              tls:
                description: TLS defines the endpoint trust boundary and TLS termination
                  mode.
                properties:
                  mode:
                    description: Mode identifies where TLS is terminated.
                    enum:
                    - Disabled
                    - Secret
                    - External
                    type: string
                  secretRef:
                    description: SecretRef references the serving certificate when
                      mode is Secret.
                    properties:
                      name:
                        description: Name of the secret.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  trust:
                    description: |-
                      Trust identifies whether the endpoint is confined to a trusted LAN or is
                      reachable across an untrusted network.
                    enum:
                    - TrustedLAN
                    - Public
                    type: string
                required:
                - mode
                - trust
                type: object
                x-kubernetes-validations:
                - message: secretRef must be set only when TLS mode is Secret
                  rule: 'self.mode == ''Secret'' ? has(self.secretRef) : !has(self.secretRef)'
              type:
                description: Type identifies how the endpoint edge is operated.
                enum:
                - ManagedL2
                - ExternalL2
                - HTTP
                type: string
            required:
            - externalURL
            - siteRef
            - tls
            - type
            type: object
            x-kubernetes-validations:
            - message: public endpoints require HTTPS
              rule: self.tls.trust != 'Public' || (self.externalURL.startsWith('https://')
                && self.tls.mode != 'Disabled')
            - message: managedL2 configuration must be set only for ManagedL2 endpoints
              rule: 'self.type == ''ManagedL2'' ? has(self.managedL2) : !has(self.managedL2)'
            - message: http configuration must be set only for HTTP endpoints
              rule: 'self.type == ''HTTP'' ? has(self.http) : !has(self.http)'
          status:
            description: NetbootEndpointStatus reports edge ownership and readiness.
            properties:
              claim:
                description: Claim identifies the edge currently responsible for this
                  endpoint.
                properties:
                  holderIdentity:
                    description: HolderIdentity uniquely identifies the claiming edge
                      process.
                    type: string
                  renewedAt:
                    description: RenewedAt records the latest successful claim heartbeat.
                    format: date-time
                    type: string
                required:
                - holderIdentity
                - renewedAt
                type: object
              conditions:
                description: Conditions report endpoint readiness and degradation.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the latest spec generation processed
                  by the edge.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
