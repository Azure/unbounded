---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: machineclasses.unbounded-cloud.io
spec:
  group: unbounded-cloud.io
  names:
    kind: MachineClass
    listKind: MachineClassList
    plural: machineclasses
    shortNames:
    - mcls
    singular: machineclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.siteRef.name
      name: Site
      type: string
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          MachineClass describes a provider-neutral template from which capacity
          consumers request MachineAllocations. Provider-specific settings live in an
          object referenced by providerConfigRef and are interpreted only by the
          provider adapter.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MachineClassSpec defines the inputs shared by allocations
              from this class.
            properties:
              bootstrap:
                description: Bootstrap optionally customizes first-boot artifact delivery.
                properties:
                  agentArtifact:
                    description: AgentArtifact overrides the agent tarball location
                      and pins its digest.
                    properties:
                      sha256:
                        description: SHA256 is the lowercase hex SHA-256 digest of
                          the tarball.
                        pattern: ^[a-f0-9]{64}$
                        type: string
                      url:
                        description: |-
                          URL is the agent tarball location: an https URL with a DNS name or IPv4
                          host and an optional port, or a local file:/// path. It must not embed
                          credentials, a query, or a fragment.
                        maxLength: 2048
                        pattern: ^(https://[A-Za-z0-9.-]+(:[0-9]{1,5})?|file://)(/[A-Za-z0-9._~%+=,:-]+)+$
                        type: string
                    required:
                    - sha256
                    - url
                    type: object
                  filesRef:
                    description: |-
                      FilesRef references a ConfigMap of bootstrap files for hosts launched
                      from this class. Its required "run" key is the script that runs as root
                      on the host before the agent installer.
                    properties:
                      name:
                        description: Name is the referenced object name.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace is the referenced object namespace.
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                type: object
              configurationRef:
                description: |-
                  ConfigurationRef pins the MachineConfiguration version whose content is
                  frozen into each allocation.
                properties:
                  name:
                    description: Name is the name of the MachineConfiguration.
                    minLength: 1
                    type: string
                  version:
                    description: |-
                      Version is the specific MachineConfigurationVersion number to
                      use. If omitted, the controller selects the latest locked
                      (deployed) version and populates this field.
                    format: int32
                    type: integer
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: configurationRef.version is required
                  rule: has(self.version)
              provider:
                description: |-
                  Provider selects the registered provider adapter that interprets
                  providerConfigRef and executes allocation operations. It is immutable
                  after creation.
                minLength: 1
                type: string
              providerConfigRef:
                description: |-
                  ProviderConfigRef references provider-specific configuration. Only a
                  namespaced ConfigMap in the core API group is accepted today.
                properties:
                  apiGroup:
                    description: |-
                      APIGroup is the API group of the referenced object. An absent or empty
                      value means the core API group.
                    type: string
                  kind:
                    description: Kind is the kind of the referenced object.
                    minLength: 1
                    type: string
                  name:
                    description: Name is the name of the referenced object.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the referenced object. It is absent for
                      cluster-scoped kinds.
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: providerConfigRef.apiGroup must be the core group
                  rule: '!has(self.apiGroup) || self.apiGroup == '''''
                - message: providerConfigRef.kind must be ConfigMap
                  rule: self.kind == 'ConfigMap'
                - message: providerConfigRef.namespace is required for a ConfigMap
                  rule: self.kind != 'ConfigMap' || has(self.namespace)
              siteRef:
                description: |-
                  SiteRef identifies the Site that allocated machines join. It is
                  immutable after creation.
                properties:
                  name:
                    description: Name of the referenced resource.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - configurationRef
            - provider
            - providerConfigRef
            - siteRef
            type: object
            x-kubernetes-validations:
            - message: provider is immutable
              rule: self.provider == oldSelf.provider
            - message: siteRef is immutable
              rule: self.siteRef == oldSelf.siteRef
          status:
            description: MachineClassStatus reports the normalized, observed class
              state.
            properties:
              bootstrapFiles:
                description: BootstrapFiles records the bootstrap files observed for
                  the revision.
                properties:
                  hash:
                    description: Hash is the SHA-256 of the object content.
                    type: string
                  name:
                    description: Name is the object name.
                    type: string
                  namespace:
                    description: Namespace is the object namespace.
                    type: string
                  uid:
                    description: UID detects deletion and recreation of the object.
                    type: string
                required:
                - hash
                - name
                - namespace
                - uid
                type: object
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configuration:
                description: Configuration records the configuration version observed
                  for the revision.
                properties:
                  hash:
                    description: Hash is the SHA-256 of the configuration template.
                    type: string
                  name:
                    description: Name is the MachineConfiguration name.
                    type: string
                  uid:
                    description: UID is the MachineConfigurationVersion UID.
                    type: string
                  version:
                    description: Version is the MachineConfiguration version.
                    format: int32
                    type: integer
                  versionName:
                    description: VersionName is the MachineConfigurationVersion object
                      name.
                    type: string
                required:
                - hash
                - name
                - uid
                - version
                - versionName
                type: object
              credential:
                description: |-
                  Credential is the exact MachineOperationCredential instance the
                  revision was resolved with.
                properties:
                  name:
                    description: Name is the object name.
                    minLength: 1
                    type: string
                  uid:
                    description: UID is the object UID.
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
              observedGeneration:
                description: ObservedGeneration is the class generation whose inputs
                  were resolved.
                format: int64
                type: integer
              offerings:
                description: Offerings are the normalized capacity offerings for this
                  class.
                items:
                  description: MachineClassOffering is one normalized purchasable
                    capacity shape.
                  properties:
                    availability:
                      description: Availability is the observed availability.
                      enum:
                      - Available
                      - Unavailable
                      - Unknown
                      type: string
                    capacity:
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      description: Capacity is the machine capacity before overhead.
                      type: object
                    capacityType:
                      description: CapacityType is the purchase model.
                      enum:
                      - OnDemand
                      - Spot
                      type: string
                    instanceType:
                      description: InstanceType is the provider instance type.
                      type: string
                    labels:
                      additionalProperties:
                        type: string
                      description: Labels are the well-known labels Nodes from this
                        offering register with.
                      type: object
                    name:
                      description: Name uniquely identifies the offering within the
                        class.
                      minLength: 1
                      type: string
                    observedAt:
                      description: ObservedAt is when availability and capacity were
                        observed.
                      format: date-time
                      type: string
                    overhead:
                      description: Overhead is the capacity reserved from workloads.
                      properties:
                        evictionThreshold:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: EvictionThreshold is the hard eviction threshold.
                          type: object
                        kubeReserved:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: KubeReserved is reserved for Kubernetes node
                            components.
                          type: object
                        systemReserved:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: SystemReserved is reserved for operating system
                            daemons.
                          type: object
                      type: object
                    price:
                      description: Price is the observed or configured price, when
                        known.
                      properties:
                        currency:
                          description: Currency is the ISO 4217 currency code.
                          pattern: ^[A-Z]{3}$
                          type: string
                        observedAt:
                          description: ObservedAt is when the price was observed.
                          format: date-time
                          type: string
                        perHour:
                          description: PerHour is the decimal price per instance hour.
                          pattern: ^[0-9]+(\.[0-9]+)?$
                          type: string
                        source:
                          description: Source documents where the price came from
                            and what it includes.
                          type: string
                      required:
                      - currency
                      - perHour
                      type: object
                    validUntil:
                      description: |-
                        ValidUntil is when this observation expires. An expired offering must
                        not be used to launch a machine.
                      format: date-time
                      type: string
                    zone:
                      description: Zone is the provider zone, or empty for regional
                        capacity.
                      type: string
                  required:
                  - availability
                  - capacityType
                  - instanceType
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              providerConfig:
                description: ProviderConfig records the provider config observed for
                  the revision.
                properties:
                  hash:
                    description: Hash is the SHA-256 of the object content.
                    type: string
                  name:
                    description: Name is the object name.
                    type: string
                  namespace:
                    description: Namespace is the object namespace.
                    type: string
                  uid:
                    description: UID detects deletion and recreation of the object.
                    type: string
                required:
                - hash
                - name
                - namespace
                - uid
                type: object
              resolvedRevision:
                description: |-
                  ResolvedRevision identifies the resolved spec, provider config,
                  bootstrap files, and configuration content. Allocations whose frozen
                  revision differs are drifted.
                type: string
              site:
                description: |-
                  Site is the exact Site instance the revision was resolved for. A Site
                  deleted and recreated under the same name is a different authority.
                properties:
                  name:
                    description: Name is the object name.
                    minLength: 1
                    type: string
                  uid:
                    description: UID is the object UID.
                    minLength: 1
                    type: string
                required:
                - name
                - uid
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
