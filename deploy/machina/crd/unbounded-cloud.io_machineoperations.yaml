---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: machineoperations.unbounded-cloud.io
spec:
  group: unbounded-cloud.io
  names:
    kind: MachineOperation
    listKind: MachineOperationList
    plural: machineoperations
    shortNames:
    - mop
    singular: machineoperation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.machineRef
      name: Machine
      type: string
    - jsonPath: .spec.operationKind
      name: Operation
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          MachineOperation represents a discrete operation to be performed on a
          Machine. MachineOperations are created by CLI commands or controllers and
          processed by the appropriate agent. The in-VM agent handles operations
          like NodeReboot, while cloud or PXE controllers handle operations like
          HostReboot, HostPowerOff, and HostPowerOn.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MachineOperationSpec defines the desired state of a MachineOperation.
            properties:
              machineRef:
                description: |-
                  MachineRef is the name of the Machine CR this operation targets.
                  Either machineRef or machineSelector must be set.
                type: string
              machineSelector:
                description: |-
                  MachineSelector selects machines by labels. When set, the
                  controller creates individual MachineOperation children for
                  each matched machine. Either machineRef or machineSelector
                  must be set.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              operationKind:
                description: OperationKind is the operation to perform on the target
                  machine.
                enum:
                - NodeReboot
                - AgentUpgrade
                - HostReboot
                - HostPowerOff
                - HostPowerOn
                type: string
              parameters:
                additionalProperties:
                  type: string
                description: |-
                  Parameters is an optional set of key-value pairs passed to the
                  operation executor. For example, RestartService uses "service" to
                  specify the systemd unit name.
                  need a richer type (e.g. runtime.RawExtension for arbitrary
                  JSON, or a typed []OperationParameter struct).
                type: object
              ttlSecondsAfterFinished:
                description: |-
                  TTLSecondsAfterFinished limits the lifetime of a completed or failed
                  MachineOperation. If set, the agent deletes the MachineOperation
                  this many seconds after it reaches a terminal phase. If unset, the
                  MachineOperation is kept indefinitely.
                format: int32
                minimum: 0
                type: integer
            required:
            - operationKind
            type: object
          status:
            description: MachineOperationStatus defines the observed state of a MachineOperation.
            properties:
              completedAt:
                description: |-
                  CompletedAt is when the operation reached a terminal state
                  (Complete or Failed).
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  operation's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                description: Message is a human-readable description of the current
                  state.
                type: string
              observedMachineGeneration:
                description: |-
                  ObservedMachineGeneration is the Machine's metadata.generation
                  at the time the agent began executing the operation. Clients
                  can compare this to the current Machine generation to determine
                  whether the operation acted on the expected machine state.
                format: int64
                type: integer
              phase:
                description: Phase is the current phase of the operation.
                type: string
              startedAt:
                description: StartedAt is when the agent began executing the operation.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
