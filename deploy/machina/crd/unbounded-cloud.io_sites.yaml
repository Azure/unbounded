---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: sites.unbounded-cloud.io
spec:
  group: unbounded-cloud.io
  names:
    kind: Site
    listKind: SiteList
    plural: sites
    shortNames:
    - st
    singular: site
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeCidrs
      name: Node CIDRs
      type: string
    - jsonPath: .spec.podCidrAssignments
      name: Pod CIDR Assignments
      type: string
    - jsonPath: .spec.components.machina.enabled
      name: Machina
      priority: 1
      type: boolean
    - jsonPath: .spec.components.metalman.enabled
      name: Metalman
      priority: 1
      type: boolean
    - jsonPath: .spec.components.storage.enabled
      name: Storage
      priority: 1
      type: boolean
    - jsonPath: .spec.components.gantry.enabled
      name: Gantry
      priority: 1
      type: boolean
    - jsonPath: .status.nodeCount
      name: Nodes
      type: integer
    - jsonPath: .status.sliceCount
      name: Slices
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          Site defines a top-level Unbounded location and the optional components
          enabled for that location.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SiteSpec defines the desired state of Site.
            properties:
              components:
                description: Components declares optional Unbounded components managed
                  for this site.
                properties:
                  gantry:
                    default:
                      enabled: true
                    description: |-
                      Gantry configures the gantry peer-to-peer OCI distribution agent for this
                      site. Unlike the other components, gantry defaults to enabled; set
                      gantry.enabled to false to opt a site out. The apiserver defaults an
                      omitted gantry block to enabled=true so the intent is explicit on read
                      (for example the Gantry print column) whenever a components block is
                      present. A site that omits the components block entirely is not defaulted.
                    properties:
                      enabled:
                        description: Enabled controls whether the component is reconciled.
                        type: boolean
                    type: object
                  machina:
                    description: Machina configures the machina controller for this
                      site.
                    properties:
                      enabled:
                        description: Enabled controls whether the component is reconciled.
                        type: boolean
                    type: object
                  metalman:
                    description: Metalman configures the Metalman PXE controller for
                      this site.
                    properties:
                      enabled:
                        description: Enabled controls whether the component is reconciled.
                        type: boolean
                    type: object
                  storage:
                    description: Storage configures the unbounded-storage supervisor
                      for this site.
                    properties:
                      enabled:
                        description: Enabled controls whether the component is reconciled.
                        type: boolean
                    type: object
                type: object
              healthCheckSettings:
                description: HealthCheckSettings controls health check settings for
                  inter-site tunnel peers.
                properties:
                  detectMultiplier:
                    description: |-
                      DetectMultiplier is the multiplier used to determine session down detection.
                      Valid range is 1-255.
                    format: int32
                    maximum: 255
                    minimum: 1
                    type: integer
                  enabled:
                    description: Enabled controls whether health check is enabled
                      for this scope.
                    type: boolean
                  receiveInterval:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      ReceiveInterval is the minimum interval between received health check packets.
                      Accepts either a duration string (e.g. "300ms") or an integer interpreted as milliseconds.
                    x-kubernetes-int-or-string: true
                  transmitInterval:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      TransmitInterval is the minimum interval between transmitted health check packets.
                      Accepts either a duration string (e.g. "300ms") or an integer interpreted as milliseconds.
                    x-kubernetes-int-or-string: true
                type: object
              localCidrs:
                description: |-
                  LocalCIDRs are CIDR blocks that are considered local to this site.
                  Traffic to these CIDRs should never be routed via gateway pools.
                items:
                  type: string
                type: array
              manageCniPlugin:
                description: |-
                  ManageCniPlugin controls whether the node agent writes CNI configuration
                  and creates tunnel endpoints for same-site nodes. When true (the default),
                  CNI config is written and all same-site nodes are tunnel peers.
                  When false, only tunnel links to gateway pools for other sites are created,
                  allowing an external CNI plugin to manage intra-site networking.
                  Pod CIDR assignment is also disabled when manageCniPlugin is false,
                  regardless of the assignmentEnabled setting on individual podCidrAssignments
                  rules. The podCidrAssignments are still required to define the CIDR ranges
                  used for inter-site routing.
                type: boolean
              nodeCidrs:
                description: NodeCidrs are the CIDRs that contain the internal IPs
                  of nodes at this site.
                items:
                  type: string
                minItems: 1
                type: array
              nonMasqueradeCIDRs:
                description: |-
                  NonMasqueradeCIDRs are CIDR blocks that should NOT be masqueraded when
                  traffic leaves the node via the default gateway. Traffic to these CIDRs
                  will use the pod's actual IP address.
                items:
                  type: string
                type: array
              podCidrAssignments:
                description: PodCidrAssignments define how pod CIDRs are allocated
                  to nodes in this site.
                items:
                  description: PodCidrAssignment defines a pod CIDR allocation rule
                    for nodes in a site.
                  properties:
                    assignmentEnabled:
                      description: AssignmentEnabled controls whether this assignment
                        is active. Defaults to true.
                      type: boolean
                    cidrBlocks:
                      description: CidrBlocks are the CIDR pools to allocate from.
                      items:
                        type: string
                      minItems: 1
                      type: array
                    nodeBlockSizes:
                      description: NodeBlockSizes define the per-node allocation sizes
                        for IPv4 and IPv6.
                      properties:
                        ipv4:
                          description: IPv4 is the IPv4 subnet mask size (e.g., 24
                            for /24).
                          maximum: 32
                          minimum: 1
                          type: integer
                        ipv6:
                          description: IPv6 is the IPv6 subnet mask size (e.g., 80
                            for /80).
                          maximum: 128
                          minimum: 1
                          type: integer
                      type: object
                    nodeRegex:
                      description: NodeRegex is a list of regex patterns for matching
                        node names. If empty, no regex filtering is applied.
                      items:
                        maxLength: 1024
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    priority:
                      description: |-
                        Priority controls which assignment wins when multiple match. Lower values win.
                        Defaults to 100.
                      format: int32
                      type: integer
                  required:
                  - cidrBlocks
                  type: object
                minItems: 1
                type: array
              tunnelMTU:
                description: TunnelMTU is the MTU to set on routes through tunnels
                  for this site.
                format: int32
                maximum: 9000
                minimum: 576
                type: integer
              tunnelProtocol:
                description: |-
                  TunnelProtocol selects the tunnel protocol for this site.
                  Valid values are "WireGuard", "IPIP", "GENEVE", "VXLAN", "None", or "Auto".
                  Defaults to "Auto" when unset.
                enum:
                - WireGuard
                - IPIP
                - GENEVE
                - VXLAN
                - None
                - Auto
                type: string
            required:
            - nodeCidrs
            - podCidrAssignments
            type: object
          status:
            description: SiteStatus defines the observed state of Site.
            properties:
              conditions:
                description: |-
                  Conditions report the last observed state of site components. One
                  condition is published per component (for example NetReady, MachinaReady,
                  MetalmanReady, StorageReady) so callers can `kubectl wait` on a Site.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              nodeCount:
                description: NodeCount is the number of nodes matched to this site
                  by unbounded-net.
                type: integer
              sliceCount:
                description: SliceCount is the number of SiteNodeSlice objects for
                  this site.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
