---
apiVersion: unbounded-cloud.io/v1alpha3
kind: CapacityClaim
metadata:
  name: hillsboro-gb200-example
spec:
  machineSelector:
    matchLabels:
      unbounded-cloud.io/hardware-class: gb200
      unbounded-cloud.io/gpu-vendor: NVIDIA
      unbounded-cloud.io/gpu-model: GB200
  siteSelector:
    matchLabels:
      unbounded-cloud.io/site: hillsboro
  domainSelector:
    matchLabels:
      unbounded-cloud.io/capacity-domain: hillsboro-gb200
  consumer:
    apiGroup: example.unbounded-cloud.io
    kind: Workload
    namespace: default
    name: replace-with-consumer-name
    uid: 00000000-0000-0000-0000-000000000000
  releasePolicy: DeleteNode
  configurationRef:
    name: hillsboro-gb200
  imagePolicy:
    requiredImage: ghcr.io/azure/agent-ubuntu2404-nvidia:v20260619
    requireNVIDIA: true
  gpu:
    vendor: NVIDIA
    model: GB200
    count: 4
    requireFabric: true
