apiVersion: unbounded-cloud.io/v1alpha3
kind: MachineConfiguration
metadata:
  name: hillsboro-gb200
spec:
  template:
    agent:
      image: ghcr.io/azure/agent-ubuntu2404-nvidia:v20260619
    kubernetes:
      nodeLabels:
        unbounded-cloud.io/site: hillsboro
        unbounded-cloud.io/gpu-vendor: NVIDIA
        unbounded-cloud.io/gpu-model: GB200
  updateStrategy:
    type: OnDelete
---
apiVersion: unbounded-cloud.io/v1alpha3
kind: Machine
metadata:
  name: gb200-1
  labels:
    unbounded-cloud.io/site: hillsboro
    unbounded-cloud.io/capacity-domain: hillsboro-gb200
    unbounded-cloud.io/hardware-class: gb200
    unbounded-cloud.io/gpu-vendor: NVIDIA
    unbounded-cloud.io/gpu-model: GB200
    inventory.unbounded-cloud.io/serial: HILLSBORO-GB200-01
    inventory.unbounded-cloud.io/mac: d0-f4-05-5f-a4-27
spec:
  host:
    external:
      provider: HillsboroInventory
      providerID: serial://HILLSBORO-GB200-01
---
