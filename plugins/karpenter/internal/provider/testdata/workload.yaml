apiVersion: v1
kind: Namespace
metadata:
  name: karpenter-poc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-demo
  namespace: karpenter-poc
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-demo
    spec:
      nodeSelector:
        karpenter.sh/nodepool: azure-poc
      containers:
        - name: demo
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-demo
  namespace: karpenter-poc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-demo
